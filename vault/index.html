/* =========================================================================
   Dates.

   THE SERVER OWNS THE CLOCK. state.today is supplied by the bootstrap and is
   what decides forecast versus actual. The prototype used new Date() in the
   browser, so a laptop with a wrong date flipped weeks to "actual" early or
   late and the forecast silently changed for that person only
   (REQUIREMENTS C6).

   All arithmetic below is on yyyy-mm-dd strings in UTC, never through
   toISOString() on a locally-constructed date — that shifted every date back a
   day in Africa/Lagos and made the default forecast start a SUNDAY
   (REQUIREMENTS D1).
   ========================================================================= */
function dMs(iso) {
  var p = String(iso || "").slice(0, 10).split("-");
  return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}
function msIso(ms) {
  var d = new Date(ms), pad = function (n) { return String(n).padStart(2, "0"); };
  return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
}
function addDaysIso(iso, n) { return msIso(dMs(iso) + n * 86400000); }
function mondayOfIso(iso) {
  var ms = dMs(iso), day = new Date(ms).getUTCDay();
  return msIso(ms + ((day === 0 ? -6 : 1) - day) * 86400000);
}
function isValidIso(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "").slice(0, 10)); }
/* Display only. Formatted from the UTC parts, so it can never drift a day. */
function fmtDateShort(iso) {
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var d = new Date(dMs(iso));
  return String(d.getUTCDate()).padStart(2, "0") + " " + MON[d.getUTCMonth()];
}

/* ---------- formatting / parsing helpers ---------- */
function fmtUSD(n) {
  var sign = n < 0 ? "-" : "";
  var v = Math.abs(n || 0);
  return sign + "$" + v.toLocaleString("en-US", { maximumFractionDigits: 0 });
}
function fmtCcy(n, ccy) {
  var symbols = { USD: "$", NGN: "₦", GHS: "₵" };
  var sign = n < 0 ? "-" : "";
  var v = Math.abs(n || 0);
  return sign + (symbols[ccy] || "") + v.toLocaleString("en-US", { maximumFractionDigits: 0 });
}

/* Converts at the CURRENT rate. Used for open weeks and for anything the user
   is looking at "as it stands today". */
function toUSD(amount, currency, rates) {
  var a = Number(amount) || 0;
  if (currency === "NGN") return a / (Number(rates.ngnRate) || 1411);
  if (currency === "GHS") return a / (Number(rates.ghsRate) || 11.5);
  return a;
}

/* Converts at the rate stamped on the row when it was written, falling back to
   the current rate only for rows written before fxRateAtEntry existed.

   This is the snapshot rule (REQUIREMENTS §14 Q2b): a closed week is a
   statement of what happened, and what happened does not change because the
   naira moved. It matters most INSIDE the FIFO engines, where `remaining` is
   held in USD — at the current rate, changing the rate altered which invoices a
   historic receipt was deemed to have cleared (REQUIREMENTS D6). */
function rowUSD(row, rates) {
  var a = Number(row.amount) || 0;
  var ccy = row.currency || "USD";
  if (ccy === "USD") return a;
  var stamped = Number(row.fxRateAtEntry);
  if (isFinite(stamped) && stamped > 0) return a / stamped;
  return toUSD(a, ccy, rates);
}

/* ---------- HTML escaping ---------- */
function esc(v) {
  if (v === undefined || v === null) return "";
  return String(v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function attr(v) { return esc(v); }
function dash() { return "–"; }

/* =========================================================================
   TRANSPORT

   Every call is a POST to /exec with a text/plain body. Apps Script cannot
   answer a CORS preflight, and application/json triggers one — text/plain is
   CORS-safelisted, so the browser sends the request directly and the server
   parses the JSON itself.

   An /exec POST is TWO HOPS. The script runs at script.google.com, which
   302-redirects to script.googleusercontent.com carrying a SINGLE-USE content
   key, and the reply is served from there. The two failure modes are not the
   same thing and must not be treated as one:

     · fetch THROWS        → the host was never reached. Nothing ran. Safe.
     · a 404 comes back    → something answered and rejected the key. A proxy or
                             scanner pre-fetched the redirect and spent it.
                             THE SCRIPT ALREADY RAN.

   So: reads retry automatically, writes NEVER do, and when a write's reply is
   lost we say the work probably succeeded rather than claiming it failed.
   ========================================================================= */

function ApiError(message, kind) {
  var e = new Error(message);
  e.kind = kind || "error";
  return e;
}

var READ_ACTIONS = {
  getLoginContext: 1, getBootstrap: 1, getRevision: 1,
  getCounterpartyLedger: 1, getHistory: 1, ping: 1
};

function callApi(action, payload, opts) {
  opts = opts || {};
  if (!VAULT_BACKEND_URL || VAULT_BACKEND_URL.indexOf("PASTE_YOUR") === 0) {
    return Promise.reject(ApiError(
      "VAULT has not been connected to its backend yet. Whoever published this page " +
      "needs to set VAULT_BACKEND_URL near the top of vault.html to the Apps Script " +
      "deployment's /exec URL.", "unconfigured"));
  }

  var isRead = !!READ_ACTIONS[action];
  var attempts = isRead ? 2 : 1;   /* writes are never retried */

  function attempt(n) {
    return fetch(VAULT_BACKEND_URL, {
      method: "POST",
      /* text/plain on purpose — see the note above. */
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: action,
        payload: payload || {},
        sessionToken: state.sessionToken || ""
      }),
      redirect: "follow"
    }).then(function (res) {
      if (!res.ok) {
        if (res.status === 404) {
          throw ApiError(isRead
            ? "VAULT reached the server but the reply was lost in transit. Try again."
            : "The reply was lost in transit, but your entry was almost certainly SAVED. " +
              "Refresh before entering it again — re-entering it now would duplicate it.",
            isRead ? "lost-read" : "lost-write");
        }
        if (res.status === 401 || res.status === 403) {
          throw ApiError(
            "The deployment is set to require sign-in, so the browser cannot reach it. " +
            "In the Apps Script editor: Deploy → Manage deployments → edit → " +
            "set \"Who has access\" to Anyone, then deploy a new version.", "deployment");
        }
        throw ApiError("The server replied with HTTP " + res.status + ".", "http");
      }
      return res.text();
    }).then(function (text) {
      var body;
      try {
        body = JSON.parse(text);
      } catch (err) {
        /* An HTML page instead of JSON is nearly always a sign-in redirect. */
        if (/<html|<!doctype/i.test(text)) {
          throw ApiError(
            "The server sent a sign-in page instead of data. The deployment is not open " +
            "to anonymous callers: Deploy → Manage deployments → edit → \"Who has access\": " +
            "Anyone, and \"Execute as\": Me.", "deployment");
        }
        throw ApiError("The server sent something that was not data: " +
          text.slice(0, 120), "garbled");
      }
      if (body.error) {
        var msg = String(body.error);
        if (msg === "SESSION_REQUIRED" || msg === "SESSION_INVALID" || msg === "SESSION_EXPIRED") {
          throw ApiError(msg, "session");
        }
        if (msg.indexOf("Unknown action") === 0) throw ApiError(msg, "stale-deployment");
        throw ApiError(msg, "server");
      }
      return body.result;
    }).catch(function (err) {
      /* A thrown fetch means the host was never reached — nothing ran, so a
         read may safely be retried. */
      var neverSent = (err instanceof TypeError) ||
        (err && !err.kind && /NetworkError|Failed to fetch|Load failed/i.test(String(err.message)));
      if (neverSent && n < attempts) {
        return new Promise(function (r) { setTimeout(r, 400); }).then(function () {
          return attempt(n + 1);
        });
      }
      if (neverSent) {
        throw ApiError(
          "VAULT could not reach the server, so the request was never sent — nothing was " +
          "saved. Check your connection, then try again. If it keeps happening the " +
          "deployment URL may be wrong or the deployment may have been deleted.", "offline");
      }
      throw err;
    });
  }
  return attempt(1);
}

/* A connection check the user can run. Probes BOTH hops and interprets what it
   finds, rather than reporting one undifferentiated failure. */
function runConnectionCheck() {
  var lines = [];
  var t0 = Date.now();
  lines.push("Backend URL:");
  lines.push("  " + (VAULT_BACKEND_URL.indexOf("PASTE_YOUR") === 0 ? "(not set)" : VAULT_BACKEND_URL));
  lines.push("");
  ui.connCheck = lines.join("\n") + "\nChecking…";
  render();

  return fetch(VAULT_BACKEND_URL, { method: "GET", redirect: "follow" })
    .then(function (res) {
      lines.push("Hop 1 — script.google.com");
      lines.push("  answered, HTTP " + res.status);
      lines.push("Hop 2 — script.googleusercontent.com (serves the reply)");
      lines.push("  final URL: " + (res.url || "(not reported)"));
      return res.text().then(function (t) { return { res: res, text: t }; });
    })
    .then(function (r) {
      var parsed = null;
      try { parsed = JSON.parse(r.text); } catch (e) { /* not JSON */ }
      if (parsed && parsed.result && parsed.result.ok) {
        lines.push("  reply parsed as JSON — OK");
        lines.push("");
        lines.push("Server date: " + parsed.result.today);
        lines.push("");
        lines.push("VERDICT: both hops are working. VAULT can reach its backend.");
      } else if (/<html|<!doctype/i.test(r.text)) {
        lines.push("  reply was an HTML page, not data");
        lines.push("");
        lines.push("VERDICT: the deployment requires sign-in. Fix it in the Apps Script");
        lines.push("editor: Deploy → Manage deployments → edit → \"Who has access\": Anyone,");
        lines.push("\"Execute as\": Me. Then deploy a NEW VERSION.");
      } else {
        lines.push("  reply was neither data nor a sign-in page:");
        lines.push("  " + r.text.slice(0, 200));
        lines.push("");
        lines.push("VERDICT: something is answering, but it is not this VAULT deployment.");
      }
      lines.push("");
      lines.push("Round trip: " + (Date.now() - t0) + " ms");
      ui.connCheck = lines.join("\n");
      render();
    })
    .catch(function (err) {
      lines.push("Hop 1 — script.google.com");
      lines.push("  NOT REACHED (" + String(err.message || err) + ")");
      lines.push("");
      lines.push("VERDICT: the request never left, or the host does not exist. Either the");
      lines.push("URL above is wrong or the deployment has been deleted. Check it against");
      lines.push("Deploy → Manage deployments in the Apps Script editor — and make sure it");
      lines.push("ends in /exec, not /dev.");
      ui.connCheck = lines.join("\n");
      render();
    });
}

/* Turns any failure into a sentence naming the actual cause and the actual fix.
   Crucially it distinguishes "your file is malformed" from "VAULT hit an
   internal error" — a ReferenceError reported as a bad CSV sent us hunting the
   wrong thing for two rounds on Vantage. */
function describeError(err) {
  if (!err) return "Something went wrong.";
  if (err.kind === "session") return "Your session has ended. Sign in again.";
  if (err.kind === "stale-deployment") {
    return "This page is newer than the deployed script. Whoever published VAULT needs to " +
      "re-deploy the Apps Script: Deploy → Manage deployments → edit → New version.";
  }
  if (err.kind) return err.message;
  /* Not an ApiError at all — this is a bug in VAULT, and saying so is the
     difference between a five-minute fix and a two-day hunt. */
  if (err instanceof TypeError || err instanceof ReferenceError || err instanceof SyntaxError) {
    console.error("VAULT internal error", err);
    return "VAULT hit an internal error (" + err.name + ": " + err.message + "). This is a " +
      "fault in VAULT itself, not in your data — the details are in the browser console.";
  }
  return String(err.message || err);
}

/* =========================================================================
   FIFO ageing engine — debtors

   UNCHANGED from the prototype in every respect that produces a number:
   receipts are POOLED (not matched by date), sales are consumed oldest-first,
   and the `> 0.5` residual threshold stops rounding dust showing as
   outstanding.

   Two things did change, both deliberate:
     · conversion uses rowUSD (the rate stamped at entry), not the current rate,
       so a rate change cannot restate which invoices a historic receipt cleared
       (REQUIREMENTS D6);
     · a carried-forward credit from before the feed cutoff joins the pool, so
       bounding the feed cannot change the answer (REQUIREMENTS §14 Q3).
   ========================================================================= */
function computeDebtorAgeing(transactions, rates, asOfDate, carriedCredits) {
  var byKey = {};
  var creditByKey = {};
  (carriedCredits || []).forEach(function (c) {
    creditByKey[nameKeyOf(c.debtorName)] = (creditByKey[nameKeyOf(c.debtorName)] || 0) + Number(c.amountUSD || 0);
  });

  transactions.forEach(function (t) {
    var k = nameKeyOf(t.debtorName);
    (byKey[k] = byKey[k] || []).push(t);
  });
  /* A debtor whose every transaction was collapsed away by the feed cutoff, but
     who is carrying a credit, still has to appear — they have overpaid, and money
     we owe back must not be invisible just because the feed was bounded. */
  (carriedCredits || []).forEach(function (c) {
    var k = nameKeyOf(c.debtorName);
    if (!byKey[k]) byKey[k] = [{ debtorName: c.debtorName, type: "cash_receipt",
      transactionDate: "", amount: 0, currency: "USD", fxRateAtEntry: 1, __creditOnly: true }];
  });

  var result = [];
  var allOutstandingInvoices = [];

  Object.keys(byKey).forEach(function (key) {
    var txns = byKey[key];
    var displayName = txns[0].debtorName;
    var sales = txns.filter(function (t) { return t.type === "credit_sale"; })
      .map(function (t) {
        var usd = rowUSD(t, rates);
        return Object.assign({}, t, { usd: usd, remaining: usd });
      })
      .sort(function (a, b) { return String(a.transactionDate || "").localeCompare(String(b.transactionDate || "")); });
    var receipts = txns.filter(function (t) { return t.type === "cash_receipt"; })
      .map(function (t) { return Object.assign({}, t, { usd: rowUSD(t, rates) }); })
      .sort(function (a, b) { return String(a.transactionDate || "").localeCompare(String(b.transactionDate || "")); });

    var receiptPool = receipts.reduce(function (s, r) { return s + r.usd; }, 0) + (creditByKey[key] || 0);
    for (var i = 0; i < sales.length; i++) {
      if (receiptPool <= 0) break;
      var consume = Math.min(sales[i].remaining, receiptPool);
      sales[i].remaining -= consume;
      receiptPool -= consume;
    }
    var outstanding = sales.filter(function (s) { return s.remaining > 0.5; });
    var totalOutstanding = outstanding.reduce(function (s, i2) { return s + i2.remaining; }, 0);
    var overdue = outstanding.filter(function (i2) { return i2.dueDate && i2.dueDate < asOfDate; })
      .reduce(function (s, i2) { return s + i2.remaining; }, 0);
    var nextDue = outstanding.map(function (i2) { return i2.dueDate; }).filter(Boolean).sort()[0] || null;
    outstanding.forEach(function (i2) {
      allOutstandingInvoices.push(Object.assign({}, i2, { debtorName: displayName }));
    });
    /* A debtor with nothing outstanding AND no credit has nothing to say on an
       ageing screen. Dropping them also makes the bounded and unbounded feeds
       agree exactly — a settled debtor is absent either way. */
    if (totalOutstanding <= 0 && receiptPool <= 0.5) return;
    result.push({
      debtorName: displayName, totalOutstanding: totalOutstanding, overdue: overdue,
      nextDue: nextDue, invoiceCount: outstanding.length, unallocatedReceipt: receiptPool
    });
  });

  result.sort(function (a, b) { return b.totalOutstanding - a.totalOutstanding; });
  return { byDebtor: result, invoices: allOutstandingInvoices };
}

/* =========================================================================
   FIFO ageing engine — OEM creditors. The same, in reverse.
   ========================================================================= */
function computeCreditorAgeing(transactions, rates, asOfDate, carriedCredits) {
  var byKey = {};
  var creditByKey = {};
  (carriedCredits || []).forEach(function (c) {
    creditByKey[nameKeyOf(c.oem)] = (creditByKey[nameKeyOf(c.oem)] || 0) + Number(c.amountUSD || 0);
  });

  transactions.forEach(function (t) {
    var k = nameKeyOf(t.oem);
    (byKey[k] = byKey[k] || []).push(t);
  });
  /* Same for an OEM we have overpaid — see the note in computeDebtorAgeing. */
  (carriedCredits || []).forEach(function (c) {
    var k = nameKeyOf(c.oem);
    if (!byKey[k]) byKey[k] = [{ oem: c.oem, type: "payment", paymentDate: "",
      amount: 0, currency: "USD", fxRateAtEntry: 1, __creditOnly: true }];
  });

  var result = [];
  var allOutstandingInvoices = [];

  Object.keys(byKey).forEach(function (key) {
    var txns = byKey[key];
    var displayName = txns[0].oem;
    var invoices = txns.filter(function (t) { return (t.type || "invoice") === "invoice"; })
      .map(function (t) {
        var usd = rowUSD(t, rates);
        return Object.assign({}, t, { usd: usd, remaining: usd });
      })
      .sort(function (a, b) {
        return String(a.invoiceDate || a.dueDate || "").localeCompare(String(b.invoiceDate || b.dueDate || ""));
      });
    var payments = txns.filter(function (t) { return t.type === "payment"; })
      .map(function (t) { return Object.assign({}, t, { usd: rowUSD(t, rates) }); })
      .sort(function (a, b) { return String(a.paymentDate || "").localeCompare(String(b.paymentDate || "")); });

    var paymentPool = payments.reduce(function (s, p) { return s + p.usd; }, 0) + (creditByKey[key] || 0);
    for (var i = 0; i < invoices.length; i++) {
      if (paymentPool <= 0) break;
      var consume = Math.min(invoices[i].remaining, paymentPool);
      invoices[i].remaining -= consume;
      paymentPool -= consume;
    }
    var outstanding = invoices.filter(function (s) { return s.remaining > 0.5; });
    var totalOutstanding = outstanding.reduce(function (s, i2) { return s + i2.remaining; }, 0);
    var overdue = outstanding.filter(function (i2) { return i2.dueDate && i2.dueDate < asOfDate; })
      .reduce(function (s, i2) { return s + i2.remaining; }, 0);
    var nextDue = outstanding.map(function (i2) { return i2.dueDate; }).filter(Boolean).sort()[0] || null;
    outstanding.forEach(function (i2) {
      allOutstandingInvoices.push(Object.assign({}, i2, { oem: displayName }));
    });
    var totalPaid = payments.reduce(function (s, p) { return s + p.usd; }, 0);
    if (totalOutstanding <= 0 && paymentPool <= 0.5 && totalPaid <= 0) return;
    result.push({
      oem: displayName, totalOutstanding: totalOutstanding, overdue: overdue, nextDue: nextDue,
      invoiceCount: outstanding.length, totalPaid: totalPaid, unallocatedPayment: paymentPool
    });
  });

  result.sort(function (a, b) { return b.totalOutstanding - a.totalOutstanding; });
  return { byOem: result, invoices: allOutstandingInvoices };
}

/* "Acme Ltd", "acme ltd" and "Acme  Ltd " were three separate debtors with
   three separate FIFO chains (REQUIREMENTS D23). Must match nameKey_ on the
   server exactly — a test asserts it does. */
function nameKeyOf(name) {
  return String(name || "").trim().replace(/\s+/g, " ").toLowerCase();
}

/* =========================================================================
   Derived model — recomputed on every render, exactly as the memos did
   ========================================================================= */
var model = {};

/* Which week a date falls in.

   `null` means the date is OUTSIDE the horizon. The prototype returned null
   here too, but every caller filtered on `=== w.index`, so those rows were
   silently dropped — a $7m dividend due in week 13 of a 12-week horizon simply
   vanished, and nothing on the dashboard said obligations were being excluded
   (REQUIREMENTS D4). VAULT still excludes them from the arithmetic (they are
   genuinely outside the window being forecast) but now COUNTS them and says so.
   See model.excluded. */
function bucketIndex(dateStr, weeksArr) {
  if (!dateStr || !weeksArr.length) return null;
  if (dateStr < weeksArr[0].start) return 0;   /* overdue rolls into week 1 */
  for (var i = 0; i < weeksArr.length; i++) {
    if (dateStr >= weeksArr[i].start && dateStr <= weeksArr[i].end) return weeksArr[i].index;
  }
  return null;
}

/* The label a record view shows for a row's week. It MUST agree with
   bucketIndex: the prototype's weekLabelFor printed "outside range" for any
   past-dated row while the ledger charged it to week 1, so the table told the
   user a figure was excluded while the forecast was spending it
   (REQUIREMENTS D21). */
function weekLabelFor(dateStr) {
  if (!dateStr || !model.weeks || !model.weeks.length) return '<span class="tcf-td-sub">–</span>';
  var idx = bucketIndex(dateStr, model.weeks);
  if (idx === null) return '<span class="tcf-td-sub" title="After the end of the forecast window, so not included in any week">beyond horizon</span>';
  if (dateStr < model.weeks[0].start) {
    return esc(model.weeks[0].label) + ' <span class="tcf-td-sub" title="Dated before the forecast start, so absorbed into week 1">(overdue)</span>';
  }
  return esc(model.weeks[idx].label);
}

function computeModel() {
  var s = state.settings;
  var rates = { ngnRate: Number(s.ngnRate) || 1411, ghsRate: Number(s.ghsRate) || 11.5 };
  var today = state.today;

  /* Clamped on READ as well as write. A bad stored value must not render
     hundreds of weeks (REQUIREMENTS D7). */
  /* Clamped exactly as the server clamps it (numSetting_), so the two cannot
     disagree. `Number(x) || 12` was wrong: it turned a stored 0 into 12 here
     while the server turned it into 1. A blank still means "use the default". */
  var rawWeeks = s.numWeeks;
  var n = (rawWeeks === "" || rawWeeks === null || rawWeeks === undefined) ? 12 : Number(rawWeeks);
  if (!isFinite(n)) n = 12;
  n = Math.max(1, Math.min(16, n));
  var startDate = isValidIso(s.startDate) ? s.startDate : mondayOfIso(today);

  var weeks = [];
  for (var i = 0; i < n; i++) {
    weeks.push({
      index: i,
      start: addDaysIso(startDate, i * 7),
      end: addDaysIso(startDate, i * 7 + 6),
      label: "Wk " + (i + 1)
    });
  }

  /* Opening cash. The three USD locations are summed for the headline but never
     collapsed in storage — treasury needs to see where the cash actually sits. */
  var p = state.position || {};
  var startingCashUSD =
    Number(p.usdGlobal || 0) + Number(p.usdNigeria || 0) + Number(p.usdGhana || 0) +
    toUSD(p.ngnPosition, "NGN", rates) + toUSD(p.ghsPosition, "GHS", rates);

  var ageing = computeDebtorAgeing(state.debtorTxns, rates, startDate, state.debtorCredits);
  var totalARUSD = ageing.byDebtor.reduce(function (a, d) { return a + d.totalOutstanding; }, 0);
  var totalOverdueUSD = ageing.byDebtor.reduce(function (a, d) { return a + d.overdue; }, 0);

  var oemAgeing = computeCreditorAgeing(state.oemInvoices, rates, startDate, state.oemCredits);
  var totalOemOutstandingUSD = oemAgeing.byOem.reduce(function (a, o) { return a + o.totalOutstanding; }, 0);
  var totalOemOverdueUSD = oemAgeing.byOem.reduce(function (a, o) { return a + o.overdue; }, 0);

  /* Anything falling outside the horizon is counted here rather than silently
     dropped, and surfaced on the dashboard (REQUIREMENTS D4, G5). */
  var excluded = { count: 0, usd: 0, items: [] };
  function noteExcluded(label, dateStr, usd) {
    excluded.count++;
    excluded.usd += usd;
    if (excluded.items.length < 12) excluded.items.push({ label: label, date: dateStr, usd: usd });
  }

  var opening = startingCashUSD;
  var horizonEnd = weeks[weeks.length - 1].end;

  ageing.invoices.forEach(function (inv) {
    if (bucketIndex(inv.dueDate, weeks) === null) {
      noteExcluded("AR — " + inv.debtorName, inv.dueDate, inv.remaining);
    }
  });
  oemAgeing.invoices.forEach(function (inv) {
    if (bucketIndex(inv.dueDate, weeks) === null) {
      noteExcluded("OEM — " + inv.oem, inv.dueDate, -inv.remaining);
    }
  });
  state.dividends.filter(function (d) { return d.status !== "paid"; }).forEach(function (d) {
    if (bucketIndex(d.dueDate, weeks) === null) {
      noteExcluded("Dividend — " + d.description, d.dueDate, -rowUSD(d, rates));
    }
  });
  state.mobilePurchases.forEach(function (m) {
    if (bucketIndex(m.estimatedDate, weeks) === null) {
      noteExcluded("Mobile — " + m.brand, m.estimatedDate, -rowUSD(m, rates));
    }
  });
  state.dailyExpenses.forEach(function (e) {
    if (bucketIndex(e.date, weeks) === null) {
      noteExcluded("Expense — " + e.description, e.date, -rowUSD(e, rates));
    }
  });
  state.cashSales.forEach(function (c) {
    if (bucketIndex(c.date, weeks) === null) {
      noteExcluded("Cash sale — " + (c.description || c.reference || ""), c.date, rowUSD(c, rates));
    }
  });

  var ledger = weeks.map(function (w) {
    /* Overrides are keyed by the week's START DATE. Changing startDate now
       moves the window without silently re-pointing every override at a
       different calendar week (REQUIREMENTS D2). A cleared override DELETES its
       row, so this falls through to the default rather than forecasting 0%
       (REQUIREMENTS D3). */
    var ov = state.collectionOverrides[w.start];
    var pct = (ov === undefined || ov === null || ov === "") ? Number(s.collectionRatePct) : Number(ov);
    if (!isFinite(pct)) pct = Number(s.collectionRatePct) || 0;

    var dueInvoices = ageing.invoices.filter(function (inv) { return bucketIndex(inv.dueDate, weeks) === w.index; });
    var dueThisWeekUSD = dueInvoices.reduce(function (a, i2) { return a + i2.remaining; }, 0);
    var forecastInflow = dueThisWeekUSD * (pct / 100);

    /* THE SERVER'S DATE decides this, not the browser's (REQUIREMENTS C6). */
    var isClosed = w.end < today;

    var actualReceipts = state.debtorTxns.filter(function (t) {
      return t.type === "cash_receipt" && t.transactionDate &&
        t.transactionDate >= w.start && t.transactionDate <= w.end;
    });
    var actualInflowUSD = actualReceipts.reduce(function (a, t) { return a + rowUSD(t, rates); }, 0);
    var arInflow = isClosed ? actualInflowUSD : forecastInflow;

    /* Cash sales bypass the collection assumption because the cash is already
       in hand. They are never folded into the AR path. */
    var weekCashSales = state.cashSales.filter(function (c) { return bucketIndex(c.date, weeks) === w.index; });
    var cashSalesUSD = weekCashSales.reduce(function (a, c) { return a + rowUSD(c, rates); }, 0);
    var inflow = arInflow + cashSalesUSD;

    var oemDueInvoices = oemAgeing.invoices.filter(function (inv) { return bucketIndex(inv.dueDate, weeks) === w.index; });
    var oemDueThisWeekUSD = oemDueInvoices.reduce(function (a, i2) { return a + i2.remaining; }, 0);
    var actualOemPayments = state.oemInvoices.filter(function (t) {
      return t.type === "payment" && t.paymentDate &&
        t.paymentDate >= w.start && t.paymentDate <= w.end;
    });
    var actualOemPaidUSD = actualOemPayments.reduce(function (a, t) { return a + rowUSD(t, rates); }, 0);
    var oemTotal = isClosed ? actualOemPaidUSD : oemDueThisWeekUSD;

    /* THE CLOSED-WEEK RULE (REQUIREMENTS D5, §14 Q2).

       The prototype switched AR and OEM to actuals but left mobile purchases,
       dividends and expenses on their logged amount in EVERY week — so a
       dividend that was never actually paid still showed as an outflow in a
       week that had already ended.

       A closed week now reports what actually happened, consistently: only rows
       actually PAID inside it count. Anything logged as due in a closed week but
       never paid is not silently charged to a week that has ended — it is rolled
       into the current week and flagged (see unpaidRolledIn below). */
    var weekMobile, weekDividends, weekExpenses;
    if (isClosed) {
      /* An estimate with no paid date never counts in a closed week — the money
         demonstrably did not move. It is picked up by unpaidRolledIn below. */
      weekMobile = state.mobilePurchases.filter(function (m) {
        return !!m.paidDate && m.paidDate >= w.start && m.paidDate <= w.end;
      });
      weekDividends = state.dividends.filter(function (d) {
        return d.status === "paid" && d.paidDate && d.paidDate >= w.start && d.paidDate <= w.end;
      });
      weekExpenses = state.dailyExpenses.filter(function (e) {
        return !!e.paidDate && e.paidDate >= w.start && e.paidDate <= w.end;
      });
    } else {
      weekMobile = state.mobilePurchases.filter(function (m) { return bucketIndex(m.estimatedDate, weeks) === w.index; });
      weekDividends = state.dividends.filter(function (d) {
        return d.status !== "paid" && bucketIndex(d.dueDate, weeks) === w.index;
      });
      weekExpenses = state.dailyExpenses.filter(function (e) { return bucketIndex(e.date, weeks) === w.index; });
    }

    var mobileTotal = weekMobile.reduce(function (a, m) { return a + rowUSD(m, rates); }, 0);
    var dividendTotal = weekDividends.reduce(function (a, d) { return a + rowUSD(d, rates); }, 0);
    var expenseTotal = weekExpenses.reduce(function (a, e) { return a + rowUSD(e, rates); }, 0);
    var mobileByBrand = MOBILE_BRANDS.reduce(function (acc, b) {
      acc[b] = weekMobile.filter(function (m) { return m.brand === b; })
        .reduce(function (a, m) { return a + rowUSD(m, rates); }, 0);
      return acc;
    }, {});

    var outflow = oemTotal + mobileTotal + dividendTotal + expenseTotal;
    var closing = opening + inflow - outflow;
    var row = Object.assign({}, w, {
      pct: pct, hasOverride: (ov !== undefined && ov !== null && ov !== ""),
      opening: opening, dueThisWeekUSD: dueThisWeekUSD, forecastInflow: forecastInflow,
      actualInflowUSD: actualInflowUSD, cashSalesUSD: cashSalesUSD, arInflow: arInflow,
      inflow: inflow, isClosed: isClosed,
      oemTotal: oemTotal, oemDueThisWeekUSD: oemDueThisWeekUSD, actualOemPaidUSD: actualOemPaidUSD,
      mobileTotal: mobileTotal, dividendTotal: dividendTotal, expenseTotal: expenseTotal,
      mobileByBrand: mobileByBrand, outflow: outflow, closing: closing,
      oemCount: oemDueInvoices.length, mobileCount: weekMobile.length,
      dividendCount: weekDividends.length, expenseCount: weekExpenses.length,
      /* Strict `<`. Exactly at the buffer is COVERED, not breached — preserved
         from the prototype and asserted at the boundary by a test. */
      shortfall: closing < Number(s.minBufferUSD || 0)
    });
    opening = closing;
    return row;
  });

  /* Obligations logged as due in a week that has already closed, but never
     recorded as paid. They are not charged to the closed week (that would be
     reporting a payment that did not happen) and they are not dropped either —
     they are named here so treasury can chase or write them off. */
  var unpaidRolledIn = [];
  var firstOpen = ledger.filter(function (r) { return !r.isClosed; })[0];
  if (firstOpen) {
    state.dividends.filter(function (d) { return d.status !== "paid"; }).forEach(function (d) {
      var idx = bucketIndex(d.dueDate, weeks);
      if (idx !== null && ledger[idx] && ledger[idx].isClosed) {
        unpaidRolledIn.push({ what: "Dividend — " + d.description, dueDate: d.dueDate, usd: rowUSD(d, rates) });
      }
    });
    state.dailyExpenses.filter(function (e) { return !e.paidDate; }).forEach(function (e) {
      var idx = bucketIndex(e.date, weeks);
      if (idx !== null && ledger[idx] && ledger[idx].isClosed) {
        unpaidRolledIn.push({ what: "Expense — " + e.description, dueDate: e.date, usd: rowUSD(e, rates) });
      }
    });
    state.mobilePurchases.filter(function (m) { return !m.paidDate; }).forEach(function (m) {
      var idx = bucketIndex(m.estimatedDate, weeks);
      if (idx !== null && ledger[idx] && ledger[idx].isClosed) {
        unpaidRolledIn.push({ what: "Mobile — " + m.brand, dueDate: m.estimatedDate, usd: rowUSD(m, rates) });
      }
    });
    var rolledTotal = unpaidRolledIn.reduce(function (a, x) { return a + x.usd; }, 0);
    if (rolledTotal > 0) {
      firstOpen.outflow += rolledTotal;
      firstOpen.rolledInUSD = rolledTotal;
      /* Re-chain every closing balance downstream of the change. */
      var run = firstOpen.opening;
      for (var k = firstOpen.index; k < ledger.length; k++) {
        ledger[k].opening = run;
        ledger[k].closing = run + ledger[k].inflow - ledger[k].outflow;
        ledger[k].shortfall = ledger[k].closing < Number(s.minBufferUSD || 0);
        run = ledger[k].closing;
      }
    }
  }

  var totalInflow = ledger.reduce(function (a, r) { return a + r.inflow; }, 0);
  var totalOutflow = ledger.reduce(function (a, r) { return a + r.outflow; }, 0);
  var horizonSummary = {
    totalInflow: totalInflow,
    totalOutflow: totalOutflow,
    net: totalInflow - totalOutflow,
    endingCash: ledger.length ? ledger[ledger.length - 1].closing : startingCashUSD,
    breaches: ledger.filter(function (r) { return r.shortfall; }).length,
    weeks: ledger.length
  };

  /* The opening position's as-of date against the forecast start. If the bank
     count is dated after the window opens, every transaction in between is
     counted twice — and nothing on screen compared the two dates
     (REQUIREMENTS D22, G7). */
  var reconcile = null;
  if (state.position && state.position.asOfDate) {
    if (state.position.asOfDate > startDate) {
      reconcile = {
        kind: "after",
        asOfDate: state.position.asOfDate, startDate: startDate,
        days: Math.round((dMs(state.position.asOfDate) - dMs(startDate)) / 86400000)
      };
    } else if (state.position.asOfDate < startDate) {
      reconcile = {
        kind: "before",
        asOfDate: state.position.asOfDate, startDate: startDate,
        days: Math.round((dMs(startDate) - dMs(state.position.asOfDate)) / 86400000)
      };
    }
  }

  model = {
    rates: rates, weeks: weeks, startDate: startDate, horizonEnd: horizonEnd,
    startingCashUSD: startingCashUSD,
    ageing: ageing, totalARUSD: totalARUSD, totalOverdueUSD: totalOverdueUSD,
    oemAgeing: oemAgeing, totalOemOutstandingUSD: totalOemOutstandingUSD,
    totalOemOverdueUSD: totalOemOverdueUSD,
    ledger: ledger, horizonSummary: horizonSummary, monthSummary: horizonSummary,
    excluded: excluded, unpaidRolledIn: unpaidRolledIn, reconcile: reconcile
  };
  return model;
}

/* =========================================================================
   Charts — hand-drawn SVG, replacing Recharts. Lifted from the prototype
   unchanged; they take {name,value} rows and know nothing about the model.
   ========================================================================= */
var CHART_TIPS = {};

function axisTick(v) {
  var a = Math.abs(v), sign = v < 0 ? "-$" : "$";
  if (a === 0) return "$0";
  if (a >= 1000000000) return sign + (a / 1000000000).toFixed(1) + "B";
  if (a >= 1000000) return sign + (a / 1000000).toFixed(a >= 10000000 ? 0 : 1) + "M";
  if (a >= 1000) return sign + Math.round(a / 1000) + "k";
  return sign + Math.round(a);
}
function niceStep(range, target) {
  var raw = range / target;
  var mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  var norm = raw / mag;
  var step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return step * mag;
}
function scaleTicks(min, max, count) {
  if (min === max) { min = min - 1; max = max + 1; }
  var step = niceStep(max - min, count);
  var lo = Math.floor(min / step) * step;
  var hi = Math.ceil(max / step) * step;
  var ticks = [];
  for (var v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return { lo: lo, hi: hi, ticks: ticks };
}

/* Area chart: closing cash against the minimum buffer line. */
function renderAreaChart(id, rows, buffer) {
  var W = 900, H = 240, ML = 68, MR = 22, MT = 14, MB = 30;
  var iw = W - ML - MR, ih = H - MT - MB;
  if (!rows.length) return '<div class="tcf-empty">Nothing to plot yet.</div>';

  var vals = rows.map(function (r) { return r.value; }).concat([Number(buffer) || 0, 0]);
  var sc = scaleTicks(Math.min.apply(null, vals), Math.max.apply(null, vals), 4);
  var y = function (v) { return MT + ih - ((v - sc.lo) / (sc.hi - sc.lo)) * ih; };
  var x = function (i) { return rows.length === 1 ? ML + iw / 2 : ML + (i / (rows.length - 1)) * iw; };

  var grid = sc.ticks.map(function (t) {
    return '<line x1="' + ML + '" x2="' + (W - MR) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '" style="stroke:var(--border)" stroke-dasharray="3 3"/>' +
      '<text x="' + (ML - 10) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end" style="fill:var(--muted)" font-size="11" font-family="IBM Plex Mono, monospace">' + axisTick(t) + '</text>';
  }).join("");

  var linePts = rows.map(function (r, i) { return x(i).toFixed(1) + "," + y(r.value).toFixed(1); }).join(" ");
  var areaPts = x(0).toFixed(1) + "," + y(sc.lo).toFixed(1) + " " + linePts + " " + x(rows.length - 1).toFixed(1) + "," + y(sc.lo).toFixed(1);

  var xLabels = rows.map(function (r, i) {
    return '<text x="' + x(i).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle" style="fill:var(--muted)" font-size="12">' + esc(r.name) + '</text>';
  }).join("");

  var bufY = y(Number(buffer) || 0);
  var bufLine = '<line x1="' + ML + '" x2="' + (W - MR) + '" y1="' + bufY.toFixed(1) + '" y2="' + bufY.toFixed(1) + '" style="stroke:var(--red)" stroke-dasharray="4 4"/>' +
    '<text x="' + (W - MR - 4) + '" y="' + (bufY - 6).toFixed(1) + '" text-anchor="end" style="fill:var(--red)" font-size="11">Min buffer</text>';

  var dots = rows.map(function (r, i) {
    return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(r.value).toFixed(1) + '" r="3" style="fill:var(--gold)"/>';
  }).join("");

  CHART_TIPS[id] = rows.map(function (r) {
    return '<div class="tcf-tooltip-label">' + esc(r.name) + '</div>' +
      '<div class="tcf-tooltip-row"><span style="color:var(--gold)">Closing</span><span class="tcf-mono">' + fmtUSD(r.value) + '</span></div>' +
      '<div class="tcf-tooltip-row"><span style="color:var(--red)">Buffer</span><span class="tcf-mono">' + fmtUSD(Number(buffer) || 0) + '</span></div>';
  });

  var bandW = iw / rows.length;
  var hits = rows.map(function (r, i) {
    return '<rect class="tcf-chart-hit" data-tipidx="' + i + '" x="' + (ML + i * bandW).toFixed(1) + '" y="' + MT + '" width="' + bandW.toFixed(1) + '" height="' + ih + '"/>';
  }).join("");

  return '<div class="tcf-chart" data-chart="' + id + '">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Closing cash by week against the minimum buffer">' +
    '<defs><linearGradient id="' + id + '-fill" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" style="stop-color:var(--gold)" stop-opacity="0.35"/><stop offset="100%" style="stop-color:var(--gold)" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    '<polygon points="' + areaPts + '" fill="url(#' + id + '-fill)"/>' +
    '<polyline points="' + linePts + '" fill="none" style="stroke:var(--gold)" stroke-width="2"/>' +
    dots + bufLine +
    '<line x1="' + ML + '" x2="' + (W - MR) + '" y1="' + (MT + ih) + '" y2="' + (MT + ih) + '" style="stroke:var(--border)"/>' +
    xLabels + hits +
    '</svg><div class="tcf-chart-tip"></div></div>';
}

/* Grouped bar chart: weekly inflows above the axis, outflows below. */
function renderBarChart(id, rows, series) {
  var W = 900, H = 230, ML = 68, MR = 22, MT = 14, MB = 30;
  var iw = W - ML - MR, ih = H - MT - MB;
  if (!rows.length) return '<div class="tcf-empty">Nothing to plot yet.</div>';

  var all = [0];
  rows.forEach(function (r) { series.forEach(function (sd) { all.push(r.values[sd.key] || 0); }); });
  var sc = scaleTicks(Math.min.apply(null, all), Math.max.apply(null, all), 4);
  var y = function (v) { return MT + ih - ((v - sc.lo) / (sc.hi - sc.lo)) * ih; };

  var grid = sc.ticks.map(function (t) {
    return '<line x1="' + ML + '" x2="' + (W - MR) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '" style="stroke:var(--border)" stroke-dasharray="3 3"/>' +
      '<text x="' + (ML - 10) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end" style="fill:var(--muted)" font-size="11" font-family="IBM Plex Mono, monospace">' + axisTick(t) + '</text>';
  }).join("");

  var groupW = iw / rows.length;
  var inner = groupW * 0.78;
  var barW = Math.max(2, inner / series.length - 1.5);
  var zeroY = y(0);

  var bars = "", hits = "", xLabels = "";
  rows.forEach(function (r, gi) {
    var gx = ML + gi * groupW + (groupW - inner) / 2;
    series.forEach(function (sd, si) {
      var v = r.values[sd.key] || 0;
      var yv = y(v);
      var top = Math.min(yv, zeroY), h = Math.abs(yv - zeroY);
      if (h < 0.6 && v !== 0) h = 0.6;
      bars += '<rect x="' + (gx + si * (inner / series.length)).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) + '" style="fill:' + sd.color + '" rx="2"/>';
    });
    xLabels += '<text x="' + (ML + gi * groupW + groupW / 2).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle" style="fill:var(--muted)" font-size="12">' + esc(r.name) + '</text>';
    hits += '<rect class="tcf-chart-hit" data-tipidx="' + gi + '" x="' + (ML + gi * groupW).toFixed(1) + '" y="' + MT + '" width="' + groupW.toFixed(1) + '" height="' + ih + '"/>';
  });

  CHART_TIPS[id] = rows.map(function (r) {
    return '<div class="tcf-tooltip-label">' + esc(r.name) + '</div>' + series.map(function (sd) {
      return '<div class="tcf-tooltip-row"><span style="color:' + sd.color + '">' + esc(sd.key) + '</span><span class="tcf-mono">' + fmtUSD(r.values[sd.key] || 0) + '</span></div>';
    }).join("");
  });

  var legend = '<div class="tcf-legend">' + series.map(function (sd) {
    return '<span class="tcf-legend-item"><span class="tcf-legend-swatch" style="background:' + sd.color + '"></span>' + esc(sd.key) + '</span>';
  }).join("") + '</div>';

  return '<div class="tcf-chart" data-chart="' + id + '">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weekly inflows and outflows by category">' +
    grid + bars +
    '<line x1="' + ML + '" x2="' + (W - MR) + '" y1="' + zeroY.toFixed(1) + '" y2="' + zeroY.toFixed(1) + '" style="stroke:var(--border)"/>' +
    xLabels + hits +
    '</svg><div class="tcf-chart-tip"></div></div>' + legend;
}

/* =========================================================================
   Render helpers
   ========================================================================= */
function getDraft(path) {
  var bits = path.split(".");
  var o = drafts[bits[0]];
  return o ? o[bits[1]] : "";
}
function setDraft(path, value) {
  var bits = path.split(".");
  if (!drafts[bits[0]]) drafts[bits[0]] = {};
  drafts[bits[0]][bits[1]] = value;
}

function inputEl(path, o) {
  o = o || {};
  var v = getDraft(path);
  return '<input class="tcf-input ' + (o.cls || "") + '" data-draft="' + attr(path) + '"' +
    ' type="' + (o.type || "text") + '"' +
    (o.placeholder ? ' placeholder="' + attr(o.placeholder) + '"' : "") +
    (o.title ? ' title="' + attr(o.title) + '"' : "") +
    (o.min !== undefined ? ' min="' + o.min + '"' : "") +
    (o.max !== undefined ? ' max="' + o.max + '"' : "") +
    (o.disabled ? " disabled" : "") +
    ' value="' + attr(v === undefined || v === null ? "" : v) + '" />';
}
function selectEl(path, options, o) {
  o = o || {};
  var v = String(getDraft(path));
  var opts = options.map(function (op) {
    var val = (typeof op === "string") ? op : op.value;
    var lab = (typeof op === "string") ? op : op.label;
    return '<option value="' + attr(val) + '"' + (String(val) === v ? " selected" : "") + '>' + esc(lab) + '</option>';
  }).join("");
  return '<select class="tcf-input ' + (o.cls || "") + '" data-draft="' + attr(path) + '"' +
    (o.rerender ? ' data-rerender="1"' : "") + (o.disabled ? " disabled" : "") + '>' + opts + '</select>';
}
function summaryCard(label, value, tone, iconName) {
  return '<div class="tcf-card tcf-card-' + tone + '"><div class="tcf-card-top">' + ico(iconName, 15) +
    '<span>' + esc(label) + '</span></div><div class="tcf-card-value tcf-mono">' + esc(value) + '</div></div>';
}
function fieldNum(label, path, prefix, sub, live) {
  return '<div class="tcf-field"><label>' + esc(label) + '</label>' +
    '<div class="tcf-input-prefix"><span>' + esc(prefix) + '</span>' +
    '<input class="tcf-input" type="number" data-draft="' + attr(path) + '"' + (live ? ' data-live="' + attr(live) + '"' : "") +
    ' value="' + attr(getDraft(path)) + '" /></div>' +
    (sub !== undefined && sub !== null ? '<div class="tcf-field-sub" data-sub="' + attr(path) + '">' + esc(sub) + '</div>' : "") +
    '</div>';
}
function btn(action, label, opts) {
  opts = opts || {};
  return '<button class="tcf-btn ' + (opts.cls || "tcf-btn-primary") + '" data-act="' + attr(action) + '"' +
    (opts.data ? opts.data : "") + (opts.disabled ? " disabled" : "") +
    (opts.title ? ' title="' + attr(opts.title) + '"' : "") + '>' +
    (opts.icon ? ico(opts.icon, opts.iconSize || 14) : "") + " " + esc(label) + '</button>';
}
function iconBtn(action, iconName, opts) {
  opts = opts || {};
  return '<button class="tcf-icon-btn" data-act="' + attr(action) + '"' + (opts.data || "") +
    (opts.disabled ? " disabled" : "") +
    (opts.title ? ' title="' + attr(opts.title) + '"' : "") + ' aria-label="' + attr(opts.title || action) + '">' +
    ico(iconName, opts.size || 13, opts.cls) + '</button>';
}

/* Add/Save buttons are disabled while a write is in flight. state.saving was set
   in the prototype but gated nothing, so double-clicking Add created two
   entries (REQUIREMENTS D15). */
function saveBtn(action, label, opts) {
  opts = Object.assign({}, opts || {});
  if (state.saving) { opts.disabled = true; label = "Saving…"; }
  return btn(action, label, opts);
}

/* =========================================================================
   Filters, sorting and pagination — on EVERY record view.

   The prototype paged only the expense list, and an expanded debtor rendered
   every transaction that debtor had ever had (REQUIREMENTS G3). VAULT is the
   highest-volume of the three apps; that does not survive a year of daily
   receipts.

   Changing any filter or sort returns to page one. Each view keeps its own
   page, in ui.views[key].
   ========================================================================= */
var PAGE_SIZE = 50;

function applyView(key, rows, cfg) {
  var v = viewState(key);
  var out = rows.slice();
  var dateField = v.dateField || (cfg.dateFields && cfg.dateFields[0] && cfg.dateFields[0].value) || "";

  if (v.q) {
    var needle = v.q.toLowerCase();
    out = out.filter(function (r) {
      return (cfg.searchFields || []).some(function (f) {
        return String(r[f] === undefined || r[f] === null ? "" : r[f]).toLowerCase().indexOf(needle) >= 0;
      });
    });
  }
  /* Inclusive date range over a SELECTABLE date field — a debtor row can be
     filtered by transaction date or by due date. */
  if (dateField && (v.from || v.to)) {
    out = out.filter(function (r) {
      var d = String(r[dateField] || "").slice(0, 10);
      if (!d) return false;
      if (v.from && d < v.from) return false;
      if (v.to && d > v.to) return false;
      return true;
    });
  }
  if (v.cat && cfg.catField) out = out.filter(function (r) { return String(r[cfg.catField] || "") === v.cat; });
  if (v.ccy) out = out.filter(function (r) { return String(r.currency || "") === v.ccy; });
  if (v.type && cfg.typeField) out = out.filter(function (r) { return String(r[cfg.typeField] || "") === v.type; });

  var sortKey = v.sort || cfg.defaultSort;
  if (sortKey) {
    var dir = v.dir === "asc" ? 1 : -1;
    out.sort(function (a, b) {
      var x = a[sortKey], y = b[sortKey];
      if (typeof x === "number" || typeof y === "number") return ((Number(x) || 0) - (Number(y) || 0)) * dir;
      return String(x === undefined || x === null ? "" : x)
        .localeCompare(String(y === undefined || y === null ? "" : y)) * dir;
    });
  }

  var pageCount = Math.max(1, Math.ceil(out.length / PAGE_SIZE));
  var page = Math.min(Math.max(0, v.page), pageCount - 1);
  v.page = page;
  return {
    all: out, total: out.length, unfiltered: rows.length,
    page: page, pageCount: pageCount,
    rows: out.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE),
    dateField: dateField, sortKey: sortKey, dir: v.dir
  };
}

function renderFilters(key, cfg) {
  var v = viewState(key);
  var h = '<div class="tcf-filters">';
  h += '<div class="tcf-filter tcf-filter-grow"><label>Search</label>' +
    '<input class="tcf-input" data-filter="' + attr(key) + '.q" value="' + attr(v.q) + '" placeholder="' +
    attr(cfg.searchPlaceholder || "Anything in this table") + '" /></div>';
  if (cfg.dateFields && cfg.dateFields.length) {
    h += '<div class="tcf-filter"><label>Date field</label><select class="tcf-input" data-filter="' + attr(key) + '.dateField">' +
      cfg.dateFields.map(function (f) {
        var sel = (v.dateField || cfg.dateFields[0].value) === f.value ? " selected" : "";
        return '<option value="' + attr(f.value) + '"' + sel + '>' + esc(f.label) + '</option>';
      }).join("") + '</select></div>';
    h += '<div class="tcf-filter"><label>From</label><input class="tcf-input" type="date" data-filter="' + attr(key) + '.from" value="' + attr(v.from) + '" /></div>';
    h += '<div class="tcf-filter"><label>To</label><input class="tcf-input" type="date" data-filter="' + attr(key) + '.to" value="' + attr(v.to) + '" /></div>';
  }
  if (cfg.catOptions) {
    h += '<div class="tcf-filter"><label>' + esc(cfg.catLabel || "Category") + '</label><select class="tcf-input" data-filter="' + attr(key) + '.cat">' +
      '<option value="">All</option>' + cfg.catOptions.map(function (c) {
        return '<option value="' + attr(c) + '"' + (v.cat === c ? " selected" : "") + '>' + esc(c) + '</option>';
      }).join("") + '</select></div>';
  }
  if (cfg.typeOptions) {
    h += '<div class="tcf-filter"><label>' + esc(cfg.typeLabel || "Type") + '</label><select class="tcf-input" data-filter="' + attr(key) + '.type">' +
      '<option value="">All</option>' + cfg.typeOptions.map(function (c) {
        return '<option value="' + attr(c.value) + '"' + (v.type === c.value ? " selected" : "") + '>' + esc(c.label) + '</option>';
      }).join("") + '</select></div>';
  }
  h += '<div class="tcf-filter"><label>Currency</label><select class="tcf-input" data-filter="' + attr(key) + '.ccy">' +
    '<option value="">All</option>' + CURRENCIES.map(function (c) {
      return '<option value="' + attr(c) + '"' + (v.ccy === c ? " selected" : "") + '>' + esc(c) + '</option>';
    }).join("") + '</select></div>';
  h += '<div class="tcf-filter">' + btn("filter-clear", "Clear", { cls: "tcf-btn-ghost", data: ' data-view="' + attr(key) + '"' }) + '</div>';
  h += '</div>';
  return h;
}

function sortableTh(key, field, label) {
  var v = viewState(key);
  var active = (v.sort === field);
  var arrow = active ? '<span class="tcf-sort-arrow">' + (v.dir === "asc" ? "▲" : "▼") + '</span>' : "";
  return '<th class="tcf-sortable" data-act="sort" data-view="' + attr(key) + '" data-field="' + attr(field) + '">' +
    esc(label) + arrow + '</th>';
}

/* A filter is never invisible: the count always says what was filtered out. */
function renderCount(key, r) {
  var from = r.total ? (r.page * PAGE_SIZE + 1) : 0;
  var to = Math.min(r.total, (r.page + 1) * PAGE_SIZE);
  var txt = r.total
    ? "Showing " + from + "–" + to + " of " + r.total.toLocaleString("en-US")
    : "Nothing matches these filters";
  if (r.total !== r.unfiltered) txt += " (filtered from " + r.unfiltered.toLocaleString("en-US") + ")";
  return '<div class="tcf-rowcount">' + esc(txt) + '</div>';
}

function renderPager(key, r) {
  if (r.pageCount <= 1) return "";
  return '<div class="tcf-pager">' +
    btn("page", "Previous", { cls: "tcf-btn-ghost", disabled: r.page === 0, data: ' data-view="' + attr(key) + '" data-page="' + (r.page - 1) + '"' }) +
    '<span class="tcf-td-sub">Page ' + (r.page + 1) + ' of ' + r.pageCount + '</span>' +
    btn("page", "Next", { cls: "tcf-btn-ghost", disabled: r.page >= r.pageCount - 1, data: ' data-view="' + attr(key) + '" data-page="' + (r.page + 1) + '"' }) +
    '</div>';
}

/* Edit / delete buttons, drawn only where this actor may actually use them —
   and refused again on the server if the markup is tampered with. */
function rowActions(entity, row) {
  if (!canWrite()) return "";
  var mine = row.createdById === state.actor.userId;
  var allowed = canDeleteAny() || mine;
  var why = allowed ? "" : "Logged by " + (row.createdBy || "someone else") + " — ask a Treasury Manager";
  return '<div class="tcf-td-actions">' +
    iconBtn("edit-open", "settings", { data: ' data-entity="' + attr(entity) + '" data-id="' + attr(row.id) + '"', size: 13, title: allowed ? "Edit" : why, disabled: !allowed }) +
    iconBtn("del-ask", "trash", { data: ' data-entity="' + attr(entity) + '" data-id="' + attr(row.id) + '"', size: 13, title: allowed ? "Delete" : why, disabled: !allowed }) +
    '</div>';
}

/* =========================================================================
   Shell
   ========================================================================= */
function renderApp() {
  if (state.phase === "boot") {
    return '<div class="tcf-center" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
      ico("refresh", 28, "tcf-spin") + '<div style="margin-top:12px;color:var(--muted)">Loading VAULT…</div></div>';
  }
  if (state.phase === "signin") return renderSignIn();

  computeModel();

  var html = "";
  if (ui.toast) {
    html += '<div class="tcf-toast ' + (ui.toast.type === "error" ? "tcf-toast-error" : "tcf-toast-success") + '" role="status">' +
      esc(ui.toast.message) +
      (ui.toast.undo ? ' <span class="tcf-link" data-act="undo-delete" role="button" tabindex="0">Undo</span>' : "") +
      '</div>';
  }
  if (ui.exportOpen) html += renderExportModal();
  if (ui.bulk) html += renderBulkModal();
  if (ui.edit) html += renderEditModal();
  if (ui.confirm) html += renderConfirmModal();
  if (ui.drilldown) html += renderDrilldownModal();

  html += '<header class="tcf-header">' +
    '<div class="tcf-header-left">' +
    '<div class="tcf-eyebrow">TD Africa · Group Treasury</div>' +
    '<h1 class="tcf-title">VAULT</h1>' +
    '<div class="tcf-subtitle">Cash Flow Forecast &amp; Working Capital Ledger</div>' +
    '</div>' +
    '<div class="tcf-header-right">' +
    '<div class="tcf-hero-figure"><div class="tcf-hero-label">Cash position today</div>' +
    '<div class="tcf-hero-number">' + esc(fmtUSD(model.startingCashUSD)) + '</div></div>' +
    btn("export-open", "Export data", { icon: "clipboard", iconSize: 15, title: "Copy data out sheet by sheet" }) +
    iconBtn("refresh-all", "refresh", { size: 16, title: "Reload from the shared workspace", cls: state.saving ? "tcf-spin" : "" }) +
    '</div></header>';

  html += '<nav class="tcf-nav">' + TABS.map(function (t) {
    return '<button class="tcf-tab' + (ui.tab === t.id ? " tcf-tab-active" : "") + '" data-act="tab" data-tab="' + attr(t.id) + '"' +
      (ui.tab === t.id ? ' aria-current="page"' : "") + '>' + ico(t.icon, 15) + " " + esc(t.label) + '</button>';
  }).join("") +
    (canManagePeople() ? '<button class="tcf-tab' + (ui.tab === "people" ? " tcf-tab-active" : "") + '" data-act="tab" data-tab="people">' + ico("users", 15) + ' Directory</button>' : "") +
    '<div class="tcf-nav-spacer"></div>' +
    '<div class="tcf-user-chip">' + ico("users", 13) + " " + esc(state.actor.name) +
    ' <span class="tcf-role-pill">' + esc(ROLE_LABELS[state.actor.role] || state.actor.role) + '</span>' +
    ' <span class="tcf-link" data-act="sign-out" role="button" tabindex="0">sign out</span></div></nav>';

  html += '<main class="tcf-main">';

  /* The background poll never re-renders over an open form — it sets this flag
     and the flag is shown once the modal closes (REQUIREMENTS §11). */
  if (state.stale) {
    html += '<div class="tcf-stale">' + ico("alert", 15) +
      '<span>Someone else has changed VAULT since this page loaded. ' +
      'Reload to see their entries — anything you have typed but not saved will be kept.</span>' +
      btn("refresh-all", "Reload", { cls: "tcf-btn-ghost" }) + '</div>';
  }

  if (ui.tab === "dashboard") html += renderDashboard();
  else if (ui.tab === "positions") html += renderPositions();
  else if (ui.tab === "debtors") html += renderDebtors();
  else if (ui.tab === "cashsales") html += renderCashSales();
  else if (ui.tab === "oem") html += renderOem();
  else if (ui.tab === "mobile") html += renderMobile();
  else if (ui.tab === "dividends") html += renderDividends();
  else if (ui.tab === "expenses") html += renderExpenses();
  else if (ui.tab === "history") html += renderHistory();
  else if (ui.tab === "people") html += renderPeople();
  else if (ui.tab === "settings") html += renderSettings();
  html += '</main>';

  html += '<footer class="tcf-footer">Shared workspace — every entry here is visible to everyone ' +
    'signed in to VAULT, and every change is recorded against the person who made it. ' +
    'Server date ' + esc(state.today) + '. Last loaded ' +
    esc(state.lastSync ? state.lastSync.toLocaleTimeString() : "–") + '.</footer>';

  return html;
}

/* =========================================================================
   Sign-in — work email, 6-digit code, session
   ========================================================================= */
function renderSignIn() {
  var a = ui.auth;
  var h = '<div class="tcf-auth-wrap"><div class="tcf-auth">' +
    '<div class="tcf-eyebrow">TD Africa · Group Treasury</div>' +
    '<h2>VAULT</h2>';

  if (a.error) h += '<div class="tcf-auth-err">' + esc(a.error) +
    (a.error.indexOf("could not reach") >= 0 || a.error.indexOf("deployment") >= 0
      ? ' <span class="tcf-link" data-act="conn-check" role="button" tabindex="0">Run a connection check</span>' : "") +
    '</div>';
  if (a.notice) h += '<div class="tcf-auth-ok">' + esc(a.notice) + '</div>';

  if (a.step === "bootstrap") {
    h += '<p>This workspace has no Admin yet. The first person to set it up becomes ' +
      'the Admin and can then add everyone else.</p>' +
      '<input class="tcf-input" id="auth-name" placeholder="Your full name" value="' + attr(a.name) + '" autocomplete="name" />' +
      '<input class="tcf-input" id="auth-email" type="email" placeholder="Your work email" value="' + attr(a.email) + '" autocomplete="email" />' +
      '<div class="tcf-modal-actions">' +
      btn("auth-bootstrap", a.busy ? "Creating…" : "Create the Admin account", { disabled: a.busy }) + '</div>';
  } else if (a.step === "email") {
    h += '<p>Sign in with your work email. VAULT sends a 6-digit code — there is no password.</p>' +
      '<input class="tcf-input" id="auth-email" type="email" placeholder="you@tdafrica.com" value="' + attr(a.email) + '" autocomplete="email" />' +
      '<div class="tcf-modal-actions">' +
      btn("auth-request", a.busy ? "Sending…" : "Send me a code", { disabled: a.busy }) + '</div>';
  } else {
    h += '<p>We sent a 6-digit code to <strong>' + esc(a.email) + '</strong>. ' +
      'It expires in ' + (a.expiresInMinutes || 10) + ' minutes and can only be used once.</p>' +
      '<input class="tcf-input tcf-auth-code" id="auth-code" inputmode="numeric" maxlength="6" ' +
      'placeholder="000000" value="' + attr(a.code) + '" autocomplete="one-time-code" />' +
      '<div class="tcf-modal-actions">' +
      btn("auth-back", "Use a different address", { cls: "tcf-btn-ghost" }) +
      btn("auth-verify", a.busy ? "Checking…" : "Sign in", { disabled: a.busy }) + '</div>' +
      '<div class="tcf-auth-foot"><span>Didn\'t get it? Check spam.</span>' +
      (a.cooldown > 0
        ? '<span>Resend in ' + a.cooldown + 's</span>'
        : '<span class="tcf-link" data-act="auth-request" role="button" tabindex="0">Send another code</span>') +
      '</div>';
  }

  h += '<div class="tcf-auth-foot"><span class="tcf-link" data-act="conn-check" role="button" tabindex="0">Connection check</span></div>';
  if (ui.connCheck) h += '<div class="tcf-conn">' + esc(ui.connCheck) + '</div>';
  h += '</div></div>';
  return h;
}

/* =========================================================================
   Forecast (dashboard)
   ========================================================================= */
function renderDashboard() {
  var m = model, s = state.settings, ms = m.horizonSummary;

  var chartRows = m.ledger.map(function (r) { return { name: r.label, value: Math.round(r.closing) }; });
  var flowRows = m.ledger.map(function (r) {
    return {
      name: r.label,
      values: {
        "AR Collections": Math.round(r.arInflow),
        "Cash Sales": Math.round(r.cashSalesUSD),
        "OEM Payments": -Math.round(r.oemTotal),
        "Mobile Purchases": -Math.round(r.mobileTotal),
        "Dividends": -Math.round(r.dividendTotal),
        "Daily Expenses": -Math.round(r.expenseTotal)
      }
    };
  });
  var flowSeries = [
    { key: "AR Collections", color: "var(--green)" },
    { key: "Cash Sales", color: "var(--blue)" },
    { key: "OEM Payments", color: "var(--red)" },
    { key: "Mobile Purchases", color: "var(--amber)" },
    { key: "Dividends", color: "var(--violet)" },
    { key: "Daily Expenses", color: "var(--slate)" }
  ];

  var weeksLabel = ms.weeks + "-week";
  var html = '<div class="tcf-stack"><section class="tcf-grid-4">' +
    /* Labelled by the actual horizon. The prototype called these "Month
       inflow"/"Month outflow" while summing 12 weeks — nearly three months
       (REQUIREMENTS D13). */
    summaryCard(weeksLabel + " inflow", fmtUSD(ms.totalInflow), "pos", "trendingUp") +
    summaryCard(weeksLabel + " outflow", fmtUSD(ms.totalOutflow), "neg", "trendingDown") +
    summaryCard("Net movement", fmtUSD(ms.net), ms.net >= 0 ? "pos" : "neg", "wallet") +
    summaryCard("Ending cash", fmtUSD(ms.endingCash), ms.endingCash >= Number(s.minBufferUSD) ? "pos" : "warn", "landmark") +
    '</section>';

  if (!state.position) {
    html += '<div class="tcf-alert">' + ico("alert", 16) +
      '<span><strong>No opening cash position has been entered.</strong> The forecast is rolling ' +
      'forward from zero. Enter it on the <strong>Cash Positions</strong> tab.</span></div>';
  }

  if (ms.breaches > 0) {
    html += '<div class="tcf-alert">' + ico("alert", 16) + '<span><strong>' + ms.breaches + ' week' + (ms.breaches > 1 ? "s" : "") +
      '</strong> fall below the minimum cash buffer of ' + esc(fmtUSD(s.minBufferUSD)) + '. ' +
      (m.totalOverdueUSD > 0 ? esc(fmtUSD(m.totalOverdueUSD)) + ' of debt is already overdue and rolled into Week 1. ' : "") +
      'OEM obligations and dividends are treated as non-negotiable — review collection assumptions or phase mobile purchases and daily expenses.</span></div>';
  }

  /* Obligations outside the horizon are NAMED, not silently dropped
     (REQUIREMENTS D4, G5). */
  if (m.excluded.count > 0) {
    html += '<div class="tcf-warn-inline"><strong>' + m.excluded.count + ' record' +
      (m.excluded.count > 1 ? "s are" : " is") + ' dated after ' + esc(fmtDateShort(m.horizonEnd)) +
      ', beyond this ' + ms.weeks + '-week horizon, so ' + (m.excluded.count > 1 ? "they are" : "it is") +
      ' not in any figure above</strong> — a net ' + esc(fmtUSD(m.excluded.usd)) + '. ' +
      'Widen the horizon on Settings to bring ' + (m.excluded.count > 1 ? "them" : "it") + ' in.<br>' +
      m.excluded.items.map(function (x) {
        return '<span class="tcf-mono tcf-td-sub">' + esc(x.date) + ' · ' + esc(x.label) + ' · ' + esc(fmtUSD(x.usd)) + '</span>';
      }).join("<br>") +
      (m.excluded.count > m.excluded.items.length ? '<br><span class="tcf-td-sub">…and ' + (m.excluded.count - m.excluded.items.length) + ' more.</span>' : "") +
      '</div>';
  }

  /* Obligations that fell due in a week which has already closed but were never
     recorded as paid (REQUIREMENTS D5). */
  if (m.unpaidRolledIn.length) {
    var rolled = m.unpaidRolledIn.reduce(function (a, x) { return a + x.usd; }, 0);
    html += '<div class="tcf-warn-inline"><strong>' + esc(fmtUSD(rolled)) + ' fell due in a week that has ' +
      'already closed but was never marked paid.</strong> A closed week reports what actually happened, ' +
      'so these are not charged to it — they have been rolled into the current week instead. ' +
      'Mark them paid (with the date) or remove them.<br>' +
      m.unpaidRolledIn.slice(0, 8).map(function (x) {
        return '<span class="tcf-mono tcf-td-sub">' + esc(x.dueDate) + ' · ' + esc(x.what) + ' · ' + esc(fmtUSD(x.usd)) + '</span>';
      }).join("<br>") +
      (m.unpaidRolledIn.length > 8 ? '<br><span class="tcf-td-sub">…and ' + (m.unpaidRolledIn.length - 8) + ' more.</span>' : "") +
      '</div>';
  }

  /* The opening count against the forecast start (REQUIREMENTS D22, G7). */
  if (m.reconcile && m.reconcile.kind === "after") {
    html += '<div class="tcf-warn-inline"><strong>The cash position is dated ' + esc(m.reconcile.asOfDate) +
      ', which is ' + m.reconcile.days + ' day' + (m.reconcile.days === 1 ? "" : "s") + ' AFTER the forecast starts (' +
      esc(m.reconcile.startDate) + ').</strong> Any receipt or payment between those two dates is already ' +
      'inside the bank count AND counted again as forecast cash flow. Move the forecast start to ' +
      esc(mondayOfIso(m.reconcile.asOfDate)) + ', or re-count as at ' + esc(m.reconcile.startDate) + '.</div>';
  }

  html += '<section class="tcf-panel"><div class="tcf-panel-title">Closing cash vs minimum buffer</div>' +
    renderAreaChart("closing", chartRows, Number(s.minBufferUSD) || 0) + '</section>';

  html += '<section class="tcf-panel"><div class="tcf-panel-title">Weekly inflow vs outflow</div>' +
    renderBarChart("flows", flowRows, flowSeries) + '</section>';

  html += '<section class="tcf-panel"><div class="tcf-panel-title">The ledger tape</div><div class="tcf-ledger-scroll">' +
    '<table class="tcf-table tcf-ledger"><thead><tr>' +
    '<th>Week</th><th>Opening</th><th>AR due</th><th>AR collected <span class="tcf-th-sub">(rate % / actual)</span></th>' +
    '<th>Cash sales</th><th>OEM <span class="tcf-th-sub">(due / actual)</span></th><th>Mobile</th><th>Dividends</th>' +
    '<th>Daily opex</th><th>Closing</th><th>Status</th></tr></thead><tbody>';

  m.ledger.forEach(function (r) {
    html += '<tr class="' + (r.shortfall ? "tcf-row-warn" : "") + '">' +
      '<td class="tcf-mono">' + esc(r.label) + '<div class="tcf-td-sub">' + esc(fmtDateShort(r.start)) + '–' + esc(fmtDateShort(r.end)) + '</div></td>' +
      '<td class="tcf-mono">' + esc(fmtUSD(r.opening)) + '</td>' +
      '<td class="tcf-mono tcf-td-sub">' + esc(fmtUSD(r.dueThisWeekUSD)) + (r.index === 0 ? " *" : "") + '</td>' +
      '<td class="tcf-mono tcf-pos">+' + esc(fmtUSD(r.arInflow)) +
      (r.isClosed
        ? '<span class="tcf-badge tcf-badge-ok" style="margin-left:6px">Actual</span>'
        : (canSetAssumptions()
            ? '<input class="tcf-pct-input" type="number" min="0" max="100" value="' + attr(r.pct) + '" data-act="pct-override" data-week="' + attr(r.start) + '" title="' + (r.hasOverride ? "Overridden for this week — clear the box to go back to the default" : "Default rate — type here to override this week only") + '" aria-label="Collection rate for ' + attr(r.label) + '" />'
            : '<span class="tcf-td-sub" style="margin-left:6px">' + esc(r.pct) + '%' + (r.hasOverride ? " (set)" : "") + '</span>')) +
      '</td>' +
      '<td class="tcf-mono tcf-pos">' + (r.cashSalesUSD ? "+" + esc(fmtUSD(r.cashSalesUSD)) : dash()) + '</td>' +
      '<td class="tcf-mono tcf-neg">-' + esc(fmtUSD(r.oemTotal)) +
      (r.isClosed
        ? '<span class="tcf-badge tcf-badge-ok" style="margin-left:6px">Actual</span>'
        : '<span class="tcf-td-sub" style="margin-left:6px">' + r.oemCount + ' invoice' + (r.oemCount !== 1 ? "s" : "") + '</span>') +
      '</td>' +
      '<td class="tcf-mono tcf-neg">' + (r.mobileTotal ? "-" + esc(fmtUSD(r.mobileTotal)) : dash()) + '</td>' +
      '<td class="tcf-mono tcf-neg">' + (r.dividendTotal ? "-" + esc(fmtUSD(r.dividendTotal)) : dash()) + '</td>' +
      '<td class="tcf-mono tcf-neg">' + (r.expenseTotal ? "-" + esc(fmtUSD(r.expenseTotal)) : dash()) +
      (r.rolledInUSD ? '<div class="tcf-td-sub">incl. ' + esc(fmtUSD(r.rolledInUSD)) + ' rolled in</div>' : "") + '</td>' +
      '<td class="tcf-mono tcf-bold ' + (r.closing < 0 ? "tcf-neg" : "") + '">' + esc(fmtUSD(r.closing)) + '</td>' +
      '<td>' + (r.shortfall ? '<span class="tcf-badge tcf-badge-warn">Below buffer</span>' : '<span class="tcf-badge tcf-badge-ok">Covered</span>') + '</td>' +
      '</tr>';
  });

  html += '</tbody></table></div>' +
    '<p class="tcf-note">“AR due” is the value of invoices falling due that week (Week 1 also absorbs everything already overdue, marked *). ' +
    'For the current and future weeks, “AR collected” is the assumed collection rate applied to that; once a week\'s end date (the ' +
    '<strong>Sunday</strong>) has passed, VAULT switches automatically to the <strong>actual</strong> cash receipts and OEM payments logged ' +
    'against it, and closing balances recalculate from there. Closed weeks likewise count only dividends, purchases and expenses that were ' +
    'actually <strong>paid</strong> in them. Cash sales always add in full as actual cash, with no collection-rate assumption. ' +
    'The switch uses the <strong>server\'s</strong> date (' + esc(state.today) + '), not this computer\'s.</p></section></div>';

  return html;
}

/* =========================================================================
   Cash positions — an append-only series, not one mutable row
   ========================================================================= */
function positionsTotal(form) {
  return Number(form.usdGlobal || 0) + Number(form.usdNigeria || 0) + Number(form.usdGhana || 0) +
    toUSD(form.ngnPosition, "NGN", model.rates) + toUSD(form.ghsPosition, "GHS", model.rates);
}
function renderPositions() {
  /* A render that reaches a view before its draft exists must not take the whole
     app down with it — an empty form is recoverable, a blank screen is not. */
  if (!drafts.positions) resetDrafts();
  var f = drafts.positions, r = model.rates;
  var may = canSetAssumptions();
  var html = '<div class="tcf-stack"><section class="tcf-panel">' +
    '<div class="tcf-panel-title">Opening cash position</div>' +
    '<p class="tcf-note" style="margin-top:-4px">The base the forecast rolls forward from. Saving records a new ' +
    'snapshot rather than overwriting the last one, so the position at any past date can still be read off the ' +
    'History tab. The three USD locations are kept separate — treasury needs to see where the cash actually sits.</p>';

  if (!may) {
    html += '<div class="tcf-readonly-note">Your role can see the position but not change it. ' +
      'Cash positions are set by a Treasury Manager.</div>';
  }

  html += '<div class="tcf-form-grid">' +
    fieldNum("USD — Global / HQ", "positions.usdGlobal", "$", null, "positions") +
    fieldNum("USD — sitting in Nigeria", "positions.usdNigeria", "$", null, "positions") +
    fieldNum("USD — sitting in Ghana", "positions.usdGhana", "$", null, "positions") +
    fieldNum("Naira position (NGN)", "positions.ngnPosition", "₦", "≈ " + fmtUSD(toUSD(f.ngnPosition, "NGN", r)) + " at ₦" + r.ngnRate + "/$", "positions") +
    fieldNum("Cedis position (GHS)", "positions.ghsPosition", "₵", "≈ " + fmtUSD(toUSD(f.ghsPosition, "GHS", r)) + " at ₵" + r.ghsRate + "/$", "positions") +
    '<div class="tcf-field"><label>As-of date</label><input class="tcf-input" type="date" data-draft="positions.asOfDate" value="' + attr(f.asOfDate) + '" /></div>' +
    '<div class="tcf-field"><label>Note (optional)</label><input class="tcf-input" data-draft="positions.note" value="' + attr(f.note || "") + '" placeholder="e.g. from the 17 Aug bank position workbook" /></div>' +
    '</div>' +
    '<div class="tcf-total-strip"><span>Total cash position</span>' +
    '<span class="tcf-mono tcf-bold" id="tcf-pos-total" style="font-size:20px">' + esc(fmtUSD(positionsTotal(f))) + '</span></div>';

  if (model.reconcile && model.reconcile.kind === "after") {
    html += '<div class="tcf-warn-inline">This count is dated after the forecast start (' +
      esc(model.reconcile.startDate) + '), so cash flow between the two dates is counted twice. ' +
      'See the warning on the Forecast tab.</div>';
  }

  if (may) {
    html += '<div style="display:flex;justify-content:flex-end;margin-top:12px">' +
      saveBtn("positions-save", "Save position", {}) + '</div>';
  }

  if (state.position) {
    html += '<p class="tcf-note">Current position recorded by ' + esc(state.position.createdBy || "—") +
      ' as at ' + esc(state.position.asOfDate) + '.' +
      (state.position.note ? ' “' + esc(state.position.note) + '”' : "") + '</p>';
  }
  html += '</section>';

  if (state.positionHistory.length > 1) {
    html += '<section class="tcf-panel"><div class="tcf-panel-title">Previous counts</div>' +
      '<table class="tcf-table"><thead><tr><th>As at</th><th>USD Global</th><th>USD Nigeria</th>' +
      '<th>USD Ghana</th><th>NGN</th><th>GHS</th><th>Total USD</th><th>Recorded by</th></tr></thead><tbody>';
    state.positionHistory.forEach(function (p) {
      /* Historic totals use the rates snapshotted ON that row, so a later rate
         change cannot restate a count that was taken months ago. */
      var total = Number(p.usdGlobal || 0) + Number(p.usdNigeria || 0) + Number(p.usdGhana || 0) +
        Number(p.ngnPosition || 0) / (Number(p.ngnRateAtEntry) || model.rates.ngnRate) +
        Number(p.ghsPosition || 0) / (Number(p.ghsRateAtEntry) || model.rates.ghsRate);
      html += '<tr><td class="tcf-mono">' + esc(p.asOfDate) + '</td>' +
        '<td class="tcf-mono">' + esc(fmtUSD(p.usdGlobal)) + '</td>' +
        '<td class="tcf-mono">' + esc(fmtUSD(p.usdNigeria)) + '</td>' +
        '<td class="tcf-mono">' + esc(fmtUSD(p.usdGhana)) + '</td>' +
        '<td class="tcf-mono">' + esc(fmtCcy(p.ngnPosition, "NGN")) + '</td>' +
        '<td class="tcf-mono">' + esc(fmtCcy(p.ghsPosition, "GHS")) + '</td>' +
        '<td class="tcf-mono tcf-bold">' + esc(fmtUSD(total)) + '</td>' +
        '<td class="tcf-td-sub">' + esc(p.createdBy || dash()) + '</td></tr>';
    });
    html += '</tbody></table><p class="tcf-note">Each row is converted at the rate that applied when it was ' +
      'recorded, not today\'s — so past counts do not move when the naira does.</p></section>';
  }

  return html + '</div>';
}

/* Warns when a newly typed name is a near-match for one already on file —
   "Acme Ltd" vs "Acme Limited" would otherwise become two FIFO chains
   (REQUIREMENTS G6). Exact case/spacing differences are handled by nameKeyOf. */
function nameHint(draftPath, existing) {
  var typed = String(getDraft(draftPath) || "").trim();
  if (typed.length < 3) return "";
  var key = nameKeyOf(typed);
  if (existing.some(function (e) { return nameKeyOf(e) === key; })) return "";
  var near = existing.filter(function (e) {
    var ek = nameKeyOf(e);
    return ek.indexOf(key) === 0 || key.indexOf(ek) === 0;
  }).slice(0, 3);
  if (!near.length) return "";
  return '<div class="tcf-warn-inline">“' + esc(typed) + '” looks close to ' +
    near.map(function (n) { return "<strong>" + esc(n) + "</strong>"; }).join(", ") +
    '. A different spelling starts a separate ageing chain — check before adding.</div>';
}

      '<td>' + o.invoiceCount + '</td>' +
