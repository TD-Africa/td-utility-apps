}

/* =========================================================================
   The counterparty drilldown.

   Fetched on demand, so the bootstrap feed can be bounded without losing any
   detail. The prototype rendered every transaction a debtor had ever had,
   inline, on every render (REQUIREMENTS G3).

   The Outstanding column shows the FIFO REMAINING, not the gross converted
   amount. The prototype showed the gross, so a part-paid invoice displayed its
   full value and contradicted the summary directly above it (REQUIREMENTS D20).
   ========================================================================= */
function renderDrilldownModal() {
  var d = ui.drilldown;
  var isDebtor = d.kind === "debtor";
  var vkey = "drill:" + d.kind + ":" + d.name;

  var html = '<div class="tcf-modal-backdrop" data-act="drill-close-bg"><div class="tcf-modal tcf-modal-lg" data-stop="1" style="width:min(980px,96vw)">' +
    '<div class="tcf-modal-head"><div><div class="tcf-eyebrow">' + (isDebtor ? "Debtor ledger" : "OEM ledger") + '</div>' +
    '<h3 style="margin:4px 0 0">' + esc(d.name) + '</h3></div>' +
    iconBtn("drill-close", "x", { size: 16, title: "Close" }) + '</div>';

  if (d.loading) {
    html += '<div class="tcf-center" style="padding:40px">' + ico("refresh", 22, "tcf-spin") + '</div></div></div>';
    return html;
  }
  if (d.error) {
    html += '<div class="tcf-auth-err" style="margin-top:14px">' + esc(d.error) + '</div></div></div>';
    return html;
  }

  /* Remaining per invoice, from the same engine the summary uses — so the two
     can never disagree. */
  var remainingById = {};
  var summaryRow = null;
  if (isDebtor) {
    (model.ageing.invoices || []).forEach(function (i) { remainingById[i.id] = i.remaining; });
    summaryRow = model.ageing.byDebtor.filter(function (x) { return nameKeyOf(x.debtorName) === nameKeyOf(d.name); })[0];
  } else {
    (model.oemAgeing.invoices || []).forEach(function (i) { remainingById[i.id] = i.remaining; });
    summaryRow = model.oemAgeing.byOem.filter(function (x) { return nameKeyOf(x.oem) === nameKeyOf(d.name); })[0];
  }

  if (summaryRow) {
    html += '<div class="tcf-chip-row" style="margin-top:12px">' +
      '<div class="tcf-chip"><span>Outstanding</span><span class="tcf-mono tcf-bold">' + esc(fmtUSD(summaryRow.totalOutstanding)) + '</span></div>' +
      '<div class="tcf-chip"><span>Overdue</span><span class="tcf-mono tcf-bold">' + esc(fmtUSD(summaryRow.overdue)) + '</span></div>' +
      '<div class="tcf-chip"><span>Open invoices</span><span class="tcf-mono tcf-bold">' + summaryRow.invoiceCount + '</span></div>' +
      '<div class="tcf-chip"><span>' + (isDebtor ? "Unallocated receipts" : "Unallocated payments") + '</span><span class="tcf-mono tcf-bold">' +
      esc(fmtUSD(isDebtor ? summaryRow.unallocatedReceipt : summaryRow.unallocatedPayment)) + '</span></div>' +
      '</div>';
  }

  var cfg = isDebtor
    ? { searchFields: ["reference", "type"], dateFields: [{ value: "transactionDate", label: "Transaction date" }, { value: "dueDate", label: "Due date" }],
        typeField: "type", typeLabel: "Entry", typeOptions: [{ value: "credit_sale", label: "Credit sale" }, { value: "cash_receipt", label: "Cash receipt" }],
        defaultSort: "transactionDate", searchPlaceholder: "Reference" }
    : { searchFields: ["reference", "type"], dateFields: [{ value: "invoiceDate", label: "Invoice date" }, { value: "dueDate", label: "Due date" }, { value: "paymentDate", label: "Payment date" }],
        typeField: "type", typeLabel: "Entry", typeOptions: [{ value: "invoice", label: "Invoice" }, { value: "payment", label: "Payment" }],
        defaultSort: "invoiceDate", searchPlaceholder: "Reference" };

  var view = applyView(vkey, d.rows, cfg);
  var entity = isDebtor ? "debtorTxn" : "oemTxn";

  html += renderFilters(vkey, cfg) + renderCount(vkey, view) +
    '<div class="tcf-ledger-scroll"><table class="tcf-table"><thead><tr>' +
    '<th>Date</th><th>Due</th><th>Entry</th><th>Amount</th><th>USD</th>' +
    '<th title="What is still owed on this invoice after receipts are applied FIFO">Outstanding</th>' +
    '<th>Reference</th><th>Logged by</th><th></th></tr></thead><tbody>';

  view.rows.forEach(function (t) {
    var isCredit = isDebtor ? t.type === "cash_receipt" : t.type === "payment";
    var primaryDate = isDebtor ? t.transactionDate : (t.type === "payment" ? t.paymentDate : (t.invoiceDate || dash()));
    var rem = remainingById[t.id];
    html += '<tr><td class="tcf-mono">' + esc(primaryDate || dash()) + '</td>' +
      '<td class="tcf-mono">' + (t.dueDate ? esc(t.dueDate) : '<span class="tcf-td-sub">' + dash() + '</span>') + '</td>' +
      '<td class="tcf-td-sub">' + esc(isCredit ? (isDebtor ? "receipt" : "payment") : "invoice") +
      (t.carriedForward ? ' <span class="tcf-badge tcf-badge-ok" title="Carried forward from before the forecast window">b/f</span>' : "") + '</td>' +
      '<td class="tcf-mono ' + (isCredit ? "tcf-pos" : "") + '">' + (isCredit ? "+" : "") + esc(fmtCcy(t.amount, t.currency)) + '</td>' +
      '<td class="tcf-mono">' + esc(fmtUSD(t.usd !== undefined ? t.usd : rowUSD(t, model.rates))) + '</td>' +
      '<td class="tcf-mono tcf-bold">' + (isCredit ? dash() : (rem !== undefined ? esc(fmtUSD(rem)) : '<span class="tcf-td-sub">settled</span>')) + '</td>' +
      '<td class="tcf-td-sub">' + esc(t.reference || dash()) + '</td>' +
      '<td class="tcf-td-sub">' + esc(t.createdBy || dash()) + '</td>' +
      '<td>' + (t.carriedForward ? "" : rowActions(entity, t)) + '</td></tr>';
  });
  if (!view.rows.length) html += '<tr><td colspan="9" class="tcf-empty">Nothing matches these filters.</td></tr>';
  html += '</tbody></table></div>' + renderPager(vkey, view) +
    '<p class="tcf-note">“Outstanding” is what is still owed on that invoice after receipts have been applied ' +
    'oldest-first — not the invoice\'s gross value. Rows marked <strong>b/f</strong> are the net position ' +
    'carried forward from before the forecast window; edit them at source if they are wrong.</p>' +
    '</div></div>';
  return html;
}

/* =========================================================================
   A generic record table. Mobile, cash sales, dividends and expenses differ
   only in their columns, so they share one renderer — which is also why a
   filter or a fix lands on all four rather than three of them.
   ========================================================================= */
function renderRecordTable(vkey, entity, rows, cfg) {
  var view = applyView(vkey, rows, cfg);
  var html = renderFilters(vkey, cfg) + renderCount(vkey, view) +
    '<div class="tcf-ledger-scroll"><table class="tcf-table"><thead><tr>' +
    cfg.columns.map(function (c) {
      return c.sort ? sortableTh(vkey, c.sort, c.label) : '<th>' + esc(c.label) + '</th>';
    }).join("") + '<th></th></tr></thead><tbody>';

  view.rows.forEach(function (r) {
    html += '<tr>' + cfg.columns.map(function (c) { return c.cell(r); }).join("") +
      '<td>' + rowActions(entity, r) + '</td></tr>';
  });
  if (!view.rows.length) {
    html += '<tr><td colspan="' + (cfg.columns.length + 1) + '" class="tcf-empty">' +
      (rows.length ? "Nothing matches these filters." : esc(cfg.emptyText || "Nothing logged yet.")) + '</td></tr>';
  }
  html += '</tbody></table></div>' + renderPager(vkey, view);
  return html;
}

    '<p class="tcf-note" style="margin-top:-4px">Every entry, edit and deletion, with who made it and what it was before. ' +
    'Nothing is ever removed from this list — a deleted record leaves a tombstone carrying its full contents.</p>' +
    '<div class="tcf-filters">' +
    '<div class="tcf-filter"><label>What</label><select class="tcf-input" data-hist="entity">' +
    ENTITIES.map(function (e) {
      return '<option value="' + attr(e.value) + '"' + (h.entity === e.value ? " selected" : "") + '>' + esc(e.label) + '</option>';
    }).join("") + '</select></div>' +
    '<div class="tcf-filter"><label>From</label><input class="tcf-input" type="date" data-hist="from" value="' + attr(h.from) + '" /></div>' +
    '<div class="tcf-filter"><label>To</label><input class="tcf-input" type="date" data-hist="to" value="' + attr(h.to) + '" /></div>' +
    '<div class="tcf-filter">' + btn("hist-load", h.loading ? "Loading…" : "Apply", { disabled: h.loading }) + '</div>' +
    '</div>';

  html += '<div class="tcf-rowcount">' + (h.total
    ? "Showing " + (h.page * 50 + 1) + "–" + Math.min(h.total, (h.page + 1) * 50) + " of " + h.total.toLocaleString("en-US")
    : (h.loading ? "Loading…" : "No history matches these filters.")) + '</div>';

  html += '<div class="tcf-ledger-scroll"><table class="tcf-table"><thead><tr>' +
    '<th>When</th><th>Who</th><th>What</th><th>Action</th><th>Field</th><th>Change</th></tr></thead><tbody>';

  h.rows.forEach(function (r) {
    var change;
    if (r.action === "deleted") {
      change = '<span class="tcf-hist-detail tcf-diff-old">' + esc(String(r.oldValue).slice(0, 300)) + '</span>';
    } else if (r.action === "created") {
      change = '<span class="tcf-hist-detail tcf-diff-new">' + esc(r.newValue || r.detail) + '</span>';
    } else {
      change = '<span class="tcf-hist-detail"><span class="tcf-diff-old">' + esc(r.oldValue || "(blank)") +
        '</span> → <span class="tcf-diff-new">' + esc(r.newValue || "(blank)") + '</span></span>';
    }
    html += '<tr><td class="tcf-mono tcf-td-sub">' + esc(String(r.ts).replace("T", " ").slice(0, 16)) + '</td>' +
      '<td>' + esc(r.actor || dash()) + '</td>' +
      '<td class="tcf-td-sub">' + esc(r.entity) + '</td>' +
      '<td><span class="tcf-badge ' + (r.action === "deleted" ? "tcf-badge-warn" : "tcf-badge-ok") + '">' + esc(r.action) + '</span></td>' +
      '<td class="tcf-td-sub">' + esc(r.field || dash()) + '</td>' +
      '<td>' + change + (r.detail ? '<div class="tcf-td-sub">' + esc(r.detail) + '</div>' : "") + '</td></tr>';
  });
  if (!h.rows.length) html += '<tr><td colspan="6" class="tcf-empty">' +
    (h.loading ? "Loading…" : "Nothing yet. Press Apply to load the history.") + '</td></tr>';
  html += '</tbody></table></div>';

  var pageCount = Math.max(1, Math.ceil(h.total / 50));
  if (pageCount > 1) {
    html += '<div class="tcf-pager">' +
      btn("hist-page", "Previous", { cls: "tcf-btn-ghost", disabled: h.page === 0, data: ' data-page="' + (h.page - 1) + '"' }) +
      '<span class="tcf-td-sub">Page ' + (h.page + 1) + ' of ' + pageCount + '</span>' +
      btn("hist-page", "Next", { cls: "tcf-btn-ghost", disabled: h.page >= pageCount - 1, data: ' data-page="' + (h.page + 1) + '"' }) +
      '</div>';
  }
  return html + '</section></div>';
}

/* Minimal delimited-text parser for pasted Excel ranges (tab-separated) or CSV. */
function parseDelimitedText(text) {
  var lines = text.split(/\r\n|\r|\n/).filter(function (l) { return l.length > 0; });
  if (!lines.length) return [];
  var delimiter = lines[0].indexOf("\t") !== -1 ? "\t" : (lines[0].split(";").length > lines[0].split(",").length ? ";" : ",");
  return lines.map(function (line) {
    if (delimiter === "\t") return line.split("\t");
    var result = [], cur = "", inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (ch === delimiter && !inQuotes) { result.push(cur); cur = ""; }
      else cur += ch;
    }
    result.push(cur);
    return result.map(function (c) { return c.trim(); });
  });
}

/* =========================================================================
   Date parsing for imports.

   GUESSING IS WORSE THAN ASKING. The prototype resolved "01/02/2026" day-first
   whenever both numbers were ≤ 12, and a mis-parsed date moves cash into the
   wrong week (REQUIREMENTS D11).

   parseImportDate returns {iso, ambiguous}. Anything genuinely ambiguous is
   collected and the user picks DD/MM or MM/DD ONCE for the whole file. ISO
   dates and unambiguous ones are never questioned.
   ========================================================================= */
function parseImportDate(v, order) {
  if (v === null || v === undefined || v === "") return { iso: "", ambiguous: false };

  /* Excel serial number. */
  if (typeof v === "number") {
    if (hasXLSX() && XLSX.SSF) {
      var dc = XLSX.SSF.parse_date_code(v);
      if (dc && dc.y) {
        return { iso: dc.y + "-" + String(dc.m).padStart(2, "0") + "-" + String(dc.d).padStart(2, "0"), ambiguous: false };
      }
    }
    return { iso: "", ambiguous: false, bad: true };
  }

  var s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return { iso: s.slice(0, 10), ambiguous: false };

  var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    var a = Number(m[1]), b = Number(m[2]), y = m[3];
    if (y.length === 2) y = (Number(y) > 70 ? "19" : "20") + y;
    if (a > 12 && b <= 12) return { iso: y + "-" + String(b).padStart(2, "0") + "-" + String(a).padStart(2, "0"), ambiguous: false };
    if (b > 12 && a <= 12) return { iso: y + "-" + String(a).padStart(2, "0") + "-" + String(b).padStart(2, "0"), ambiguous: false };
    if (a > 12 && b > 12) return { iso: "", ambiguous: false, bad: true };
    /* Both ≤ 12 — genuinely ambiguous. */
    var day = order === "mdy" ? b : a;
    var mon = order === "mdy" ? a : b;
    return {
      iso: y + "-" + String(mon).padStart(2, "0") + "-" + String(day).padStart(2, "0"),
      ambiguous: true, raw: s
    };
  }

  /* "17 Aug 2026" and similar. Parsed from parts, never through Date parsing
     plus toISOString, which shifts the day. */
  var MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  var t = s.match(/^(\d{1,2})[\s\-]+([A-Za-z]{3,})[\s\-]+(\d{4})$/);
  if (t && MONTHS[t[2].slice(0, 3).toLowerCase()]) {
    return { iso: t[3] + "-" + String(MONTHS[t[2].slice(0, 3).toLowerCase()]).padStart(2, "0") + "-" + String(Number(t[1])).padStart(2, "0"), ambiguous: false };
  }
  var t2 = s.match(/^([A-Za-z]{3,})[\s\-]+(\d{1,2}),?[\s\-]+(\d{4})$/);
  if (t2 && MONTHS[t2[1].slice(0, 3).toLowerCase()]) {
    return { iso: t2[3] + "-" + String(MONTHS[t2[1].slice(0, 3).toLowerCase()]).padStart(2, "0") + "-" + String(Number(t2[2])).padStart(2, "0"), ambiguous: false };
  }

  return { iso: "", ambiguous: false, bad: true };
}

/* Amounts must parse cleanly AND be positive. The prototype stripped
   non-numerics and returned 0 for anything left unparseable, so "1.2.3" became
   a silent zero and a negative broke FIFO (REQUIREMENTS D8). */
function parseImportNumber(v) {
  if (v === null || v === undefined || v === "") return { n: null, bad: true, why: "is blank" };
  if (typeof v === "number") {
    if (!isFinite(v)) return { n: null, bad: true, why: "is not a number" };
    if (v <= 0) return { n: null, bad: true, why: "is " + v + " — amounts must be greater than zero" };
    return { n: v };
  }
  var s = String(v).trim().replace(/[\s,]/g, "").replace(/^[$₦₵]/, "");
  var neg = /^\(.*\)$/.test(s);
  if (neg) s = s.slice(1, -1);
  if (!/^-?\d*\.?\d+$/.test(s)) return { n: null, bad: true, why: '"' + v + '" is not a number' };
  var n = Number(s) * (neg ? -1 : 1);
  if (!isFinite(n)) return { n: null, bad: true, why: '"' + v + '" is not a number' };
  if (n <= 0) return { n: null, bad: true, why: "is " + n + " — amounts must be greater than zero" };
  return { n: n };
}

function resolveField(headerRaw, fields) {
  var h = normHeader(headerRaw);
  for (var i = 0; i < fields.length; i++) {
    var f = fields[i];
    if (normHeader(f.label) === h) return f.key;
    if (f.aliases && f.aliases.some(function (a) { return normHeader(a) === h; })) return f.key;
  }
  return null;
}

/* Builds the preview. Rejected rows are shown AS ROWS, with the row number, the
   column, the offending value and the reason — not collapsed into a count. */
function processRawRows(headerRow, dataRows) {
  var cfg = bulkConfig();
  var fields = cfg.fields;
  var keyMap = headerRow.map(function (h) { return resolveField(h, fields); });
  if (!keyMap.some(Boolean)) {
    ui.bulk.errors = [{ row: 1, why: "None of the columns matched the expected headings. Expected: " +
      fields.map(function (f) { return f.label; }).join(", ") + ". Use the template's column names." }];
    ui.bulk.rows = null;
    return;
  }

  var order = ui.bulk.dateOrder || "dmy";
  var parsed = [], rowErrors = [], ambiguous = [];

  dataRows.forEach(function (line, r) {
    if (!line || line.every(function (c) { return c === "" || c == null; })) return;
    var obj = {}, rowNum = r + 2, problems = [];
    keyMap.forEach(function (key, ci) { if (key) obj[key] = line[ci]; });

    fields.forEach(function (f) {
      var raw = obj[f.key];
      if (f.type === "date") {
        if (raw === undefined || raw === "" || raw === null) {
          if (f.required) problems.push(f.label + " is missing");
          obj[f.key] = "";
          return;
        }
        var d = parseImportDate(raw, order);
        if (d.bad || !d.iso) { problems.push(f.label + ': "' + raw + '" is not a date we can read'); obj[f.key] = ""; return; }
        if (d.ambiguous) ambiguous.push({ row: rowNum, field: f.label, raw: d.raw });
        obj[f.key] = d.iso;
      } else if (f.type === "number") {
        var n = parseImportNumber(raw);
        if (n.bad) { problems.push(f.label + " " + n.why); obj[f.key] = null; return; }
        obj[f.key] = n.n;
      } else {
        obj[f.key] = raw === undefined || raw === null ? "" : String(raw).trim();
        if (f.required && !obj[f.key]) problems.push(f.label + " is missing");
      }
    });

    if (problems.length) rowErrors.push({ row: rowNum, why: problems.join("; ") });
    else parsed.push(obj);
  });

  ui.bulk.rows = parsed;
  ui.bulk.errors = rowErrors;
  ui.bulk.ambiguous = ambiguous;
  ui.bulk.duplicates = findDuplicates(parsed, cfg);
}

/* Same counterparty, date, amount and reference as something already on file —
   the same receipt uploaded twice doubles a collection (REQUIREMENTS G6). */
function findDuplicates(rows, cfg) {
  var existing = {};
  var pool = cfg.entity === "debtorTxn" ? state.debtorTxns
    : cfg.entity === "oemTxn" ? state.oemInvoices
    : cfg.entity === "cashSale" ? state.cashSales
    : cfg.entity === "dividend" ? state.dividends
    : cfg.entity === "expense" ? state.dailyExpenses
    : state.mobilePurchases;
  var sig = function (r) {
    return [nameKeyOf(r.debtorName || r.oem || r.description || r.brand || ""),
      r.transactionDate || r.paymentDate || r.invoiceDate || r.date || r.dueDate || r.estimatedDate || "",
      Number(r.amount) || 0, String(r.reference || "").toLowerCase()].join("|");
  };
  pool.forEach(function (r) { existing[sig(r)] = true; });
  var out = [];
  rows.forEach(function (r, i) { if (existing[sig(r)]) out.push(i); });
  return out;
}

function handleBulkFile(file) {
  ui.bulk.fileName = file.name;
  ui.bulk.errors = [];
  ui.bulk.rows = null;
  var isCsv = /\.csv$/i.test(file.name);
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      if (isCsv || !hasXLSX()) {
        if (!isCsv && !hasXLSX()) {
          ui.bulk.errors = [{ row: 0, why: "Spreadsheet support didn't load, so .xlsx files can't be read right now. " +
            "Save the sheet as .csv and upload that, or use “Paste from Excel” instead." }];
          ui.bulk.rows = null;
          render();
          return;
        }
        var data = parseDelimitedText(String(e.target.result).trim());
        if (!data.length) { ui.bulk.errors = [{ row: 0, why: "The file has no rows." }]; ui.bulk.rows = null; render(); return; }
        ui.bulk.raw = data;
        processRawRows(data[0], data.slice(1));
      } else {
        var wb = XLSX.read(e.target.result, { type: "array", cellDates: false });
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!raw.length) { ui.bulk.errors = [{ row: 0, why: "The file has no rows." }]; ui.bulk.rows = null; render(); return; }
        ui.bulk.raw = raw;
        processRawRows(raw[0], raw.slice(1));
      }
    } catch (err) {
      /* "Your file is malformed" vs "VAULT hit an internal error" — reporting a
         ReferenceError as a bad CSV sent us hunting the wrong thing for two
         rounds on Vantage. */
      ui.bulk.errors = [{ row: 0, why: describeError(err) }];
      ui.bulk.rows = null;
    }
    render();
  };
  reader.onerror = function () {
    ui.bulk.errors = [{ row: 0, why: "The browser could not read that file." }];
    render();
  };
  if (isCsv || !hasXLSX()) reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

function handlePasteParse() {
  var text = (ui.bulk.pasteText || "").trim();
  if (!text) {
    ui.bulk.errors = [{ row: 0, why: "Paste some rows first — copy straight from Excel, including the header row." }];
    render(); return;
  }
  try {
    var data = parseDelimitedText(text);
    if (!data.length) { ui.bulk.errors = [{ row: 0, why: "Couldn't find any rows in that paste." }]; ui.bulk.rows = null; render(); return; }
    ui.bulk.raw = data;
    processRawRows(data[0], data.slice(1));
  } catch (err) {
    ui.bulk.errors = [{ row: 0, why: describeError(err) }];
    ui.bulk.rows = null;
  }
  render();
}

function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function downloadTemplate() {
  var cfg = bulkConfig();
  var header = cfg.fields.map(function (f) { return f.label; });
  var safeName = cfg.title.replace(/\s+/g, "_");
  if (hasXLSX()) {
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet([header, cfg.sampleRow]);
    XLSX.utils.book_append_sheet(wb, ws, "Template");
    var out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    downloadBlob(new Blob([out], { type: "application/octet-stream" }), safeName + "_Template.xlsx");
  } else {
    var csv = [header, cfg.sampleRow].map(function (row) {
      return row.map(function (v) {
        var s = String(v === undefined || v === null ? "" : v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(",");
    }).join("\n");
    downloadBlob(new Blob([csv], { type: "text/csv;charset=utf-8" }), safeName + "_Template.csv");
  }
}

/* =========================================================================
   Export

   Copy-to-clipboard as TSV stays the FIRST-CLASS path, because downloads are
   blocked on the office network. The .xlsx download is secondary and stays
   behind hasXLSX() guards throughout.
   ========================================================================= */
function rowsToTSV(rows) {
  if (!rows || !rows.length) return "";
  var headers = Object.keys(rows[0]);
  var lines = [headers.join("\t")];
  rows.forEach(function (r) {
    lines.push(headers.map(function (h) { return (r[h] === undefined || r[h] === null) ? "" : String(r[h]); }).join("\t"));
  });
  return lines.join("\n");
}
function rowsToCSV(rows) {
  if (!rows || !rows.length) return "";
  var headers = Object.keys(rows[0]);
  var q = function (v) {
    var s = (v === undefined || v === null) ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  var lines = [headers.map(q).join(",")];
  rows.forEach(function (r) { lines.push(headers.map(function (h) { return q(r[h]); }).join(",")); });
  return lines.join("\n");
}

function buildExportSheets() {
  var s = state.settings, m = model;

    return arr.map(function (row) {

      delete copy.importBatchId;
      delete copy.createdById;
      delete copy.updatedById;
      return copy;

  return {
    "Settings": [{
      ngnRate: s.ngnRate, ghsRate: s.ghsRate, collectionRatePct: s.collectionRatePct,
      minBufferUSD: s.minBufferUSD, numWeeks: s.numWeeks, startDate: s.startDate,
      serverDate: state.today, exportedBy: state.actor.name, exportedAt: new Date().toISOString()
    }],
    "Collection Overrides": Object.keys(state.collectionOverrides).sort().map(function (k) {

    }),

    "Position History": strip(state.positionHistory),
    "Weekly Forecast": m.ledger.map(function (r) {
      return {

        "Actual Cash Received USD": Math.round(r.actualInflowUSD),
        "AR Inflow Used USD": Math.round(r.arInflow), "Cash Sales USD": Math.round(r.cashSalesUSD),
        "Total Inflow USD": Math.round(r.inflow),
        "OEM Basis": r.isClosed ? "Actual Paid" : "Forecast Due", "OEM Due USD": Math.round(r.oemDueThisWeekUSD),
        "OEM Actual Paid USD": Math.round(r.actualOemPaidUSD), "OEM Outflow Used USD": Math.round(r.oemTotal),
        "Mobile Purchases USD": Math.round(r.mobileTotal), "Dividends USD": Math.round(r.dividendTotal),
        "Daily Expenses USD": Math.round(r.expenseTotal),

        "Why": "Dated after " + m.horizonEnd + ", beyond the " + m.ledger.length + "-week horizon" };
    }),
    "AR Ageing Summary": m.ageing.byDebtor.map(function (d) {
      return { "Debtor": d.debtorName, "Outstanding USD": Math.round(d.totalOutstanding),
        "Overdue USD": Math.round(d.overdue), "Next Due": d.nextDue, "Open Invoices": d.invoiceCount,
        "Unallocated Receipts USD": Math.round(d.unallocatedReceipt) };
    }),
    "Debtor Transactions": strip(state.debtorTxns),
    "OEM Ageing Summary": m.oemAgeing.byOem.map(function (o) {
      return { "OEM": o.oem, "Outstanding USD": Math.round(o.totalOutstanding),
        "Overdue USD": Math.round(o.overdue), "Next Due": o.nextDue, "Open Invoices": o.invoiceCount,
        "Total Paid USD": Math.round(o.totalPaid), "Unallocated Payments USD": Math.round(o.unallocatedPayment) };
    }),
    "OEM Transactions": strip(state.oemInvoices),
    "Mobile Purchases": strip(state.mobilePurchases),
    "Dividends": strip(state.dividends),
    "Daily Expenses": strip(state.dailyExpenses),
    "Cash Sales": strip(state.cashSales),
    "History": ui.history.rows.length
      ? ui.history.rows.map(function (r) {
          return { "When": r.ts, "Who": r.actor, "What": r.entity, "Record": r.entityId,
            "Action": r.action, "Field": r.field, "Was": r.oldValue, "Became": r.newValue, "Detail": r.detail };
        })
      : []
  };
}

function prepareExportFile() {
  if (!hasXLSX()) { flashToast("error", "Spreadsheet support didn't load — copy the sheet above into Excel instead."); return; }
  var sheets = buildExportSheets();
  var wb = XLSX.utils.book_new();
  Object.keys(sheets).forEach(function (name) {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheets[name]), name.slice(0, 31));
  });
  var out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  var blob = new Blob([out], { type: "application/octet-stream" });
  revokeExportUrl();
  ui.exportUrl = URL.createObjectURL(blob);
  ui.exportName = "VAULT_Cashflow_" + state.settings.startDate + ".xlsx";
  render();
}

/* Revoked on close, not only when a new one is prepared — the prototype leaked

function revokeExportUrl() {

function renderExportModal() {

    '<div class="tcf-subtab-row" style="flex-wrap:wrap">' +
    names.map(function (name) {
      return '<button class="tcf-subtab' + (ui.exportSheet === name ? " tcf-subtab-active" : "") + '" data-act="export-sheet" data-sheet="' + attr(name) + '">' +
        esc(name) + ' <span class="tcf-td-sub">(' + sheets[name].length + ')</span></button>';
    }).join("") +

    '<span class="tcf-td-sub">' + rows.length + ' row' + (rows.length !== 1 ? "s" : "") + '</span>' +

    '</div>' +
    '<textarea class="tcf-textarea" id="tcf-export-text" style="height:260px;font-size:11px" readonly>' + esc(tsv || "No data in this sheet yet.") + '</textarea>' +
    '<div class="tcf-note" style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +

    (!ui.exportUrl

      : '<a class="tcf-btn tcf-btn-ghost" href="' + attr(ui.exportUrl) + '" download="' + attr(ui.exportName) + '">' + ico("download", 13) + ' Download ' + esc(ui.exportName) + '</a>') +

/* =========================================================================
   Render loop

   Full innerHTML re-render, as the prototype. What is added is generic UI-state
   preservation: focus, caret, scroll and any field value the user has typed but
   not yet committed to a draft (REQUIREMENTS §11).
   ========================================================================= */
var appEl = document.getElementById("app");

function captureUIState() {
  var snap = { scroll: {}, values: {}, focus: null, selStart: null, selEnd: null };
  var main = appEl.querySelector(".tcf-main");
  if (main) snap.scroll.main = main.scrollTop;
  Array.prototype.forEach.call(appEl.querySelectorAll("[data-scrollkey]"), function (el) {
    snap.scroll[el.getAttribute("data-scrollkey")] = el.scrollTop;
  });

  var active = document.activeElement;
  if (active && appEl.contains(active) && active !== document.body) {
    snap.focus = fieldKeyOf(active);
    try {
      if (active.selectionStart !== undefined && active.selectionStart !== null) {
        snap.selStart = active.selectionStart;
        snap.selEnd = active.selectionEnd;
      }
    } catch (err) { /* selection is not readable on this input type — harmless */ }
  }

  Array.prototype.forEach.call(appEl.querySelectorAll("input,select,textarea"), function (el) {
    /* NEVER capture a file input. It reads back as C:\fakepath\name.csv and may
       only be SET to '', so restoring it throws InvalidStateError. */
    if (el.type === "file" || el.hasAttribute("data-nopreserve")) return;
    var key = fieldKeyOf(el);
    if (key) snap.values[key] = el.value;
  });
  return snap;
}

function fieldKeyOf(el) {
  if (!el || !el.getAttribute) return null;
  return el.getAttribute("data-draft") || el.getAttribute("data-filter") ||
    el.getAttribute("data-edit") || el.getAttribute("data-hist") ||
    (el.id ? "#" + el.id : null);
}

function restoreUIState(snap) {
  var main = appEl.querySelector(".tcf-main");
  if (main && snap.scroll.main) main.scrollTop = snap.scroll.main;
  Object.keys(snap.scroll).forEach(function (k) {
    if (k === "main") return;
    var el = appEl.querySelector('[data-scrollkey="' + k + '"]');
    if (el) el.scrollTop = snap.scroll[k];
  });

  Array.prototype.forEach.call(appEl.querySelectorAll("input,select,textarea"), function (el) {
    if (el.type === "file" || el.hasAttribute("data-nopreserve")) return;
    var key = fieldKeyOf(el);
    if (key && snap.values[key] !== undefined && el.value !== snap.values[key]) {
      el.value = snap.values[key];
    }
  });

  if (snap.focus) {
    var target = appEl.querySelector('[data-draft="' + cssEscape(snap.focus) + '"],[data-filter="' + cssEscape(snap.focus) + '"],[data-edit="' + cssEscape(snap.focus) + '"],[data-hist="' + cssEscape(snap.focus) + '"]') ||
      (snap.focus.charAt(0) === "#" ? document.getElementById(snap.focus.slice(1)) : null);
    if (target) {
      target.focus();
      if (snap.selStart !== null && target.setSelectionRange) {
        target.setSelectionRange(snap.selStart, snap.selEnd);
      }
    }
  }
}

function cssEscape(s) { return String(s).replace(/["\\]/g, "\\$&"); }

function render() {
  var snap;
  try { snap = captureUIState(); } catch (err) { console.warn("VAULT: could not capture UI state", err); snap = null; }

  appEl.innerHTML = renderApp();

  /* The screen is already drawn by this point. Failing to put the caret back is
     worth a console entry, never a dead app. */
  try {
    if (snap) restoreUIState(snap);
  } catch (err) {
    console.warn("VAULT: could not restore focus/caret after render", err);
  }

  var autofocus = appEl.querySelector("#auth-email, #auth-code, #auth-name");
  if (autofocus && !snap.focus) autofocus.focus();
}

function flashToast(type, message, undo) {
  ui.toast = { type: type, message: message, undo: !!undo };
  if (ui.toastTimer) clearTimeout(ui.toastTimer);
  ui.toastTimer = setTimeout(function () { ui.toast = null; ui.undo = null; render(); }, undo ? 12000 : 4000);
  render();
}

/* =========================================================================
   Loading and saving
   ========================================================================= */
function loadBootstrap() {
  return callApi("getBootstrap", {}).then(function (b) {
    state.today = b.today;
    state.revision = b.revision;
    state.actor = b.actor;
    state.settings = b.settings;
    state.collectionOverrides = b.collectionOverrides || {};
    state.position = b.position;
    state.positionHistory = b.positionHistory || [];
    state.debtorTxns = b.debtorTxns || [];
    state.debtorCredits = b.debtorCredits || [];
    state.oemInvoices = b.oemInvoices || [];
    state.oemCredits = b.oemCredits || [];
    state.cashSales = b.cashSales || [];
    state.mobilePurchases = b.mobilePurchases || [];
    state.dividends = b.dividends || [];
    state.dailyExpenses = b.dailyExpenses || [];
    state.directory = b.directory || [];
    state.feed = b.feed;
    state.perf = b.perf;
    state.lastSync = new Date();
    state.stale = false;
    state.phase = "ready";
    resetDrafts();
    render();
    return b;
  });
}

/* Reload after a write. Deliberately does NOT call resetDrafts — the prototype's
   refreshAll did, so anyone mid-entry who pressed Refresh lost what they had
   typed (REQUIREMENTS D16). */
function refreshAll(keepDrafts) {
  var savedDrafts = keepDrafts ? drafts : null;
  state.saving = true;
  render();
  return loadBootstrap().then(function () {
    if (savedDrafts) {
      /* Bring back everything the user had typed, but let the freshly-computed
         settings/position drafts win where they were not being edited. */
      Object.keys(savedDrafts).forEach(function (k) {
        if (k === "settings" || k === "positions") return;
        drafts[k] = savedDrafts[k];
      });
    }
    state.saving = false;
    render();
  }).catch(function (err) {
    state.saving = false;
    handleApiError(err);
  });
}

function handleApiError(err) {
  if (err && err.kind === "session") {
    state.sessionToken = null;
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* private mode */ }
    state.phase = "signin";
    ui.auth = { step: "email", email: ui.auth.email || "", code: "", name: "", busy: false,
      error: "Your session has ended. Sign in again.", notice: "", cooldown: 0 };
    render();
    return;
  }
  flashToast("error", describeError(err));
  render();
}

/* One path for every write: disable the buttons, call, reload, report.

   The prototype wrote to state BEFORE the save resolved and never reverted on
   failure, so a row showed as saved underneath a "could not save" toast
   (REQUIREMENTS D18). Here nothing is shown as saved until the server has said
   so — with the single exception of a lost reply, where the truthful answer is
   "this probably worked". */
function mutate(action, payload, okMsg, opts) {
  opts = opts || {};
  if (state.saving) return Promise.resolve();
  state.saving = true;
  render();
  return callApi(action, payload).then(function (res) {
    state.saving = false;
    if (opts.onDone) opts.onDone(res);
    return refreshAll(true).then(function () {
      if (okMsg) flashToast("success", typeof okMsg === "function" ? okMsg(res) : okMsg, opts.undo);
      return res;
    });
  }).catch(function (err) {
    state.saving = false;
    if (err && err.kind === "lost-write") {
      /* Never claim a failure we cannot prove. Reload and let the user see. */
      return refreshAll(true).then(function () {
        flashToast("error", err.message);
      });
    }
    if (opts.onError) { opts.onError(err); render(); return; }
    handleApiError(err);
  });
}

/* =========================================================================
   Sign-in flow
   ========================================================================= */
function startAuth() {
  return callApi("getLoginContext", {}).then(function (ctx) {
    ui.auth.step = ctx.needsBootstrap ? "bootstrap" : "email";
    if (!ctx.emailConfigured) {
      ui.auth.notice = "Email is not configured yet, so codes will be sent from the deploying " +
        "Google account. That works, but it is rate-limited — set up Postmark before rollout.";
    }
    state.phase = "signin";
    render();
  }).catch(function (err) {
    state.phase = "signin";
    ui.auth.error = describeError(err);
    render();
  });
}

function authRequest() {
  var a = ui.auth;
  var email = String(a.email || "").trim();
  if (!email) { a.error = "Enter your work email address."; render(); return; }
  a.busy = true; a.error = ""; render();
  callApi("requestOtp", { email: email }).then(function (r) {
    a.busy = false; a.step = "code"; a.code = ""; a.error = "";
    a.expiresInMinutes = r.expiresInMinutes;
    a.notice = "Code sent to " + r.email + ".";
    startResendCooldown(r.resendInSeconds || 45);
    render();
  }).catch(function (err) {
    a.busy = false; a.error = describeError(err); render();
  });
}

function startResendCooldown(seconds) {
  ui.auth.cooldown = seconds;
  if (ui.auth.cooldownTimer) clearInterval(ui.auth.cooldownTimer);
  ui.auth.cooldownTimer = setInterval(function () {
    ui.auth.cooldown--;
    if (ui.auth.cooldown <= 0) { clearInterval(ui.auth.cooldownTimer); ui.auth.cooldownTimer = null; }
    if (state.phase === "signin") render();
  }, 1000);
}

function authVerify() {
  var a = ui.auth;
  var code = String(a.code || "").replace(/\D/g, "");
  if (code.length !== 6) { a.error = "Enter the 6-digit code from your email."; render(); return; }
  a.busy = true; a.error = ""; render();
  callApi("verifyOtp", { email: a.email, code: code }).then(function (r) {
    state.sessionToken = r.sessionToken;
    try { localStorage.setItem(SESSION_KEY, r.sessionToken); } catch (e) { /* private mode — session lasts this tab only */ }
    if (a.cooldownTimer) { clearInterval(a.cooldownTimer); a.cooldownTimer = null; }
    state.phase = "boot";
    render();
    return loadBootstrap().then(startPolling);
  }).catch(function (err) {
    a.busy = false; a.error = describeError(err); render();
  });
}

function authBootstrap() {
  var a = ui.auth;
  a.busy = true; a.error = ""; render();
  callApi("createFirstAdmin", { name: a.name, email: a.email }).then(function () {
    a.busy = false; a.step = "email";
    a.notice = "Admin account created. Now sign in with a code to prove the mailbox is yours.";
    render();
  }).catch(function (err) {
    a.busy = false; a.error = describeError(err); render();
  });
}

function signOut() {
  state.sessionToken = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* private mode */ }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  state.phase = "signin";
  ui.auth = { step: "email", email: "", code: "", name: "", busy: false, error: "", notice: "", cooldown: 0 };
  render();
}

/* =========================================================================
   Revision polling.

   NEVER re-renders over an open form — it sets the stale flag, and the flag is
   shown when the modal closes (REQUIREMENTS §11).
   ========================================================================= */
var pollTimer = null;
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function () {
    if (state.phase !== "ready" || state.saving) return;
    callApi("getRevision", {}).then(function (r) {
      if (r.today && r.today !== state.today) state.today = r.today;
      if (r.revision && r.revision !== state.revision) {
        state.stale = true;
        if (!formIsOpen()) render();
      }
    }).catch(function () { /* a failed poll is not worth interrupting anyone for */ });
  }, 45000);
}

/* =========================================================================
   Entity metadata used by the add / edit / delete handlers
   ========================================================================= */
var ENTITY_META = {
  debtorTxn: { label: "transaction", listOf: function () { return state.debtorTxns; },
    describe: function (r) { return (r.type === "credit_sale" ? "credit sale" : "cash receipt") + " · " + r.debtorName + " · " + fmtCcy(r.amount, r.currency); } },
  oemTxn: { label: "OEM entry", listOf: function () { return state.oemInvoices; },
    describe: function (r) { return (r.type === "payment" ? "payment" : "invoice") + " · " + r.oem + " · " + fmtCcy(r.amount, r.currency); } },
  cashSale: { label: "cash sale", listOf: function () { return state.cashSales; },
    describe: function (r) { return (r.description || "cash sale") + " · " + fmtCcy(r.amount, r.currency) + " · " + r.date; } },
  mobilePurchase: { label: "purchase estimate", listOf: function () { return state.mobilePurchases; },
    describe: function (r) { return r.brand + " · " + fmtCcy(r.amount, r.currency) + " · " + r.estimatedDate; } },
  dividend: { label: "dividend", listOf: function () { return state.dividends; },
    describe: function (r) { return r.description + " · " + fmtCcy(r.amount, r.currency) + " · due " + r.dueDate; } },
  expense: { label: "expense", listOf: function () { return state.dailyExpenses; },
    describe: function (r) { return r.description + " · " + fmtCcy(r.amount, r.currency) + " · " + r.date; } }
};

function findRecord(entity, id) {
  var list = ENTITY_META[entity].listOf();
  var hit = list.filter(function (r) { return r.id === id; })[0];
  if (hit) return hit;
  /* The drilldown holds rows the bootstrap feed summarised away. */
  if (ui.drilldown && ui.drilldown.rows) {
    return ui.drilldown.rows.filter(function (r) { return r.id === id; })[0] || null;
  }
  return null;
}

/* A single entry is a batch of one — same validation, same path as an import.
   The prototype had a hand-written handler per entity per mode, which is how the
   bulk path and the single-entry path drifted apart. */
function addSingle(entity, draftKey, required, fixed) {
  var d = drafts[draftKey];
  var missing = required.filter(function (f) { return !d[f] && d[f] !== 0; });
  if (missing.length) {
    /* Never a silent no-op — the prototype's add handlers just returned, so the
       button looked dead (REQUIREMENTS D25). */
    flashToast("error", "Fill in " + missing.join(", ") + " first.");
    return;
  }
  var row = Object.assign({}, d, fixed || {});
  /* A receipt has no due date, and the hidden draft value is not sent
     (REQUIREMENTS D14). */
  if (entity === "debtorTxn" && row.type === "cash_receipt") delete row.dueDate;

  mutate("createRecords", { entity: entity, rows: [row] }, "Saved", {
    onDone: function () {
      /* Clear only the per-entry fields, keeping the counterparty and dates so a
         run of entries for the same debtor stays quick. */
      d.amount = ""; d.reference = ""; d.description = ""; d.notes = "";
    }
  });
}

/* =========================================================================
   Event delegation
   ========================================================================= */
appEl.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  if (el.disabled) return;
  var act = el.getAttribute("data-act");

  /* Backdrop clicks only count when the backdrop itself was hit. */
  if (/-close-bg$/.test(act) && ev.target !== el) return;

  switch (act) {
    /* ---- auth ---- */
    case "auth-request": authRequest(); break;
    case "auth-verify": authVerify(); break;
    case "auth-bootstrap": authBootstrap(); break;
    case "auth-back":
      ui.auth.step = "email"; ui.auth.code = ""; ui.auth.error = ""; ui.auth.notice = "";
      render(); break;
    case "sign-out": signOut(); break;
    case "conn-check": runConnectionCheck(); break;

    /* ---- shell ---- */
    case "tab":
      ui.tab = el.getAttribute("data-tab");
      ui.connCheck = null;
      if (ui.tab === "history" && !ui.history.rows.length) loadHistory(0);
      render();
      break;
    case "refresh-all": refreshAll(true); break;

    /* ---- filters, sorting, paging ---- */
    case "sort": {
      var vk = el.getAttribute("data-view"), field = el.getAttribute("data-field");
      var v = viewState(vk);
      if (v.sort === field) v.dir = (v.dir === "asc" ? "desc" : "asc");
      else { v.sort = field; v.dir = "desc"; }
      v.page = 0;   /* changing the sort returns to page one */
      render();
      break;
    }
    case "page":
      viewState(el.getAttribute("data-view")).page = Number(el.getAttribute("data-page")) || 0;
      render();
      break;
    case "filter-clear": {
      var key = el.getAttribute("data-view");
      ui.views[key] = null;
      viewState(key);
      render();
      break;
    }

    /* ---- forecast ---- */
    case "pct-override": break;   /* handled on change */

    /* ---- positions ---- */
    case "positions-save":
      mutate("savePosition", { position: drafts.positions }, "Cash position saved");
      break;

    /* ---- settings ---- */
    case "settings-save":
      mutate("saveSettings", { settings: drafts.settings }, "Settings saved");
      break;

    /* ---- adds ---- */
    case "debtor-add":
      addSingle("debtorTxn", "debtor",
        drafts.debtor.type === "credit_sale"
          ? ["debtorName", "transactionDate", "dueDate", "amount"]
          : ["debtorName", "transactionDate", "amount"]);
      break;
    case "oem-invoice-add":
      addSingle("oemTxn", "oemInvoice", ["oem", "dueDate", "amount"], { type: "invoice" });
      break;
    case "oem-payment-add":
      addSingle("oemTxn", "oemPayment", ["oem", "paymentDate", "amount"], { type: "payment" });
      break;
    case "mobile-add":
      addSingle("mobilePurchase", "mobile", ["brand", "amount", "estimatedDate"]);
      break;
    case "cashsale-add":
      addSingle("cashSale", "cashSale", ["amount", "date"]);
      break;
    case "dividend-add":
      addSingle("dividend", "dividend", ["description", "amount", "dueDate"]);
      break;
    case "expense-add":
      addSingle("expense", "expense", ["description", "amount", "date"]);
      break;

    case "dividend-toggle": {
      var did = el.getAttribute("data-id");
      var dv = findRecord("dividend", did);
      if (!dv) return;
      var paying = dv.status !== "paid";
      mutate("updateRecord", {
        entity: "dividend", id: did,
        patch: paying ? { status: "paid", paidDate: state.today } : { status: "due", paidDate: "" }
      }, paying ? "Marked paid on " + state.today : "Marked unpaid");
      break;
    }

    /* ---- edit ---- */
    case "edit-open": {
      var entity = el.getAttribute("data-entity"), id = el.getAttribute("data-id");
      var row = findRecord(entity, id);
      if (!row) { flashToast("error", "That record is no longer loaded — reload and try again."); return; }
      ui.edit = { entity: entity, id: id, row: row, error: "",
        title: ENTITY_META[entity].describe(row), draft: Object.assign({}, row) };
      render();
      break;
    }
    case "edit-close":
    case "edit-close-bg":
      ui.edit = null;
      /* Closing a modal is when a stale-data flag raised by the background poll
         finally gets shown — the poll itself never re-renders over an open form. */
      render();
      break;
    case "edit-save": {
      var e = ui.edit;
      mutate("updateRecord", { entity: e.entity, id: e.id, patch: e.draft },
        function (res) { return res.changed ? "Saved — " + res.changed + " field" + (res.changed === 1 ? "" : "s") + " changed" : "Nothing had changed"; },
        { onDone: function () { ui.edit = null; },
          onError: function (err) { ui.edit.error = describeError(err); } });
      break;
    }

    /* ---- delete: confirm, then tombstone, then offer an undo ---- */
    case "del-ask": {
      var dEntity = el.getAttribute("data-entity"), dId = el.getAttribute("data-id");
      var dRow = findRecord(dEntity, dId);
      if (!dRow) { flashToast("error", "That record is no longer loaded — reload and try again."); return; }
      ui.confirm = {
        eyebrow: "Delete", title: "Delete this " + ENTITY_META[dEntity].label + "?",
        body: '<span class="tcf-mono">' + esc(ENTITY_META[dEntity].describe(dRow)) + '</span><br><br>' +
          'It will stop counting towards the forecast immediately. A record of the deletion — ' +
          'including everything this row contained — is kept on the History tab, and you can undo ' +
          'it for a few seconds afterwards.',
        okLabel: "Delete", action: "delete-record", entity: dEntity, id: dId, error: ""
      };
      render();
      break;
    }
    case "confirm-cancel":
    case "confirm-close-bg":
      ui.confirm = null; render(); break;
    case "confirm-go": {
      var c = ui.confirm;
      if (c.action === "delete-record") {
        mutate("deleteRecord", { entity: c.entity, id: c.id }, "Deleted", {
          undo: true,
          onDone: function (res) {
            ui.undo = { entity: c.entity, row: res.restored };
            ui.confirm = null;
          },
          onError: function (err) { ui.confirm.error = describeError(err); }
        });
      }
      break;
    }
    case "undo-delete": {
      if (!ui.undo) return;
      var u = ui.undo;
      ui.undo = null;
      /* Re-created as a NEW row with a new id, and the re-creation is itself
         recorded — an undo is a business event, not a rewrite of history. */
      var restore = Object.assign({}, u.row);
      delete restore.id; delete restore.createdAt; delete restore.createdById;
      delete restore.createdBy; delete restore.updatedAt; delete restore.updatedById;
      delete restore.updatedBy; delete restore.importBatchId;
      mutate("createRecords", { entity: u.entity, rows: [restore] }, "Restored");
      break;
    }

    /* ---- drilldown ---- */
    case "drill": {
      var kind = el.getAttribute("data-kind"), name = el.getAttribute("data-name");
      ui.drilldown = { kind: kind, name: name, rows: [], loading: true, error: "" };
      render();
      callApi("getCounterpartyLedger", { kind: kind, name: name }).then(function (r) {
        if (!ui.drilldown) return;
        ui.drilldown.rows = r.rows; ui.drilldown.loading = false; render();
      }).catch(function (err) {
        if (!ui.drilldown) return;
        ui.drilldown.loading = false; ui.drilldown.error = describeError(err); render();
      });
      break;
    }
    case "drill-close":
    case "drill-close-bg":
      ui.drilldown = null; render(); break;

    /* ---- history ---- */
    case "hist-load": loadHistory(0); break;
    case "hist-page": loadHistory(Number(el.getAttribute("data-page")) || 0); break;

    /* ---- directory ---- */
    case "member-add":
      if (!drafts.member.name || !drafts.member.email) {
        flashToast("error", "A name and a work email are both needed."); return;
      }
      mutate("addTeamMember", drafts.member, "Added to the Directory", {
        onDone: function () { drafts.member = { name: "", email: "", role: "analyst" }; }
      });
      break;
    case "member-status":
      mutate("setUserStatus", { userId: el.getAttribute("data-id"), status: el.getAttribute("data-status") },
        "Access updated");
      break;

    /* ---- OEM entry type ---- */
    case "oem-entry-type":
      ui.oemEntryType = el.getAttribute("data-type");
      render();
      break;

    /* ---- bulk upload ---- */
    case "bulk-open":
      ui.bulk = { key: el.getAttribute("data-bulk"), mode: "file", pasteText: "", rows: null,
        errors: [], fileName: "", ambiguous: [], duplicates: [], dateOrder: "dmy" };
      render();
      break;
    case "bulk-close":
    case "bulk-close-bg":
      ui.bulk = null; render(); break;
    case "bulk-mode":
      ui.bulk.mode = el.getAttribute("data-mode");
      ui.bulk.errors = []; ui.bulk.rows = null; ui.bulk.ambiguous = [];
      render();
      break;
    case "bulk-template": downloadTemplate(); break;
    case "bulk-parse": handlePasteParse(); break;
    case "bulk-dateorder":
      ui.bulk.dateOrder = el.getAttribute("data-order");
      if (ui.bulk.raw && ui.bulk.raw.length) processRawRows(ui.bulk.raw[0], ui.bulk.raw.slice(1));
      render();
      break;
    case "bulk-import": {
      var cfg = bulkConfig();
      var payloadRows = ui.bulk.rows.map(function (r) { return Object.assign({}, r, cfg.fixed); });
      var n = payloadRows.length;
      mutate("createRecords", { entity: cfg.entity, rows: payloadRows },
        "Imported " + n + " row" + (n === 1 ? "" : "s"),
        { onDone: function () { ui.bulk = null; },
          onError: function (err) { ui.bulk.errors = [{ row: 0, why: describeError(err) }]; } });
      break;
    }

    /* ---- export ---- */
    case "export-open": ui.exportOpen = true; render(); break;
    case "export-close":
    case "export-close-bg":
      ui.exportOpen = false;
      revokeExportUrl();     /* not leaked until the next prepare (D17) */
      render();
      break;
    case "export-sheet": ui.exportSheet = el.getAttribute("data-sheet"); render(); break;
    case "export-copy": {
      var ta = document.getElementById("tcf-export-text");
      var text = ta ? ta.value : "";
      var done = function () { flashToast("success", ui.exportSheet + " copied — paste into a blank Excel sheet"); };
      var fail = function () { flashToast("error", "Could not copy automatically — select the text below and copy manually"); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fail);
      } else if (ta) {
        ta.removeAttribute("readonly"); ta.select();
        try { document.execCommand("copy") ? done() : fail(); } catch (e) { fail(); }
        ta.setAttribute("readonly", "readonly");
      } else fail();
      break;
    }
    case "export-prepare": {
      if (hasXLSX()) { prepareExportFile(); }
      else {
        var sheetsNow = buildExportSheets();
        var csv = rowsToCSV(sheetsNow[ui.exportSheet] || []);
        downloadBlob(new Blob([csv], { type: "text/csv;charset=utf-8" }), "VAULT_" + String(ui.exportSheet).replace(/\s+/g, "_") + ".csv");
      }
      break;
    }
  }
});

function loadHistory(page) {
  ui.history.loading = true;
  ui.history.page = page;
  render();
  callApi("getHistory", {
    entity: ui.history.entity, from: ui.history.from, to: ui.history.to,
    page: page, pageSize: 50
  }).then(function (r) {
    ui.history.rows = r.rows;
    ui.history.total = r.total;
    ui.history.loading = false;
    render();
  }).catch(function (err) {
    ui.history.loading = false;
    handleApiError(err);
  });
}

/* ---------- keyboard ---------- */
appEl.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") {
    if (ui.bulk) { ui.bulk = null; render(); }
    else if (ui.edit) { ui.edit = null; render(); }
    else if (ui.confirm) { ui.confirm = null; render(); }
    else if (ui.drilldown) { ui.drilldown = null; render(); }
    else if (ui.exportOpen) { ui.exportOpen = false; revokeExportUrl(); render(); }
    return;
  }
  if (ev.key === "Enter") {
    if (ev.target.id === "auth-email") { ev.preventDefault(); ui.auth.step === "bootstrap" ? authBootstrap() : authRequest(); }
    else if (ev.target.id === "auth-code") { ev.preventDefault(); authVerify(); }
    else if (ev.target.id === "auth-name") { ev.preventDefault(); authBootstrap(); }
  }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches('[data-act][role="button"]')) {
    ev.preventDefault();
    ev.target.click();
  }
});

/* ---------- draft bindings ----------
   Typing updates state WITHOUT re-rendering, so focus is never lost. */
function handleBinding(ev) {
  var t = ev.target;
  if (!t || !t.getAttribute) return;

  if (t.id === "auth-email") { ui.auth.email = t.value; return; }
  if (t.id === "auth-code") { ui.auth.code = t.value; return; }
  if (t.id === "auth-name") { ui.auth.name = t.value; return; }
  if (t.hasAttribute("data-paste")) { ui.bulk.pasteText = t.value; return; }

  if (t.hasAttribute("data-edit")) { ui.edit.draft[t.getAttribute("data-edit")] = t.value; return; }
  if (t.hasAttribute("data-hist")) { ui.history[t.getAttribute("data-hist")] = t.value; return; }

  if (t.hasAttribute("data-filter")) {
    var parts = t.getAttribute("data-filter").split(".");
    var v = viewState(parts[0]);
    v[parts[1]] = t.value;
    v.page = 0;      /* changing any filter returns to page one */
    render();
    return;
  }

  if (t.hasAttribute("data-draft")) {
    setDraft(t.getAttribute("data-draft"), t.value);
    if (t.getAttribute("data-live") === "positions") updatePositionsLive();
    if (t.hasAttribute("data-rerender")) render();
  }
}
appEl.addEventListener("input", handleBinding);

appEl.addEventListener("change", function (ev) {
  var t = ev.target;
  var act = t.getAttribute && t.getAttribute("data-act");

  if (act === "bulk-file") {
    if (t.files && t.files[0]) handleBulkFile(t.files[0]);
    return;
  }
  if (act === "pct-override") {
    /* Keyed by the week's START DATE. A blank box CLEARS the override and
       reverts to the default — it does not store "" and forecast 0%
       (REQUIREMENTS D2, D3). */
    var week = t.getAttribute("data-week");
    var raw = String(t.value).trim();
    mutate("setCollectionOverride", { weekStartDate: week, pct: raw === "" ? null : raw },
      raw === "" ? "Reverted to the default rate" : "Collection rate set to " + raw + "% for that week");
    return;
  }
  if (act === "default-rate") {
    mutate("saveSettings", { settings: { collectionRatePct: t.value } }, "Default collection rate saved");
    return;
  }
  if (act === "member-role") {
    mutate("updateTeamMember", { userId: t.getAttribute("data-id"), role: t.value }, "Role updated");
    return;
  }
  handleBinding(ev);
});

function updatePositionsLive() {
  var f = drafts.positions, r = model.rates;
  var total = document.getElementById("tcf-pos-total");
  if (total) total.textContent = fmtUSD(positionsTotal(f));
  var ngnSub = appEl.querySelector('[data-sub="positions.ngnPosition"]');
  if (ngnSub) ngnSub.textContent = "≈ " + fmtUSD(toUSD(f.ngnPosition, "NGN", r)) + " at ₦" + r.ngnRate + "/$";
  var ghsSub = appEl.querySelector('[data-sub="positions.ghsPosition"]');
  if (ghsSub) ghsSub.textContent = "≈ " + fmtUSD(toUSD(f.ghsPosition, "GHS", r)) + " at ₵" + r.ghsRate + "/$";
}

/* ---------- chart tooltips ---------- */
appEl.addEventListener("mousemove", function (ev) {
  var hit = ev.target.closest ? ev.target.closest(".tcf-chart-hit") : null;
  if (!hit) return;
  var wrap = hit.closest(".tcf-chart");
  if (!wrap) return;
  var id = wrap.getAttribute("data-chart");
  var idx = Number(hit.getAttribute("data-tipidx"));
  var tips = CHART_TIPS[id];
  if (!tips || !tips[idx]) return;
  var tip = wrap.querySelector(".tcf-chart-tip");
  tip.innerHTML = tips[idx];
  tip.style.display = "block";
  var box = wrap.getBoundingClientRect();
  var x = ev.clientX - box.left, y = ev.clientY - box.top;
  var tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(4, Math.min(box.width - tw - 4, x + 14)) + "px";
  tip.style.top = Math.max(4, y - th - 10) + "px";
});
appEl.addEventListener("mouseleave", function () {
  Array.prototype.forEach.call(appEl.querySelectorAll(".tcf-chart-tip"), function (t) { t.style.display = "none"; });
}, true);

/* Free the export blob if the tab is closed with the modal open. */
window.addEventListener("beforeunload", revokeExportUrl);

/* =========================================================================
   Boot
   ========================================================================= */
function boot() {
  try {
    state.sessionToken = localStorage.getItem(SESSION_KEY);
  } catch (e) {
    state.sessionToken = null;   /* private browsing — sign-in still works */
  }
  render();

  if (!state.sessionToken) return startAuth();

  loadBootstrap()
    .then(startPolling)
    .catch(function (err) {
      if (err && err.kind === "session") { signOut(); return startAuth(); }
      state.phase = "signin";
      ui.auth.error = describeError(err);
      render();
    });
}

boot();
</script>
