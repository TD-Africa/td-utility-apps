<script>
/* ============================================================
   SCREEN: Overview
   ============================================================ */
function viewOverview(){
  const t = positionFigures();
  const scopedNonB2B = scopedItems().filter(function(i){ return !i.b2b; });
  /* Categories come from the filtered position when there is one, so a
     bar chart beside a filtered card cannot describe a wider set of
     stock than the card does. */
  const catRows = t.filtered
    ? t.byCategory
    : (STATE.data.categories || []).map(function(c){
        return {category: c.category, value: scopedNonB2B
          .filter(function(i){ return i.category === c.category; })
          .reduce(function(s, i){ return s + i.consolidatedValue; }, 0)};
      });
  const cats = catRows.map(function(c){ return c.category; });
  const catValues = catRows.map(function(c){ return c.value; });
  const flagged = scopedNonB2B.filter(function(i){ return i.flag && !i.flagResolvedBy; }).length;

  const dataQuality = [];
  const unknownCost = ((STATE.data.items) || []).filter(function(i){ return i.costUnknown && i.consolidatedQty > 0; });
  if(unknownCost.length){
    dataQuality.push(unknownCost.length + ' item(s) hold stock with no purchase history, so their cost is not known');
  }
  const unknownAge = ((STATE.data.items) || []).filter(function(i){ return i.ageUnknownQty > 0; });
  if(unknownAge.length) dataQuality.push(unknownAge.length + ' item(s) hold stock whose entry date cannot be read');
  const futureAge = ((STATE.data.items) || []).filter(function(i){ return i.ageFutureQty > 0; });
  if(futureAge.length) dataQuality.push(futureAge.length + ' item(s) hold stock dated in the future');
  if(flagged) dataQuality.push(flagged + ' item(s) carry an unresolved data-quality flag');

  return '' +
    (dataQuality.length
      ? '<div class="banner"><div>⚠</div><div><b>Worth a look.</b> ' +
        dataQuality.map(esc).join('<br>') + '</div></div>'
      : '') +

    activityFilterBar() +

    /* The panel the filter actually governs, directly under the filter.
       It used to sit below the charts, which meant changing a date moved
       numbers a screen and a half further down and the page looked
       inert. */
    activityPanel({full: false}) +

    positionMarker() +

    '<div class="kpi-grid">' +
      kpi('Consolidated Stock Value', fmtMoney0(t.consolidatedValue),
        fmtNum(t.consolidatedQty) + ' units across ' + (t.skus + t.b2bSkus) +
        ((t.skus + t.b2bSkus) === 1 ? ' SKU' : ' SKUs') +
        (t.b2bSkus ? ' (' + t.b2bSkus + ' B2B)' : ''), 'var(--flow)') +
      kpi('GIT Value', fmtMoney0(t.gitValue), fmtNum(t.gitQty) + ' units in transit', 'var(--amber)') +
      kpi('Main Warehouse Value', fmtMoney0(t.mwValue), fmtNum(t.mwQty) + ' units on ground', 'var(--flow)') +
      kpi(t.filtered ? 'Sold (these movements)' : 'Sold (all time)', fmtMoney0(t.soldValue),
        fmtNum(t.soldQty) + ' units · cost of sale ' + fmtMoney0(t.costOfSale), 'var(--green)') +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Stock Flow' +
        '<span>Backlog → GIT → Main Warehouse → Sold</span></div></div>' +
      '<div class="flow-wrap">' +
        flowNode('backlog', 'Backlog (on order)', fmtNum(t.backlogQty), 'not owned yet') +
        '<div class="flow-arrow">&#8594;</div>' +
        flowNode('git', 'Goods In Transit', fmtNum(t.gitQty), fmtMoney0(t.gitValue)) +
        '<div class="flow-arrow">&#8594;</div>' +
        flowNode('mw', 'Main Warehouse', fmtNum(t.mwQty), fmtMoney0(t.mwValue)) +
        '<div class="flow-arrow">&#8594;</div>' +
        flowNode('sold', 'Sold', fmtNum(t.soldQty), fmtMoney0(t.soldValue)) +
      '</div>' +
      '<div style="font-size:11.5px;color:var(--text-faint);margin-top:12px;">' +
        'Ageing starts the day stock is recognised as GIT and carries through to the Main Warehouse ' +
        'and across any transfer — it never resets. Sold value is the price actually achieved; ' +
        'cost of sale was frozen at the moment of each sale, so changing a landed percentage today ' +
        'cannot restate it.' +
      '</div>' +
    '</div>' +

    '<div class="grid-2">' +
      '<div class="panel">' +
        '<div class="panel-head"><div class="panel-title">Consolidated Value by Category</div></div>' +
        '<div class="chart-box">' + chartBar(cats, catValues, null, {px: 262, fmt: money0k}) + '</div>' +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-head"><div class="panel-title">GIT vs Main Warehouse</div></div>' +
        '<div class="chart-box">' + chartDonut(['GIT', 'Main Warehouse'], [t.gitValue, t.mwValue],
          ['#E3A23D', '#2FBEB0'], {px: 262, centre: '$' + Math.round(t.consolidatedValue / 1000) + 'k',
            fmt: function(v){ return '$' + Math.round(v).toLocaleString('en-US'); }}) + '</div>' +
      '</div>' +
    '</div>';
}

/* ============================================================
   THE MOVEMENT FILTER — Overview and Analytics
   ------------------------------------------------------------
   Both screens are a position: what is held right now. A date
   range and a movement type cannot filter that — there is no
   such quantity as "Main Warehouse stock, filtered to sales",
   and a stock level is a point in time rather than a period.

   What they CAN filter is what moved. So the bar drives a
   movement panel, aggregated on the server over the ledger, and
   says plainly which part of the screen it governs. An item is
   the exception: a position for one part number is a real thing,
   so choosing one scopes the cards as well.
   ============================================================ */

/* The part numbers the position panels should count. Only the item
   filter reaches this far, for the reason above. */
function scopedItems(){
  const chosen = STATE.activity.item;
  const all = visibleItems();
  if(!chosen) return all;
  return all.filter(function(i){ return i.item === chosen; });
}

function activityFilterBar(){
  const a = STATE.activity;
  /* Every type that exists, not only the postable ones: a type an
     Admin has since retired still has history, and history you cannot
     filter to is history you cannot check. */
  const types = (STATE.data.movementTypes || []);
  /* Short on purpose: once a filter is on, the banner over the position
     half carries the full explanation, and saying it twice buries the
     filter under its own caveat. */
  const note = 'Filters everything on this screen. The Movement panel shows what happened; the ' +
    'cards and charts show the stock still held that those movements put there.';

  return '<div class="filter-bar">' +
    '<div class="field narrow"><label>From</label>' +
      '<input type="date" id="mf-from" data-state-value="1" value="' + attr(a.from) + '"></div>' +
    '<div class="field narrow"><label>To (inclusive)</label>' +
      '<input type="date" id="mf-to" data-state-value="1" value="' + attr(a.to) + '"></div>' +
    '<div class="field"><label>Item</label><select id="mf-item" data-state-value="1">' +
      '<option value="">All items</option>' +
      visibleItems().map(function(i){
        return '<option value="' + attr(i.item) + '"' + (a.item === i.item ? ' selected' : '') + '>' +
          esc(i.item) + (i.name ? ' — ' + esc(i.name) : '') + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Movement type</label><select id="mf-type" data-state-value="1">' +
      '<option value="">All types</option>' +
      types.map(function(t){
        return '<option value="' + attr(t.code) + '"' + (a.type === t.code ? ' selected' : '') + '>' +
          esc(t.label || t.code) + (t.active === false ? ' (retired)' : '') + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Stage</label><select id="mf-stage" data-state-value="1">' +
      stageOptions(a.stage) + '</select></div>' +
    '<div class="field"><label>Business</label><select id="mf-business" data-state-value="1">' +
      '<option value="">All businesses</option>' +
      (STATE.data.businessTypes || []).map(function(b){
        return '<option value="' + attr(b) + '"' + (a.businessType === b ? ' selected' : '') + '>' +
          esc(b) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Partner</label><select id="mf-partner" data-state-value="1">' +
      partnerFilterOptions(a.partner) + '</select></div>' +
    '<div class="field narrow"><label>&nbsp;</label>' +
      '<button class="btn secondary" id="mf-clear">Clear</button></div>' +
    '<div style="flex:1 1 100%;font-size:11.5px;color:var(--text-faint);margin-top:-2px;">' +
      esc(note) + '</div>' +
  '</div>';
}

/* "1 Aug – 31 Aug 2026", or an honest word when an end is open. */
function periodLabel(){
  const a = STATE.activity;
  if(a.from && a.to) return a.from + ' – ' + a.to;
  if(a.from) return 'from ' + a.from;
  if(a.to) return 'up to ' + a.to;
  return 'all time';
}

function directionTag(direction){
  const map = {
    ordered: ['ordered', 'var(--text-dim)'],
    in: ['into stock', 'var(--flow)'],
    out: ['out of stock', 'var(--red)'],
    move: ['internal move', 'var(--amber)']
  };
  const d = map[direction] || map.move;
  return '<span style="font-size:10.5px;color:' + d[1] + '">' + esc(d[0]) + '</span>';
}

function periodFilterOn(){
  const a = STATE.activity;
  /* businessType belongs here for the same reason type does: it makes
     the cards a narrower question than "everything", so they have to be
     drawn from the server's filtered answer rather than summed in the
     page. Leaving it out would filter the movement panel and quietly
     leave the position cards showing the whole company beside it. */
  return !!(a.from || a.to || a.type || a.businessType || a.stage || a.partner);
}

/* The figures the cards, the flow and the charts are drawn from.

   With no filter this is the whole position, summed in the page from
   the item list the page already holds — unchanged, and no extra work.
   With a filter it is the server's answer to a narrower question: the
   stock still held that the SELECTED MOVEMENTS put there. Every open
   lot records the movement that created it, which is what makes "the
   Main Warehouse, filtered to Opening balance B2B-MainWH" a real
   quantity rather than a phrase.

   The two agree to the penny when nothing is filtered — the server
   rounds per item exactly as this does — so applying a filter narrows
   the numbers without also nudging them. */
function positionFigures(){
  const p = STATE.activity.position;
  if(p && p.filtered) return p;
  const t = totals(visibleItems());
  t.filtered = false;
  return t;
}

/* Says what the cards are counting whenever that is not "everything",
   because four narrowed figures with nothing above them read as the
   whole position. */
function positionMarker(){
  const p = STATE.activity.position;
  if(!p || !p.filtered) return '';
  const a = STATE.activity;
  const parts = [];
  if(a.from || a.to) parts.push('arrived ' + periodLabel());
  if(a.type) parts.push('through ' + a.type);
  if(a.businessType) parts.push('on the ' + a.businessType + ' book');
  if(a.partner) parts.push('with ' + a.partner);
  if(a.stage) parts.push('through a ' + a.stage + ' movement');
  if(a.item) parts.push('for ' + a.item);
  return '<div class="banner"><div>🔎</div><div>' +
    '<b>Showing the stock still held that these movements put there</b> — ' +
    esc(parts.join(', ')) + '. ' +
    'Valued at each item\'s net cost, exactly as the unfiltered figures are. ' +
    'Sold is the sales among the same movements.' +
    /* The stage filter is the one that gets misread, so it says so
       outright. Filtering to GIT and seeing a Main Warehouse figure
       looks like a bug until you know the cards count stock by the
       movement that PUT it where it is, not by where it sits now: the
       60 units a receipt brought in came through GIT, and are on the
       shelf. What is in GIT today is the GIT card on the unfiltered
       view, which is a different question and always available. */
    (a.stage
      ? '<br><b>' + esc(a.stage) + '</b> here means "came through a ' + esc(a.stage) +
        ' movement", not "is sitting in ' + esc(a.stage) + ' now" — a receipt out of GIT ' +
        'counts as GIT activity and its stock is on the shelf. Clear the filter to see ' +
        'where stock sits today.'
      : '') +
    (p.lotsUnattributed
      ? ' ' + fmtNum(p.lotsUnattributed) + ' lot(s) predate the movement log and are ' +
        'excluded while a filter is on.'
      : '') +
  '</div></div>';
}

/* opts.full adds the per-item table; the Overview shows the compact
   version and Analytics the whole thing. */
function activityPanel(opts){
  const o = opts || {};
  const a = STATE.activity;
  const d = a.data;

  let body;
  if(a.loading && !d){
    body = '<div class="empty-state">Loading…</div>';
  }else if(!d){
    body = '<div class="empty-state">No movements loaded yet.</div>';
  }else if(!d.movements){
    body = '<div class="empty-state">No movements match these filters.</div>';
  }else{
    const chartLabels = d.byPeriod.map(function(p){
      return d.grouping === 'month' ? p.period : String(p.period).slice(5);
    });
    /* Units moved, of every kind — a volume-of-activity chart, not a
       position. Leaving purchases out made a day on which only orders
       were placed draw an empty bar, which reads as "nothing happened"
       on the one screen meant to show that something did. */
    const chartValues = d.byPeriod.map(function(p){
      return p.in + p.out + p.moved + p.ordered;
    });

    body =
      '<div class="kpi-grid">' +
        kpi('Movements', fmtNum(d.movements),
          d.itemsTouched + ' item' + (d.itemsTouched === 1 ? '' : 's') + ' touched', 'var(--flow)') +
        kpi('Units in', fmtNum(d.unitsIn),
          d.unitsOrdered ? fmtNum(d.unitsOrdered) + ' more ordered, not yet owned' : 'became owned stock',
          'var(--flow)') +
        kpi('Units out', fmtNum(d.unitsOut),
          d.saleValue ? fmtMoney0(d.saleValue) + ' sold' : 'sold, written off or returned', 'var(--red)') +
        kpi('Net into stock', (d.netUnits >= 0 ? '+' : '') + fmtNum(d.netUnits),
          d.margin === null
            ? (d.unitsMoved ? fmtNum(d.unitsMoved) + ' units moved internally' : 'in less out')
            : fmtPct(d.margin) + ' margin on what was sold',
          d.netUnits >= 0 ? 'var(--green)' : 'var(--amber)') +
      '</div>' +

      (d.byPeriod.length > 1
        ? '<div style="font-size:11.5px;color:var(--text-faint);margin:2px 0 6px 0;">' +
            'Units moved per ' + esc(d.grouping) + ', every kind of movement counted once</div>' +
          '<div class="chart-box" style="margin-bottom:16px;">' +
          chartBar(chartLabels, chartValues, null,
            {px: 170, fmt: function(v){ return fmtNum(v) + ' units'; }}) + '</div>'
        : '') +

      '<div class="table-wrap"><table><thead><tr>' +
        '<th>Movement type</th><th></th><th class="num">Movements</th>' +
        '<th class="num">Units</th><th class="num">Value</th>' +
      '</tr></thead><tbody>' +
        d.byType.map(function(t){
          return '<tr>' +
            '<td><b>' + esc(t.label) + '</b>' +
              (t.label !== t.type ? '<br><span class="unknown">' + esc(t.type) + '</span>' : '') + '</td>' +
            '<td>' + directionTag(t.direction) + '</td>' +
            '<td class="num">' + fmtNum(t.count) + '</td>' +
            '<td class="num">' + fmtNum(t.qty) + '</td>' +
            /* A shipment records no money. Showing $0 would read as a
               loss rather than as a figure that was never captured. */
            '<td class="num">' + (t.saleValue
              ? fmtMoney0(t.saleValue) + '<br><span class="unknown">cost ' + fmtMoney0(t.costOfSale) + '</span>'
              : (t.value === null
                ? '<span class="unknown">not priced</span>'
                : fmtMoney0(t.value))) + '</td>' +
          '</tr>';
        }).join('') +
      '</tbody></table></div>' +

      (d.valueUnknownRows
        ? '<div style="font-size:11.5px;color:var(--text-faint);margin-top:10px;">' +
          fmtNum(d.valueUnknownRows) + ' of these movements carry no price of their own — a ' +
          'shipment, a receipt or a transfer moves stock at the cost already on the lot, which ' +
          'is why they are shown as not priced rather than as zero.</div>'
        : '') +

      (o.full && d.topItems.length
        ? '<div class="table-wrap" style="margin-top:18px;"><table><thead><tr>' +
            '<th>#</th><th>Item</th><th>Product</th><th class="num">Movements</th><th class="num">Units</th>' +
          '</tr></thead><tbody>' +
          d.topItems.map(function(i, n){
            return '<tr><td>' + (n + 1) + '</td><td><b>' + esc(i.item) + '</b></td>' +
              '<td class="wrap">' + (i.name ? esc(i.name) : '<span class="unknown">—</span>') + '</td>' +
              '<td class="num">' + fmtNum(i.count) + '</td>' +
              '<td class="num">' + fmtNum(i.qty) + '</td></tr>';
          }).join('') +
          '</tbody></table></div>'
        : '');
  }

  return '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">Movement' +
      '<span>' + esc(periodLabel()) +
        (a.item ? ' · ' + esc(a.item) : '') +
        (a.type ? ' · ' + esc(a.type) : '') +
        (a.businessType ? ' · ' + esc(a.businessType) : '') +
        (a.stage ? ' · ' + esc(a.stage) : '') +
        (a.partner ? ' · ' + esc(a.partner) : '') +
        ' — reversed movements excluded</span></div></div>' +
    body +
  '</div>';
}

async function loadActivity(){
  const a = STATE.activity;
  a.loading = true;
  try{
    /* One request for both halves. Two would let the cards and the
       movement panel be drawn from two different moments. */
    const res = await rpc('getDashboard', {
      dateFrom: a.from, dateTo: a.to, item: a.item, type: a.type,
      businessType: a.businessType, stage: a.stage, partner: a.partner,
      brand: STATE.activeBrand || ''
    });
    a.data = res.movement;
    a.position = res.position;
    if(res.movement && res.movement.partners) STATE.data.partners = res.movement.partners;
  }catch(err){
    if(!err.sessionInvalid) toast(diagnose(err).detail, true);
  }
  a.loading = false;
  if(!STATE.modal) render();
}

function bindActivity(){
  if(STATE.tab !== 'overview' && STATE.tab !== 'analytics') return;
  const set = function(key, value){
    STATE.activity[key] = value;
    loadActivity();
  };
  on('#mf-from', 'change', function(e){ set('from', e.target.value); });
  on('#mf-to', 'change', function(e){ set('to', e.target.value); });
  /* Item re-renders as well as reloads: it scopes the position cards,
     which are drawn from data already in the page. */
  on('#mf-item', 'change', function(e){ set('item', e.target.value); render(); });
  on('#mf-type', 'change', function(e){ set('type', e.target.value); });
  /* Re-renders as well as reloads, for the same reason Item does: it
     scopes the position cards, which are drawn in the page. */
  on('#mf-business', 'change', function(e){ set('businessType', e.target.value); render(); });
  on('#mf-stage', 'change', function(e){ set('stage', e.target.value); render(); });
  on('#mf-partner', 'change', function(e){ set('partner', e.target.value); render(); });
  on('#mf-clear', 'click', function(){
    STATE.activity.from = ''; STATE.activity.to = '';
    STATE.activity.item = ''; STATE.activity.type = '';
    STATE.activity.businessType = ''; STATE.activity.stage = '';
    STATE.activity.partner = '';
    loadActivity(); render();
  });
}

function kpi(label, value, delta, accent){
  return '<div class="kpi-card" style="--kpi-accent:' + accent + '">' +
    '<div class="kpi-label">' + esc(label) + '</div>' +
    '<div class="kpi-value">' + value + '</div>' +
    '<div class="kpi-delta">' + delta + '</div></div>';
}
function flowNode(cls, label, value, sub){
  return '<div class="flow-node ' + cls + '"><div class="fn-label">' + esc(label) + '</div>' +
    '<div class="fn-value">' + value + '</div><div class="fn-sub">' + sub + '</div></div>';
}

/* ============================================================
   SCREEN: Transactions Ledger
   ============================================================ */
/* `name` is here so whoever fills the file can see what they are typing
   against — it is checked against the item master and never used to
   change it. `cost price` is the unit FOB under a plainer name, and
   `remark` is the reference. Both are aliases; the stored columns are
   unchanged, so every row already on the ledger still reads correctly. */
/* The last two columns are how a transaction that carries child items
   is expressed. Rows sharing a txnRef are one transaction; the row with
   a blank parentItem is the parent and the rest hang off it. The two
   worked examples at the bottom are there because "leave parentItem
   blank on the parent" is far easier to copy than to read. */
const BULK_TEMPLATE_ROWS = [
  ['date', 'item', 'name', 'category', 'type', 'qty', 'cost price', 'location', 'toLocation', 'remark', 'txnRef', 'parentItem', 'partner', 'businessType'],
  ['2026-08-25', 'D79E6EA', 'HP OmniBook 3 14-hu0009nia', 'Laptops', 'Purchase-Backlog', '100', '638', '', '', 'PO-4472', '', '', '', 'Run-Rate'],
  ['2026-08-25', 'D79E6EA', 'HP OmniBook 3 14-hu0009nia', 'Laptops', 'Ship-to-GIT', '60', '', '', '', 'OEM-INV-88231', '', '', '', 'Run-Rate'],
  ['2026-09-02', 'D79E6EA', 'HP OmniBook 3 14-hu0009nia', 'Laptops', 'Receive-to-MainWH', '60', '', 'TD MW', '', 'ASN-1123', '', '', '', 'Run-Rate'],
  ['2026-09-05', 'D79E6EA', 'HP OmniBook 3 14-hu0009nia', 'Laptops', 'Sale-from-MainWH', '3', '', '', '', 'INV-9981', '', '', '', 'Run-Rate'],
  ['2026-09-08', 'AP6J2AV-B2B', 'HP EliteBook 8 G1i 14 AI', 'Laptops', 'Opening Balance-MainWH', '45', '742252.143', 'TD MW', '', 'Opening stock', 'TXN-1001', '', 'Chiomas Ltd', 'B2B'],
  ['2026-09-08', '1Y629AV-B2B', 'Electronic Energy Star labeling (EStar)', 'Integrated Components', 'Opening Balance-MainWH', '45', '1.081333', 'TD MW', '', 'Opening stock', 'TXN-1001', 'AP6J2AV-B2B', 'Chiomas Ltd', 'B2B']
];

/* The template as a file. Same rows the Copy button puts on the
   clipboard, so there is one definition of the right shape.

   Note what is NOT in it: no title row, no blank line, no notes column
   full of prose. The first line has to be the header or the parser has
   nothing to work with, and a "helpful" preamble is the quickest way to
   make a template that cannot be uploaded. */
function templateCsv(){
  return toCsv(BULK_TEMPLATE_ROWS);
}

/* The movement-type dropdown, used by the main form and by every child
   item. One definition, so a type an Admin adds appears in both. */
function txnTypeOptions(selected){
  return (STATE.data.txnTypes || []).map(function(code){
    const def = ((STATE.data.movementTypes || [])
      .filter(function(t){ return t.code === code; })[0]) || {};
    return '<option value="' + attr(code) + '"' +
      (code === selected ? ' selected' : '') + '>' + esc(def.label || code) + '</option>';
  }).join('');
}

/* ---------------- Child items ----------------

   A laptop that ships with an integrated accessory is one transaction
   and several movements: the accessory has its own part number, its own
   unit cost and its own lots, and folding it into the laptop's row would
   lose that cost entirely. So it gets its own row here, with the same
   fields the parent has — and the server ties the two together with a
   transaction ref.

   The date is not repeated on a child. One transaction happens on one
   day; offering a second date box would only invite the two to disagree,
   and the server refuses a group that carries more than one date. The
   partner is not repeated either, for the same reason and with the same
   result: one transaction is with one partner, and a child inherits the
   parent's. */
function viewTxnChildren(){
  const kids = STATE.txnChildren || [];

  const blocks = kids.map(function(c, i){
    const need = txnFieldsFor(c.type || '');
    const hidden = function(on){ return on ? '' : 'display:none;'; };
    return '<div class="child-block" data-child-block="' + i + '">' +
      '<div class="child-head">' +
        '<span class="child-n">Child item ' + (i + 1) + '</span>' +
        '<span class="child-of">ships inside the movement above — its own part ' +
          'number, its own cost, its own lots</span>' +
        '<button class="btn secondary child-drop" type="button" data-child-remove="' + i + '">' +
          'Remove</button>' +
      '</div>' +
      '<div class="form-grid">' +
        '<div class="field"><label>Item Number</label>' +
          '<input type="text" data-ci="' + i + '" data-cf="item" list="f-item-options" ' +
            'autocomplete="off" autocapitalize="characters" spellcheck="false" ' +
            'value="' + attr(c.item || '') + '" placeholder="e.g. 1Y629AV-B2B"></div>' +
        '<div class="field"><label>Type</label>' +
          '<select data-ci="' + i + '" data-cf="type">' + txnTypeOptions(c.type || '') +
          '</select></div>' +
        '<div class="field"><label>Qty</label>' +
          '<input type="number" min="0" step="any" data-ci="' + i + '" data-cf="qty" ' +
            'value="' + attr(c.qty || '') + '" placeholder="e.g. 45"></div>' +
        '<div class="field" style="' + hidden(need.fob) + '"><label>' + esc(need.fobLabel) + '</label>' +
          '<input type="number" min="0" step="any" data-ci="' + i + '" data-cf="fob" ' +
            'value="' + attr(c.fob || '') + '" placeholder="e.g. 1.081333"></div>' +
        '<div class="field"><label>Remark</label>' +
          '<input type="text" data-ci="' + i + '" data-cf="ref" ' +
            'value="' + attr(c.ref || '') + '" placeholder="PO / ASN / Invoice #"></div>' +
        '<div class="field" style="' + hidden(need.location) + '"><label>' + esc(need.locLabel) + '</label>' +
          '<select data-ci="' + i + '" data-cf="location">' +
            locationOptions(c.location || '', 'Not specified') + '</select></div>' +
        '<div class="field" style="' + hidden(need.toLocation) + '"><label>Move to</label>' +
          '<select data-ci="' + i + '" data-cf="toLocation">' +
            locationOptions(c.toLocation || '', 'Choose…') + '</select></div>' +
        '<div class="field" style="' + hidden(need.sellPrice) + '"><label>Unit selling price $</label>' +
          '<input type="number" min="0" step="any" data-ci="' + i + '" data-cf="sellPrice" ' +
            'value="' + attr(c.sellPrice || '') + '"></div>' +
        '<div class="field" style="grid-column:span 2;"><label>Notes</label>' +
          '<input type="text" data-ci="' + i + '" data-cf="notes" ' +
            'value="' + attr(c.notes || '') + '" placeholder="optional"></div>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div id="txn-children">' +
    blocks +
    '<div class="btn-row" style="margin-bottom:12px;">' +
      '<button class="btn secondary" id="txn-add-child" type="button">+ Add child item</button>' +
      (kids.length
        ? '<div class="field" style="max-width:230px;margin-left:6px;">' +
            '<label>Transaction ref</label>' +
            '<input type="text" id="f-txnref" value="' + attr(STATE.txnRef || '') + '" ' +
              'placeholder="generated if left blank"></div>'
        : '<span style="font-size:11.5px;color:var(--text-faint);align-self:center;">' +
          'for stock that ships inside the item above — an accessory, a licence, a labelling line' +
          '</span>') +
    '</div>' +
    (kids.length
      ? '<div style="font-size:11px;color:var(--text-faint);margin:-4px 0 12px 0;">' +
        'These ' + kids.length + ' child item' + (kids.length === 1 ? '' : 's') +
        ' post with the parent on the parent\'s date, under one transaction ref. ' +
        'They go in together or not at all, and reversing the parent later reverses them too.' +
        '</div>'
      : '') +
    '</div>';
}

        '<div class="field"><label>Qty</label>' +
          '<input type="number" id="f-qty" min="0" step="any" placeholder="e.g. 10"></div>' +
        '<div class="field" id="f-fob-wrap"><label>Cost price $ (unit FOB)</label>' +
          '<input type="number" id="f-fob" min="0" step="any" placeholder="e.g. 750.00"></div>' +
        '<div class="field"><label>Remark</label>' +
          '<input type="text" id="f-ref" placeholder="PO / ASN / Invoice #"></div>' +
        /* Optional on every movement type. B2B business is transacted
           through a partner and run-rate business is not, and one ledger
           carries both — so a column that is mandatory for half the rows
           is mandatory for none of them. Always shown rather than
           revealed for -B2B part numbers: which business a movement
           belongs to is the poster's call, not a guess from a suffix. */
        '<div class="field"><label>Partner <span style="color:var(--text-faint);' +
          'font-weight:400;">— B2B only</span></label>' +
          '<input type="text" id="f-partner" list="f-partner-options" autocomplete="off" ' +
            'placeholder="reseller / partner, if B2B">' +
          '<datalist id="f-partner-options">' + partnerOptions() + '</datalist></div>' +
        /* Defaulted from the type on the server, so an existing
           "…B2B-MainWH" type still stamps B2B when this is left alone.
           Offered here so the duplicate types can eventually be
           collapsed into one and the business chosen per movement. */
        '<div class="field"><label>Business type</label>' +
          '<select id="f-businesstype" data-keep-value="1">' +
            businessTypeOptions('', 'From the movement type') + '</select></div>' +
        '<div class="field" id="f-loc-wrap"><label>Warehouse</label>' +
          '<select id="f-location" data-keep-value="1">' + locationOptions('', 'Not specified') + '</select></div>' +
        '<div class="field" id="f-toloc-wrap"><label>Move to</label>' +
          '<select id="f-tolocation" data-keep-value="1">' + locationOptions('', 'Choose…') + '</select></div>' +
        '<div class="field" id="f-sell-wrap"><label>Unit selling price $</label>' +
          '<input type="number" id="f-sellprice" min="0" step="any" placeholder="e.g. 799.00"></div>' +
        '<div class="field" style="grid-column:span 2;"><label>Notes</label>' +
          '<input type="text" id="f-notes" placeholder="optional"></div>' +
      '</div>' +
      /* Outside the grid on purpose. The fields are bottom-aligned, so a
         hint tucked inside one of them makes that column taller and
         knocks the whole row out of line. */
      '<div id="f-item-hint" style="font-size:11.5px;min-height:16px;margin:-6px 0 12px 0;' +
        'color:var(--text-faint);"></div>' +
      viewTxnChildren() +
      '<div class="btn-row">' +
        '<button class="btn" id="log-btn"' + (STATE.busy === 'post' ? ' disabled' : '') + '>' +
          (STATE.busy === 'post' ? 'Posting…' : 'Log Transaction') + '</button>' +
        '<label style="font-size:11.5px;color:var(--text-faint);display:flex;align-items:center;gap:6px;">' +
          '<input type="checkbox" id="f-allow-dup" data-keep-value="1" style="width:auto;"> ' +
          'post anyway if it repeats the last one</label>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--text-faint);margin-top:10px;">' +
        'A selling price is only recorded on a sale, and it is what makes achieved margin reportable. ' +
        'There is no way to edit or delete a movement: a mistake is corrected with a reversing entry, ' +
        'which leaves both rows on the record.' +
      '</div>' +
    '</div>' +
    viewBulkPanel()
  ) : lockedNote('Your role can view every movement but not post one. Admin and Warehouse can post.');

  return form + viewImports() + viewLedgerHistory();
}

function viewBulkPanel(){
  const b = STATE.bulk;
  let preview = '';
  if(b.error){
    preview = '<div class="banner bad"><div>⚠</div><div>' + esc(b.error).replace(/\n/g, '<br>') + '</div></div>';
  }else if(b.preview){
    const p = b.preview;
    preview = dateNotice(b) + (b.ignored && b.ignored.length
      ? '<div class="banner"><div>i</div><div>' +
        esc(b.ignored.length === 1 ? 'One column was ignored' : b.ignored.length + ' columns were ignored') +
        ': <b>' + esc(b.ignored.join(', ')) + '</b>. Stockflow reads date, item, type, qty, fob, ' +
        'location, toLocation, ref, sellPrice and notes; anything else in your file is left alone.' +
        '</div></div>'
      : '') +
      '<div class="banner ' + (p.invalid ? '' : 'good') + '"><div>' + (p.invalid ? '⚠' : '✓') + '</div><div>' +
        '<b>' + p.total + ' rows checked against the live position</b> — ' + p.valid + ' would import, ' +
        p.invalid + ' would be refused. Every row was simulated against the real stock, so an overselling ' +
        'row is caught here rather than after it has corrupted the position.' +
        ((p.brands && p.brands.length)
          ? '<br>This file covers <b>' + esc(p.brands.join(', ')) + '</b>, across ' +
            p.itemCount + ' item' + (p.itemCount === 1 ? '' : 's') + '.'
          : '') +
        ((p.newItems && p.newItems.length)
          ? '<br><span style="color:var(--amber);">' + p.newItems.length +
            ' new part number' + (p.newItems.length === 1 ? '' : 's') +
            ' will be created: <b>' +
            esc(p.newItems.map(function(n){ return n.item; }).join(', ')) +
            '</b>. They are flagged for review once added.</span>'
          : '') +
        (p.warningCount
          ? '<br><span style="color:var(--amber);">' + p.warningCount + ' row' +
            (p.warningCount === 1 ? '' : 's') + ' name a product that does not match the part ' +
            'number. They will still import — check them below first.</span>'
          : '') +
      '</div></div>' +
      '<div class="table-wrap" data-keep-scroll="bulk" style="max-height:300px;overflow-y:auto;margin-bottom:12px;">' +
        '<table><thead><tr><th>#</th><th>Date</th><th>Item</th><th>Product</th><th>Type</th>' +
        '<th class="num">Qty</th><th class="num">Cost</th><th>Where</th><th>Remark</th>' +
        '<th>Transaction</th><th>Status</th></tr></thead><tbody>' +
        p.rows.map(function(r){
          /* A child is shown indented and pointing at the row it belongs
             to. Without it the two are just adjacent rows with a shared
             reference, and "why was this refused?" means matching up
             refs by eye down a 300-row preview. */
          const child = !!r.parentItem;
          return '<tr><td>' + r.line + '</td><td>' + esc(r.date || '—') + '</td>' +
            '<td' + (child ? ' style="padding-left:22px;"' : '') + '>' +
            (child ? '<span style="color:var(--flow);">↳ </span>' : '') +
            '<b>' + esc(r.item || '—') + '</b>' +
            (child
              ? '<div style="font-size:10.5px;color:var(--text-faint);">child of ' +
                esc(r.parentItem) + (r.parentLine ? ' on row ' + r.parentLine : '') + '</div>'
              : '') +
            '</td>' +
            '<td class="wrap">' + esc(r.name || '') + '</td>' +
            '<td>' + esc(r.type || '—') + '</td><td class="num">' + esc(String(r.qty || '—')) + '</td>' +
            '<td class="num">' + (r.fob ? esc(String(r.fob)) : '—') + '</td>' +
            '<td>' + esc([r.location, r.toLocation].filter(Boolean).join(' → ')) + '</td>' +
            '<td>' + esc(r.ref || '') + '</td>' +
            '<td style="font-family:var(--font-mono);font-size:11px;">' +
              esc(r.txnRef || '') + '</td>' +
            /* The reason has to be readable. Clipped to one line it is
               just a red smear, and the whole point of the preview is
               that somebody can act on what it says. */
            '<td class="wrap" style="max-width:none;min-width:280px;">' + (r.status === 'ok'
              ? '<span style="color:var(--green);font-weight:600;">OK</span>'
              : '<span style="color:var(--red)">' + esc(r.errors.join('; ')) + '</span>') +
              /* A description that does not match is not a reason to refuse
                 the row — but it is very often a transposed part number,
                 so it is put in front of someone before they commit. */
              ((r.warnings && r.warnings.length)
                ? '<div style="color:var(--amber);margin-top:4px;">' +
                  esc(r.warnings.join('; ')) + '</div>'
                : '') +
            '</td></tr>';
        }).join('') +
        '</tbody></table></div>' +
      '<div class="btn-row">' +
        '<button class="btn" id="bulk-commit"' + ((!p.valid || b.busy) ? ' disabled' : '') + '>' +
          (b.busy ? 'Importing…' : 'Import ' + p.valid + ' row' + (p.valid === 1 ? '' : 's')) + '</button>' +
        (p.invalid
          ? '<label style="font-size:11.5px;color:var(--text-faint);display:flex;align-items:center;gap:6px;">' +
            '<input type="checkbox" id="bulk-skip" data-keep-value="1" style="width:auto;"' +
            (b.skipInvalid ? ' checked' : '') + '> skip the ' + p.invalid + ' refused row(s)</label>'
          : '') +
        /* Offered only when something was actually refused for being
           already recorded. A standing tick that loosens a duplicate
           guard on every future import is how the guard stops meaning
           anything at all. */
        (p.rows && p.rows.some(function(r){
          return (r.errors || []).some(function(e){ return /already on the ledger/.test(e); }); })
          ? '<label style="font-size:11.5px;color:var(--amber);display:flex;align-items:center;gap:6px;">' +
            '<input type="checkbox" id="bulk-repeats" style="width:auto;"' +
            (b.allowRepeats ? ' checked' : '') + '> these movements really did happen again</label>'
          : '') +
        '<button class="btn secondary" id="bulk-cancel">Cancel</button>' +
        (p.invalid ? '<button class="btn secondary" id="bulk-export-errors">Download the refused rows</button>' : '') +
      '</div>';
  }

  return '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">Bulk Upload' +
      '<span>a day\'s sales report, a shipment manifest — checked against the position before anything is written</span></div></div>' +
    '<div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;align-items:start;">' +
      '<div class="field"><label>1. Get the template</label>' +
        '<div class="btn-row">' +
          '<button class="btn secondary" id="download-template" type="button">Download template</button>' +
          '<button class="btn secondary" id="copy-template" type="button">Copy</button>' +
        '</div></div>' +
      '<div class="field"><label>2. Upload the filled-in file</label>' +
        '<input type="file" id="bulk-file" accept=".csv,text/csv,text/plain,.txt">' +
        (b.fileName
          ? '<div style="font-size:11px;color:var(--text-dim);margin-top:4px;">read <b>' +
            esc(b.fileName) + '</b>' + (b.delimiter ? ' · ' + esc(delimiterName(b.delimiter)) : '') + '</div>'
          : '') +
      '</div>' +
      '<div class="field"><label>3. Or paste rows below</label>' +
        '<button class="btn secondary" id="bulk-parse" type="button"' + (b.busy ? ' disabled' : '') + '>' +
          (b.busy ? 'Checking…' : 'Check pasted rows') + '</button></div>' +
    '</div>' +
    '<textarea id="bulk-paste" data-keep-value="1" rows="4" ' +
      'placeholder="date,item,name,category,type,qty,cost price,location,toLocation,remark"></textarea>' +
    '<label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px;' +
      'margin:2px 0 10px 0;">' +
      '<input type="checkbox" id="bulk-create-items" data-keep-value="1" style="width:auto;"' +
      (autoCreateItems() ? ' checked' : '') + '> ' +
      'Create part numbers that are new' +
    '</label>' +
    '<div style="font-size:11px;color:var(--text-faint);margin:0 0 12px 0;">' +
      'On, so a movement is never blocked because the part number has not been set up yet. ' +
      'Include <b>name</b> and <b>category</b> columns and they are used; leave them out and the ' +
      'item is still created, flagged for review, and costed at 0% landed until an Admin sets its ' +
      'category. The preview lists every code it will create. Untick this to have unknown codes ' +
      'refused instead.' +
    '</div>' +
    '<div style="font-size:11px;color:var(--text-faint);margin:10px 0 12px 0;">' +
      'Columns: <b>date</b> (YYYY-MM-DD), <b>item</b> (part number), <b>name</b> (the product — ' +
      'checked against the item master, never used to change it), <b>type</b>, <b>qty</b>, ' +
      '<b>category</b> (only needed for a part number that is new), <b>type</b>, <b>qty</b>, ' +
      '<b>cost price</b> (the unit cost — required for a purchase or an opening balance), ' +
      '<b>location</b> / <b>toLocation</b> (warehouse codes), <b>remark</b>. ' +
      'Add a <b>sellPrice</b> column on sales if you want achieved margin reported. ' +
      'Column order does not matter; the header row does.' +
    '</div>' +
    preview +
  '</div>';
}

/* Which uploads happened, who sent them, and which brands they touched.
   The direct answer to "which brand was that file?" without joining
   every row back to the item master. */
function viewImports(){
  const d = STATE.views.imports.data;
  if(!d) return '';
  if(!d.rows.length){
    return '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Uploads' +
        '<span>nothing has been bulk-uploaded yet</span></div></div>' +
      '<div class="empty-state">Imports will be listed here, with the brands each one touched.</div>' +
    '</div>';
  }
  return '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">Uploads' +
      '<span>' + d.total + ' import' + (d.total === 1 ? '' : 's') + ', newest first</span></div></div>' +
    '<div class="table-wrap"><table><thead><tr>' +
      '<th>When</th><th>Who</th><th class="num">Rows</th><th class="num">Items</th>' +
      '<th>Brands</th><th>Note</th><th></th>' +
    '</tr></thead><tbody>' +
    d.rows.map(function(b){
      return '<tr>' +
        '<td>' + esc(fmtDateTime(b.importedAt)) + '</td>' +
        '<td>' + esc(b.importedBy) + '</td>' +
        '<td class="num">' + fmtNum(b.rowCount) + '</td>' +
        '<td class="num">' + fmtNum(b.itemCount) + '</td>' +
        '<td>' + (b.brandsKnown
          ? (b.brands.length
              ? b.brands.map(function(x){ return '<span class="tag">' + esc(x) + '</span>'; }).join(' ')
              : '<span class="unknown">no brand set</span>')
          : '<span class="unknown">not recorded</span>') + '</td>' +
        '<td class="wrap">' + esc(b.note) + '</td>' +
        '<td><button class="btn secondary sm" data-batch-dl="' + attr(b.batchId) + '">Download</button></td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div>' +
    pagerServer('imports', d) +
  '</div>';
}

/* Says, in words, how the dates in this file were read — and offers the
   other reading. Nothing is silently interpreted: the person clicking
   Import has been told what the dates mean. */
function dateNotice(b){
  const d = b.dateInfo;
  if(!d || !d.count) return '';
  const other = d.order === 'DMY' ? 'MDY' : 'DMY';
  const certain = d.basis === 'evidence';
  return '<div class="banner ' + (certain ? 'info' : '') + '">' +
    '<div>' + (certain ? 'i' : '?') + '</div><div>' +
      '<b>' + d.count + ' date' + (d.count === 1 ? '' : 's') + ' came in as ' +
      esc(d.sample) + '</b> — read as <b>' + esc(dateOrderLabel(d.order)) + '</b>, so ' +
      esc(d.sample) + ' means <b>' + esc(d.example) + '</b>.' +
      (certain
        ? ' The file settles it: at least one date has a day above 12, so no other reading fits.'
        : ' Every date in this file works either way, so the default was used.') +
      ' <button class="link-btn" id="flip-date-order">Read them as ' +
      esc(dateOrderLabel(other)) + ' instead</button>' +
    '</div></div>';
}

/* null in state means "whatever the workbook is set to"; ticking or
   unticking on this upload overrides it for this upload only. */
function autoCreateItems(){
  if(STATE.bulk.createMissingItems !== null && STATE.bulk.createMissingItems !== undefined){
    return !!STATE.bulk.createMissingItems;
  }
  const s = (STATE.data && STATE.data.settings) || {};
  return s.autoCreateItems !== false;
}

function viewLedgerHistory(){
  const v = STATE.views.ledger;
  const d = v.data;
  const types = ['Opening Balance-MainWH'].concat(STATE.data.txnTypes || []).concat(['Reversal']);

  const filters = '<div class="filter-bar">' +
    '<div class="field narrow"><label>From</label><input type="date" id="lf-from" data-state-value="1" value="' + attr(v.dateFrom) + '"></div>' +
    '<div class="field narrow"><label>To (inclusive)</label><input type="date" id="lf-to" data-state-value="1" value="' + attr(v.dateTo) + '"></div>' +
    '<div class="field"><label>Item</label><select id="lf-item" data-state-value="1">' +
      '<option value="">All items</option>' +
      visibleItems().map(function(i){
        return '<option value="' + attr(i.item) + '"' + (v.item === i.item ? ' selected' : '') + '>' + esc(i.item) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Type</label><select id="lf-type" data-state-value="1">' +
      '<option value="">All types</option>' +
      types.map(function(t){
        return '<option value="' + attr(t) + '"' + (v.type === t ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') + '</select></div>' +
    /* The two filters the split exists for. Stage is derived from each
       row's behaviour, so a shipment answers to both Backlog and GIT —
       "all GIT activity" that omitted the movements filling GIT would
       be half a report. */
    '<div class="field"><label>Stage</label><select id="lf-stage" data-state-value="1">' +
      stageOptions(v.stage) + '</select></div>' +
    '<div class="field"><label>Business</label><select id="lf-business" data-state-value="1">' +
      '<option value="">All businesses</option>' +
      (STATE.data.businessTypes || []).map(function(b){
        return '<option value="' + attr(b) + '"' + (v.businessType === b ? ' selected' : '') + '>' +
          esc(b) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Partner</label><select id="lf-partner" data-state-value="1">' +
      partnerFilterOptions(v.partner) + '</select></div>' +
    '<div class="field"><label>Search remark, notes, who</label>' +
      '<input type="text" id="lf-search" data-state-value="1" placeholder="PO-4471, INV-, a name…" value="' + attr(v.search) + '"></div>' +
    '<div class="field narrow"><label>&nbsp;</label><button class="btn secondary" id="lf-clear">Clear</button></div>' +
  '</div>';

  let body;
  if(v.loading && !d){
    body = '<div class="empty-state">Loading…</div>';
  }else if(!d){
    body = '<div class="empty-state">No movements loaded yet.</div>';
  }else if(!d.rows.length){
    body = '<div class="empty-state">No movements match these filters.</div>';
  }else{
    body = '<div class="table-wrap" data-keep-scroll="ledger">' +
      '<table><thead><tr>' +
        '<th>Date</th><th>Item</th>' + (showBrandColumn() ? '<th>Brand</th>' : '') +
        '<th>Type</th><th class="num">Qty</th><th class="num">Cost $</th>' +
        '<th>Stage</th><th>Business</th>' +
        '<th>Where</th><th>Partner</th><th class="num">Sell $</th><th class="num">Cost of sale</th>' +
        '<th>Remark</th><th>Posted by</th><th></th>' +
      '</tr></thead><tbody>' +
      d.rows.map(function(r){
        const canReverse = STATE.perms.ledger && !r.voided && r.type !== 'Reversal';
        const canEdit = STATE.perms.editLedger && !r.voided && r.type !== 'Reversal';
        return '<tr class="' + (r.voided ? 'voided' : '') + '">' +
          '<td>' + esc(r.date) + '</td>' +
          /* A movement that is part of a transaction says so on the row
             itself. A child is indented and names its parent; a parent
             says how many rows go with it — which is the thing somebody
             needs to know BEFORE pressing Reverse. */
          '<td' + (r.parentItem ? ' style="padding-left:20px;"' : '') + '>' +
            (r.parentItem ? '<span style="color:var(--flow);">↳ </span>' : '') +
            '<b>' + esc(r.item) + '</b>' +
            (r.parentItem
              ? '<div class="unknown" style="font-size:10.5px;">child of ' +
                esc(r.parentItem) + '</div>'
              : (r.childCount
                  ? '<div style="font-size:10.5px;color:var(--flow);">+ ' + r.childCount +
                    ' child item' + (r.childCount === 1 ? '' : 's') + '</div>'
                  : '')) +
          '</td>' +
          (showBrandColumn()
            ? '<td>' + (r.brand ? esc(r.brand) : '<span class="unknown">—</span>') + '</td>'
            : '') +
          '<td>' + typePill(r.type) + '</td>' +
          '<td>' + (r.stage ? esc(r.stage) : '<span class="unknown">—</span>') + '</td>' +
          '<td>' + (r.businessType ? esc(r.businessType) : '<span class="unknown">—</span>') + '</td>' +
          '<td class="num">' + fmtNum(r.qty) + '</td>' +
          '<td class="num">' + (r.fob ? fmtMoney(r.fob) : '—') + '</td>' +
          '<td>' + esc([r.location, r.toLocation].filter(function(x, i, a){ return x && a.indexOf(x) === i; }).join(' → ')) + '</td>' +
          '<td class="wrap">' + (r.partner ? esc(r.partner) : '<span class="unknown">—</span>') + '</td>' +
          '<td class="num">' + (isNum(r.sellPrice) ? fmtMoney(r.sellPrice) : '—') + '</td>' +
          '<td class="num">' + (r.costOfSale ? fmtMoney0(r.costOfSale) : '—') + '</td>' +
          '<td class="wrap">' + esc(r.ref) +
            (r.txnRef ? '<br><span class="unknown">txn ' + esc(r.txnRef) + '</span>' : '') +
            (r.reversalOf ? '<br><span class="unknown">reverses ' + esc(r.reversalOf) + ' — ' + esc(r.reversalReason) + '</span>' : '') +
            (r.correctsTxnId ? '<br><span class="unknown">corrected version of ' + esc(r.correctsTxnId) + '</span>' : '') +
            (r.notes ? '<br><span class="unknown">' + esc(r.notes) + '</span>' : '') + '</td>' +
          '<td class="wrap">' + esc(r.actor) + '</td>' +
          '<td class="btn-row">' +
            (canEdit ? '<button class="btn secondary sm" data-edittxn="' + attr(r.txnId) + '">Edit</button>' : '') +
            (canReverse ? '<button class="btn secondary sm" data-reverse="' + attr(r.txnId) + '">Reverse</button>' : '') +
            (r.voided
              ? '<span class="unknown">' + (r.correctedBy ? 'edited' : 'reversed') + '</span>'
              : '') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>' +
      pagerServer('ledger', d);
  }

  return '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">Ledger History' +
      '<span>' + (d ? d.total + ' matching row' + (d.total === 1 ? '' : 's') : '') + '</span></div>' +
      '<div class="btn-row">' +
        (STATE.bulk.lastBatchId
          ? '<button class="btn secondary sm" id="export-batch" data-batch="' +
            attr(STATE.bulk.lastBatchId) + '">Download my last import</button>'
          : '') +
        '<button class="btn secondary sm" id="export-ledger">Export CSV</button>' +
      '</div>' +
    '</div>' +
    filters + body +
    '<div style="font-size:11px;color:var(--text-faint);margin-top:10px;">' +
      'Export CSV downloads every row matching the filters above, not just this page.' +
    '</div>' +
  '</div>';
}

/* Only worth a column when there is more than one brand loaded and no
   single brand selected. With one brand, or with the switcher already
   scoped to one, it would be the same word on every row. */
function showBrandColumn(){
  if(STATE.activeBrand) return false;
  return Object.keys(brandsWithStock()).length > 1;
}

function pagerServer(viewId, d){
  if(!d.total) return '';
  const from = (d.page - 1) * d.pageSize + 1;
  const to = Math.min(d.page * d.pageSize, d.total);
  return '<div class="pager">' +
    '<div class="pager-info">showing ' + from + '–' + to + ' of ' + d.total + '</div>' +
    '<div class="pager-btns">' +
      '<button class="btn secondary sm" data-spage="' + attr(viewId) + '" data-to="1"' + (d.page === 1 ? ' disabled' : '') + '>&laquo; first</button>' +
      '<button class="btn secondary sm" data-spage="' + attr(viewId) + '" data-to="' + (d.page - 1) + '"' + (d.page === 1 ? ' disabled' : '') + '>prev</button>' +
      '<span class="pager-info">page ' + d.page + ' of ' + d.pages + '</span>' +
      '<button class="btn secondary sm" data-spage="' + attr(viewId) + '" data-to="' + (d.page + 1) + '"' + (d.page >= d.pages ? ' disabled' : '') + '>next</button>' +
      '<button class="btn secondary sm" data-spage="' + attr(viewId) + '" data-to="' + d.pages + '"' + (d.page >= d.pages ? ' disabled' : '') + '>last &raquo;</button>' +
    '</div></div>';
}
</script>

<script>
/* ============================================================
   SCREEN: GIT
   ============================================================ */
function viewGit(){
  const v = STATE.views.git;
  const b = STATE.data.ageBuckets || [30, 60, 90];
  const all = nonB2B().concat(b2bItems());
  const withGit = all.filter(function(i){ return i.gitQty > 0; });
  const res = applyView(withGit, v);
  const totalQty = withGit.reduce(function(s, i){ return s + i.gitQty; }, 0);
  const totalVal = withGit.reduce(function(s, i){ return s + i.gitValue; }, 0);
  const over = withGit.filter(function(i){ return isNum(i.gitOldestAge) && i.gitOldestAge > b[2]; }).length;

  return '<div class="banner"><div>⏳</div><div>Stock ships to GIT and clears to the Main Warehouse ' +
    'through the ledger. Ageing starts the day stock is recognised as GIT and carries through to the ' +
    'Main Warehouse — it does not reset on receipt, and it does not reset on a transfer either.</div></div>' +

    '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;">' +
      kpi('Total GIT Units', fmtNum(totalQty), withGit.length + ' SKUs in transit', 'var(--amber)') +
      kpi('Total GIT Value', fmtMoney0(totalVal), 'at net cost', 'var(--amber)') +
      kpi('SKUs over ' + b[2] + ' days in GIT', String(over), over ? 'chase these' : 'nothing overdue', over ? 'var(--red)' : 'var(--flow)') +
    '</div>' +

    '<div class="panel">' +
      filterBar('git', {search: true, category: true}) +
      '<div class="table-wrap"><table><thead><tr>' +
        sortableTh('git', 'item', 'Item') +
        '<th>Product</th>' +
        sortableTh('git', 'category', 'Category') +
        sortableTh('git', 'gitQty', 'GIT Qty', true) +
        sortableTh('git', 'netCost', 'Net Cost/unit', true) +
        sortableTh('git', 'gitValue', 'GIT Value', true) +
        '<th>Oldest lot entered GIT</th>' +
        sortableTh('git', 'gitOldestAge', 'Oldest age', true) +
        sortableTh('git', 'gitAvgAge', 'Avg age', true) +
        '<th>Status</th>' +
      '</tr></thead><tbody>' +
      (res.rows.length ? res.rows.map(function(i){
        const age = i.gitOldestAge;
        const status = !isNum(age) ? 'Unknown age'
          : age > b[2] ? 'Delayed (' + b[2] + '+ days)'
          : age > b[1] ? 'Ageing (' + b[1] + '+ days)' : 'In Transit';
        return '<tr>' +
          '<td><b>' + esc(i.item) + '</b>' + flagIcon(i) + '</td>' +
          '<td class="wrap">' + esc(i.name) + '</td>' +
          '<td>' + catTag(i.category) + '</td>' +
          '<td class="num">' + fmtNum(i.gitQty) + '</td>' +
          '<td class="num">' + costCell(i) + '</td>' +
          '<td class="num">' + fmtMoney0(i.gitValue) + '</td>' +
          '<td>' + esc(i.gitOldestDate || '—') + '</td>' +
          '<td class="num" style="color:' + ageColour(age) + ';font-weight:600;">' + fmtDays(age) + '</td>' +
          '<td class="num">' + fmtDays(i.gitAvgAge) + '</td>' +
          '<td><span style="color:' + ageColour(age) + ';font-weight:600;">' + esc(status) + '</span></td>' +
        '</tr>';
      }).join('') : emptyRow(10, 'No stock currently in transit. Log a Ship-to-GIT on the Transactions Ledger.')) +
      '</tbody></table></div>' +
      pager('git', res) +
    '</div>';
}

function flagIcon(i){
  if(!i.flag) return '';
  const resolved = !!i.flagResolvedBy;
  const title = i.flag + (resolved ? ' — confirmed by ' + i.flagResolvedBy + ': ' + i.flagNote : '');
  return ' <span class="flag-icon' + (resolved ? ' resolved' : '') + '" title="' + attr(title) + '">' +
    (resolved ? '✓' : '⚠') + '</span>';
}

/* An item that has never been purchased has no cost, and saying "$0.00"
   would be a lie the prototype told on every such row. */
function costCell(i){
  if(i.costUnknown) return '<span class="unknown" title="No purchase history, so there is no cost to show">no cost yet</span>';
  const warn = i.supportExceedsLanded
    ? ' <span class="flag-icon" title="HP support exceeds landed cost, so net cost is floored at zero">⚠</span>'
    : '';
  return fmtMoney(i.netCost) + warn;
}

function filterBar(viewId, opts){
  const v = STATE.views[viewId];
  let html = '<div class="filter-bar">';
  if(opts.search){
    html += '<div class="field"><label>Search item or product</label>' +
      '<input type="text" id="vf-' + attr(viewId) + '-search" data-keep-value="1" ' +
      'placeholder="part number or description" value="' + attr(v.search) + '"></div>';
  }
  if(opts.category){
    html += '<div class="field narrow"><label>Category</label>' +
      '<select id="vf-' + attr(viewId) + '-category" data-keep-value="1">' + categoryOptions(v.category) + '</select></div>';
  }
  if(opts.location){
    html += '<div class="field narrow"><label>Warehouse</label>' +
      '<select id="vf-' + attr(viewId) + '-location" data-keep-value="1">' + locationOptions(v.location) + '</select></div>';
  }
  if(opts.flagged){
    html += '<div class="field narrow"><label>&nbsp;</label>' +
      '<label style="font-size:11.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;height:34px;">' +
      '<input type="checkbox" id="vf-' + attr(viewId) + '-flagged" data-keep-value="1" style="width:auto;"' +
      (v.flagged ? ' checked' : '') + '> flagged only</label></div>';
  }
  html += '<div class="field narrow"><label>&nbsp;</label>' +
    '<button class="btn secondary" data-clearview="' + attr(viewId) + '">Clear</button></div>';
  return html + '</div>';
}

/* ============================================================
   SCREEN: Main Warehouse
   ============================================================ */
function viewMainWh(){
  const v = STATE.views.mainwh;
  const b = STATE.data.ageBuckets || [30, 60, 90];
  const all = nonB2B().concat(b2bItems());
  const withMw = all.filter(function(i){ return i.mwQty > 0; });
  const res = applyView(withMw, v);
  const totalQty = withMw.reduce(function(s, i){ return s + i.mwQty; }, 0);
  const totalVal = withMw.reduce(function(s, i){ return s + i.mwValue; }, 0);
  const over = withMw.filter(function(i){ return isNum(i.mwOldestAge) && i.mwOldestAge > b[2]; }).length;

  /* Per-warehouse totals. The prototype captured a warehouse on every
     opening lot and then collapsed all of them into one number. */
  const byLoc = {};
  withMw.forEach(function(i){
    Object.keys(i.byLocation || {}).forEach(function(code){
      if(!byLoc[code]) byLoc[code] = {qty: 0, value: 0};
      byLoc[code].qty += i.byLocation[code];
      byLoc[code].value += i.byLocation[code] * (i.costUnknown ? 0 : i.netCost);
    });
  });
  const locCodes = Object.keys(byLoc).sort();

  return '<div class="banner"><div>📦</div><div>Age here carries over from the date stock entered GIT ' +
    '(or, for opening-balance stock, the date it was loaded into Stockflow) — receiving into the ' +
    'warehouse does not restart the clock, and neither does moving it between warehouses.</div></div>' +

    '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;">' +
      kpi('Total Main WH Units', fmtNum(totalQty), withMw.length + ' SKUs on hand', 'var(--flow)') +
      kpi('Total Main WH Value', fmtMoney0(totalVal), 'at net cost', 'var(--flow)') +
      kpi('SKUs over ' + b[2] + ' days on hand', String(over), over ? 'ageing stock' : 'nothing overdue', over ? 'var(--red)' : 'var(--flow)') +
    '</div>' +

    (locCodes.length ? '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">By Warehouse' +
        '<span>where the stock physically is</span></div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Warehouse</th><th class="num">Units</th>' +
      '<th class="num">Value</th><th class="num">Share of units</th></tr></thead><tbody>' +
      locCodes.map(function(code){
        const loc = (STATE.data.locations || []).filter(function(l){ return l.code === code; })[0];
        const share = totalQty > 0 ? (byLoc[code].qty / totalQty) : 0;
        return '<tr><td><b>' + esc(code) + '</b> <span class="unknown">' +
          esc(loc ? loc.name : '') + '</span></td>' +
          '<td class="num">' + fmtNum(byLoc[code].qty) + '</td>' +
          '<td class="num">' + fmtMoney0(byLoc[code].value) + '</td>' +
          '<td class="num">' + fmtPct(share) + '</td></tr>';
      }).join('') +
      '</tbody></table></div></div>' : '') +

    '<div class="panel">' +
      filterBar('mainwh', {search: true, category: true, location: true}) +
      '<div class="table-wrap" data-keep-scroll="mainwh"><table><thead><tr>' +
        sortableTh('mainwh', 'item', 'Item') +
        '<th>Product</th>' +
        sortableTh('mainwh', 'category', 'Category') +
        sortableTh('mainwh', 'mwQty', 'MW Qty', true) +
        '<th>Held at</th>' +
        sortableTh('mainwh', 'netCost', 'Net Cost/unit', true) +
        sortableTh('mainwh', 'mwValue', 'MW Value', true) +
        '<th>Oldest lot entry</th>' +
        sortableTh('mainwh', 'mwOldestAge', 'Oldest age', true) +
        sortableTh('mainwh', 'mwAvgAge', 'Avg age', true) +
      '</tr></thead><tbody>' +
      (res.rows.length ? res.rows.map(function(i){
        const where = Object.keys(i.byLocation || {}).sort().map(function(code){
          return esc(code) + '&nbsp;' + fmtNum(i.byLocation[code]);
        }).join(' · ');
        return '<tr>' +
          '<td><b>' + esc(i.item) + '</b>' + flagIcon(i) + '</td>' +
          '<td class="wrap">' + esc(i.name) + '</td>' +
          '<td>' + catTag(i.category) + '</td>' +
          '<td class="num">' + fmtNum(i.mwQty) + '</td>' +
          '<td class="wrap">' + (where || '<span class="unknown">unassigned</span>') + '</td>' +
          '<td class="num">' + costCell(i) + '</td>' +
          '<td class="num">' + fmtMoney0(i.mwValue) + '</td>' +
          '<td>' + esc(i.mwOldestDate || '—') + '</td>' +
          '<td class="num" style="color:' + ageColour(i.mwOldestAge) + ';font-weight:600;">' + fmtDays(i.mwOldestAge) + '</td>' +
          '<td class="num">' + fmtDays(i.mwAvgAge) + '</td>' +
        '</tr>';
      }).join('') : emptyRow(10, 'Nothing on hand matches these filters.')) +
      '</tbody></table></div>' +
      pager('mainwh', res) +
    '</div>';
}

/* ============================================================
   SCREEN: Consolidated position
   ============================================================ */
function viewConsolidated(){
  const v = STATE.views.consolidated;
  const t = totals();
  const all = nonB2B().concat(b2bItems());
  const res = applyView(all, v);

  const labels = ageBucketLabels();
  const buckets = {};
  labels.forEach(function(l){ buckets[l] = 0; });
  let unbucketed = 0;
  all.forEach(function(i){
    (i.lots || []).forEach(function(lot){
      const bucket = ageBucket(lot.age);
      const value = lot.qty * (i.costUnknown ? 0 : i.netCost);
      if(bucket) buckets[bucket] += value; else unbucketed += lot.qty;
    });
  });

  return '<div class="kpi-grid" style="margin-bottom:18px;">' +
      kpi('GIT Qty', fmtNum(t.gitQty), 'in transit', 'var(--amber)') +
      kpi('Main WH Qty', fmtNum(t.mwQty), 'on ground', 'var(--flow)') +
      kpi('Consolidated Qty', fmtNum(t.consolidatedQty), 'owned position', 'var(--flow)') +
      kpi('Consolidated Value', fmtMoney0(t.consolidatedValue), 'at net cost', 'var(--flow)') +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Inventory Ageing' +
        '<span>value by days held, from GIT entry through to ' + esc(STATE.today) +
        ' (opening stock ages from its upload date)</span></div></div>' +
      '<div class="chart-box">' + chartBar(labels, labels.map(function(l){ return buckets[l]; }),
        ['#5FE0BE', '#2FBEB0', '#E3A23D', '#E0654F'], {px: 210, fmt: money0k}) + '</div>' +
      (unbucketed ? '<div style="font-size:11.5px;color:var(--red);margin-top:8px;">' +
        fmtNum(unbucketed) + ' unit(s) are not in any bucket because their entry date cannot be read. ' +
        'They are excluded from this chart rather than counted as brand new.</div>' : '') +
    '</div>' +

    '<div class="panel">' +
      filterBar('consolidated', {search: true, category: true}) +
      '<div class="table-wrap" data-keep-scroll="consolidated"><table><thead><tr>' +
        sortableTh('consolidated', 'item', 'Item') +
        '<th>Product</th>' +
        sortableTh('consolidated', 'category', 'Category') +
        sortableTh('consolidated', 'backlogQty', 'Backlog', true) +
        sortableTh('consolidated', 'gitQty', 'GIT', true) +
        sortableTh('consolidated', 'mwQty', 'Main WH', true) +
        sortableTh('consolidated', 'consolidatedQty', 'Consolidated', true) +
        '<th class="num">Oldest age</th>' +
        sortableTh('consolidated', 'netCost', 'Net Cost/unit', true) +
        sortableTh('consolidated', 'consolidatedValue', 'Value', true) +
      '</tr></thead><tbody>' +
      (res.rows.length ? res.rows.map(function(i){
        const ages = [i.gitOldestAge, i.mwOldestAge].filter(isNum);
        const oldest = ages.length ? Math.max.apply(null, ages) : null;
        return '<tr>' +
          '<td><b>' + esc(i.item) + '</b>' + flagIcon(i) + (i.b2b ? ' <span class="tag">B2B</span>' : '') + '</td>' +
          '<td class="wrap">' + esc(i.name) + '</td>' +
          '<td>' + catTag(i.category) + '</td>' +
          '<td class="num">' + fmtNum(i.backlogQty) + '</td>' +
          '<td class="num">' + fmtNum(i.gitQty) + '</td>' +
          '<td class="num">' + fmtNum(i.mwQty) + '</td>' +
          '<td class="num">' + fmtNum(i.consolidatedQty) + '</td>' +
          '<td class="num" style="color:' + ageColour(oldest) + ';font-weight:600;">' +
            (i.consolidatedQty > 0 ? fmtDays(oldest) : '—') + '</td>' +
          '<td class="num">' + costCell(i) + '</td>' +
          '<td class="num">' + fmtMoney0(i.consolidatedValue) + '</td>' +
        '</tr>';
      }).join('') : emptyRow(10, 'Nothing matches these filters.')) +
      '</tbody></table></div>' +
      pager('consolidated', res) +
      '<div style="font-size:11.5px;color:var(--text-faint);margin-top:10px;">' +
        'Backlog is shown for context but is <b>not</b> part of the consolidated position: it is ordered, ' +
        'not owned, and it carries no ageing clock.</div>' +
    '</div>';
}
</script>

<script>
/* ============================================================
   SCREEN: Item Master — the cost build-up, spelled out
   ============================================================ */
function viewItemMaster(){
  const editable = STATE.perms.category;
  const v = STATE.views.itemmaster;
  const res = applyView(nonB2B(), v);

  return (editable ? '' : lockedNote(
      'Only an Admin can change an FOB override or HP price support — those two numbers revalue the ' +
      'whole inventory. You can see every figure.')) +

    '<div class="banner info"><div>🧮</div><div><b>How the cost is built, in order.</b> ' +
      'weighted average FOB across every purchase ever &rarr; an optional per-SKU override &rarr; ' +
      '&times; (1 + the category landed %) &rarr; less HP price support &rarr; net cost, floored at zero. ' +
      'Every valuation on every screen uses net cost, which is why a change here is written to the audit trail.' +
    '</div></div>' +

    '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Item Master' +
        '<span>' + nonB2B().length + ' SKUs</span></div>' +
        '<div class="btn-row">' +
          (STATE.perms.items
            ? '<button class="btn sm" id="add-item">Add an item</button>' +
              '<button class="btn secondary sm" id="import-items">Add many from a file</button>'
            : '') +
          '<button class="btn secondary sm" id="export-items">Export CSV</button>' +
        '</div></div>' +
      viewItemImport() +
      filterBar('itemmaster', {search: true, category: true, flagged: true}) +
      '<div class="table-wrap" data-keep-scroll="itemmaster"><table><thead><tr>' +
        sortableTh('itemmaster', 'item', 'Item') +
        '<th>Product</th>' +
        sortableTh('itemmaster', 'category', 'Category') +
        sortableTh('itemmaster', 'weightedFob', 'Weighted avg cost (FOB)', true) +
        '<th class="num">FOB override</th>' +
        sortableTh('itemmaster', 'effectiveFob', 'Effective FOB', true) +
        sortableTh('itemmaster', 'landedPct', 'Landed %', true) +
        sortableTh('itemmaster', 'landedCost', 'Landed cost', true) +
        '<th class="num">HP support</th>' +
        sortableTh('itemmaster', 'netCost', 'Net cost', true) +
        sortableTh('itemmaster', 'gitQty', 'GIT', true) +
        sortableTh('itemmaster', 'mwQty', 'Main WH', true) +
        sortableTh('itemmaster', 'consolidatedQty', 'Consolidated', true) +
        sortableTh('itemmaster', 'consolidatedValue', 'Value', true) +
        (STATE.perms.items ? '<th></th>' : '') +
      '</tr></thead><tbody>' +
      (res.rows.length ? res.rows.map(function(i){
        return '<tr>' +
          '<td><b>' + esc(i.item) + '</b>' + flagIcon(i) + '</td>' +
          '<td class="wrap">' + esc(i.name) + '</td>' +
          '<td>' + catTag(i.category) + '</td>' +
          '<td class="num">' + (i.costUnknown ? '<span class="unknown">—</span>' : fmtMoney(i.weightedFob)) + '</td>' +
          '<td class="num"><input type="number" step="any" min="0" style="width:96px;text-align:right;padding:5px 6px;" ' +
            'id="fob-' + attr(i.item) + '" data-fob="' + attr(i.item) + '" placeholder="—" ' +
            'value="' + (isNum(i.fobOverride) ? attr(i.fobOverride) : '') + '"' + (editable ? '' : ' disabled') + '></td>' +
          '<td class="num">' + (i.costUnknown && !isNum(i.fobOverride) ? '<span class="unknown">—</span>' : fmtMoney(i.effectiveFob)) + '</td>' +
          '<td class="num">' + fmtPct(i.landedPct) + '</td>' +
          '<td class="num">' + (i.costUnknown && !isNum(i.fobOverride) ? '<span class="unknown">—</span>' : fmtMoney(i.landedCost)) + '</td>' +
          '<td class="num"><input type="number" step="any" min="0" style="width:88px;text-align:right;padding:5px 6px;" ' +
            'id="sup-' + attr(i.item) + '" data-support="' + attr(i.item) + '" placeholder="0" ' +
            'value="' + (i.support ? attr(i.support) : '') + '"' + (editable ? '' : ' disabled') + '></td>' +
          '<td class="num">' + costCell(i) + '</td>' +
          '<td class="num">' + fmtNum(i.gitQty) + '</td>' +
          '<td class="num">' + fmtNum(i.mwQty) + '</td>' +
          '<td class="num">' + fmtNum(i.consolidatedQty) + '</td>' +
          '<td class="num">' + fmtMoney0(i.consolidatedValue) + '</td>' +
          (STATE.perms.items
            ? '<td><button class="btn secondary sm" data-edititem="' + attr(i.item) + '">Edit</button></td>'
            : '') +
        '</tr>';
      }).join('') : emptyRow(STATE.perms.items ? 15 : 14, 'No items match these filters.')) +
      '</tbody></table></div>' +
      pager('itemmaster', res) +
      (editable ? '<div style="font-size:11.5px;color:var(--text-faint);margin-top:10px;">' +
        'Leave the FOB override blank (or set it to 0) to go back to the weighted average. ' +
        'An HP support of 0 is a real zero and is kept as one.</div>' : '') +
    '</div>';
}

/* ============================================================
   SCREEN: Selling Price Simulator
   ============================================================ */
/* Adding a hundred SKUs one dialogue at a time is not a workflow, so the
   item master gets the same preview-then-commit shape as a movement
   upload — and reuses the same CSV reader, so the same spreadsheet
   quirks are handled. */
function viewItemImport(){
  const s = STATE.itemImport;
  if(!s.open) return '';
  let preview = '';
  if(s.error){
    preview = '<div class="banner bad"><div>!</div><div>' + esc(s.error).replace(/\n/g, '<br>') + '</div></div>';
  }else if(s.preview){
    const p = s.preview;
    preview =
      '<div class="banner ' + (p.invalid ? '' : 'good') + '"><div>' + (p.invalid ? '!' : 'ok') + '</div><div>' +
        '<b>' + p.total + ' rows checked</b> — ' + p.valid + ' would be added, ' + p.invalid +
        ' would be refused. Nothing is created until you press Add.' +
      '</div></div>' +
      '<div class="table-wrap" data-keep-scroll="itemimport" style="max-height:280px;overflow-y:auto;margin-bottom:12px;">' +
        '<table><thead><tr><th>#</th><th>Part number</th><th>Description</th><th>Category</th>' +
        '<th>Brand</th><th>Status</th></tr></thead><tbody>' +
        p.rows.map(function(r){
          return '<tr><td>' + r.line + '</td><td><b>' + esc(r.item || '—') + '</b></td>' +
            '<td class="wrap">' + esc(r.name || '') + '</td>' +
            '<td>' + esc(r.category || '') + '</td><td>' + esc(r.brand || '') + '</td>' +
            '<td class="wrap" style="max-width:none;min-width:260px;">' + (r.status === 'ok'
              ? '<span style="color:var(--green);font-weight:600;">OK</span>'
              : '<span style="color:var(--red)">' + esc(r.errors.join('; ')) + '</span>') + '</td></tr>';
        }).join('') +
        '</tbody></table></div>' +
      '<div class="btn-row">' +
        '<button class="btn" id="item-import-commit"' + ((!p.valid || s.busy) ? ' disabled' : '') + '>' +
          (s.busy ? 'Adding…' : 'Add ' + p.valid + ' item' + (p.valid === 1 ? '' : 's')) + '</button>' +
        (p.invalid

/* Mirrors the server's resolver exactly. This is a preview of what the
   server would compute; the server is still the authority. */
function livePricing(){
  const p = STATE.data.pricing || {global: null, category: {}, sku: {}};
  const draft = STATE.marginDraft || {};
  return {
    global: draft.global !== undefined ? draft.global : p.global,
    category: Object.assign({}, p.category, draft.category || {}),
    sku: Object.assign({}, p.sku, draft.sku || {})
  };
}
function resolveMargin(item, category){
  const p = livePricing();
  const sku = p.sku[item];
  if(isNum(sku)) return Number(sku) / 100;
  const cat = p.category[category];
  if(isNum(cat)) return Number(cat) / 100;
  if(isNum(p.global)) return Number(p.global) / 100;
  return Number(STATE.data.defaultMarginPct || 0) / 100;
}

function simRows(rows, editable){
  const p = livePricing();
  return rows.map(function(i){
    const margin = resolveMargin(i.item, i.category);
    const unknown = i.costUnknown;
    const sp = unknown ? null : i.netCost * (1 + margin);
    const skuOv = p.sku[i.item];
    return '<tr>' +
      '<td><b>' + esc(i.item) + '</b>' + flagIcon(i) + '</td>' +
      '<td class="wrap">' + esc(i.name) + '</td>' +
      '<td>' + catTag(i.category) + '</td>' +
      '<td class="num">' + costCell(i) + '</td>' +
      '<td class="num"><input type="number" step="any" style="width:78px;text-align:right;padding:5px 6px;" ' +
        'id="skusim-' + attr(i.item) + '" data-skusim="' + attr(i.item) + '" placeholder="—" ' +
        'value="' + (isNum(skuOv) ? attr(skuOv) : '') + '"' + (editable ? '' : ' disabled') + '></td>' +
      '<td class="num">' + fmtPct(margin) + '</td>' +
      '<td class="num">' + (unknown ? '<span class="unknown">—</span>' : fmtMoney(sp)) + '</td>' +
      '<td class="num">' + (unknown ? '<span class="unknown">—</span>' : fmtMoney(sp - i.netCost)) + '</td>' +
    '</tr>';
  }).join('') || emptyRow(8, 'No items match these filters.');
}
