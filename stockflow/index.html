<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stockflow — TD Africa Group</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  TD AFRICA · STOCKFLOW — the entire application, one static file.

  PUBLISHING THIS FILE
  --------------------
  Search for STOCKFLOW_BACKEND_URL below and paste the Apps Script Web App
  /exec URL between the quotes. That is the only thing anyone ever has to
  configure, and it is done once by whoever publishes the page — never by
  a user.

  WHAT THIS FILE DOES AND DOES NOT DO
  -----------------------------------
  It renders. Every figure it shows was computed by the server, including
  the date every age is measured against: there is no `new Date()` here
  driving anything a person reads. It holds one thing in local storage —
  a signed session token — and nothing else.

  It has no external dependencies at all. The charts are inline SVG and
  the CSV parser is thirty lines below, so a blocked CDN cannot take out
  the bulk-upload path or leave a screen half-drawn.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C1319;
  --panel:#121B23;
  --panel-2:#0E161D;
  --border:#22303B;
  --border-soft:#1A2530;
  --text:#E7EDF2;
  --text-dim:#8CA0AC;
  --text-faint:#5C6C77;
  --flow:#2FBEB0;
  --flow-dim:#1D5C56;
  --amber:#E3A23D;
  --amber-dim:#5A4321;
  --red:#E0654F;
  --red-dim:#4A2620;
  --green:#5FBE7C;
  --font-display:'Space Grotesk','Segoe UI',sans-serif;
  --font-body:'Inter','Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono','SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased;}
::selection{background:var(--flow-dim);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}

.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:230px;flex-shrink:0;background:var(--panel-2);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:0 20px 18px 20px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
.brand-mark{display:flex;align-items:center;gap:9px;}
.brand-dot{width:9px;height:9px;border-radius:2px;background:var(--flow);position:relative;flex-shrink:0;}
.brand-dot::after{content:'';position:absolute;inset:-4px;border:1px solid var(--flow-dim);border-radius:4px;}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:16.5px;letter-spacing:0.2px;}
.brand-name b{color:var(--flow);font-weight:700;}
.brand-sub{font-size:10.5px;color:var(--text-faint);margin-top:5px;letter-spacing:0.4px;text-transform:uppercase;}

.nav-group{margin-bottom:4px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);padding:14px 20px 6px 20px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--text-dim);
  font-size:13px;font-weight:500;border-left:2px solid transparent;transition:all .12s ease;
}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.02);}
.nav-item.active{color:var(--text);background:rgba(47,190,176,0.08);border-left:2px solid var(--flow);}
.nav-item .nav-badge{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);background:var(--panel);padding:1px 6px;border-radius:8px;border:1px solid var(--border-soft);}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
  border-bottom:1px solid var(--border-soft);background:rgba(12,19,25,0.85);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:20;
}
.topbar-title{font-family:var(--font-display);font-size:15px;font-weight:600;}
.topbar-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:14px;}

.whoami{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 10px 5px 8px;}
.whoami-avatar{width:26px;height:26px;border-radius:6px;background:var(--flow-dim);color:#EAFBF8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.whoami-name{font-size:12px;font-weight:600;line-height:1.25;}
.whoami-role{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;}
.link-btn{background:none;border:none;color:var(--text-faint);font-family:var(--font-body);font-size:11.5px;cursor:pointer;padding:0;text-decoration:underline;}
.link-btn:hover{color:var(--text);}

.serverdate{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);border:1px solid var(--border-soft);border-radius:6px;padding:5px 9px;}
.serverdate b{color:var(--text-dim);font-weight:500;}

.content{padding:26px 28px 60px 28px;max-width:1400px;}

h1.page-h{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0 0 4px 0;}
p.page-sub{color:var(--text-dim);font-size:13px;margin:0 0 22px 0;max-width:760px;line-height:1.5;}

.banner{
  display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);
  border-left:3px solid var(--amber);border-radius:8px;padding:12px 14px;margin-bottom:20px;font-size:12.5px;color:var(--text-dim);
}
.banner b{color:var(--text);}
.banner.info{border-left-color:var(--flow);}
.banner.bad{border-left-color:var(--red);}
.banner.good{border-left-color:var(--green);}

/* ---------- Cards / KPIs ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:var(--kpi-accent,var(--flow));}
.kpi-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.kpi-value{font-family:var(--font-mono);font-size:24px;font-weight:600;color:var(--text);}
.kpi-value small{font-size:13px;color:var(--text-dim);font-weight:400;}
.kpi-delta{font-size:11px;color:var(--text-faint);margin-top:6px;}

.panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:20px;margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:14px;flex-wrap:wrap;}
.panel-title{font-family:var(--font-display);font-size:14.5px;font-weight:600;}
.panel-title span{color:var(--text-faint);font-weight:400;font-size:12px;margin-left:8px;}

.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}

/* ---------- Flow diagram ---------- */
.flow-wrap{display:flex;align-items:stretch;gap:0;margin:6px 0 4px 0;}
.flow-node{
  flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:16px;
  text-align:center;position:relative;
}
.flow-node .fn-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.flow-node .fn-value{font-family:var(--font-mono);font-size:22px;font-weight:600;}
.flow-node .fn-sub{font-size:11px;color:var(--text-dim);margin-top:4px;}
.flow-arrow{width:46px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-faint);}
.flow-node.backlog{border-color:var(--border);}
.flow-node.backlog .fn-value{color:var(--text-dim);}
.flow-node.git{border-color:var(--amber-dim);}
.flow-node.git .fn-value{color:var(--amber);}
.flow-node.mw{border-color:var(--flow-dim);}
.flow-node.mw .fn-value{color:var(--flow);}
.flow-node.sold{border-color:#2B3B34;}
.flow-node.sold .fn-value{color:var(--green);}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border-soft);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{
  background:var(--panel-2);color:var(--text-faint);text-transform:uppercase;font-size:10px;letter-spacing:.5px;
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;
}
thead th.sortable{cursor:pointer;user-select:none;}
thead th.sortable:hover{color:var(--text-dim);}
thead th .sort-caret{color:var(--flow);margin-left:4px;}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border-soft);color:var(--text);white-space:nowrap;}
tbody tr:hover{background:rgba(255,255,255,0.015);}
tbody tr:last-child td{border-bottom:none;}
tbody tr.voided td{opacity:.45;text-decoration:line-through;}
td.num,th.num{text-align:right;font-family:var(--font-mono);}
/* The description is the only column that can shrink, so in a wide table
   it gets squeezed to a sliver and wraps to six lines. Give it a floor
   and let the wrapper scroll horizontally instead. */
td.wrap{white-space:normal;min-width:170px;max-width:300px;color:var(--text-dim);line-height:1.4;}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text-dim);}
.tag.cat-Laptops{border-color:#2A4A6B;color:#7EB3E8;}
.tag.cat-Desktops{border-color:#5A3F1F;color:#E3A23D;}
.tag.cat-All-in-One{border-color:#3F2A5A;color:#B18CE8;}
.tag.cat-Monitors{border-color:#1F5A4A;color:#5FE0BE;}
.tag.cat-Accessories{border-color:#4A2A3F;color:#E88CAF;}
.flag-icon{color:var(--red);font-weight:700;cursor:help;}
.flag-icon.resolved{color:var(--green);}
.type-pill{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
.type-Purchase{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border);}
.type-Opening{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border);}
.type-Ship{background:var(--amber-dim);color:#F5C778;}
.type-Receive{background:var(--flow-dim);color:#8DEBE0;}
.type-Sale{background:#2B3B22;color:#A6D97E;}
.type-Transfer{background:#23324A;color:#9EC1F0;}
.type-Reversal{background:#3B2222;color:#E89C9C;}
.unknown{color:var(--text-faint);font-style:italic;}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;margin-bottom:16px;}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.field label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;}
select,input[type=text],input[type=number],input[type=date],input[type=email],textarea{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;
  padding:8px 10px;font-size:12.5px;font-family:var(--font-body);outline:none;width:100%;
}
textarea{font-family:var(--font-mono);font-size:12px;resize:vertical;}

/* ---------- Child items on a transaction ----------
   Indented and rule-marked on the left so a child reads as belonging to
   the movement above it rather than as another movement in its own
   right. It IS its own movement in the ledger — but on the form, what
   matters is that nobody posts an accessory thinking it is a laptop. */
.child-block{border:1px solid var(--border-soft);border-left:3px solid var(--flow);
  border-radius:8px;padding:12px 14px 2px 14px;margin:0 0 10px 22px;background:var(--panel-2);}
.child-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.child-head .child-n{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  color:var(--flow);}
.child-head .child-of{font-size:11.5px;color:var(--text-faint);}
.child-head .child-drop{margin-left:auto;}
.child-block .form-grid{margin-bottom:8px;}
select:focus,input:focus,textarea:focus{border-color:var(--flow);}
input::placeholder,textarea::placeholder{color:var(--text-faint);}
input:disabled,select:disabled,textarea:disabled{opacity:.5;cursor:not-allowed;}
.btn{
  font-family:var(--font-body);font-weight:600;font-size:12.5px;padding:9px 16px;border-radius:7px;
  border:1px solid var(--flow-dim);background:var(--flow-dim);color:#EAFBF8;cursor:pointer;transition:all .12s ease;
}
.btn:hover:not(:disabled){background:#236B63;}
.btn.secondary{background:transparent;border-color:var(--border);color:var(--text-dim);}
.btn.secondary:hover:not(:disabled){color:var(--text);border-color:var(--text-faint);}
.btn.danger{background:var(--red-dim);border-color:var(--red-dim);color:#FFD9D2;}
.btn.danger:hover:not(:disabled){background:#6A362C;}
.btn.sm{padding:5px 10px;font-size:11.5px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

.locked-note{
  display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px dashed var(--border);
  border-radius:8px;padding:14px 16px;color:var(--text-faint);font-size:12px;margin-bottom:16px;
}

/* ---------- Filters & pagination ---------- */
.filter-bar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:var(--panel-2);
  border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;margin-bottom:14px;
}
.filter-bar .field{flex:1 1 150px;}
.filter-bar .field.narrow{flex:0 0 130px;}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap;}
.pager-info{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}
.pager-btns{display:flex;gap:6px;align-items:center;}

/* ---------- Simulator ---------- */
.sim-row{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.sim-row label{width:150px;font-size:12px;color:var(--text-dim);flex-shrink:0;}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:var(--flow);cursor:pointer;border:2px solid #0C1319;}
.sim-val{font-family:var(--font-mono);font-weight:600;color:var(--flow);width:60px;text-align:right;flex-shrink:0;}
.sim-val.inherit{color:var(--text-faint);font-weight:400;}

.chart-box{position:relative;}
.split-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.footer-note{color:var(--text-faint);font-size:11px;text-align:center;padding:30px 0 10px 0;}

/* ---------- Brand switcher ---------- */
.brand-switch{
  margin:0 20px 16px 20px;padding:10px 12px;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  gap:8px;transition:border-color .12s ease;
}
.brand-switch:hover{border-color:var(--flow-dim);}
.brand-switch-label{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.brand-switch-value{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-switch-value small{color:var(--text-faint);font-weight:400;}
.brand-switch-chevron{color:var(--text-faint);font-size:11px;flex-shrink:0;}
.bu-group{margin-bottom:16px;}
.bu-group-name{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.brand-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.brand-chip{
  display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel-2);font-size:12.5px;color:var(--text-dim);cursor:pointer;transition:all .12s ease;
}
.brand-chip.locked{opacity:0.55;cursor:not-allowed;}
.brand-chip.locked:hover{border-color:var(--border);}
.brand-chip.active{background:var(--flow-dim);border-color:var(--flow);color:#EAFBF8;font-weight:600;cursor:default;}
.brand-chip:not(.locked):not(.active):hover{border-color:var(--text-faint);color:var(--text);}
.chip-tag{font-size:9px;padding:1px 6px;border-radius:10px;background:var(--panel);color:var(--text-faint);border:1px solid var(--border);}
.chip-tag.live{background:var(--flow-dim);color:#EAFBF8;border-color:var(--flow-dim);}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(5,9,12,0.7);backdrop-filter:blur(2px);z-index:200;
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s ease;
}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;width:640px;max-width:92vw;
  max-height:84vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.modal-box.wide{width:900px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:12px;}
.modal-title{font-family:var(--font-display);font-size:16px;font-weight:600;}
.modal-close{color:var(--text-faint);cursor:pointer;font-size:20px;line-height:1;background:none;border:none;}
.modal-sub{font-size:12px;color:var(--text-dim);margin-bottom:18px;line-height:1.5;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

.toast{
  position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--flow-dim);border-left:3px solid var(--flow);
  padding:12px 16px;border-radius:8px;font-size:12.5px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.4);
  opacity:0;transform:translateY(8px);transition:all .25s ease;pointer-events:none;z-index:300;max-width:380px;
}
.toast.show{opacity:1;transform:translateY(0);}
.toast.err{border-color:var(--red-dim);border-left-color:var(--red);}

.empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:12.5px;}
.badge-count{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

/* ---------- Sign-in ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{width:420px;max-width:100%;background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;padding:30px;}
.auth-brand{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.auth-sub{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:22px;}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.auth-code{font-family:var(--font-mono);font-size:24px;letter-spacing:10px;text-align:center;padding:12px;}
.auth-msg{font-size:12px;padding:10px 12px;border-radius:7px;margin-bottom:14px;line-height:1.5;}
.auth-msg.err{background:rgba(224,101,79,.10);border:1px solid var(--red-dim);color:#F0AFA2;}
.auth-msg.info{background:rgba(47,190,176,.08);border:1px solid var(--flow-dim);color:#9FE3DA;}
.auth-foot{margin-top:16px;font-size:11.5px;color:var(--text-faint);display:flex;justify-content:space-between;gap:10px;}

.diag{
  font-family:var(--font-mono);font-size:11px;white-space:pre-wrap;background:var(--panel-2);
  border:1px solid var(--border-soft);border-radius:8px;padding:12px;max-height:340px;overflow:auto;color:var(--text-dim);
}
.stale-strip{
  background:var(--amber-dim);color:#F5C778;padding:8px 28px;font-size:12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}

@media (max-width:980px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:12px;gap:8px;align-items:center;}
  .brand{border-bottom:none;margin-bottom:0;padding:0 8px 0 8px;}
  .nav-group{display:flex;flex-wrap:wrap;align-items:center;}
  .nav-label{display:none;}
  .nav-item{border-left:none;border-bottom:2px solid transparent;padding:7px 11px;}
  .nav-item.active{border-left:none;border-bottom:2px solid var(--flow);}
  .content{padding:18px 14px 50px 14px;}
  .kpi-grid,.grid-2,.split-2{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr 1fr;}
  .topbar{padding:12px 14px;flex-wrap:wrap;gap:10px;}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURATION — the only thing anyone ever sets
   ============================================================ */

/* Paste the Apps Script Web App /exec URL here when you publish this
   file. Deploy → Manage deployments → copy the Web app URL.
   Nothing else in Stockflow is configurable, by design: a user should
   never be asked to point the app at anything. */
const STOCKFLOW_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyOBWe8HQuJsynAJ4RexjNaPymlL6E8GMgBA-kc5Jx6P_6yWVQb3zOm4uhohRB06AFo/exec';

/* Bump this whenever this file changes. Shown on the Access & Roles
   screen next to the server's own build, and in the connection check.

   The reason it exists: a fix can be deployed to the script and the page
   left stale — not re-uploaded, or re-uploaded and then served from the
   browser's cache — and the symptom is simply that the fix does not
   work. Without a visible build there is nothing to check, and the
   obvious conclusion is that the fix is broken. */
const STOCKFLOW_BUILD = "2026-09-06.1";

const SESSION_KEY = 'stockflow_session';
const EMAIL_KEY = 'stockflow_last_email';

function backendUrl(){ return String(STOCKFLOW_BACKEND_URL || '').trim(); }

/* ============================================================
   TRANSPORT
   ------------------------------------------------------------
   An /exec POST is two hops. The script runs at script.google.com,
   which 302-redirects to script.googleusercontent.com carrying a
   SINGLE-USE content key, and the reply is served from there.
   fetch follows the redirect by itself, but the two hops fail
   differently and it matters a great deal which one did:

     · fetch throws  → the host was never reached. Nothing ran.
     · a 404 comes back → something answered and rejected the key.
       Anything that pre-fetches or follows redirects — a proxy, a
       web filter, a security scanner — spends that one-use key
       first, so the browser then finds it already used.
       THE SCRIPT ALREADY RAN.

   So: reads retry automatically, writes never do, and a write whose
   reply was lost is reported as "this probably succeeded" rather
   than as a failure. For a stock ledger that distinction is the
   difference between a shipment recorded once and recorded twice.
   ============================================================ */

const RETRYABLE_ACTIONS = {
  getBootstrap: true, getRevision: true, getLoginContext: true,
  getLedger: true, getAudit: true, getItemDetail: true, getImportBatches: true,
  getDashboard: true
};

/* Set once any call has succeeded. After that we know the deployment
   exists, so a later 404 is a transport failure rather than a wrong
   URL — and the two need very different advice. */
let backendProvenAlive = false;

function sessionToken(){
  try{ return localStorage.getItem(SESSION_KEY) || ''; }catch(e){ return ''; }
}
function setSessionToken(token){
  try{
    if(token) localStorage.setItem(SESSION_KEY, token);
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){ /* private browsing; the session lasts this tab only */ }
}

async function rpc(action, payload){
  const url = backendUrl();
  if(!url){
    throw new Error('This copy of Stockflow has not been pointed at a Google Sheet yet. ' +
      'Whoever published it needs to set STOCKFLOW_BACKEND_URL near the top of stockflow.html.');
  }
  const attempts = RETRYABLE_ACTIONS[action] ? 2 : 1;
  let lastError = null;
  for(let attempt = 1; attempt <= attempts; attempt++){
    try{
      return await rpcOnce(action, payload, url);
    }catch(err){
      lastError = err;
      /* Only a transport failure is worth repeating; an application
         error would come back the same way every time. And a WRITE is
         never repeated, whatever went wrong — see the header above. */
      if(!err.transport || attempt === attempts) throw err;
      await new Promise(function(resolve){ setTimeout(resolve, 700 * attempt); });
    }
  }
  throw lastError;
}

async function rpcOnce(action, payload, url){
  let res;
  try{
    res = await fetch(url, {
      method: 'POST',
      /* text/plain, not application/json. An application/json
         cross-origin POST triggers a CORS preflight, and an Apps Script
         Web App cannot answer one. The server parses the body itself. */
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action: action, payload: payload, sessionToken: sessionToken()}),
      redirect: 'follow'
    });
  }catch(err){
    const e = new Error('Could not reach the Stockflow backend. Check your internet connection, ' +
      'and that the Web App is deployed with "Who has access" set to Anyone.');
    e.transport = true;
    e.neverRan = true;   /* fetch threw: the request did not arrive */
    throw e;
  }

  if(!res.ok){
    if(res.status === 404 && backendProvenAlive){
      const e = new Error('Google did not return the reply, though the request itself went through.');
      e.transport = true;
      e.replyLost = true;   /* the script ran; the reply was not delivered */
      throw e;
    }
    if(res.status === 404){
      const e = new Error('Nothing is deployed at the address this page is pointed at, so the Google ' +
        'Sheet backend cannot be reached. Copy the current Web app URL from the Apps Script editor ' +
        '(Deploy → Manage deployments) and set STOCKFLOW_BACKEND_URL in stockflow.html to match.');
      e.transport = true;
      e.neverRan = true;
      throw e;
    }
    const e = new Error('The backend returned HTTP ' + res.status + '. Re-deploy the Web App and try again.');
    if(res.status >= 500){ e.transport = true; e.replyLost = true; }
    throw e;
  }

  const text = await res.text();
  let data;
  try{
    data = JSON.parse(text);
  }catch(err){
    throw new Error('The backend replied with a sign-in page instead of data. ' +
      'Re-deploy the Web App with "Execute as: Me" and "Who has access: Anyone".');
  }

  backendProvenAlive = true;

  if(data.error){
    if(data.error === 'SESSION_REQUIRED' || data.error === 'SESSION_INVALID' || data.error === 'SESSION_EXPIRED'){
      const message = data.error === 'SESSION_EXPIRED'
        ? 'Your session has expired. Sign in again to carry on.'
        : 'Please sign in again.';
      onSessionLost(message);
      const e = new Error(message);
      e.sessionInvalid = true;
      throw e;
    }
    /* An internal fault is labelled by the server so it is never
       reported to the user as though their file was malformed. */
    if(String(data.error).indexOf('STOCKFLOW_INTERNAL') === 0){
      const e = new Error(String(data.error).replace('STOCKFLOW_INTERNAL: ', ''));
      e.internal = true;
      throw e;
    }
    throw new Error(data.error);
  }
  return data.result;
}

/* Wraps a write. The rule is in the message it produces: if the reply
   was lost, the work probably SUCCEEDED, and saying otherwise invites
   someone to post the same shipment twice. */
async function mutate(action, payload){
  try{
    const result = await rpc(action, payload);
    return result;
  }catch(err){
    if(err.replyLost){
      const e = new Error('Stockflow did not get a reply, but the request did reach the server, ' +
        'so this change has PROBABLY been saved. Do not post it again — reload and check the ' +
        'ledger first. Posting a shipment twice double-counts the stock.');
      e.probablySucceeded = true;
      throw e;
    }
    throw err;
  }
}

/* ---------------- Connection check ----------------
   Probes both hops and interprets the result, so a network team is
   handed evidence rather than a guess. */
async function connectionCheck(){
  const url = backendUrl();
  const lines = [
    'Stockflow connection check',
    'When    : ' + new Date().toISOString(),
    'Page    : ' + (typeof location !== 'undefined' ? location.origin : '(unknown)'),
    'Backend : ' + (url || '(not set)'),
    'Page build : ' + STOCKFLOW_BUILD,
    ''
  ];
  if(!url){
    lines.push('No backend URL is configured, so there is nothing to test.');
    lines.push('Whoever published this page needs to set STOCKFLOW_BACKEND_URL in stockflow.html.');
    return lines;
  }

  const probe = async function(label, init){
    const started = Date.now();
    try{
      const res = await fetch(url, init);
      const took = Date.now() - started;
      const body = await res.text();
      let shape;
      try{
        const parsed = JSON.parse(body);
        shape = (parsed.result && parsed.result.app === 'stockflow')
          ? 'Stockflow JSON, script build ' + (parsed.result.build || 'not reported')
          : (parsed.error ? 'JSON error: ' + parsed.error : 'JSON, unrecognised');
      }catch(e){
        shape = /<html|<!doctype/i.test(body) ? 'an HTML page (usually a Google sign-in)' : 'not JSON';
      }
      lines.push(label + ': HTTP ' + res.status + ' in ' + took + 'ms');
      lines.push('        replied from : ' + (res.url || '(not reported)'));
      lines.push('        body         : ' + shape);
      return {status: res.status, finalUrl: res.url || '', shape: shape};
    }catch(err){
      lines.push(label + ': could not connect (' + (Date.now() - started) + 'ms)');
      lines.push('        ' + String(err.message || err));
      return {status: 0, finalUrl: '', shape: 'no reply'};
    }
  };

  const get = await probe('GET   ', {method: 'GET', redirect: 'follow'});
  lines.push('');
  const post = await probe('POST  ', {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action: 'getLoginContext'}),
    redirect: 'follow'
  });

  lines.push('');
  lines.push('What this means:');
  const reachedContentHost = (get.finalUrl + post.finalUrl).indexOf('googleusercontent') >= 0;

  if(post.shape.indexOf('JSON') >= 0){
    lines.push('  The backend is reachable from this device and answering normally.');
  }else if(post.status === 0 && get.status === 0){
    lines.push('  Nothing answered at all — this device is offline, or script.google.com is blocked.');
  }else if(post.status === 404 || get.status === 404){
    lines.push('  Something answered but rejected the one-time key in Google\'s redirect.');
    lines.push('  That key is good for a single request. Anything on this network that follows or');
    lines.push('  pre-fetches redirects — a proxy, web filter, or security scanner — spends it first,');
    lines.push('  so the browser then finds it used. Note this also means the script DID run.');
    lines.push('  Decisive test: load this page on a phone hotspot. If it works there, it is the network.');
  }else if(post.shape.indexOf('HTML') >= 0){
    lines.push('  A Google sign-in page came back instead of data. Re-deploy the Web App with');
    lines.push('  "Execute as: Me" and "Who has access: Anyone".');
  }else{
    lines.push('  Unexpected reply — the HTTP status above is the thing to look into.');
  }
  if(!reachedContentHost && post.status !== 0){
    lines.push('  Note: nothing replied from script.googleusercontent.com. Apps Script always serves');
    lines.push('  replies from there, so it looks like that host was never reached.');
  }

  lines.push('');
  lines.push('Both hosts must be reachable AND exempt from redirect pre-fetching / inspection:');
  lines.push('  script.google.com');
  lines.push('  script.googleusercontent.com');
  return lines;
}

/* Turns a failure into the specific thing that is wrong and the
   specific thing that fixes it. A generic "something went wrong" costs
   a support call every time. */
function diagnose(err){
  const text = String((err && err.message) || err);
  if(err && err.internal){
    return {title: 'Stockflow hit an internal error', detail: text +
      '\n\nThis is a fault in Stockflow, not a problem with anything you did or any file you uploaded.'};
  }
  if(err && err.probablySucceeded){
    return {title: 'The reply was lost — but the change probably went through', detail: text};
  }
  if(/has not been pointed at a Google Sheet/.test(text)){
    return {title: 'This page has no backend configured', detail: text};
  }
  if(/Nothing is deployed at the address/.test(text)){
    return {title: 'The deployment address is wrong or the deployment was replaced', detail: text +
      '\n\nA NEW deployment gets a NEW URL. If someone chose "New deployment" instead of ' +
      '"Manage deployments → edit → New version", this page is pointing at the old one.'};
  }
  if(/sign-in page instead of data/.test(text)){
    return {title: 'The Web App is not open to anonymous callers', detail: text};
  }
  if(/Could not reach the Stockflow backend/.test(text)){
    return {title: 'The backend could not be reached', detail: text +
      '\n\nRun the connection check to find out which of the two hops failed.'};
  }
  if(/Missing tab:/.test(text)){
    return {title: 'The Google Sheet is missing a tab', detail: text +
      '\n\nOpen the Apps Script editor and run setupStockflow() once.'};
  }
  if(/is busy saving someone/.test(text)){
    return {title: 'Someone else is saving right now', detail: text};
  }
  return {title: 'That did not work', detail: text};
}
</script>

    git:      {page: 1, search: '', category: '', sortBy: 'gitOldestAge', sortDir: 'desc'},
    mainwh:   {page: 1, search: '', category: '', location: '', sortBy: 'mwOldestAge', sortDir: 'desc'},

  },
  /* Shared by Overview and Analytics: one filter, so switching between
     the two screens does not silently change the period being read. */
  activity: {from: '', to: '', item: '', type: '', businessType: '', stage: '', partner: '',
             data: null, position: null, loading: false},
  bulk: {rows: [], preview: null, busy: false, error: null, skipInvalid: true,
         allowRepeats: false,
         ignored: null, fileName: null, delimiter: null, lastBatchId: null,
         rawText: null, dateOrder: null, dateInfo: null, createMissingItems: null},
  itemImport: {open: false, rows: [], preview: null, busy: false, error: null, skipInvalid: true},

  /* Child items on the transaction currently being typed — a laptop's

  txnChildren: [],
  txnRef: ''
};

const PAGE_SIZE = 25;

/* ============================================================
   FORMATTING
   ------------------------------------------------------------
   The prototype rendered NaN as "$0.00", "0" and "0.0%", so a
   broken cost looked like free stock and a broken date looked
   like the newest stock in the building. Nothing here invents a
   number it does not have — it says so instead.
   ============================================================ */
function isNum(n){ return n !== null && n !== undefined && n !== '' && isFinite(Number(n)); }

function fmtMoney(n){
  if(!isNum(n)) return '<span class="unknown">—</span>';
  return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtMoney0(n){
  if(!isNum(n)) return '<span class="unknown">—</span>';
  return '$' + Math.round(Number(n)).toLocaleString('en-US');
}
function fmtNum(n){
  if(!isNum(n)) return '<span class="unknown">—</span>';
  const v = Number(n);
  return (Math.abs(v - Math.round(v)) < 0.0001 ? Math.round(v) : Math.round(v * 100) / 100)
    .toLocaleString('en-US');
}
function fmtPct(n){
  if(!isNum(n)) return '<span class="unknown">—</span>';
  return (Number(n) * 100).toFixed(1) + '%';
}
/* Chart labels have to fit above a bar, so thousands are abbreviated. */
function money0k(n){
  const v = Math.round(Number(n) || 0);
  if(Math.abs(v) >= 1000000) return '$' + (v / 1000000).toFixed(v >= 10000000 ? 0 : 1) + 'm';
  if(Math.abs(v) >= 1000) return '$' + Math.round(v / 1000) + 'k';
  return '$' + v;
}

/* fmtNum returns markup for an unknown value, which is right in a table
   cell and wrong inside textContent. */
function fmtNumPlain(n){
  if(!isNum(n)) return '—';
  const v = Number(n);
  return (Math.abs(v - Math.round(v)) < 0.0001 ? Math.round(v) : Math.round(v * 100) / 100)
    .toLocaleString('en-US');
}

function fmtDays(n){
  if(!isNum(n)) return '<span class="unknown">—</span>';
  return String(Math.round(Number(n)));
}
function fmtDateTime(iso){
  if(!iso) return '';
  const s = String(iso);
  return s.slice(0, 10) + ' ' + s.slice(11, 16);
}
function initials(name){
  return String(name || '?').trim().split(/\s+/).slice(0, 2)
    .map(function(p){ return p.charAt(0).toUpperCase(); }).join('') || '?';
}

/* Everything that reaches innerHTML goes through this. The prototype
   interpolated item names, references and notes raw; harmless with
   static embedded data, but the moment those strings come from a shared
   Sheet that other people write to, a stray angle bracket reparents the
   table and a deliberate one is worse. */
function esc(str){
  return String(str === null || str === undefined ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function attr(str){ return esc(str); }

function catTag(cat){
  return '<span class="tag cat-' + esc(String(cat || '').replace(/\s+/g, '-')) + '">' + esc(cat) + '</span>';
}
function typePill(type){
  const cls = {
    'Opening Balance-MainWH': 'type-Opening', 'Purchase-Backlog': 'type-Purchase',
    'Ship-to-GIT': 'type-Ship', 'Receive-to-MainWH': 'type-Receive',
    'Sale-from-GIT': 'type-Sale', 'Sale-from-MainWH': 'type-Sale',
    'Transfer-MainWH': 'type-Transfer', 'Reversal': 'type-Reversal'
  }[type] || '';
  return '<span class="type-pill ' + cls + '">' + esc(type) + '</span>';
}

/* Buckets come from the server so the charts and the status columns can
   never drift apart again — the prototype bucketed at 30/60/90 and then
   coloured the GIT status column at 45/90. */
function ageBucketLabels(){
  const b = (STATE.data && STATE.data.ageBuckets) || [30, 60, 90];
  return ['0–' + b[0] + ' days', (b[0] + 1) + '–' + b[1] + ' days', (b[1] + 1) + '–' + b[2] + ' days', b[2] + '+ days'];
}
function ageBucket(days){
  const b = (STATE.data && STATE.data.ageBuckets) || [30, 60, 90];
  const labels = ageBucketLabels();
  if(!isNum(days)) return null;
  if(days <= b[0]) return labels[0];
  if(days <= b[1]) return labels[1];
  if(days <= b[2]) return labels[2];
  return labels[3];
}
function ageColour(days){
  const b = (STATE.data && STATE.data.ageBuckets) || [30, 60, 90];
  if(!isNum(days)) return 'var(--text-faint)';
  if(days > b[2]) return 'var(--red)';
  if(days > b[1]) return 'var(--amber)';
  return 'var(--text)';
}

/* ============================================================
   CSV — thirty lines instead of a CDN
   ------------------------------------------------------------
   Handles quoted fields, embedded commas, embedded newlines and
   doubled quotes. Written out rather than pulled from a CDN so a
   blocked script cannot take out the entire bulk-upload path, and
   so a malformed file produces our error rather than a library's.
   ============================================================ */
/* Which character separates the fields.

   Copying a block of cells out of Excel puts TAB-separated text on the
   clipboard, and this panel invites exactly that — "or paste rows below".
   Excel on a European locale writes semicolons into a .csv. Assuming a
   comma meant both of those failed with "required columns are missing",
   which is true but tells you nothing about why.

   Decided on the header line only: it is the one row guaranteed to have
   no free text in it, so counting separators there cannot be thrown off
   by a comma inside a product description. */
function detectDelimiter(text){
  const firstLine = String(text || '').replace(/^\uFEFF/, '').split(/\r\n|\r|\n/)[0] || '';
  const counts = [
    {ch: ',', n: (firstLine.match(/,/g) || []).length},
    {ch: '\t', n: (firstLine.match(/\t/g) || []).length},
    {ch: ';', n: (firstLine.match(/;/g) || []).length}
  ].sort(function(a, b){ return b.n - a.n; });
  return counts[0].n > 0 ? counts[0].ch : ',';
}

function delimiterName(ch){
  return ch === '\t' ? 'tab-separated (as copied out of Excel)'
    : ch === ';' ? 'semicolon-separated' : 'comma-separated';
}

function parseCsv(text, delimiter){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  /* A UTF-8 byte-order mark is what Excel puts at the front of every CSV
     it saves. Left in place it becomes part of the first header name. */
  const src = String(text || '').replace(/^\uFEFF/, '')
    .replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const sep = delimiter || detectDelimiter(src);
  for(let i = 0; i < src.length; i++){
    const ch = src[i];
    if(inQuotes){
      if(ch === '"'){
        if(src[i + 1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      }else field += ch;
    }else if(ch === '"'){
      inQuotes = true;
    }else if(ch === sep){
      row.push(field); field = '';
    }else if(ch === '\n'){
      row.push(field); field = '';
      rows.push(row); row = [];
    }else field += ch;
  }
  row.push(field);
  rows.push(row);
  /* Drop trailing blank lines, but never a row that merely has empty
     cells — that is a data error the preview should show, not hide. */
  while(rows.length && rows[rows.length - 1].every(function(c){ return String(c).trim() === ''; })) rows.pop();
  return rows;
}

/* Header spellings people actually type, mapped to the field names the

  name: 'name', description: 'name', productname: 'name', product: 'name', productdescription: 'name',
  category: 'category', productcategory: 'category', brand: 'brand', b2b: 'b2b',
  location: 'location', warehouse: 'location', wh: 'location',
  fromlocation: 'location', fromwarehouse: 'location', from: 'location',
  tolocation: 'toLocation', towarehouse: 'toLocation', destination: 'toLocation',
  moveto: 'toLocation', to: 'toLocation',
  ref: 'ref', reference: 'ref', remark: 'ref', remarks: 'ref',
  po: 'ref', ponumber: 'ref', invoice: 'ref', invoiceno: 'ref',

  txnref: 'txnRef', transactionref: 'txnRef', transactionreference: 'txnRef',
  txref: 'txnRef', groupref: 'txnRef', transactiongroup: 'txnRef',
  bundle: 'txnRef', bundleref: 'txnRef',
  parentitem: 'parentItem', parent: 'parentItem', parentpart: 'parentItem',
  parentpartnumber: 'parentItem', parentitemnumber: 'parentItem',
  parentsku: 'parentItem', parentcode: 'parentItem', childof: 'parentItem',
  /* The B2B partner or reseller. "customer" is deliberately included:
     on a sale that is what people call the same column. */
  partner: 'partner', partnername: 'partner', b2bpartner: 'partner',
  reseller: 'partner', dealer: 'partner', customer: 'partner',
  customername: 'partner', account: 'partner', accountname: 'partner',
  /* The business the movement belongs to — B2B or run-rate. The other
     half of what a type code like "…B2B-MainWH" used to say on its own;
     the stage half is derived from the type's behaviour and so is never
     a column. */
  businesstype: 'businessType', business: 'businessType',
  businessline: 'businessType', book: 'businessType',
  b2borrunrate: 'businessType', channel: 'businessType',
  /* No longer in the template — a sale row does not have to carry one.
     Still read if a file includes it, because it is what makes achieved
     margin reportable. */
  sellprice: 'sellPrice', sellingprice: 'sellPrice', unitsellingprice: 'sellPrice',
  saleprice: 'sellPrice',
  notes: 'notes', note: 'notes', comment: 'notes', comments: 'notes'
};

function normaliseHeader(h){
  return String(h || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

/* Turns parsed rows into objects keyed by the field names the server
   reads, so "Date", "date", " DATE " and "Transaction Date" all work —
   and so do "toLocation", "To Location" and "Destination". */
/* Everything an upload can carry. Anything else in the file is ignored
   and reported as ignored. */
const KNOWN_CSV_FIELDS = ['date', 'item', 'name', 'category', 'brand', 'b2b', 'type', 'qty',
  'fob', 'location', 'toLocation', 'ref', 'sellPrice', 'notes', 'txnRef', 'parentItem',
  'partner', 'businessType'];

function csvToObjects(text){
  const delimiter = detectDelimiter(text);
  const rows = parseCsv(text, delimiter);
  if(!rows.length) return {headers: [], rows: [], error: 'The file is empty.'};

  const raw = rows[0].map(normaliseHeader);
  const fields = raw.map(function(h){ return CSV_FIELD_ALIASES[h] || h; });
  const required = ['date', 'item', 'type', 'qty'];
  const missing = required.filter(function(r){ return fields.indexOf(r) < 0; });
  if(missing.length){
    return {headers: fields, rows: [], delimiter: delimiter,
      error: 'The first line must be a header row. ' +
      'These required columns are missing: ' + missing.join(', ') + '. Found: ' +
      (rows[0].map(function(h){ return String(h).trim(); }).filter(Boolean).join(', ') || '(nothing)') +
      '. Download the template to get the right shape.'};
  }
  const unknown = fields.filter(function(f, i){
    return raw[i] && KNOWN_CSV_FIELDS.indexOf(f) < 0;
  });

  /* TWO COLUMNS THAT MEAN THE SAME THING.

     "Type" and "Movement Type" both mean type; "Remark" and "Reference"
     both mean ref. Reading them in order let the second silently
     overwrite the first, so a file could show one movement type in the
     column a person was looking at and import an entirely different one
     from a column they had forgotten was there. That is not a warning —
     the file is ambiguous and there is no honest way to pick. */
  const collisions = [];
  const firstAt = {};
  fields.forEach(function(f, i){
    if(!raw[i]) return;                      // an unnamed trailing column
    if(KNOWN_CSV_FIELDS.indexOf(f) < 0) return;   // extras are ignored anyway
    if(firstAt[f] === undefined){ firstAt[f] = i; return; }
    collisions.push({
      field: f,
      headers: [String(rows[0][firstAt[f]]).trim(), String(rows[0][i]).trim()]
    });
  });
  if(collisions.length){
    return {headers: fields, rows: [], delimiter: delimiter,
      error: 'Two columns mean the same thing, so it is not clear which to use: ' +
        collisions.map(function(c){
          return '"' + c.headers[0] + '" and "' + c.headers[1] + '" both mean ' + c.field;
        }).join('; ') + '. Rename or remove one of each pair and try again.'};
  }

  const out = rows.slice(1)
    .filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); })
    .map(function(r){
      const obj = {};
      fields.forEach(function(f, i){ obj[f] = (r[i] === undefined ? '' : String(r[i]).trim()); });
      return obj;
    });
  return {headers: fields, rows: out, error: null, delimiter: delimiter,
    ignoredColumns: unknown.length ? unknown : null};
}

/* ============================================================
   DATES AS A SPREADSHEET WRITES THEM
   ------------------------------------------------------------
   Excel rewrites a date column the moment the file is opened, so
   "2026-08-25" comes back as "25/08/2026" and there is nothing
   the person typing can do about it after the fact. Refusing the
   file and telling them to reformat the column was correct and
   useless: it happens on every file, to everyone.

   So the import reads them — but never by guessing. The order is
   settled from the FILE, not from a single date:

     · any date with a first part above 12  → day/month, certain
     · any date with a second part above 12 → month/day, certain
     · both                                  → the file contradicts
                                                itself; refused
     · neither                               → genuinely ambiguous,
                                                so the configured
                                                default is used and
                                                the preview says so

   Whatever is decided, the preview states it in words before
   anything is imported, and it can be flipped. The SERVER never
   relaxes: only YYYY-MM-DD ever reaches the ledger, so a stored
   date is never open to interpretation. */
const ISO_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const LOCAL_DATE_RE = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/;

function inspectDates(rows){
  let count = 0, firstOver12 = false, secondOver12 = false, sample = null;
  rows.forEach(function(r){
    const v = String((r && r.date) || '').trim();
    if(!v || ISO_DATE_RE.test(v)) return;
    const m = v.match(LOCAL_DATE_RE);
    if(!m) return;
    count++;
    if(!sample) sample = v;
    if(Number(m[1]) > 12) firstOver12 = true;
    if(Number(m[2]) > 12) secondOver12 = true;
  });
  return {count: count, sample: sample, firstOver12: firstOver12, secondOver12: secondOver12};
}

function localDateToIso(value, order){
  const m = String(value || '').trim().match(LOCAL_DATE_RE);
  if(!m) return value;
  const a = Number(m[1]), b = Number(m[2]);
  const day = order === 'MDY' ? b : a;
  const month = order === 'MDY' ? a : b;
  let year = m[3];
  /* Two-digit years: 00-69 is this century, 70-99 the last. The usual
     convention, and a stock ledger will never legitimately carry 1970. */
  if(year.length === 2) year = (Number(year) <= 69 ? '20' : '19') + year;
  /* Deliberately not validated here — 31/02 becomes 2026-02-31 and the
     server refuses it as an impossible date, which is the right place
     for that to happen and the right message to get. */
  return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}

/* Returns the rows with every local-format date rewritten as ISO, plus
   what was decided and on what basis, so the preview can say it. */
function normaliseCsvDates(rows, preferred){
  const found = inspectDates(rows);
  const info = {
    count: found.count,
    sample: found.sample,
    order: preferred === 'MDY' ? 'MDY' : 'DMY',
    basis: 'none',
    conflict: false,
    example: null
  };
  if(!found.count) return {rows: rows, info: info};

  if(found.firstOver12 && found.secondOver12){
    info.conflict = true;
    return {rows: rows, info: info};
  }
  if(found.firstOver12){ info.order = 'DMY'; info.basis = 'evidence'; }
  else if(found.secondOver12){ info.order = 'MDY'; info.basis = 'evidence'; }
  else { info.basis = 'preference'; }

  const out = rows.map(function(r){
    const v = String((r && r.date) || '').trim();
    if(!v || ISO_DATE_RE.test(v) || !LOCAL_DATE_RE.test(v)) return r;
    return Object.assign({}, r, {date: localDateToIso(v, info.order)});
  });
  if(info.sample) info.example = localDateToIso(info.sample, info.order);
  return {rows: out, info: info};
}

function dateOrderLabel(order){
  return order === 'MDY' ? 'month/day/year' : 'day/month/year';
}

function toCsv(rows){
  return rows.map(function(row){
    return row.map(function(cell){
      const s = String(cell === null || cell === undefined ? '' : cell);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\n');
}

/* ============================================================
   CHARTS — no library, and no stretched text
   ------------------------------------------------------------
   The bars are HTML, not SVG. An SVG scaled to an unknown width
   with preserveAspectRatio="none" stretches its own labels
   horizontally, which is exactly what a chart must not do to the
   words on its axis. Divs size themselves and their text stays
   the size it was asked to be. The donut stays SVG because a
   circle has to keep its aspect ratio anyway.
   ============================================================ */
const CHART_COLOURS = ['#7EB3E8', '#E3A23D', '#B18CE8', '#5FE0BE', '#E88CAF', '#8CA0AC'];

function chartBar(labels, values, colours, opts){
  const o = opts || {};
  const fmt = o.fmt || function(v){ return String(v); };
  const max = Math.max.apply(null, values.map(Number).concat([0])) || 1;
  const h = o.px || 210;

  const bars = labels.map(function(label, i){
    const v = Number(values[i]) || 0;
    const pct = max > 0 ? (v / max) * 100 : 0;
    const colour = (colours && colours[i]) || CHART_COLOURS[i % CHART_COLOURS.length];
    return '<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;' +
        'align-items:center;justify-content:flex-end;gap:6px;height:100%;" title="' +
        attr(label + ': ' + fmt(v)) + '">' +
      '<div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);' +
        'white-space:nowrap;">' + esc(v > 0 ? fmt(v) : '') + '</div>' +
      '<div style="width:min(70%,46px);background:' + colour + ';border-radius:3px 3px 0 0;' +
        'height:' + Math.max(pct, v > 0 ? 1.5 : 0).toFixed(2) + '%;min-height:' + (v > 0 ? '2px' : '0') + ';"></div>' +
    '</div>';
  }).join('');

  const axis = labels.map(function(label){
    return '<div style="flex:1 1 0;min-width:0;text-align:center;font-size:11px;color:var(--text-dim);' +
      'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;" title="' +
      attr(label) + '">' + esc(label) + '</div>';
  }).join('');

  return '<div style="height:' + h + 'px;display:flex;flex-direction:column;gap:8px;">' +
    '<div style="flex:1;display:flex;align-items:flex-end;gap:8px;' +
      'border-bottom:1px solid var(--border-soft);padding-bottom:2px;min-height:0;">' + bars + '</div>' +
    '<div style="display:flex;gap:8px;">' + axis + '</div>' +
  '</div>';
}

function chartDonut(labels, values, colours, opts){
  const o = opts || {};
  const fmt = o.fmt || function(v){ return String(v); };
  const total = values.reduce(function(s, v){ return s + (Number(v) || 0); }, 0);
  const r = 34, cx = 50, cy = 50, stroke = 15;
  const circ = 2 * Math.PI * r;
  let offset = 0, arcs = '';

  values.forEach(function(v, i){
    const frac = total > 0 ? (Number(v) || 0) / total : 0;
    const len = frac * circ;
    const colour = (colours && colours[i]) || CHART_COLOURS[i % CHART_COLOURS.length];
    if(len > 0){
      arcs += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + colour +
        '" stroke-width="' + stroke + '" stroke-dasharray="' + len.toFixed(3) + ' ' + (circ - len).toFixed(3) +
        '" stroke-dashoffset="' + (-offset).toFixed(3) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')">' +
        '<title>' + esc(labels[i] + ': ' + fmt(Number(v) || 0) + ' (' + (frac * 100).toFixed(1) + '%)') +
        '</title></circle>';
    }
    offset += len;
  });
  if(total <= 0){
    arcs = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#1A2530" stroke-width="' + stroke + '"/>';
  }

  const legend = labels.map(function(label, i){
    const colour = (colours && colours[i]) || CHART_COLOURS[i % CHART_COLOURS.length];
    const v = Number(values[i]) || 0;
    return '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-dim);">' +
      '<span style="width:9px;height:9px;border-radius:2px;background:' + colour + ';flex-shrink:0;"></span>' +
      '<span>' + esc(label) + '</span>' +
      '<span style="font-family:var(--font-mono);color:var(--text);margin-left:auto;">' + esc(fmt(v)) + '</span>' +
    '</div>';
  }).join('');

  const size = (o.px || 210) - 62;
  return '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;">' +
    '<svg viewBox="0 0 100 100" role="img" style="width:' + size + 'px;height:' + size + 'px;max-width:100%;">' +
      arcs +
      '<text x="50" y="48" text-anchor="middle" font-size="7" fill="#8CA0AC">total</text>' +
      '<text x="50" y="58" text-anchor="middle" font-size="8" font-weight="600" fill="#E7EDF2">' +
        esc(o.centre || fmt(total)) + '</text>' +
    '</svg>' +
    '<div style="width:100%;max-width:280px;display:flex;flex-direction:column;gap:6px;">' + legend + '</div>' +
  '</div>';
}

</script>

<script>
/* ============================================================
   RENDER CORE
   ------------------------------------------------------------
   innerHTML re-render, same as the prototype. What is added is
   the thing the prototype had none of: UI state survives a
   redraw. This app has editable cells scattered through long
   tables — FOB override, HP support, category percentage, B2B
   fields — so losing the caret and the scroll position on every
   keystroke would make it unusable.
   ============================================================ */

function modalKey(){ return STATE.modal ? JSON.stringify(STATE.modal) : ''; }

function captureUiState(){
  const snap = {
    scrollY: (typeof window !== 'undefined') ? window.scrollY : 0,
    focusId: null, start: null, end: null,
    scrolls: {}, values: {}, modalKey: modalKey()
  };
  const el = document.activeElement;
  if(el && el.id){
    snap.focusId = el.id;
    try{ snap.start = el.selectionStart; snap.end = el.selectionEnd; }catch(e){ /* not a text field */ }
  }
  document.querySelectorAll('input[id], select[id], textarea[id]').forEach(function(field){
    /* NEVER a file input. It reads back as "C:\fakepath\name.csv" but may
       only ever be *set* to an empty string, so assigning it back throws
       InvalidStateError — which once killed a render half-way through and
       left an import button spinning for ever with no request sent. The
       browser keeps the chosen file across a redraw anyway. */
    if(field.type === 'file') return;
    snap.values[field.id] = (field.type === 'checkbox') ? field.checked : field.value;
  });
  document.querySelectorAll('[data-keep-scroll]').forEach(function(node){
    snap.scrolls[node.getAttribute('data-keep-scroll')] = node.scrollTop;
  });
  return snap;
}

function restoreUiState(snap){
  if(!snap) return;
  Object.keys(snap.values).forEach(function(id){
    const field = document.getElementById(id);
    if(!field || field.type === 'file') return;
    /* Only restore a field the new markup left empty — otherwise a value
       the server just corrected would be overwritten by the stale one
       the user was looking at. */
    /* A control whose value is rendered FROM state owns its own value,
       and restoring the DOM over it puts back what the state no longer
       says. Every filter is one of these, and marking them is not
       optional: "the markup left it empty" and "the markup deliberately
       rendered it empty" look identical here, so without the mark the
       empty-field branch below refills a filter the moment it is
       cleared. That is what made Clear appear to do nothing. */
    if(field.dataset.stateValue === '1') return;
    if(field.type === 'checkbox'){
      if(field.dataset.keepValue === '1') field.checked = snap.values[id];
    }else if(field.dataset.keepValue === '1' || field.value === ''){
      /* keepValue is the opposite case: a control whose value lives
         ONLY in the DOM, like the entry form, which is not held in
         STATE between renders. */
      field.value = snap.values[id];
    }
  });
  Object.keys(snap.scrolls).forEach(function(key){
    const node = document.querySelector('[data-keep-scroll="' + key + '"]');
    if(node) node.scrollTop = snap.scrolls[key];
  });
  if(snap.focusId){
    const field = document.getElementById(snap.focusId);
    if(field && field.type !== 'file'){
      field.focus();
      if(snap.start !== null && snap.start !== undefined){
        try{ field.setSelectionRange(snap.start, snap.end); }catch(e){ /* not a text field */ }
      }
    }
  }
  if(typeof window !== 'undefined' && snap.scrollY) window.scrollTo(0, snap.scrollY);
}

let renderDepth = 0;

function render(){
  if(typeof document === 'undefined') return;
  if(renderDepth > 0) return;          // a handler that renders during a render
  renderDepth++;
  let snap = null;
  try{ snap = captureUiState(); }catch(e){ console.warn('could not capture UI state', e); }

  const root = document.getElementById('root');
  try{
    if(STATE.phase === 'loading') root.innerHTML = viewLoading();
    else if(STATE.phase === 'fatal') root.innerHTML = viewFatal();
    else if(STATE.phase === 'auth') root.innerHTML = viewAuth();
    else root.innerHTML = viewApp();
  }finally{
    renderDepth--;
  }

  try{ bindHandlers(); }catch(e){ console.error('handler binding failed', e); }
  /* The screen is already drawn by this point. Failing to put the caret
     back is worth a console entry, never a dead app. */
  try{ restoreUiState(snap); }catch(e){ console.warn('could not restore UI state', e); }
}

function toast(msg, isErr){
  if(typeof document === 'undefined') return;
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 4200);
}

/* Delegated events: one listener per action attribute, re-bound after
   every render. Simple, and it cannot leak listeners onto detached
   nodes the way per-element binding did in the prototype. */
function on(selector, event, handler){
  document.querySelectorAll(selector).forEach(function(el){
    el.addEventListener(event, handler);
  });
}

/* ============================================================
   FILTER / SORT / PAGE — client side, for the item views
   ============================================================ */
function applyView(items, view, extra){
  const search = String(view.search || '').trim().toLowerCase();
  let rows = items.filter(function(it){
    if(view.category && it.category !== view.category) return false;
    if(view.location && !(it.byLocation && it.byLocation[view.location] > 0)) return false;
    if(view.flagged && !it.flag) return false;
    if(extra && !extra(it)) return false;
    if(search){
      if((it.item + ' ' + it.name + ' ' + it.category).toLowerCase().indexOf(search) < 0) return false;
    }
    return true;
  });

  const key = view.sortBy || 'item';
  const dir = view.sortDir === 'asc' ? 1 : -1;
  rows.sort(function(a, b){
    const av = a[key], bv = b[key];
    const an = isNum(av), bn = isNum(bv);
    /* Unknown sorts last whichever way the column is pointing — an item
       with no ageing figure is not "the newest". */
    if(!an && !bn) return String(a.item).localeCompare(String(b.item));
    if(!an) return 1;
    if(!bn) return -1;
    if(an && bn && Number(av) !== Number(bv)) return (Number(av) - Number(bv)) * dir;
    if(av === bv) return String(a.item).localeCompare(String(b.item));
    return (av < bv ? -1 : 1) * dir;
  });

  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const page = Math.min(Math.max(1, view.page || 1), pages);
  view.page = page;
  return {rows: rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE), total: total, page: page, pages: pages};
}

function sortableTh(viewId, field, label, numeric){
  const v = STATE.views[viewId];
  const active = v.sortBy === field;
  const caret = active ? '<span class="sort-caret">' + (v.sortDir === 'asc' ? '▲' : '▼') + '</span>' : '';
  return '<th class="sortable' + (numeric ? ' num' : '') + '" data-sort="' + attr(viewId) + '" ' +
    'data-field="' + attr(field) + '">' + esc(label) + caret + '</th>';
}

function pager(viewId, result){
  if(result.total === 0) return '';
  const from = (result.page - 1) * PAGE_SIZE + 1;
  const to = Math.min(result.page * PAGE_SIZE, result.total);
  return '<div class="pager">' +
    '<div class="pager-info">showing ' + from + '–' + to + ' of ' + result.total + '</div>' +
    '<div class="pager-btns">' +
      '<button class="btn secondary sm" data-page="' + attr(viewId) + '" data-to="1" ' +
        (result.page === 1 ? 'disabled' : '') + '>&laquo; first</button>' +
      '<button class="btn secondary sm" data-page="' + attr(viewId) + '" data-to="' + (result.page - 1) + '" ' +
        (result.page === 1 ? 'disabled' : '') + '>prev</button>' +
      '<span class="pager-info">page ' + result.page + ' of ' + result.pages + '</span>' +
      '<button class="btn secondary sm" data-page="' + attr(viewId) + '" data-to="' + (result.page + 1) + '" ' +
        (result.page >= result.pages ? 'disabled' : '') + '>next</button>' +
      '<button class="btn secondary sm" data-page="' + attr(viewId) + '" data-to="' + result.pages + '" ' +
        (result.page >= result.pages ? 'disabled' : '') + '>last &raquo;</button>' +
    '</div></div>';
}

function categoryOptions(selected){
  const cats = (STATE.data && STATE.data.categories) || [];
  return '<option value="">All categories</option>' + cats.map(function(c){
    return '<option value="' + attr(c.category) + '"' + (selected === c.category ? ' selected' : '') + '>' +
      esc(c.category) + '</option>';
  }).join('');
}
function locationOptions(selected, allLabel){
  const locs = (STATE.data && STATE.data.locations) || [];
  return '<option value="">' + esc(allLabel || 'All warehouses') + '</option>' + locs.map(function(l){
    return '<option value="' + attr(l.code) + '"' + (selected === l.code ? ' selected' : '') + '>' +
      esc(l.code) + ' — ' + esc(l.name) + '</option>';
  }).join('');
}

/* THE TWO DIMENSIONS A TYPE CODE USED TO CONFLATE.

   `Opening balance B2B-MainWH` said two things in one string: what
   happens to the stock, and which book it belongs to. Neither could be
   filtered on, because a filter needs a field and this was a naming
   convention. They are separate now — the stage derived from the type's
   behaviour, the business recorded on the movement — and both of these
   feed the pickers that filter on them.

   Both come from the server, not from a list here: the stages are the
   three the engine has, and the business lines are a Settings value a
   business edits. Hard-coding either would put a second definition
   beside the real one. */
function businessTypeOptions(selected, blankLabel){
  const list = STATE.data.businessTypes || [];
  return '<option value="">' + esc(blankLabel || 'Not specified') + '</option>' +
    list.map(function(b){
      return '<option value="' + attr(b) + '"' + (b === selected ? ' selected' : '') + '>' +
        esc(b) + '</option>';
    }).join('');
}

function stageOptions(selected){
  return '<option value="">All stages</option>' +
    (STATE.data.stages || ['Backlog', 'GIT', 'MainWH']).map(function(st){
      return '<option value="' + attr(st) + '"' + (st === selected ? ' selected' : '') + '>' +
        esc(st) + '</option>';
    }).join('');
}

/* Partner names already on the ledger, so the second movement with a
   partner is spelled the same way as the first. Drawn from the rows the
   Ledger screen has already loaded rather than from a fetch of its own:
   suggestions are a convenience, and one that must not cost a request
   or hold up the form. An unlisted name is still perfectly valid — this
   is a datalist, not a dropdown. */
/* Partner names the ledger actually holds.

   Supplied by the server — by getLedger and by the dashboard's own
   request, both of which read the whole ledger anyway — and stashed on
   STATE.data as each lands. An earlier version of this read the rows in
   the page, which was simply wrong: the ledger lives on
   STATE.views.ledger.data, so `STATE.data.ledger` was always undefined
   and the datalist was always empty. It failed silently, which is the
   worst way for a suggestion list to fail: it looks like nobody has
   ever typed a partner.

   Deliberately still a datalist and not a dropdown on the entry form:
   a partner Stockflow has never seen is perfectly valid, and the first
   movement with a new one must not be harder than the second. */
function knownPartners(){
  return STATE.data.partners || [];
}

function partnerOptions(){
  return knownPartners().map(function(p){
    return '<option value="' + attr(p) + '"></option>';
  }).join('');
}

/* The filter version: a real dropdown, because filtering to a partner
   nobody has recorded can only ever return nothing. */
function partnerFilterOptions(selected){
  return '<option value="">All partners</option>' +
    knownPartners().map(function(p){
      return '<option value="' + attr(p) + '"' + (p === selected ? ' selected' : '') + '>' +
        esc(p) + '</option>';
    }).join('');
}

/* The three behaviours that bring stock into existence, as opposed to
   moving it or taking it out. Mirrors behaviourCreatesStock_ on the
   server; the two are checked against each other in wiring.test.js,
   because a split between them would show up as a form quietly not
   asking for a cost. */
const BEHAVIOURS_THAT_CREATE_STOCK = ['in-backlog', 'in-mainwh', 'in-git'];

/* Which fields a movement type actually uses. Shared by the entry form,
   the child-item rows and the edit dialog: three copies of this rule
   would drift, and the one that drifted would be the dialog nobody uses
   every day.

   Answered from the type's own definition, which the server sends with
   requiresFob / requiresLocation / requiresToLocation / isSale already
   worked out from its behaviour. Matching on the seven built-in CODES
   instead — as this did — meant a type an Admin added showed the wrong
   boxes: "Opening balance B2B-MainWH" is an opening balance in every
   respect except its spelling, and the form hid the cost price box on
   the one movement that cannot be posted without one.

   The literals remain as the fallback for a type the client has not
   been told about, so a stale page degrades to the old behaviour rather
   than to a form with no fields at all. */
function txnFieldsFor(type){
  const def = ((STATE.data && STATE.data.movementTypes) || [])
    .filter(function(t){ return t.code === type; })[0];
  /* `behaviour` is the tell that this is a real definition from the
     server rather than a stub. A half-populated one would read as "this
     type needs no cost price and no warehouse", which is not a
     degradation — it is a form that silently drops what was typed. */
  if(def && def.behaviour){
    /* SHOWN and REQUIRED are two different questions, and conflating
       them hid the cost price box the moment an opening balance stopped
       demanding one. A price is still the most useful thing you can put
       on an opening balance — it is simply not compulsory, because the
       cost of stock bought years ago is often not to hand. So the box
       appears on every movement that CREATES stock, and says whether it
       has to be filled in. */
    const creates = BEHAVIOURS_THAT_CREATE_STOCK.indexOf(def.behaviour) >= 0;
    return {
      fob: creates,
      fobRequired: !!def.requiresFob,
      fobLabel: 'Cost price $ (unit FOB)' + (def.requiresFob ? '' : ' — optional'),
      location: !!def.requiresLocation,
      toLocation: !!def.requiresToLocation,
      sellPrice: !!def.isSale,
      locLabel: def.behaviour === 'move-mainwh' ? 'Move from' : 'Warehouse'
    };
  }
  const legacyFob = type === 'Purchase-Backlog' || type === 'Opening Balance-MainWH';
  return {
    fob: legacyFob,
    fobRequired: legacyFob,
    fobLabel: 'Cost price $ (unit FOB)',
    location: type !== 'Purchase-Backlog' && type !== 'Ship-to-GIT',
    toLocation: type === 'Transfer-MainWH',
    sellPrice: type === 'Sale-from-GIT' || type === 'Sale-from-MainWH',
    locLabel: type === 'Transfer-MainWH' ? 'Move from' : 'Warehouse'
  };
}

function lockedNote(msg){
  return '<div class="locked-note">🔒 ' + esc(msg) + '</div>';
}

function emptyRow(cols, msg){
  return '<tr><td colspan="' + cols + '"><div class="empty-state">' + esc(msg) + '</div></td></tr>';
}
</script>

function brandSwitch(){

function brandModal(){
  const brands = (STATE.data && STATE.data.brands) || [];
  const counts = brandsWithStock();
  const groups = [];
  brands.forEach(function(b){
    let g = groups.filter(function(x){ return x.bu === b.businessUnit; })[0];
    if(!g){ g = {bu: b.businessUnit, brands: []}; groups.push(g); }
    g.brands.push(b);
  });

  return '<div class="modal-head"><div class="modal-title">Switch Business Unit / Brand</div>' +
      '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
    '<div class="modal-sub">Stockflow runs every TD Africa Group brand through the same engine. ' +

    '<div class="brand-chip-row" style="margin-bottom:16px;">' +
      '<div class="brand-chip' + (STATE.activeBrand ? '' : ' active') + '" data-brand="">' +

    '</div>' +
    groups.map(function(g){
      return '<div class="bu-group"><div class="bu-group-name">' + esc(g.bu) + '</div>' +
        '<div class="brand-chip-row">' +
        g.brands.map(function(b){
          const n = counts[b.brand] || 0;
          const isActive = STATE.activeBrand === b.brand;
          const cls = isActive ? 'active' : (n ? '' : 'locked');
          return '<div class="brand-chip ' + cls + '" data-brand="' + attr(b.brand) + '">' +
            esc(b.brand) +
            (n ? '<span class="chip-tag live">' + n + ' SKUs</span>'
               : '<span class="chip-tag">not loaded</span>') +
          '</div>';
        }).join('') +

    }).join('');
}

function navBadges(){
  const items = visibleItems();
  const b = {};
  const openFlags = items.filter(function(i){ return i.flag && !i.flagResolvedBy; }).length;
  if(openFlags) b.analytics = String(openFlags);
  const git = items.filter(function(i){ return i.gitQty > 0; }).length;
  if(git) b.git = String(git);
  return b;
}

function renderTab(){
  const renderers = {
    overview: viewOverview, ledger: viewLedger, git: viewGit, mainwh: viewMainWh,
    consolidated: viewConsolidated, itemmaster: viewItemMaster, simulator: viewSimulator,
    category: viewCategory, types: viewTypes, b2b: viewB2B,
    analytics: viewAnalytics, audit: viewAudit, access: viewAccess
  };
  const fn = renderers[STATE.tab] || viewOverview;
  try{
    return fn();
  }catch(err){
    console.error('screen failed to render', err);
    return '<div class="banner bad"><div>⚠</div><div><b>This screen could not be drawn.</b> ' +
      esc(String(err && err.message || err)) +
      '<br>This is a fault in Stockflow, not something you did. The rest of the app still works.</div></div>';
  }
}

/* Totals used by more than one screen. */
function totals(list){
  const items = list || visibleItems();
  const t = {gitQty: 0, mwQty: 0, backlogQty: 0, soldQty: 0,
    gitValue: 0, mwValue: 0, consolidatedValue: 0, soldValue: 0, costOfSale: 0, skus: 0, b2bSkus: 0};
  items.forEach(function(i){
    if(i.b2b) t.b2bSkus++; else t.skus++;
    t.gitQty += i.gitQty; t.mwQty += i.mwQty; t.backlogQty += i.backlogQty; t.soldQty += i.soldQty;
    t.gitValue += i.gitValue; t.mwValue += i.mwValue; t.consolidatedValue += i.consolidatedValue;
    t.soldValue += i.soldValue; t.costOfSale += i.costOfSale;
  });
  t.consolidatedQty = t.gitQty + t.mwQty;
  return t;
}

/* Brand is a real column on every item, so the switcher filters rather
   than pretending. It is a view, not a permission: nothing is hidden
   from anyone, and the server returns every item regardless. */
function visibleItems(){
  const all = (STATE.data && STATE.data.items) || [];
  if(!STATE.activeBrand) return all;
  return all.filter(function(i){ return i.brand === STATE.activeBrand; });
}
function nonB2B(){
  return visibleItems().filter(function(i){ return !i.b2b; });
}
function b2bItems(){
  return visibleItems().filter(function(i){ return i.b2b; });
}
function itemByCode(code){
  return ((STATE.data && STATE.data.items) || []).filter(function(i){ return i.item === code; })[0] || null;
}

/* Which brands actually have items loaded, so the switcher can say what
   is live rather than repeating a hard-coded list. */
function brandsWithStock(){
  const counts = {};
  ((STATE.data && STATE.data.items) || []).forEach(function(i){
    if(i.brand) counts[i.brand] = (counts[i.brand] || 0) + 1;
  });
  return counts;
}
