    return '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Uploads' +
        '<span>nothing has been bulk-uploaded yet</span></div></div>' +
      '<div class="empty-state">Imports will be listed here, with the brands each one touched.</div>' +
    '</div>';
  }
  return '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">Uploads' +
      '<span>' + d.total + ' import' + (d.total === 1 ? '' : 's') + ', newest first</span></div></div>' +
    '<div class="table-wrap"><table><thead><tr>' +
      '<th>When</th><th>Who</th><th class="num">Rows</th><th class="num">Items</th>' +
      '<th>Brands</th><th>Note</th><th></th>' +
    '</tr></thead><tbody>' +
    d.rows.map(function(b){
      return '<tr>' +
        '<td>' + esc(fmtDateTime(b.importedAt)) + '</td>' +
        '<td>' + esc(b.importedBy) + '</td>' +
        '<td class="num">' + fmtNum(b.rowCount) + '</td>' +
        '<td class="num">' + fmtNum(b.itemCount) + '</td>' +
        '<td>' + (b.brandsKnown
          ? (b.brands.length
              ? b.brands.map(function(x){ return '<span class="tag">' + esc(x) + '</span>'; }).join(' ')
              : '<span class="unknown">no brand set</span>')
          : '<span class="unknown">not recorded</span>') + '</td>' +
        '<td class="wrap">' + esc(b.note) + '</td>' +
        '<td><button class="btn secondary sm" data-batch-dl="' + attr(b.batchId) + '">Download</button></td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div>' +
    pagerServer('imports', d) +
  '</div>';
}

/* Says, in words, how the dates in this file were read — and offers the
   other reading. Nothing is silently interpreted: the person clicking
   Import has been told what the dates mean. */
function dateNotice(b){
  const d = b.dateInfo;
  if(!d || !d.count) return '';
  const other = d.order === 'DMY' ? 'MDY' : 'DMY';
  const certain = d.basis === 'evidence';
  return '<div class="banner ' + (certain ? 'info' : '') + '">' +
    '<div>' + (certain ? 'i' : '?') + '</div><div>' +
      '<b>' + d.count + ' date' + (d.count === 1 ? '' : 's') + ' came in as ' +
      esc(d.sample) + '</b> — read as <b>' + esc(dateOrderLabel(d.order)) + '</b>, so ' +
      esc(d.sample) + ' means <b>' + esc(d.example) + '</b>.' +
      (certain
        ? ' The file settles it: at least one date has a day above 12, so no other reading fits.'
        : ' Every date in this file works either way, so the default was used.') +
      ' <button class="link-btn" id="flip-date-order">Read them as ' +
      esc(dateOrderLabel(other)) + ' instead</button>' +
    '</div></div>';
}

function viewLedgerHistory(){
  const v = STATE.views.ledger;
  const d = v.data;
  const types = ['Opening Balance-MainWH'].concat(STATE.data.txnTypes || []).concat(['Reversal']);

  const filters = '<div class="filter-bar">' +
    '<div class="field narrow"><label>From</label><input type="date" id="lf-from" data-keep-value="1" value="' + attr(v.dateFrom) + '"></div>' +
    '<div class="field narrow"><label>To (inclusive)</label><input type="date" id="lf-to" data-keep-value="1" value="' + attr(v.dateTo) + '"></div>' +
    '<div class="field"><label>Item</label><select id="lf-item" data-keep-value="1">' +
      '<option value="">All items</option>' +
      visibleItems().map(function(i){
        return '<option value="' + attr(i.item) + '"' + (v.item === i.item ? ' selected' : '') + '>' + esc(i.item) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Type</label><select id="lf-type" data-keep-value="1">' +
      '<option value="">All types</option>' +
      types.map(function(t){
        return '<option value="' + attr(t) + '"' + (v.type === t ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Search reference, notes, who</label>' +
      '<input type="text" id="lf-search" data-keep-value="1" placeholder="PO-4471, INV-, a name…" value="' + attr(v.search) + '"></div>' +
    '<div class="field narrow"><label>&nbsp;</label><button class="btn secondary" id="lf-clear">Clear</button></div>' +
  '</div>';

  let body;
  if(v.loading && !d){
    body = '<div class="empty-state">Loading…</div>';
  }else if(!d){
    body = '<div class="empty-state">No movements loaded yet.</div>';
  }else if(!d.rows.length){
    body = '<div class="empty-state">No movements match these filters.</div>';
  }else{
    body = '<div class="table-wrap" data-keep-scroll="ledger">' +
      '<table><thead><tr>' +
        '<th>Date</th><th>Item</th>' + (showBrandColumn() ? '<th>Brand</th>' : '') +
        '<th>Type</th><th class="num">Qty</th><th class="num">FOB $</th>' +
        '<th>Where</th><th class="num">Sell $</th><th class="num">Cost of sale</th>' +
        '<th>Reference</th><th>Posted by</th><th></th>' +
      '</tr></thead><tbody>' +
      d.rows.map(function(r){
        const canReverse = STATE.perms.ledger && !r.voided && r.type !== 'Reversal';
        return '<tr class="' + (r.voided ? 'voided' : '') + '">' +
          '<td>' + esc(r.date) + '</td>' +
          '<td><b>' + esc(r.item) + '</b></td>' +
          (showBrandColumn()
            ? '<td>' + (r.brand ? esc(r.brand) : '<span class="unknown">—</span>') + '</td>'
            : '') +
          '<td>' + typePill(r.type) + '</td>' +
          '<td class="num">' + fmtNum(r.qty) + '</td>' +
          '<td class="num">' + (r.fob ? fmtMoney(r.fob) : '—') + '</td>' +
          '<td>' + esc([r.location, r.toLocation].filter(function(x, i, a){ return x && a.indexOf(x) === i; }).join(' → ')) + '</td>' +
          '<td class="num">' + (isNum(r.sellPrice) ? fmtMoney(r.sellPrice) : '—') + '</td>' +
          '<td class="num">' + (r.costOfSale ? fmtMoney0(r.costOfSale) : '—') + '</td>' +
          '<td class="wrap">' + esc(r.ref) +
            (r.reversalOf ? '<br><span class="unknown">reverses ' + esc(r.reversalOf) + ' — ' + esc(r.reversalReason) + '</span>' : '') +
            (r.notes ? '<br><span class="unknown">' + esc(r.notes) + '</span>' : '') + '</td>' +
          '<td class="wrap">' + esc(r.actor) + '</td>' +
          '<td>' + (canReverse
            ? '<button class="btn secondary sm" data-reverse="' + attr(r.txnId) + '">Reverse</button>'
            : (r.voided ? '<span class="unknown">reversed</span>' : '')) + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>' +
      pagerServer('ledger', d);
  }

  return '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">Ledger History' +
      '<span>' + (d ? d.total + ' matching row' + (d.total === 1 ? '' : 's') : '') + '</span></div>' +
      '<div class="btn-row">' +
        (STATE.bulk.lastBatchId
          ? '<button class="btn secondary sm" id="export-batch" data-batch="' +
            attr(STATE.bulk.lastBatchId) + '">Download my last import</button>'
          : '') +
        '<button class="btn secondary sm" id="export-ledger">Export CSV</button>' +
      '</div>' +
    '</div>' +
    filters + body +
    '<div style="font-size:11px;color:var(--text-faint);margin-top:10px;">' +
      'Export CSV downloads every row matching the filters above, not just this page.' +
    '</div>' +
  '</div>';
}

/* Only worth a column when there is more than one brand loaded and no
   single brand selected. With one brand, or with the switcher already
   scoped to one, it would be the same word on every row. */
function showBrandColumn(){
  if(STATE.activeBrand) return false;
  return Object.keys(brandsWithStock()).length > 1;
}

function pagerServer(viewId, d){
  if(!d.total) return '';
  const from = (d.page - 1) * d.pageSize + 1;
  const to = Math.min(d.page * d.pageSize, d.total);
  return '<div class="pager">' +
    '<div class="pager-info">showing ' + from + '–' + to + ' of ' + d.total + '</div>' +
    '<div class="pager-btns">' +
      '<button class="btn secondary sm" data-spage="' + attr(viewId) + '" data-to="1"' + (d.page === 1 ? ' disabled' : '') + '>&laquo; first</button>' +
      '<button class="btn secondary sm" data-spage="' + attr(viewId) + '" data-to="' + (d.page - 1) + '"' + (d.page === 1 ? ' disabled' : '') + '>prev</button>' +
      '<span class="pager-info">page ' + d.page + ' of ' + d.pages + '</span>' +
      '<button class="btn secondary sm" data-spage="' + attr(viewId) + '" data-to="' + (d.page + 1) + '"' + (d.page >= d.pages ? ' disabled' : '') + '>next</button>' +
      '<button class="btn secondary sm" data-spage="' + attr(viewId) + '" data-to="' + d.pages + '"' + (d.page >= d.pages ? ' disabled' : '') + '>last &raquo;</button>' +
    '</div></div>';
}
</script>

<script>
/* ============================================================
   SCREEN: GIT
   ============================================================ */
function viewGit(){
  const v = STATE.views.git;
  const b = STATE.data.ageBuckets || [30, 60, 90];
  const all = nonB2B().concat(b2bItems());
  const withGit = all.filter(function(i){ return i.gitQty > 0; });
  const res = applyView(withGit, v);
  const totalQty = withGit.reduce(function(s, i){ return s + i.gitQty; }, 0);
  const totalVal = withGit.reduce(function(s, i){ return s + i.gitValue; }, 0);
  const over = withGit.filter(function(i){ return isNum(i.gitOldestAge) && i.gitOldestAge > b[2]; }).length;

  return '<div class="banner"><div>⏳</div><div>Stock ships to GIT and clears to the Main Warehouse ' +
    'through the ledger. Ageing starts the day stock is recognised as GIT and carries through to the ' +
    'Main Warehouse — it does not reset on receipt, and it does not reset on a transfer either.</div></div>' +

    '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;">' +
      kpi('Total GIT Units', fmtNum(totalQty), withGit.length + ' SKUs in transit', 'var(--amber)') +
      kpi('Total GIT Value', fmtMoney0(totalVal), 'at net cost', 'var(--amber)') +
      kpi('SKUs over ' + b[2] + ' days in GIT', String(over), over ? 'chase these' : 'nothing overdue', over ? 'var(--red)' : 'var(--flow)') +
    '</div>' +

    '<div class="panel">' +
      filterBar('git', {search: true, category: true}) +
      '<div class="table-wrap"><table><thead><tr>' +
        sortableTh('git', 'item', 'Item') +
        '<th>Product</th>' +
        sortableTh('git', 'category', 'Category') +
        sortableTh('git', 'gitQty', 'GIT Qty', true) +
        sortableTh('git', 'netCost', 'Net Cost/unit', true) +
        sortableTh('git', 'gitValue', 'GIT Value', true) +
        '<th>Oldest lot entered GIT</th>' +
        sortableTh('git', 'gitOldestAge', 'Oldest age', true) +
        sortableTh('git', 'gitAvgAge', 'Avg age', true) +
        '<th>Status</th>' +
      '</tr></thead><tbody>' +
      (res.rows.length ? res.rows.map(function(i){
        const age = i.gitOldestAge;
        const status = !isNum(age) ? 'Unknown age'
          : age > b[2] ? 'Delayed (' + b[2] + '+ days)'
          : age > b[1] ? 'Ageing (' + b[1] + '+ days)' : 'In Transit';
        return '<tr>' +
          '<td><b>' + esc(i.item) + '</b>' + flagIcon(i) + '</td>' +
          '<td class="wrap">' + esc(i.name) + '</td>' +
          '<td>' + catTag(i.category) + '</td>' +
          '<td class="num">' + fmtNum(i.gitQty) + '</td>' +
          '<td class="num">' + costCell(i) + '</td>' +
          '<td class="num">' + fmtMoney0(i.gitValue) + '</td>' +
          '<td>' + esc(i.gitOldestDate || '—') + '</td>' +
          '<td class="num" style="color:' + ageColour(age) + ';font-weight:600;">' + fmtDays(age) + '</td>' +
          '<td class="num">' + fmtDays(i.gitAvgAge) + '</td>' +
          '<td><span style="color:' + ageColour(age) + ';font-weight:600;">' + esc(status) + '</span></td>' +
        '</tr>';
      }).join('') : emptyRow(10, 'No stock currently in transit. Log a Ship-to-GIT on the Transactions Ledger.')) +
      '</tbody></table></div>' +
      pager('git', res) +
    '</div>';
}

function flagIcon(i){
  if(!i.flag) return '';
  const resolved = !!i.flagResolvedBy;
  const title = i.flag + (resolved ? ' — confirmed by ' + i.flagResolvedBy + ': ' + i.flagNote : '');
  return ' <span class="flag-icon' + (resolved ? ' resolved' : '') + '" title="' + attr(title) + '">' +
    (resolved ? '✓' : '⚠') + '</span>';
}

/* An item that has never been purchased has no cost, and saying "$0.00"
   would be a lie the prototype told on every such row. */
function costCell(i){
  if(i.costUnknown) return '<span class="unknown" title="No purchase history, so there is no cost to show">no cost yet</span>';
  const warn = i.supportExceedsLanded
    ? ' <span class="flag-icon" title="HP support exceeds landed cost, so net cost is floored at zero">⚠</span>'
    : '';
  return fmtMoney(i.netCost) + warn;
}

function filterBar(viewId, opts){
  const v = STATE.views[viewId];
  let html = '<div class="filter-bar">';
  if(opts.search){
    html += '<div class="field"><label>Search item or product</label>' +
      '<input type="text" id="vf-' + attr(viewId) + '-search" data-keep-value="1" ' +
      'placeholder="part number or description" value="' + attr(v.search) + '"></div>';
  }
  if(opts.category){
    html += '<div class="field narrow"><label>Category</label>' +
      '<select id="vf-' + attr(viewId) + '-category" data-keep-value="1">' + categoryOptions(v.category) + '</select></div>';
  }
  if(opts.location){
    html += '<div class="field narrow"><label>Warehouse</label>' +
      '<select id="vf-' + attr(viewId) + '-location" data-keep-value="1">' + locationOptions(v.location) + '</select></div>';
  }
  if(opts.flagged){
    html += '<div class="field narrow"><label>&nbsp;</label>' +
      '<label style="font-size:11.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;height:34px;">' +
      '<input type="checkbox" id="vf-' + attr(viewId) + '-flagged" data-keep-value="1" style="width:auto;"' +
      (v.flagged ? ' checked' : '') + '> flagged only</label></div>';
  }
  html += '<div class="field narrow"><label>&nbsp;</label>' +
    '<button class="btn secondary" data-clearview="' + attr(viewId) + '">Clear</button></div>';
  return html + '</div>';
}

/* ============================================================
   SCREEN: Main Warehouse
   ============================================================ */
function viewMainWh(){
  const v = STATE.views.mainwh;
  const b = STATE.data.ageBuckets || [30, 60, 90];
  const all = nonB2B().concat(b2bItems());
  const withMw = all.filter(function(i){ return i.mwQty > 0; });
  const res = applyView(withMw, v);
  const totalQty = withMw.reduce(function(s, i){ return s + i.mwQty; }, 0);
  const totalVal = withMw.reduce(function(s, i){ return s + i.mwValue; }, 0);
  const over = withMw.filter(function(i){ return isNum(i.mwOldestAge) && i.mwOldestAge > b[2]; }).length;

  /* Per-warehouse totals. The prototype captured a warehouse on every
     opening lot and then collapsed all of them into one number. */
  const byLoc = {};
  withMw.forEach(function(i){
    Object.keys(i.byLocation || {}).forEach(function(code){
      if(!byLoc[code]) byLoc[code] = {qty: 0, value: 0};
      byLoc[code].qty += i.byLocation[code];
      byLoc[code].value += i.byLocation[code] * (i.costUnknown ? 0 : i.netCost);
    });
  });
  const locCodes = Object.keys(byLoc).sort();

  return '<div class="banner"><div>📦</div><div>Age here carries over from the date stock entered GIT ' +
    '(or, for opening-balance stock, the date it was loaded into Stockflow) — receiving into the ' +
    'warehouse does not restart the clock, and neither does moving it between warehouses.</div></div>' +

    '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;">' +
      kpi('Total Main WH Units', fmtNum(totalQty), withMw.length + ' SKUs on hand', 'var(--flow)') +
      kpi('Total Main WH Value', fmtMoney0(totalVal), 'at net cost', 'var(--flow)') +
      kpi('SKUs over ' + b[2] + ' days on hand', String(over), over ? 'ageing stock' : 'nothing overdue', over ? 'var(--red)' : 'var(--flow)') +
    '</div>' +

    (locCodes.length ? '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">By Warehouse' +
        '<span>where the stock physically is</span></div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Warehouse</th><th class="num">Units</th>' +
      '<th class="num">Value</th><th class="num">Share of units</th></tr></thead><tbody>' +
      locCodes.map(function(code){
        const loc = (STATE.data.locations || []).filter(function(l){ return l.code === code; })[0];
        const share = totalQty > 0 ? (byLoc[code].qty / totalQty) : 0;
        return '<tr><td><b>' + esc(code) + '</b> <span class="unknown">' +
          esc(loc ? loc.name : '') + '</span></td>' +
          '<td class="num">' + fmtNum(byLoc[code].qty) + '</td>' +
          '<td class="num">' + fmtMoney0(byLoc[code].value) + '</td>' +
          '<td class="num">' + fmtPct(share) + '</td></tr>';
      }).join('') +
      '</tbody></table></div></div>' : '') +

    '<div class="panel">' +
      filterBar('mainwh', {search: true, category: true, location: true}) +
      '<div class="table-wrap" data-keep-scroll="mainwh"><table><thead><tr>' +
        sortableTh('mainwh', 'item', 'Item') +
        '<th>Product</th>' +
        sortableTh('mainwh', 'category', 'Category') +
        sortableTh('mainwh', 'mwQty', 'MW Qty', true) +
        '<th>Held at</th>' +
        sortableTh('mainwh', 'netCost', 'Net Cost/unit', true) +
        sortableTh('mainwh', 'mwValue', 'MW Value', true) +
        '<th>Oldest lot entry</th>' +
        sortableTh('mainwh', 'mwOldestAge', 'Oldest age', true) +
        sortableTh('mainwh', 'mwAvgAge', 'Avg age', true) +
      '</tr></thead><tbody>' +
      (res.rows.length ? res.rows.map(function(i){
        const where = Object.keys(i.byLocation || {}).sort().map(function(code){
          return esc(code) + '&nbsp;' + fmtNum(i.byLocation[code]);
        }).join(' · ');
        return '<tr>' +
          '<td><b>' + esc(i.item) + '</b>' + flagIcon(i) + '</td>' +
          '<td class="wrap">' + esc(i.name) + '</td>' +
          '<td>' + catTag(i.category) + '</td>' +
          '<td class="num">' + fmtNum(i.mwQty) + '</td>' +
          '<td class="wrap">' + (where || '<span class="unknown">unassigned</span>') + '</td>' +
          '<td class="num">' + costCell(i) + '</td>' +
          '<td class="num">' + fmtMoney0(i.mwValue) + '</td>' +
          '<td>' + esc(i.mwOldestDate || '—') + '</td>' +
          '<td class="num" style="color:' + ageColour(i.mwOldestAge) + ';font-weight:600;">' + fmtDays(i.mwOldestAge) + '</td>' +
          '<td class="num">' + fmtDays(i.mwAvgAge) + '</td>' +
        '</tr>';
      }).join('') : emptyRow(10, 'Nothing on hand matches these filters.')) +
      '</tbody></table></div>' +
      pager('mainwh', res) +
    '</div>';
}

/* ============================================================
   SCREEN: Consolidated position
   ============================================================ */
function viewConsolidated(){
  const v = STATE.views.consolidated;
  const t = totals();
  const all = nonB2B().concat(b2bItems());
  const res = applyView(all, v);

  const labels = ageBucketLabels();
  const buckets = {};
  labels.forEach(function(l){ buckets[l] = 0; });
  let unbucketed = 0;
  all.forEach(function(i){
    (i.lots || []).forEach(function(lot){
      const bucket = ageBucket(lot.age);
      const value = lot.qty * (i.costUnknown ? 0 : i.netCost);
      if(bucket) buckets[bucket] += value; else unbucketed += lot.qty;
    });
  });

  return '<div class="kpi-grid" style="margin-bottom:18px;">' +
      kpi('GIT Qty', fmtNum(t.gitQty), 'in transit', 'var(--amber)') +
      kpi('Main WH Qty', fmtNum(t.mwQty), 'on ground', 'var(--flow)') +
      kpi('Consolidated Qty', fmtNum(t.consolidatedQty), 'owned position', 'var(--flow)') +
      kpi('Consolidated Value', fmtMoney0(t.consolidatedValue), 'at net cost', 'var(--flow)') +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Inventory Ageing' +
        '<span>value by days held, from GIT entry through to ' + esc(STATE.today) +
        ' (opening stock ages from its upload date)</span></div></div>' +
      '<div class="chart-box">' + chartBar(labels, labels.map(function(l){ return buckets[l]; }),
        ['#5FE0BE', '#2FBEB0', '#E3A23D', '#E0654F'], {px: 210, fmt: money0k}) + '</div>' +
      (unbucketed ? '<div style="font-size:11.5px;color:var(--red);margin-top:8px;">' +
        fmtNum(unbucketed) + ' unit(s) are not in any bucket because their entry date cannot be read. ' +
        'They are excluded from this chart rather than counted as brand new.</div>' : '') +
    '</div>' +

    '<div class="panel">' +
      filterBar('consolidated', {search: true, category: true}) +
      '<div class="table-wrap" data-keep-scroll="consolidated"><table><thead><tr>' +
        sortableTh('consolidated', 'item', 'Item') +
        '<th>Product</th>' +
        sortableTh('consolidated', 'category', 'Category') +
        sortableTh('consolidated', 'backlogQty', 'Backlog', true) +
        sortableTh('consolidated', 'gitQty', 'GIT', true) +
        sortableTh('consolidated', 'mwQty', 'Main WH', true) +
        sortableTh('consolidated', 'consolidatedQty', 'Consolidated', true) +
        '<th class="num">Oldest age</th>' +
        sortableTh('consolidated', 'netCost', 'Net Cost/unit', true) +
        sortableTh('consolidated', 'consolidatedValue', 'Value', true) +
      '</tr></thead><tbody>' +
      (res.rows.length ? res.rows.map(function(i){
        const ages = [i.gitOldestAge, i.mwOldestAge].filter(isNum);
        const oldest = ages.length ? Math.max.apply(null, ages) : null;
        return '<tr>' +
          '<td><b>' + esc(i.item) + '</b>' + flagIcon(i) + (i.b2b ? ' <span class="tag">B2B</span>' : '') + '</td>' +
          '<td class="wrap">' + esc(i.name) + '</td>' +
          '<td>' + catTag(i.category) + '</td>' +
          '<td class="num">' + fmtNum(i.backlogQty) + '</td>' +
          '<td class="num">' + fmtNum(i.gitQty) + '</td>' +
          '<td class="num">' + fmtNum(i.mwQty) + '</td>' +
          '<td class="num">' + fmtNum(i.consolidatedQty) + '</td>' +
          '<td class="num" style="color:' + ageColour(oldest) + ';font-weight:600;">' +
            (i.consolidatedQty > 0 ? fmtDays(oldest) : '—') + '</td>' +
          '<td class="num">' + costCell(i) + '</td>' +
          '<td class="num">' + fmtMoney0(i.consolidatedValue) + '</td>' +
        '</tr>';
      }).join('') : emptyRow(10, 'Nothing matches these filters.')) +
      '</tbody></table></div>' +
      pager('consolidated', res) +
      '<div style="font-size:11.5px;color:var(--text-faint);margin-top:10px;">' +
        'Backlog is shown for context but is <b>not</b> part of the consolidated position: it is ordered, ' +
        'not owned, and it carries no ageing clock.</div>' +
    '</div>';
}
</script>

<script>
/* ============================================================
   SCREEN: Item Master — the cost build-up, spelled out
   ============================================================ */
function viewItemMaster(){
  const editable = STATE.perms.category;
  const v = STATE.views.itemmaster;
  const res = applyView(nonB2B(), v);

  return (editable ? '' : lockedNote(

/* Mirrors the server's resolver exactly. This is a preview of what the
   server would compute; the server is still the authority. */
function livePricing(){
  const p = STATE.data.pricing || {global: null, category: {}, sku: {}};
  const draft = STATE.marginDraft || {};
  return {
    global: draft.global !== undefined ? draft.global : p.global,
    category: Object.assign({}, p.category, draft.category || {}),
    sku: Object.assign({}, p.sku, draft.sku || {})
  };
}
function resolveMargin(item, category){
  const p = livePricing();
  const sku = p.sku[item];
  if(isNum(sku)) return Number(sku) / 100;
  const cat = p.category[category];
  if(isNum(cat)) return Number(cat) / 100;
  if(isNum(p.global)) return Number(p.global) / 100;
  return Number(STATE.data.defaultMarginPct || 0) / 100;
}

function simRows(rows, editable){
  const p = livePricing();
  return rows.map(function(i){
    const margin = resolveMargin(i.item, i.category);
    const unknown = i.costUnknown;
    const sp = unknown ? null : i.netCost * (1 + margin);
    const skuOv = p.sku[i.item];
    return '<tr>' +
      '<td><b>' + esc(i.item) + '</b>' + flagIcon(i) + '</td>' +
      '<td class="wrap">' + esc(i.name) + '</td>' +
      '<td>' + catTag(i.category) + '</td>' +
      '<td class="num">' + costCell(i) + '</td>' +
      '<td class="num"><input type="number" step="any" style="width:78px;text-align:right;padding:5px 6px;" ' +
        'id="skusim-' + attr(i.item) + '" data-skusim="' + attr(i.item) + '" placeholder="—" ' +
        'value="' + (isNum(skuOv) ? attr(skuOv) : '') + '"' + (editable ? '' : ' disabled') + '></td>' +
      '<td class="num">' + fmtPct(margin) + '</td>' +
      '<td class="num">' + (unknown ? '<span class="unknown">—</span>' : fmtMoney(sp)) + '</td>' +
      '<td class="num">' + (unknown ? '<span class="unknown">—</span>' : fmtMoney(sp - i.netCost)) + '</td>' +
    '</tr>';
  }).join('') || emptyRow(8, 'No items match these filters.');
}

<script>
/* ============================================================
   SCREEN: Analytics
   ============================================================ */
function viewAnalytics(){
  const items = nonB2B();
  const t = totals();
  const cats = (STATE.data.categories || []).map(function(c){ return c.category; });
  const catValues = cats.map(function(c){
    return items.filter(function(i){ return i.category === c; })
      .reduce(function(s, i){ return s + i.consolidatedValue; }, 0);
  });
  const catUnits = cats.map(function(c){
    return items.filter(function(i){ return i.category === c; })
      .reduce(function(s, i){ return s + i.consolidatedQty; }, 0);
  });
  const top10 = items.slice().sort(function(a, b){ return b.consolidatedValue - a.consolidatedValue; }).slice(0, 10);

  const labels = ageBucketLabels();
  const buckets = {};
  labels.forEach(function(l){ buckets[l] = 0; });
  items.forEach(function(i){
    (i.lots || []).forEach(function(lot){
      const bucket = ageBucket(lot.age);
      if(bucket) buckets[bucket] += lot.qty * (i.costUnknown ? 0 : i.netCost);
    });
  });

  /* Achieved margin — impossible in the prototype, because a sale
     recorded no selling price at all. */
  const sold = items.filter(function(i){ return i.soldQty > 0; });
  const achievedRevenue = sold.reduce(function(s, i){ return s + i.soldValue; }, 0);
  const achievedCost = sold.reduce(function(s, i){ return s + i.costOfSale; }, 0);
  const achievedMargin = achievedRevenue > 0 ? (achievedRevenue - achievedCost) / achievedRevenue : null;

  const openFlags = items.filter(function(i){ return i.flag && !i.flagResolvedBy; });
  const resolvedFlags = items.filter(function(i){ return i.flag && i.flagResolvedBy; });

  return '<div class="kpi-grid">' +
      kpi('Total SKUs', String(items.length), t.b2bSkus + ' B2B held separately', 'var(--flow)') +
      kpi('Consolidated Value', fmtMoney0(t.consolidatedValue), fmtNum(t.consolidatedQty) + ' units', 'var(--flow)') +
      kpi('Achieved Margin', achievedMargin === null ? '<span class="unknown">no sales yet</span>' : fmtPct(achievedMargin),
        achievedRevenue > 0 ? fmtMoney0(achievedRevenue) + ' revenue less ' + fmtMoney0(achievedCost) + ' cost' :
        'record a selling price on a sale to populate this', 'var(--green)') +
      kpi('Open data-quality flags', String(openFlags.length),
        resolvedFlags.length + ' resolved', openFlags.length ? 'var(--red)' : 'var(--flow)') +
    '</div>' +

    '<div class="grid-2">' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Value by Category</div></div>' +
        '<div class="chart-box">' + chartBar(cats, catValues, null, {px: 230, fmt: money0k}) + '</div></div>' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Units by Category</div></div>' +
        '<div class="chart-box">' + chartBar(cats, catUnits, null, {px: 230, fmt: function(v){ return Math.round(v).toLocaleString('en-US'); }}) + '</div></div>' +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Top 10 Items by Value</div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>#</th><th>Item</th><th>Product</th>' +
      '<th>Category</th><th class="num">Qty</th><th class="num">Oldest age</th><th class="num">Value</th>' +
      '</tr></thead><tbody>' +
      (top10.length ? top10.map(function(i, n){
        const ages = [i.gitOldestAge, i.mwOldestAge].filter(isNum);
        const oldest = ages.length ? Math.max.apply(null, ages) : null;
        return '<tr><td>' + (n + 1) + '</td><td><b>' + esc(i.item) + '</b></td>' +
          '<td class="wrap">' + esc(i.name) + '</td><td>' + catTag(i.category) + '</td>' +
          '<td class="num">' + fmtNum(i.consolidatedQty) + '</td>' +
          '<td class="num" style="color:' + ageColour(oldest) + '">' + fmtDays(oldest) + '</td>' +
          '<td class="num">' + fmtMoney0(i.consolidatedValue) + '</td></tr>';
      }).join('') : emptyRow(7, 'No stock held.')) +
      '</tbody></table></div>' +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Inventory Ageing (value)' +
        '<span>GIT + Main Warehouse, from GIT entry or upload date</span></div></div>' +
      '<div class="chart-box">' + chartBar(labels, labels.map(function(l){ return buckets[l]; }),
        ['#5FE0BE', '#2FBEB0', '#E3A23D', '#E0654F'], {px: 220, fmt: money0k}) + '</div>' +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Data Quality Flags' +
        '<span>a flag records where a source figure was missing and what was used instead</span></div></div>' +
      (openFlags.length || resolvedFlags.length
        ? '<div class="table-wrap"><table><thead><tr><th>Item</th><th>Flag</th><th>Status</th>' +
          (STATE.perms.category ? '<th></th>' : '') + '</tr></thead><tbody>' +
          openFlags.concat(resolvedFlags).map(function(i){
            const resolved = !!i.flagResolvedBy;
            return '<tr>' +
              '<td><b>' + esc(i.item) + '</b></td>' +
              '<td class="wrap" style="max-width:520px;color:' + (resolved ? 'var(--text-dim)' : 'var(--red)') + '">' +
                esc(i.flag) + '</td>' +
              '<td class="wrap">' + (resolved
                ? '<span style="color:var(--green)">confirmed by ' + esc(i.flagResolvedBy) + ' on ' +
                  esc(String(i.flagResolvedAt).slice(0, 10)) + '</span><br><span class="unknown">' +
                  esc(i.flagNote) + '</span>'
                : '<span style="color:var(--red)">open</span>') + '</td>' +
              (STATE.perms.category
                ? '<td><button class="btn secondary sm" data-resolveflag="' + attr(i.item) + '">' +
                  (resolved ? 'Reopen' : 'Confirm') + '</button></td>'
                : '') +
            '</tr>';
          }).join('') + '</tbody></table></div>'
        : '<div class="empty-state">No flags on any item.</div>') +
    '</div>';
}

    '<div class="field narrow"><label>What changed</label><select id="af-entity" data-keep-value="1">' +
      '<option value="">Everything</option>' +
      entities.map(function(e){
        return '<option value="' + attr(e) + '"' + (v.entity === e ? ' selected' : '') + '>' + esc(e) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Search</label>' +
      '<input type="text" id="af-search" data-keep-value="1" placeholder="an item, a name, a reason…" value="' + attr(v.search) + '"></div>' +
    '<div class="field narrow"><label>&nbsp;</label><button class="btn secondary" id="af-clear">Clear</button></div>' +
  '</div>';

  let body;
  if(v.loading && !d) body = '<div class="empty-state">Loading…</div>';
  else if(!d) body = '<div class="empty-state">Nothing loaded yet.</div>';
  else if(!d.rows.length) body = '<div class="empty-state">No changes match these filters.</div>';
  else{
    body = '<div class="table-wrap" data-keep-scroll="audit"><table><thead><tr>' +
      '<th>When</th><th>Who</th><th>What</th><th>Which</th><th>Field</th>' +
      '<th>From</th><th>To</th><th>Reason</th></tr></thead><tbody>' +
      d.rows.map(function(r){
        return '<tr>' +
          '<td>' + esc(fmtDateTime(r.at)) + '</td>' +
          '<td>' + esc(r.actor) + '</td>' +
          '<td>' + esc(r.entity) + '</td>' +
          '<td><b>' + esc(r.key) + '</b></td>' +
          '<td>' + esc(r.field) + '</td>' +
          '<td class="wrap" style="color:var(--text-dim)">' + esc(r.oldValue) + '</td>' +
          '<td class="wrap" style="color:var(--text)">' + esc(r.newValue) + '</td>' +
          '<td class="wrap">' + esc(r.reason) + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>' + pagerServer('audit', d);
  }

  return '<div class="banner info"><div>📒</div><div>The ledger is the history for stock movements. ' +
    'This is the history for everything else: who changed a landed percentage, an FOB override, a support ' +
    'amount, a B2B price or someone\'s access — and what it was before. Inventory valuation without this ' +
    'is not auditable.</div></div>' +
    '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Audit Trail' +
        '<span>' + (d ? d.total + ' entr' + (d.total === 1 ? 'y' : 'ies') : '') + '</span></div>' +
        '<button class="btn secondary sm" id="export-audit">Export CSV</button></div>' +
      filters + body +
    '</div>';
}

/* ============================================================
   SCREEN: Access & Roles
   ============================================================ */
/* Both halves should be on the same build. They will not be, briefly,
   during a deploy — and permanently if someone forgets the second half. */
function buildsMatch(){
  const server = STATE.data && STATE.data.build;
  if(!server) return true;   // an older script does not report one
  return server === STOCKFLOW_BUILD;
}

function viewAccess(){
  const canManage = STATE.perms.directory;
  const roles = STATE.data.roles || [];
  const dir = STATE.data.directory || [];

  const matrix = '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">What each role can change' +
      '<span>enforced on the server, for every request</span></div></div>' +
    '<div class="table-wrap"><table><thead><tr><th>Role</th><th>Stock movements</th>' +
    '<th>Margins &amp; prices</th><th>Landed % / FOB / support</th><th>B2B</th><th>People</th>' +
    '</tr></thead><tbody>' +
    roles.map(function(r){
      const cell = function(v){
        return '<td>' + (v ? '<span style="color:var(--green);font-weight:600;">yes</span>'
          : '<span class="unknown">—</span>') + '</td>';
      };
      return '<tr><td><b>' + esc(r.label) + '</b></td>' +
        cell(r.perms.ledger) + cell(r.perms.pricing) + cell(r.perms.category) +
        cell(r.perms.b2b) + cell(r.perms.directory) + '</tr>';
    }).join('') +
    '</tbody></table></div>' +
    '<div style="font-size:11.5px;color:var(--text-faint);margin-top:12px;">' +
      '<b>Every role can read everything.</b> Nothing on the position is hidden from anyone who can ' +
      'sign in — that is a decision, not an oversight. Roles gate writes only, and they are checked ' +
      'on the server: a request that bypasses this page is refused just the same. There is no ' +
      '"reset data" action anywhere in the API.' +
    '</div></div>';

  const people = '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">Directory' +
      '<span>' + dir.length + ' ' + (dir.length === 1 ? 'person' : 'people') + '</span></div>' +
      (canManage ? '<button class="btn sm" id="add-member">Add someone</button>' : '') + '</div>' +
    '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th>' +
    '<th>Status</th><th>Added by</th><th>Last active</th>' + (canManage ? '<th></th>' : '') +
    '</tr></thead><tbody>' +
    dir.map(function(m){
      return '<tr>' +
        '<td><b>' + esc(m.name) + '</b></td>' +
        '<td>' + esc(m.email) + '</td>' +
        '<td>' + esc(m.roleLabel) + '</td>' +
        '<td>' + (m.status === 'disabled'
          ? '<span style="color:var(--red)">disabled</span>'
          : '<span style="color:var(--green)">active</span>') + '</td>' +
        '<td class="wrap">' + esc(m.addedBy) + '</td>' +
        '<td>' + esc(m.lastActive ? fmtDateTime(m.lastActive) : 'never') + '</td>' +
        (canManage ? '<td><div class="btn-row">' +
          '<button class="btn secondary sm" data-editmember="' + attr(m.userId) + '">Edit</button>' +
          '<button class="btn secondary sm" data-togglemember="' + attr(m.userId) + '">' +
            (m.status === 'disabled' ? 'Enable' : 'Disable') + '</button>' +
        '</div></td>' : '') +
      '</tr>';
    }).join('') +
    '</tbody></table></div>' +
    (canManage ? '<div style="font-size:11.5px;color:var(--text-faint);margin-top:12px;">' +
      'Disabling someone, or pointing their row at a different address, ends their session on their ' +
      'very next request — there is no waiting for a token to expire.</div>' : '') +
    '</div>';

  return matrix + people + '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">This deployment</div></div>' +
    '<div class="table-wrap"><table><tbody>' +
      '<tr><td>Signed in as</td><td><b>' + esc((STATE.session || {}).name) + '</b> (' +
        esc((STATE.session || {}).email) + ')</td></tr>' +
      '<tr><td>Server date used for every age</td><td><b>' + esc(STATE.today) + '</b></td></tr>' +
      '<tr><td>Data revision</td><td>' + esc(String(STATE.revision)) + '</td></tr>' +
      '<tr><td>This page (stockflow.html)</td><td><b>' + esc(STOCKFLOW_BUILD) + '</b></td></tr>' +
      '<tr><td>The script (Code.gs)</td><td><b>' +
        esc((STATE.data && STATE.data.build) || 'not reported') + '</b>' +
        (buildsMatch() ? '' :
          ' <span style="color:var(--amber);">— these differ. One side was deployed and the other ' +
          'was not, or this page came from the browser cache. Re-upload stockflow.html and ' +
          'hard-refresh (Ctrl+Shift+R, or Cmd+Shift+R on a Mac).</span>') +
      '</td></tr>' +
    '</tbody></table></div>' +
    '<div class="btn-row" style="margin-top:14px;">' +
      '<button class="btn secondary" id="access-check">Run connection check</button>' +
    '</div>' +
    '<div id="access-diag" style="margin-top:12px;"></div>' +
  '</div>';
}
</script>

<script>
/* ============================================================
   MODALS
   ------------------------------------------------------------
   While STATE.modal is set the background poll never re-renders —
   it sets STATE.stale instead, and the strip appears when the
   dialog closes. Re-rendering over an open form throws away
   whatever someone was half-way through typing.
   ============================================================ */
function renderModal(){
  const m = STATE.modal;
  if(!m) return '<div class="modal-overlay" id="modal"></div>';
  let inner = '';

  if(m.kind === 'reverse'){
    const r = m.row || {};
    inner =
      '<div class="modal-head"><div class="modal-title">Reverse a movement</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="modal-sub">A stock ledger is corrected with a reversing entry, never by editing or ' +
        'deleting. The original row stays exactly as recorded and this reversal sits beside it, with ' +
        'your reason on the record. If anything recorded later depends on this movement, the reversal ' +
        'will be refused and will name what is blocking it.</div>' +
      '<div class="table-wrap" style="margin-bottom:16px;"><table><tbody>' +
        '<tr><td>Date</td><td><b>' + esc(r.date) + '</b></td></tr>' +
        '<tr><td>Item</td><td><b>' + esc(r.item) + '</b></td></tr>' +
        '<tr><td>Type</td><td>' + typePill(r.type) + '</td></tr>' +
        '<tr><td>Quantity</td><td><b>' + fmtNum(r.qty) + '</b></td></tr>' +
        '<tr><td>Reference</td><td>' + esc(r.ref || '—') + '</td></tr>' +
        '<tr><td>Posted by</td><td>' + esc(r.actor) + '</td></tr>' +
      '</tbody></table></div>' +
      '<div class="field"><label>Why is this being reversed?</label>' +
        '<input type="text" id="reverse-reason" placeholder="e.g. quantity typed as 999 instead of 9"></div>' +
      (m.error ? '<div class="auth-msg err" style="margin-top:12px;">' + esc(m.error).replace(/\n/g, '<br>') + '</div>' : '') +
      '<div class="modal-actions">' +
        '<button class="btn secondary" data-modalclose="1">Cancel</button>' +
        '<button class="btn danger" id="reverse-confirm"' + (m.busy ? ' disabled' : '') + '>' +
          (m.busy ? 'Reversing…' : 'Post the reversal') + '</button>' +
      '</div>';

  }else if(m.kind === 'flag'){
    const i = itemByCode(m.item) || {};
    const resolved = !!i.flagResolvedBy;
    inner =
      '<div class="modal-head"><div class="modal-title">' +
        (resolved ? 'Reopen this flag' : 'Confirm this figure') + '</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="modal-sub">A data-quality flag records where a source figure was missing and what was ' +
        'used instead. Confirming it does not erase it — the original text stays on the item, with your ' +
        'note and your name beside it.</div>' +
      '<div class="banner"><div>⚠</div><div><b>' + esc(m.item) + '</b><br>' + esc(i.flag) + '</div></div>' +
      '<div class="field"><label>' + (resolved ? 'Why is this being reopened?' : 'What was confirmed, and by whom?') + '</label>' +
        '<input type="text" id="flag-note" placeholder="e.g. HP confirmed $545.90 by email on 2026-08-19" ' +
        'value="' + attr(resolved ? '' : (i.flagNote || '')) + '"></div>' +
      (m.error ? '<div class="auth-msg err" style="margin-top:12px;">' + esc(m.error) + '</div>' : '') +
      '<div class="modal-actions">' +
        '<button class="btn secondary" data-modalclose="1">Cancel</button>' +
        '<button class="btn" id="flag-confirm"' + (m.busy ? ' disabled' : '') + '>' +
          (m.busy ? 'Saving…' : (resolved ? 'Reopen' : 'Confirm')) + '</button>' +
      '</div>';

  }else if(m.kind === 'member'){
    const editing = !!m.userId;
    const existing = editing
      ? (STATE.data.directory || []).filter(function(d){ return d.userId === m.userId; })[0] || {}
      : {};
    inner =
      '<div class="modal-head"><div class="modal-title">' +
        (editing ? 'Edit ' + esc(existing.name) : 'Add someone to Stockflow') + '</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="modal-sub">They sign in with a code emailed to this address, so it has to be one they ' +
        'can read. Changing it here ends any session they currently hold.</div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Full name</label>' +
        '<input type="text" id="member-name" value="' + attr(existing.name || '') + '"></div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Work email</label>' +
        '<input type="email" id="member-email" value="' + attr(existing.email || '') + '"></div>' +
      '<div class="field"><label>Role</label><select id="member-role">' +
        (STATE.data.roles || []).map(function(r){
          return '<option value="' + attr(r.id) + '"' +
            ((existing.role || 'board') === r.id ? ' selected' : '') + '>' + esc(r.label) + '</option>';
        }).join('') + '</select></div>' +
      '<div style="font-size:11.5px;color:var(--text-faint);margin-top:10px;">' +
        'Admin: everything. Warehouse: stock movements. Sales: margins and prices. Board: read-only. ' +
        'Every role sees the whole position.</div>' +
      (m.error ? '<div class="auth-msg err" style="margin-top:12px;">' + esc(m.error) + '</div>' : '') +
      '<div class="modal-actions">' +
        '<button class="btn secondary" data-modalclose="1">Cancel</button>' +
        '<button class="btn" id="member-save"' + (m.busy ? ' disabled' : '') + '>' +
          (m.busy ? 'Saving…' : 'Save') + '</button>' +
      '</div>';

  }else if(m.kind === 'brand'){
    inner = brandModal();

  }else if(m.kind === 'diag'){
    inner =
      '<div class="modal-head"><div class="modal-title">' + esc(m.title || 'Connection check') + '</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="diag">' + esc(m.text || '') + '</div>' +
      '<div class="modal-actions"><button class="btn secondary" data-modalclose="1">Close</button></div>';
  }

  return '<div class="modal-overlay show" id="modal"><div class="modal-box' +
    (m.kind === 'diag' ? ' wide' : '') + '">' + inner + '</div></div>';
}

function openModal(m){ STATE.modal = m; render(); }
function closeModal(){
  STATE.modal = null;
  render();
  /* Anything that changed while the dialog was open is applied now. */
  if(STATE.stale) refreshData();
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function bindHandlers(){
  if(STATE.phase === 'fatal'){
    on('#fatal-retry', 'click', function(){ boot(); });
    on('#fatal-check', 'click', async function(){
      const out = document.getElementById('fatal-diag');
      out.innerHTML = '<div class="diag">Checking…</div>';
      const lines = await connectionCheck();
      out.innerHTML = '<div class="diag">' + esc(lines.join('\n')) + '</div>';
    });
    return;
  }

  if(STATE.phase === 'auth'){ bindAuth(); return; }
  if(STATE.phase !== 'app') return;

  on('.nav-item', 'click', function(e){
    STATE.tab = e.currentTarget.dataset.tab;
    render();
    if(STATE.tab === 'ledger' && !STATE.views.ledger.data){ loadLedger(); loadImports(); }
    if(STATE.tab === 'audit' && !STATE.views.audit.data) loadAudit();
  });
  on('#sign-out', 'click', function(){
    setSessionToken('');
    STATE.session = null; STATE.data = null; STATE.phase = 'auth';
    STATE.auth = {step: 'email', email: lastEmail(), message: 'Signed out.', messageKind: 'info', busy: false, needsBootstrap: false};
    render();
  });
  on('#refresh-now', 'click', function(){ refreshData(); });
  on('#brand-switch', 'click', function(){ openModal({kind: 'brand'}); });
  on('[data-brand]', 'click', function(e){
    const brand = e.currentTarget.dataset.brand;
    const counts = brandsWithStock();
    if(brand && !counts[brand]){
      toast(brand + ' has no items in Stockflow yet — it is scaffolded, not switched off.', true);
      return;
    }
    STATE.activeBrand = brand || null;
    /* A change of scope returns every view to page one; page 4 of a list
       that is now nine rows long is an empty screen. */
    Object.keys(STATE.views).forEach(function(k){ STATE.views[k].page = 1; });
    STATE.modal = null;
    render();
    /* The movement views are filtered on the server, so they have to be
       asked again; the position screens re-filter in place. */
    if(STATE.views.ledger.data) loadLedger();
    if(STATE.views.imports.data) loadImports();
    toast(brand ? 'Viewing ' + brand : 'Viewing every brand');
  });
  on('#foot-check, #access-check', 'click', async function(){
    openModal({kind: 'diag', title: 'Connection check', text: 'Checking both hops…'});
    const lines = await connectionCheck();
    if(STATE.modal && STATE.modal.kind === 'diag'){
      STATE.modal.text = lines.join('\n');
      render();
    }
  });
  on('[data-modalclose]', 'click', function(){ closeModal(); });
  on('#modal', 'click', function(e){ if(e.target.id === 'modal') closeModal(); });

  /* client-side view controls */
  on('[data-sort]', 'click', function(e){
    const viewId = e.currentTarget.dataset.sort, field = e.currentTarget.dataset.field;
    const v = STATE.views[viewId];
    if(v.sortBy === field) v.sortDir = v.sortDir === 'asc' ? 'desc' : 'asc';
    else { v.sortBy = field; v.sortDir = 'asc'; }
    v.page = 1;              // a change of sort always returns to page one
    render();
  });
  on('[data-page]', 'click', function(e){
    STATE.views[e.currentTarget.dataset.page].page = Number(e.currentTarget.dataset.to);
    render();
  });
  on('[data-clearview]', 'click', function(e){
    const v = STATE.views[e.currentTarget.dataset.clearview];
    v.search = ''; v.category = ''; v.location = ''; v.flagged = false; v.page = 1;
    render();
  });
  ['git', 'mainwh', 'consolidated', 'itemmaster', 'simulator'].forEach(function(viewId){
    const v = STATE.views[viewId];
    on('#vf-' + viewId + '-search', 'input', debounce(function(e){
      v.search = e.target.value; v.page = 1; render();
    }, 200));
    on('#vf-' + viewId + '-category', 'change', function(e){ v.category = e.target.value; v.page = 1; render(); });
    on('#vf-' + viewId + '-location', 'change', function(e){ v.location = e.target.value; v.page = 1; render(); });
    on('#vf-' + viewId + '-flagged', 'change', function(e){ v.flagged = e.target.checked; v.page = 1; render(); });
  });

  bindLedger();
  bindItemMaster();
  bindSimulator();
  bindCategory();
  bindB2B();
  bindAnalytics();
  bindAudit();
  bindAccess();
  bindModalActions();
}

function debounce(fn, ms){
  let timer = null;
  return function(){
    const args = arguments, self = this;
    clearTimeout(timer);
    timer = setTimeout(function(){ fn.apply(self, args); }, ms);
  };
}

function lastEmail(){
  try{ return localStorage.getItem(EMAIL_KEY) || ''; }catch(e){ return ''; }
}

/* ---------------- Sign-in ---------------- */
function bindAuth(){
  const a = STATE.auth;
  const send = async function(){
    const input = document.getElementById('auth-email');
    const email = String(input ? input.value : a.email).trim();
    if(!email){ a.message = 'Enter your work email address.'; a.messageKind = 'err'; render(); return; }
    a.email = email; a.busy = true; a.message = null; render();
    try{
      const res = await rpc('requestOtp', {email: email});
      try{ localStorage.setItem(EMAIL_KEY, email); }catch(e){}
      a.step = 'code'; a.busy = false;
      a.message = 'A ' + res.expiresInMinutes + '-minute code is on its way to ' + email + '.';
      a.messageKind = 'info';
    }catch(err){
      a.busy = false;
      /* A lost reply on requestOtp means the email really was sent. */
      if(err.replyLost){
        a.step = 'code';
        a.message = 'The reply was lost on the way back, but the request did reach the server — ' +
          'so the code has probably been sent. Check your email.';
        a.messageKind = 'info';
      }else{
        const d = diagnose(err);
        a.message = d.detail; a.messageKind = 'err';
      }
    }
    render();
  };

  on('#auth-send', 'click', send);
  on('#auth-resend', 'click', send);
  on('#auth-email', 'keydown', function(e){ if(e.key === 'Enter') send(); });

  on('#auth-back', 'click', function(){
    STATE.auth = {step: 'email', email: a.email, message: null, messageKind: 'info', busy: false, needsBootstrap: false};
    render();
  });

  const verify = async function(){
    const input = document.getElementById('auth-code');
    const code = String(input ? input.value : '').replace(/\D/g, '');
    if(code.length !== 6){ a.message = 'Enter the 6-digit code from your email.'; a.messageKind = 'err'; render(); return; }
    a.busy = true; a.message = null; render();
    try{
      const res = await rpc('verifyOtp', {email: a.email, code: code});
      setSessionToken(res.sessionToken);
      STATE.session = res.session;
      await loadApp();
    }catch(err){
      a.busy = false;
      a.message = diagnose(err).detail; a.messageKind = 'err';
      render();
    }
  };
  on('#auth-verify', 'click', verify);
  on('#auth-code', 'keydown', function(e){ if(e.key === 'Enter') verify(); });

  on('#bootstrap-btn', 'click', async function(){
    const name = (document.getElementById('bootstrap-name') || {}).value || '';
    const email = (document.getElementById('bootstrap-email') || {}).value || '';
    a.busy = true; a.message = null; render();
    try{
      await rpc('createFirstAdmin', {name: name.trim(), email: email.trim()});
      STATE.auth = {step: 'email', email: email.trim(), busy: false, needsBootstrap: false,
        message: 'Admin created. Now sign in with an emailed code, like everyone else.', messageKind: 'info'};
    }catch(err){
      a.busy = false; a.message = diagnose(err).detail; a.messageKind = 'err';
    }
    render();
  });

  on('#auth-check', 'click', async function(){
    const out = document.getElementById('auth-diag');
    out.innerHTML = '<div class="diag" style="margin-top:14px;">Checking…</div>';
    const lines = await connectionCheck();
    out.innerHTML = '<div class="diag" style="margin-top:14px;">' + esc(lines.join('\n')) + '</div>';
  });
}
</script>

<script>
/* ---------------- Ledger handlers ---------------- */
function bindLedger(){
  if(STATE.tab !== 'ledger') return;

  /* Which fields a type needs. The prototype hid the FOB box for
     non-purchases and nothing else; there are more fields now. */
  const syncFields = function(){
    const typeEl = document.getElementById('f-type');
    if(!typeEl) return;
    const type = typeEl.value;
    const show = function(id, on){
      const el = document.getElementById(id);
      if(el) el.style.display = on ? 'flex' : 'none';
    };
    show('f-fob-wrap', type === 'Purchase-Backlog' || type === 'Opening Balance-MainWH');
    show('f-loc-wrap', type !== 'Purchase-Backlog' && type !== 'Ship-to-GIT');
    show('f-toloc-wrap', type === 'Transfer-MainWH');
    show('f-sell-wrap', type === 'Sale-from-GIT' || type === 'Sale-from-MainWH');
    const locLabel = document.querySelector('#f-loc-wrap label');
    if(locLabel) locLabel.textContent = type === 'Transfer-MainWH' ? 'Move from' : 'Warehouse';
  };
  on('#f-type', 'change', syncFields);
  syncFields();

  on('#log-btn', 'click', async function(){
    const val = function(id){ const el = document.getElementById(id); return el ? el.value : ''; };
    const data = {
      date: val('f-date'), item: val('f-item'), type: val('f-type'),
      qty: val('f-qty'), fob: val('f-fob'), ref: val('f-ref'), notes: val('f-notes'),
      location: val('f-location'), toLocation: val('f-tolocation'), sellPrice: val('f-sellprice')
    };
    const dup = document.getElementById('f-allow-dup');
    if(!data.qty){ toast('Enter a quantity greater than 0', true); return; }
    STATE.busy = 'post'; render();
    try{
      await mutate('postTransaction', {data: data, allowDuplicate: !!(dup && dup.checked)});
      toast('Logged: ' + data.type + ' — ' + data.item + ' × ' + data.qty);
      ['f-qty', 'f-fob', 'f-ref', 'f-notes', 'f-sellprice'].forEach(function(id){
        const el = document.getElementById(id); if(el) el.value = '';
      });
      const d = document.getElementById('f-allow-dup'); if(d) d.checked = false;
      STATE.busy = null;
      await refreshData();
      await loadLedger();
    }catch(err){
      STATE.busy = null;
      const diagnosis = diagnose(err);
      toast(diagnosis.detail, !err.probablySucceeded);
      render();
    }
  });

  /* Filters. A change to any of them returns to page one. */
  const setFilter = function(key, value){
    const v = STATE.views.ledger;
    v[key] = value; v.page = 1;
    loadLedger();
  };
  on('#lf-from', 'change', function(e){ setFilter('dateFrom', e.target.value); });
  on('#lf-to', 'change', function(e){ setFilter('dateTo', e.target.value); });
  on('#lf-item', 'change', function(e){ setFilter('item', e.target.value); });
  on('#lf-type', 'change', function(e){ setFilter('type', e.target.value); });
  on('#lf-search', 'input', debounce(function(e){ setFilter('search', e.target.value); }, 300));
  on('#lf-clear', 'click', function(){
    STATE.views.ledger = Object.assign(STATE.views.ledger,
      {page: 1, dateFrom: '', dateTo: '', item: '', type: '', search: ''});
    loadLedger();
  });
  on('[data-spage]', 'click', function(e){
    const viewId = e.currentTarget.dataset.spage;
    STATE.views[viewId].page = Number(e.currentTarget.dataset.to);
    const loaders = {ledger: loadLedger, audit: loadAudit, imports: loadImports};
    (loaders[viewId] || loadLedger)();
  });
  on('[data-batch-dl]', 'click', function(e){
    const id = e.currentTarget.dataset.batchDl;
    /* A specific import, whatever brand is currently selected. */
    exportLedgerCsv({batchId: id, brand: ''}, 'stockflow-import-' + id + '.csv');
  });
  on('[data-reverse]', 'click', function(e){
    const id = e.currentTarget.dataset.reverse;
    const row = ((STATE.views.ledger.data || {}).rows || []).filter(function(r){ return r.txnId === id; })[0];
    openModal({kind: 'reverse', txnId: id, row: row || {}});
  });
  on('#export-ledger', 'click', function(){ exportLedgerCsv(); });
  on('#export-batch', 'click', function(e){
    const id = e.currentTarget.dataset.batch;
    exportLedgerCsv({batchId: id}, 'stockflow-import-' + id + '.csv');
  });

  /* Bulk upload */
  on('#download-template', 'click', function(){
    download('stockflow-upload-template.csv', templateCsv());
  });
  on('#copy-template', 'click', function(){
    const csv = templateCsv();
    const paste = document.getElementById('bulk-paste');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(csv).then(
        function(){ toast('Template copied — paste it into Excel, or into the box below'); },
        function(){ if(paste) paste.value = csv; toast('Clipboard blocked — put the template in the box instead'); }
      );
    }else{
      if(paste) paste.value = csv;
      toast('Template put in the box below');
    }
  });
  on('#bulk-file', 'change', function(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){ checkBulk(String(reader.result || ''), file.name); };
    reader.onerror = function(){
      STATE.bulk.error = 'That file could not be read. If it is open in Excel, close it and try again.';
      render();
    };
    /* Read as UTF-8 explicitly. Left to the browser, a file Excel saved
       on a Windows machine can come back in the system code page and
       every accented product name arrives as mojibake. */
    reader.readAsText(file, 'UTF-8');
  });
  on('#bulk-parse', 'click', function(){
    const paste = document.getElementById('bulk-paste');
    const text = paste ? paste.value.trim() : '';
    if(!text){ toast('Paste some CSV rows first', true); return; }
    checkBulk(text);
  });
  on('#flip-date-order', 'click', function(){
    const d = STATE.bulk.dateInfo;
    STATE.bulk.dateOrder = (d && d.order === 'DMY') ? 'MDY' : 'DMY';
    if(STATE.bulk.rawText) checkBulk(STATE.bulk.rawText);
  });
  on('#bulk-skip', 'change', function(e){ STATE.bulk.skipInvalid = e.target.checked; });
  on('#bulk-cancel', 'click', function(){
    STATE.bulk = {rows: [], preview: null, busy: false, error: null, skipInvalid: true,
      ignored: null, fileName: null, delimiter: null, lastBatchId: null,
      rawText: null, dateOrder: null, dateInfo: null};
    const paste = document.getElementById('bulk-paste');
    if(paste) paste.value = '';
    render();
  });
  on('#bulk-commit', 'click', function(){ commitBulk(false); });
  on('#bulk-export-errors', 'click', function(){
    const rows = ((STATE.bulk.preview || {}).rows || []).filter(function(r){ return r.status !== 'ok'; });
    download('stockflow-refused-rows.csv', toCsv(
      [['line', 'date', 'item', 'type', 'qty', 'fob', 'location', 'toLocation', 'ref', 'why it was refused']]
        .concat(rows.map(function(r){
          return [r.line, r.date, r.item, r.type, r.qty, r.fob, r.location, r.toLocation, r.ref, r.errors.join('; ')];
        }))));
  });
}

async function checkBulk(text, fileName){
  STATE.bulk.error = null; STATE.bulk.preview = null; STATE.bulk.ignored = null;
  if(fileName !== undefined) STATE.bulk.fileName = fileName || null;
  /* Kept so the file can be re-read under the other date order without
     asking the person to paste it again. */
  STATE.bulk.rawText = text;
  STATE.bulk.delimiter = null;
  STATE.bulk.dateInfo = null;
  STATE.bulk.busy = true; render();
  const parsed = csvToObjects(text);
  STATE.bulk.delimiter = parsed.delimiter;
  if(parsed.error){
    /* "Your file is malformed" and "Stockflow hit an internal error" are
       different problems and are reported differently. This is the first. */
    STATE.bulk.busy = false;
    STATE.bulk.error = 'That file could not be read: ' + parsed.error;
    render();
    return;
  }
  if(!parsed.rows.length){
    STATE.bulk.busy = false;
    STATE.bulk.error = 'The file has a header row but no data rows underneath it.';
    render();
    return;
  }
  /* Excel's date rewriting, undone before the rows go anywhere. */
  const preferred = STATE.bulk.dateOrder ||
    ((STATE.data && STATE.data.settings && STATE.data.settings.csvDateOrder) || 'DMY');
  const dated = normaliseCsvDates(parsed.rows, preferred);
  STATE.bulk.dateInfo = dated.info;
  if(dated.info.conflict){
    STATE.bulk.busy = false;
    STATE.bulk.error = 'This file contradicts itself on dates: some read as day/month ' +
      '(like 25/08/2026) and others as month/day (like 08/25/2026), so there is no one ' +
      'reading that fits. Fix the dates in the file, or write them as YYYY-MM-DD.';
    render();
    return;
  }

  /* ONE staged set of rows, and both the preview and the commit send
     exactly it. They were briefly allowed to differ — the preview went
     on sending `parsed.rows` while the commit sent the date-converted
     `dated.rows` — so every upload with a local-format date was refused
     at the preview and never reached the commit that would have worked.
     Whatever is previewed must be what is posted; nothing else may be
     in scope to send by mistake. */
  STATE.bulk.rows = dated.rows;
  STATE.bulk.ignored = parsed.ignoredColumns;
  try{
    const preview = await rpc('bulkPostTransactions',
      {rows: STATE.bulk.rows, dryRun: true, skipInvalid: true});
    STATE.bulk.preview = preview;
    STATE.bulk.busy = false;
    if(preview.duplicateBatch){
      STATE.bulk.error = 'These exact rows were already imported on ' +
        String(preview.duplicateBatch.importedAt).slice(0, 10) + ' by ' + preview.duplicateBatch.importedBy +
        '. Importing them again would double every quantity. Only continue if this really is a ' +
        'second, genuine set of movements.';
    }
  }catch(err){
    STATE.bulk.busy = false;
    const d = diagnose(err);
    STATE.bulk.error = (err.internal ? 'Stockflow hit an internal error — this is not a problem with your file. ' : '') + d.detail;
  }
  render();
}

async function commitBulk(force){
  const skipEl = document.getElementById('bulk-skip');
  STATE.bulk.busy = true; render();
  try{
    const res = await mutate('bulkPostTransactions', {
      rows: STATE.bulk.rows,
      skipInvalid: skipEl ? skipEl.checked : STATE.bulk.skipInvalid,
      force: !!force || !!(STATE.bulk.preview && STATE.bulk.preview.duplicateBatch)
    });
    STATE.bulk = {rows: [], preview: null, busy: false, error: null, skipInvalid: true,
      ignored: null, fileName: null, delimiter: null, lastBatchId: null,
      rawText: null, dateOrder: null, dateInfo: null};
    const paste = document.getElementById('bulk-paste');
    if(paste) paste.value = '';
    STATE.bulk.lastBatchId = res.batchId;
    toast(res.imported + ' movement(s) imported' + (res.skipped ? ', ' + res.skipped + ' skipped' : ''));
    await refreshData();
    await loadLedger();
    await loadImports();
  }catch(err){
    STATE.bulk.busy = false;
    STATE.bulk.error = diagnose(err).detail;
    render();
  }
}

const LEDGER_EXPORT_COLUMNS = ['txnId', 'date', 'item', 'brand', 'type', 'qty', 'fob', 'location',
  'toLocation', 'ref', 'notes', 'sellPrice', 'unitCostAtSale', 'saleValue', 'costOfSale',
  'reversalOf', 'reversalReason', 'batchId', 'actor', 'createdAt', 'voided'];

function ledgerRowsToCsv(rows){
  return toCsv([LEDGER_EXPORT_COLUMNS].concat(rows.map(function(r){
    return LEDGER_EXPORT_COLUMNS.map(function(h){
      return (r[h] === null || r[h] === undefined) ? '' : r[h];
    });
  })));
}

/* Everything matching the current filters, not the twenty-five on
   screen. Exporting one visible page and calling it an export is the
   sort of thing nobody notices until they are reconciling against it and
   the totals are short. */
async function exportLedgerCsv(overrides, filenameHint){
  const v = STATE.views.ledger;
  const query = Object.assign({
    pageSize: 'all',
    brand: STATE.activeBrand || '',
    dateFrom: v.dateFrom, dateTo: v.dateTo, item: v.item, type: v.type,
    search: v.search, sortBy: v.sortBy, sortDir: v.sortDir
  }, overrides || {});

  const btn = document.getElementById('export-ledger');
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try{
    const all = await rpc('getLedger', query);
    if(!all.rows.length){ toast('Nothing to export with these filters', true); return; }
    if(all.truncated){
      toast('That is ' + all.total + ' rows; the first ' + all.limit +
        ' were exported. Narrow the date range to get the rest.', true);
    }
    download(filenameHint || ledgerExportName(query), ledgerRowsToCsv(all.rows));
  }catch(err){
    toast(diagnose(err).detail, true);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Export CSV'; }
  }
}

/* A filename that says what is in it, so three exports in a downloads
   folder are still tellable apart a week later. */
function ledgerExportName(q){
  const bits = ['stockflow-ledger'];
  if(q.batchId) bits.push('import-' + q.batchId);
  if(q.brand) bits.push(String(q.brand).toLowerCase().replace(/[^a-z0-9]+/g, '-'));
  if(q.item) bits.push(String(q.item).toLowerCase());
  if(q.type) bits.push(String(q.type).toLowerCase().replace(/[^a-z0-9]+/g, '-'));
  if(q.dateFrom || q.dateTo) bits.push((q.dateFrom || 'start') + '_to_' + (q.dateTo || STATE.today));
  if(bits.length === 1) bits.push('all');
  return bits.join('-') + '.csv';
}

/* A download the page starts itself. Kept to a Blob URL and revoked
   afterwards so a long session does not leak them. */
function download(filename, text){
  try{
    const blob = new Blob([text], {type: 'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('Downloaded ' + filename);
  }catch(err){
    toast('This browser would not start the download.', true);
  }
}

function bindSimInputs(){

    STATE.marginDraft.sku[item] = raw === '' ? null : Number(raw);
    redrawSimBody();
    saveMargins([{scope: 'sku', key: item, percent: raw === '' ? null : Number(raw)}]);
  });
}

async function saveMargins(changes){
  STATE.busy = 'margins'; render();
  try{
    for(let i = 0; i < changes.length; i++){
      await mutate('setMargin', changes[i]);
    }
    STATE.busy = null;
    STATE.marginDraft = {category: {}, sku: {}};
    toast(changes.length === 1 ? 'Margin saved' : changes.length + ' margins saved');
    await refreshData();
  }catch(err){
    STATE.busy = null;
    toast(diagnose(err).detail, !err.probablySucceeded);
    await refreshData();
  }
}

    }
  });
}

<script>
/* ============================================================
   DATA LOADING AND THE BOOT SEQUENCE
   ============================================================ */

async function loadLedger(){
  const v = STATE.views.ledger;
  v.loading = true;
  try{
    v.data = await rpc('getLedger', {
      page: v.page, pageSize: PAGE_SIZE,
      /* The switcher scopes the movements too. Without this, selecting a
         brand filtered every position screen and left the ledger showing
         everything — which reads as a bug the moment a second brand is
         loaded, and is invisible until then. */
      brand: STATE.activeBrand || '',
      dateFrom: v.dateFrom, dateTo: v.dateTo, item: v.item, type: v.type,
      search: v.search, sortBy: v.sortBy, sortDir: v.sortDir
    });
  }catch(err){
    if(!err.sessionInvalid) toast(diagnose(err).detail, true);
  }
  v.loading = false;
  if(!STATE.modal) render();
}

async function loadImports(){
  const v = STATE.views.imports;
  v.loading = true;
  try{
    v.data = await rpc('getImportBatches', {
      page: v.page, pageSize: 10, brand: STATE.activeBrand || ''
    });
  }catch(err){
    if(!err.sessionInvalid) toast(diagnose(err).detail, true);
  }
  v.loading = false;
  if(!STATE.modal) render();
}

async function loadAudit(){
  const v = STATE.views.audit;
  v.loading = true;
  try{
    v.data = await rpc('getAudit', {
      page: v.page, pageSize: PAGE_SIZE,
      dateFrom: v.dateFrom, dateTo: v.dateTo, entity: v.entity, search: v.search
    });
  }catch(err){
    if(!err.sessionInvalid) toast(diagnose(err).detail, true);
  }
  v.loading = false;
  if(!STATE.modal) render();
}

async function refreshData(){
  try{
    const data = await rpc('getBootstrap', {});
    applyBootstrap(data);
    STATE.stale = false;
    if(!STATE.modal) render();
  }catch(err){
    if(!err.sessionInvalid) toast(diagnose(err).detail, true);
  }
}

function applyBootstrap(data){
  STATE.data = data;
  STATE.today = data.today;           // the server's date, always
  STATE.session = data.session;
  STATE.perms = data.perms || STATE.perms;
  STATE.revision = data.revision;
  STATE.marginDraft = {category: {}, sku: {}};
}

async function loadApp(){
  const data = await rpc('getBootstrap', {});
  applyBootstrap(data);
  STATE.phase = 'app';
  render();
  if(STATE.tab === 'ledger'){ loadLedger(); loadImports(); }
  startPolling();
}

function onSessionLost(message){
  setSessionToken('');
  STATE.phase = 'auth';
  STATE.session = null;
  STATE.data = null;
  STATE.auth = {step: 'email', email: lastEmail(), message: message, messageKind: 'err', busy: false, needsBootstrap: false};
  stopPolling();
  render();
}

/* The background poll asks only for a revision number. If it has moved
   it refreshes — unless a dialog is open, in which case it sets the
   stale flag and the strip appears the moment the dialog closes.
   Re-rendering over an open form throws away someone's work. */
let pollTimer = null;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(async function(){
    if(STATE.phase !== 'app') return;
    try{
      const res = await rpc('getRevision', {});
      if(res.today !== STATE.today){
        /* The server's day rolled over while the page was open. Every
           age on screen is now one day out; take the new date. */
        STATE.today = res.today;
        if(!STATE.modal) await refreshData();
        else STATE.stale = true;
        return;
      }
      if(res.revision !== STATE.revision){
        if(STATE.modal) STATE.stale = true;
        else await refreshData();
      }
    }catch(err){ /* a poll that fails is not worth interrupting anyone for */ }
  }, 45000);
}
function stopPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

async function boot(){
  STATE.phase = 'loading';
  STATE.fatal = null;
  render();

  if(!backendUrl()){
    STATE.phase = 'fatal';
    STATE.fatal = {
      title: 'This page has not been pointed at a Google Sheet',
      detail: 'Whoever published stockflow.html needs to set STOCKFLOW_BACKEND_URL near the top of ' +
        'the file to the Apps Script Web App /exec URL. Until then there is nothing for this page to read.'
    };
    render();
    return;
  }

  /* A stored token is tried first, so a returning user goes straight in. */
  if(sessionToken()){
    try{
      await loadApp();
      return;
    }catch(err){
      if(err.sessionInvalid) return;                 // onSessionLost already redrew
      STATE.phase = 'fatal';
      STATE.fatal = diagnose(err);
      render();
      return;
    }
  }

  try{
    const ctx = await rpc('getLoginContext', {});
    STATE.today = ctx.today;
    STATE.phase = 'auth';
    STATE.auth = {
      step: 'email', email: lastEmail(), message: null, messageKind: 'info',
      busy: false, needsBootstrap: !!ctx.needsBootstrap
    };
    if(!ctx.emailConfigured){
      STATE.auth.message = 'This Stockflow Sheet cannot send email yet, so a sign-in code will not ' +
        'arrive. Whoever set it up needs to run configureEmailFromSheet or set POSTMARK_TOKEN and ' +
        'POSTMARK_FROM in Script Properties.';
      STATE.auth.messageKind = 'err';
    }
  }catch(err){
    STATE.phase = 'fatal';
    STATE.fatal = diagnose(err);
  }
  render();
}

/* Only start in a browser. Under Node — where the test suite loads this
   same file to check the CSV parser, the margin resolver, the formatters
   and the tag balance of every screen — there is no document to render
   into and nothing should reach for one. */
if(typeof document !== 'undefined' && typeof window !== 'undefined' && !window.__HEADLESS__){
  boot();
}
</script>
</body>
</html>
