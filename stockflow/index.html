<script>
/* ============================================================
   SCREEN: Analytics
   ============================================================ */
function viewAnalytics(){
  const t = positionFigures();
  const items = scopedItems().filter(function(i){ return !i.b2b; });

  /* Every chart on this screen describes held stock, so each of them
     follows the filter the cards follow. A filtered card beside an
     unfiltered chart is the worst of both. */
  const catRows = t.filtered
    ? t.byCategory
    : (STATE.data.categories || []).map(function(c){
        const mine = items.filter(function(i){ return i.category === c.category; });
        return {
          category: c.category,
          value: mine.reduce(function(s, i){ return s + i.consolidatedValue; }, 0),
          qty: mine.reduce(function(s, i){ return s + i.consolidatedQty; }, 0)
        };
      });
  const cats = catRows.map(function(c){ return c.category; });
  const catValues = catRows.map(function(c){ return c.value; });
  const catUnits = catRows.map(function(c){ return c.qty; });

  const top10 = t.filtered
    ? t.topItems
    : items.slice()
        .sort(function(a, b){ return b.consolidatedValue - a.consolidatedValue; })
        .slice(0, 10)
        .map(function(i){
          const ages = [i.gitOldestAge, i.mwOldestAge].filter(isNum);
          return {item: i.item, name: i.name, category: i.category,
            qty: i.consolidatedQty, value: i.consolidatedValue,
            oldest: ages.length ? Math.max.apply(null, ages) : null};
        });

  let labels, bucketValues;
  if(t.filtered){
    labels = t.ageBuckets.map(function(b){ return b.label; });
    bucketValues = t.ageBuckets.map(function(b){ return b.value; });
  }else{
    labels = ageBucketLabels();
    const buckets = {};
    labels.forEach(function(l){ buckets[l] = 0; });
    items.forEach(function(i){
      (i.lots || []).forEach(function(lot){
        const bucket = ageBucket(lot.age);
        if(bucket) buckets[bucket] += lot.qty * (i.costUnknown ? 0 : i.netCost);
      });
    });
    bucketValues = labels.map(function(l){ return buckets[l]; });
  }

  /* Achieved margin — impossible in the prototype, because a sale
     recorded no selling price at all. */
  const sold = items.filter(function(i){ return i.soldQty > 0; });
  const achievedRevenue = sold.reduce(function(s, i){ return s + i.soldValue; }, 0);
  const achievedCost = sold.reduce(function(s, i){ return s + i.costOfSale; }, 0);
  const achievedMargin = achievedRevenue > 0 ? (achievedRevenue - achievedCost) / achievedRevenue : null;

  const openFlags = items.filter(function(i){ return i.flag && !i.flagResolvedBy; });
  const resolvedFlags = items.filter(function(i){ return i.flag && i.flagResolvedBy; });

  /* Achieved margin is the one card here that a period CAN restate —
     it is a figure about sales, not about stock held — so when a filter
     is on it shows the margin on the sales in that period, and says so
     rather than quietly meaning something different. */
  const scopedMargin = periodFilterOn() && STATE.activity.data;
  const m = STATE.activity.data || {};
  const marginValue = scopedMargin ? m.margin : achievedMargin;
  const marginRevenue = scopedMargin ? m.saleValue : achievedRevenue;
  const marginCost = scopedMargin ? m.costOfSale : achievedCost;

  return activityFilterBar() +
    activityPanel({full: true}) +
    positionMarker() +
    '<div class="kpi-grid">' +
      kpi(t.filtered ? 'SKUs holding this stock' : 'Total SKUs',
        String(t.filtered ? t.skus : items.length),
        t.b2bSkus + ' B2B held separately', 'var(--flow)') +
      kpi('Consolidated Value', fmtMoney0(t.consolidatedValue), fmtNum(t.consolidatedQty) + ' units', 'var(--flow)') +
      kpi('Achieved Margin' + (scopedMargin ? ' — ' + periodLabel() : ''),
        marginValue === null || marginValue === undefined
          ? '<span class="unknown">' + (scopedMargin ? 'no sales in this period' : 'no sales yet') + '</span>'
          : fmtPct(marginValue),
        marginRevenue > 0 ? fmtMoney0(marginRevenue) + ' revenue less ' + fmtMoney0(marginCost) + ' cost' :
        (scopedMargin ? 'nothing was sold in this period' : 'record a selling price on a sale to populate this'),
        'var(--green)') +
      kpi('Open data-quality flags', String(openFlags.length),
        resolvedFlags.length + ' resolved', openFlags.length ? 'var(--red)' : 'var(--flow)') +
    '</div>' +

    '<div class="grid-2">' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Value by Category</div></div>' +
        '<div class="chart-box">' + chartBar(cats, catValues, null, {px: 230, fmt: money0k}) + '</div></div>' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Units by Category</div></div>' +

function viewAudit(){
  const v = STATE.views.audit;
  const d = v.data;
  const entities = ['Costing', 'Categories', 'Pricing', 'B2B', 'Items', 'Ledger', 'Directory', 'Settings'];

  const filters = '<div class="filter-bar">' +
    '<div class="field narrow"><label>From</label><input type="date" id="af-from" data-state-value="1" value="' + attr(v.dateFrom) + '"></div>' +
    '<div class="field narrow"><label>To (inclusive)</label><input type="date" id="af-to" data-state-value="1" value="' + attr(v.dateTo) + '"></div>' +
    '<div class="field narrow"><label>What changed</label><select id="af-entity" data-state-value="1">' +
      '<option value="">Everything</option>' +
      entities.map(function(e){
        return '<option value="' + attr(e) + '"' + (v.entity === e ? ' selected' : '') + '>' + esc(e) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Search</label>' +
      '<input type="text" id="af-search" data-state-value="1" placeholder="an item, a name, a reason…" value="' + attr(v.search) + '"></div>' +
    '<div class="field narrow"><label>&nbsp;</label><button class="btn secondary" id="af-clear">Clear</button></div>' +
  '</div>';

  let body;
  if(v.loading && !d) body = '<div class="empty-state">Loading…</div>';
  else if(!d) body = '<div class="empty-state">Nothing loaded yet.</div>';
  else if(!d.rows.length) body = '<div class="empty-state">No changes match these filters.</div>';
  else{
    body = '<div class="table-wrap" data-keep-scroll="audit"><table><thead><tr>' +
      '<th>When</th><th>Who</th><th>What</th><th>Which</th><th>Field</th>' +
      '<th>From</th><th>To</th><th>Reason</th></tr></thead><tbody>' +
      d.rows.map(function(r){
        return '<tr>' +
          '<td>' + esc(fmtDateTime(r.at)) + '</td>' +
          '<td>' + esc(r.actor) + '</td>' +
          '<td>' + esc(r.entity) + '</td>' +
          '<td><b>' + esc(r.key) + '</b></td>' +
          '<td>' + esc(r.field) + '</td>' +
          '<td class="wrap" style="color:var(--text-dim)">' + esc(r.oldValue) + '</td>' +
          '<td class="wrap" style="color:var(--text)">' + esc(r.newValue) + '</td>' +
          '<td class="wrap">' + esc(r.reason) + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>' + pagerServer('audit', d);
  }

  return '<div class="banner info"><div>📒</div><div>The ledger is the history for stock movements. ' +
    'This is the history for everything else: who changed a landed percentage, an FOB override, a support ' +
    'amount, a B2B price or someone\'s access — and what it was before. Inventory valuation without this ' +
    'is not auditable.</div></div>' +
    '<div class="panel">' +
      '<div class="panel-head"><div class="panel-title">Audit Trail' +
        '<span>' + (d ? d.total + ' entr' + (d.total === 1 ? 'y' : 'ies') : '') + '</span></div>' +
        '<button class="btn secondary sm" id="export-audit">Export CSV</button></div>' +
      filters + body +
    '</div>';
}

/* ============================================================
   SCREEN: Access & Roles
   ============================================================ */
/* Every permission area this page knows how to render. If the server's
   reply does not mention one, the two halves are out of step — and the
   symptom is a button that simply is not there, which looks like the
   feature was never built rather than never deployed. */
const EXPECTED_PERMS = ['ledger', 'pricing', 'category', 'b2b', 'items', 'directory', 'editLedger'];

function missingPerms(){
  const p = STATE.data && STATE.data.perms;
  if(!p) return [];
  return EXPECTED_PERMS.filter(function(k){ return !(k in p); });
}

/* Both halves should be on the same build. They will not be, briefly,
   during a deploy — and permanently if someone forgets the second half.

   Checked two ways, because a build stamp alone is not enough: a script
   old enough to predate the stamps reports none at all, and comparing
   against nothing looks like agreement. What it cannot hide is not
   knowing about a permission this page expects. */
function buildsMatch(){
  if(missingPerms().length) return false;
  const server = STATE.data && STATE.data.build;
  if(!server) return true;   // an older script that is otherwise in step
  return server === STOCKFLOW_BUILD;
}

/* Says which of the two halves is behind, in words. */
function skewMessage(){
  const missing = missingPerms();
  const server = (STATE.data && STATE.data.build) || null;
  if(missing.length){
    return 'The script (Code.gs) has not been updated — it does not know about: ' +
      missing.join(', ') + '. Deploy a new version of Code.gs ' +
      '(Deploy \u2192 Manage deployments \u2192 pencil \u2192 New version), not a new deployment.';
  }
  if(server && server !== STOCKFLOW_BUILD){
    return 'This page is build ' + STOCKFLOW_BUILD + ' but the script is build ' + server + '. ' +
      'Re-upload whichever is behind, then hard-refresh \u2014 Ctrl+Shift+R, or Cmd+Shift+R on a Mac.';
  }
  return '';
}

function viewAccess(){
  const canManage = STATE.perms.directory;
  const roles = STATE.data.roles || [];
  const dir = STATE.data.directory || [];

  const matrix = '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">What each role can change' +
      '<span>enforced on the server, for every request</span></div></div>' +
    '<div class="table-wrap"><table><thead><tr><th>Role</th><th>Stock movements</th>' +
    '<th>Margins &amp; prices</th><th>Landed % / FOB / support</th><th>B2B</th><th>People</th>' +
    '</tr></thead><tbody>' +
    roles.map(function(r){
      const cell = function(v){
        return '<td>' + (v ? '<span style="color:var(--green);font-weight:600;">yes</span>'
          : '<span class="unknown">—</span>') + '</td>';
      };
      return '<tr><td><b>' + esc(r.label) + '</b></td>' +
        cell(r.perms.ledger) + cell(r.perms.pricing) + cell(r.perms.category) +
        cell(r.perms.b2b) + cell(r.perms.directory) + '</tr>';
    }).join('') +
    '</tbody></table></div>' +
    '<div style="font-size:11.5px;color:var(--text-faint);margin-top:12px;">' +
      '<b>Every role can read everything.</b> Nothing on the position is hidden from anyone who can ' +
      'sign in — that is a decision, not an oversight. Roles gate writes only, and they are checked ' +
      'on the server: a request that bypasses this page is refused just the same. There is no ' +
      '"reset data" action anywhere in the API.' +
    '</div></div>';

  const people = '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">Directory' +
      '<span>' + dir.length + ' ' + (dir.length === 1 ? 'person' : 'people') + '</span></div>' +
      (canManage ? '<button class="btn sm" id="add-member">Add someone</button>' : '') + '</div>' +
    '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th>' +
    '<th>Status</th><th>Added by</th><th>Last active</th>' + (canManage ? '<th></th>' : '') +
    '</tr></thead><tbody>' +
    dir.map(function(m){
      return '<tr>' +
        '<td><b>' + esc(m.name) + '</b></td>' +
        '<td>' + esc(m.email) + '</td>' +
        '<td>' + esc(m.roleLabel) + '</td>' +
        '<td>' + (m.status === 'disabled'
          ? '<span style="color:var(--red)">disabled</span>'
          : '<span style="color:var(--green)">active</span>') + '</td>' +
        '<td class="wrap">' + esc(m.addedBy) + '</td>' +
        '<td>' + esc(m.lastActive ? fmtDateTime(m.lastActive) : 'never') + '</td>' +
        (canManage ? '<td><div class="btn-row">' +
          '<button class="btn secondary sm" data-editmember="' + attr(m.userId) + '">Edit</button>' +
          '<button class="btn secondary sm" data-togglemember="' + attr(m.userId) + '">' +
            (m.status === 'disabled' ? 'Enable' : 'Disable') + '</button>' +
        '</div></td>' : '') +
      '</tr>';
    }).join('') +
    '</tbody></table></div>' +
    (canManage ? '<div style="font-size:11.5px;color:var(--text-faint);margin-top:12px;">' +
      'Disabling someone, or pointing their row at a different address, ends their session on their ' +
      'very next request — there is no waiting for a token to expire.</div>' : '') +
    '</div>';

  return matrix + people + '<div class="panel">' +
    '<div class="panel-head"><div class="panel-title">This deployment</div></div>' +
    '<div class="table-wrap"><table><tbody>' +
      '<tr><td>Signed in as</td><td><b>' + esc((STATE.session || {}).name) + '</b> (' +
        esc((STATE.session || {}).email) + ')</td></tr>' +
      '<tr><td>Server date used for every age</td><td><b>' + esc(STATE.today) + '</b></td></tr>' +
      '<tr><td>Data revision</td><td>' + esc(String(STATE.revision)) + '</td></tr>' +
      '<tr><td>This page (stockflow.html)</td><td><b>' + esc(STOCKFLOW_BUILD) + '</b></td></tr>' +
      '<tr><td>The script (Code.gs)</td><td><b>' +
        esc((STATE.data && STATE.data.build) || 'not reported') + '</b>' +
        (buildsMatch() ? '' :
          ' <span style="color:var(--amber);">— ' + esc(skewMessage()) + '</span>') +
      '</td></tr>' +
    '</tbody></table></div>' +
    '<div class="btn-row" style="margin-top:14px;">' +
      '<button class="btn secondary" id="access-check">Run connection check</button>' +
    '</div>' +
    '<div id="access-diag" style="margin-top:12px;"></div>' +
  '</div>';
}
</script>

<script>
/* ============================================================
   MODALS
   ------------------------------------------------------------
   While STATE.modal is set the background poll never re-renders —
   it sets STATE.stale instead, and the strip appears when the
   dialog closes. Re-rendering over an open form throws away
   whatever someone was half-way through typing.
   ============================================================ */
function renderModal(){
  const m = STATE.modal;
  if(!m) return '<div class="modal-overlay" id="modal"></div>';
  let inner = '';

  if(m.kind === 'reverse'){
    const r = m.row || {};
    inner =
      '<div class="modal-head"><div class="modal-title">Reverse a movement</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="modal-sub">A stock ledger is corrected with a reversing entry, never by editing or ' +
        'deleting. The original row stays exactly as recorded and this reversal sits beside it, with ' +
        'your reason on the record. If anything recorded later depends on this movement, the reversal ' +
        'will be refused and will name what is blocking it.</div>' +
      '<div class="table-wrap" style="margin-bottom:16px;"><table><tbody>' +
        '<tr><td>Date</td><td><b>' + esc(r.date) + '</b></td></tr>' +
        '<tr><td>Item</td><td><b>' + esc(r.item) + '</b></td></tr>' +
        '<tr><td>Type</td><td>' + typePill(r.type) + '</td></tr>' +
        '<tr><td>Quantity</td><td><b>' + fmtNum(r.qty) + '</b></td></tr>' +
        '<tr><td>Reference</td><td>' + esc(r.ref || '—') + '</td></tr>' +
        '<tr><td>Partner</td><td>' + (r.partner ? esc(r.partner) : '—') + '</td></tr>' +
        '<tr><td>Business type</td><td>' + (r.businessType ? esc(r.businessType) : '—') + '</td></tr>' +
        '<tr><td>Stage</td><td>' + (r.stage ? esc(r.stage) : '—') + '</td></tr>' +
        (r.txnRef ? '<tr><td>Transaction</td><td>' + esc(r.txnRef) + '</td></tr>' : '') +
        '<tr><td>Posted by</td><td>' + esc(r.actor) + '</td></tr>' +
      '</tbody></table></div>' +
      /* Said before the button, not after. This reversal posts more rows
         than the one on screen, and finding that out from the toast
         afterwards is finding out too late. */
      (r.childCount
        ? '<div class="banner" style="margin-bottom:16px;"><div>i</div><div>' +
          '<b>This movement carries ' + r.childCount + ' child item' +
          (r.childCount === 1 ? '' : 's') + ', and they will be reversed with it.</b> ' +
          'They ship inside ' + esc(r.item) + ' and are part of the same transaction' +
          (r.txnRef ? ' (' + esc(r.txnRef) + ')' : '') + ', so leaving them behind would ' +
          'put stock in the warehouse that nothing accounts for. Your reason goes on ' +
          'every one of them.</div></div>'
        : '') +
      (r.parentItem
        ? '<div class="banner" style="margin-bottom:16px;"><div>i</div><div>' +
          'This is a child item of <b>' + esc(r.parentItem) + '</b>. Reversing it takes out ' +
          'this line only and leaves ' + esc(r.parentItem) + ' standing — which is right if ' +
          'the accessory was never part of the shipment. To undo the whole transaction, ' +
          'reverse the ' + esc(r.parentItem) + ' row instead.</div></div>'
        : '') +
      '<div class="field"><label>Why is this being reversed?</label>' +
        '<input type="text" id="reverse-reason" placeholder="e.g. quantity typed as 999 instead of 9"></div>' +
      (m.error ? '<div class="auth-msg err" style="margin-top:12px;">' + esc(m.error).replace(/\n/g, '<br>') + '</div>' : '') +
      '<div class="modal-actions">' +
        '<button class="btn secondary" data-modalclose="1">Cancel</button>' +
        '<button class="btn danger" id="reverse-confirm"' + (m.busy ? ' disabled' : '') + '>' +
          (m.busy ? 'Reversing…' : 'Post the reversal') + '</button>' +
      '</div>';

  }else if(m.kind === 'edit'){
    const r = m.row || {};
    const type = m.type || r.type || '';
    const need = txnFieldsFor(type);
    /* The postable list, plus this row's own type if it is no longer on
       it. A dialog that quietly re-labelled an old row because its type
       has since been retired would be the type-substitution bug again,
       this time with a human pressing the button. */
    const codes = (STATE.data.txnTypes || []).slice();
    if(type && codes.indexOf(type) < 0) codes.unshift(type);
    const labelOf = function(code){
      const def = ((STATE.data.movementTypes || [])
        .filter(function(t){ return t.code === code; })[0]) || {};
      return def.label || code;
    };
    const box = function(label, id, control, on){
      return '<div class="field" style="' + (on === false ? 'display:none;' : '') + '">' +
        '<label>' + esc(label) + '</label>' + control + '</div>';
    };
    const num = function(id, v){
      return '<input type="number" id="' + id + '" min="0" step="any" data-keep-value="1" value="' +
        attr(v === null || v === undefined || v === '' ? '' : v) + '">';
    };
    inner =
      '<div class="modal-head"><div class="modal-title">Edit a movement</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="modal-sub">The ledger is never rewritten, so this does the correction properly: ' +
        'the original row is reversed and a corrected row is posted beside it, both at once. Nothing ' +
        'is lost and the trail shows what changed and why. The corrected row is checked exactly like ' +
        'a new posting — if the stock will not support it, or if something recorded later depends on ' +
        'the original, this is refused and says what is blocking it.</div>' +
      '<div class="form-grid" style="grid-template-columns:repeat(3,1fr);">' +
        box('Date', 'e-date',
          '<input type="date" id="e-date" data-keep-value="1" value="' + attr(r.date || '') + '">') +
        box('Item Number', 'e-item',
          '<input type="text" id="e-item" data-keep-value="1" list="e-item-options" ' +
            'autocomplete="off" autocapitalize="characters" spellcheck="false" value="' +
            attr(r.item || '') + '">' +
          /* Its own id: the entry form behind the dialog already owns
             f-item-options, and two datalists with one id is a coin toss. */
          '<datalist id="e-item-options">' +
            visibleItems().map(function(i){
              return '<option value="' + attr(i.item) + '">' + esc(i.name) + '</option>';
            }).join('') +
          '</datalist>') +
        box('Type', 'e-type',
          '<select id="e-type">' +
            codes.map(function(code){
              return '<option value="' + attr(code) + '"' + (code === type ? ' selected' : '') + '>' +
                esc(labelOf(code)) + '</option>';
            }).join('') +
          '</select>') +
        box('Qty', 'e-qty', num('e-qty', r.qty)) +
        box(need.fobLabel, 'e-fob', num('e-fob', r.fob || ''), need.fob) +
        box('Unit selling price $', 'e-sellprice', num('e-sellprice', r.sellPrice), need.sellPrice) +
        box(need.locLabel, 'e-location',
          '<select id="e-location" data-keep-value="1">' +
            locationOptions(r.location || '', 'Not specified') + '</select>', need.location) +
        box('Move to', 'e-tolocation',
          '<select id="e-tolocation" data-keep-value="1">' +
            locationOptions(r.toLocation || '', 'Choose…') + '</select>', need.toLocation) +
        box('Remark', 'e-ref',
          '<input type="text" id="e-ref" data-keep-value="1" value="' + attr(r.ref || '') + '">') +
        box('Business type', 'e-businesstype',
          '<select id="e-businesstype" data-keep-value="1">' +
            businessTypeOptions(r.businessType || '', 'Not specified') + '</select>') +
        box('Partner (B2B only)', 'e-partner',
          '<input type="text" id="e-partner" data-keep-value="1" list="e-partner-options" ' +
            'autocomplete="off" value="' + attr(r.partner || '') + '">' +
          '<datalist id="e-partner-options">' + partnerOptions() + '</datalist>') +
        box('Notes', 'e-notes',
          '<input type="text" id="e-notes" data-keep-value="1" value="' + attr(r.notes || '') + '">') +
      '</div>' +
      '<div class="field"><label>What is being corrected, and why?</label>' +
        '<input type="text" id="edit-reason" data-keep-value="1" ' +
          'placeholder="e.g. OEM invoice showed 9 units, not 999"></div>' +
      (m.error ? '<div class="auth-msg err" style="margin-top:12px;">' + esc(m.error).replace(/\n/g, '<br>') + '</div>' : '') +
      '<div class="modal-actions">' +
        '<button class="btn secondary" data-modalclose="1">Cancel</button>' +
        '<button class="btn" id="edit-confirm"' + (m.busy ? ' disabled' : '') + '>' +
          (m.busy ? 'Correcting…' : 'Post the correction') + '</button>' +
      '</div>';

  }else if(m.kind === 'flag'){
    const i = itemByCode(m.item) || {};
    const resolved = !!i.flagResolvedBy;
    inner =
      '<div class="modal-head"><div class="modal-title">' +
        (resolved ? 'Reopen this flag' : 'Confirm this figure') + '</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="modal-sub">A data-quality flag records where a source figure was missing and what was ' +
        'used instead. Confirming it does not erase it — the original text stays on the item, with your ' +
        'note and your name beside it.</div>' +
      '<div class="banner"><div>⚠</div><div><b>' + esc(m.item) + '</b><br>' + esc(i.flag) + '</div></div>' +
      '<div class="field"><label>' + (resolved ? 'Why is this being reopened?' : 'What was confirmed, and by whom?') + '</label>' +
        '<input type="text" id="flag-note" placeholder="e.g. HP confirmed $545.90 by email on 2026-08-19" ' +
        'value="' + attr(resolved ? '' : (i.flagNote || '')) + '"></div>' +
      (m.error ? '<div class="auth-msg err" style="margin-top:12px;">' + esc(m.error) + '</div>' : '') +
      '<div class="modal-actions">' +
        '<button class="btn secondary" data-modalclose="1">Cancel</button>' +
        '<button class="btn" id="flag-confirm"' + (m.busy ? ' disabled' : '') + '>' +
          (m.busy ? 'Saving…' : (resolved ? 'Reopen' : 'Confirm')) + '</button>' +
      '</div>';

  }else if(m.kind === 'member'){
    const editing = !!m.userId;
    const existing = editing
      ? (STATE.data.directory || []).filter(function(d){ return d.userId === m.userId; })[0] || {}
      : {};
    inner =
      '<div class="modal-head"><div class="modal-title">' +
        (editing ? 'Edit ' + esc(existing.name) : 'Add someone to Stockflow') + '</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="modal-sub">They sign in with a code emailed to this address, so it has to be one they ' +
        'can read. Changing it here ends any session they currently hold.</div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Full name</label>' +
        '<input type="text" id="member-name" value="' + attr(existing.name || '') + '"></div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Work email</label>' +
        '<input type="email" id="member-email" value="' + attr(existing.email || '') + '"></div>' +
      '<div class="field"><label>Role</label><select id="member-role">' +
        (STATE.data.roles || []).map(function(r){
          return '<option value="' + attr(r.id) + '"' +
            ((existing.role || 'board') === r.id ? ' selected' : '') + '>' + esc(r.label) + '</option>';
        }).join('') + '</select></div>' +
      '<div style="font-size:11.5px;color:var(--text-faint);margin-top:10px;">' +
        'Admin: everything. Warehouse: stock movements. Sales: margins and prices. Board: read-only. ' +
        'Every role sees the whole position.</div>' +
      (m.error ? '<div class="auth-msg err" style="margin-top:12px;">' + esc(m.error) + '</div>' : '') +
      '<div class="modal-actions">' +
        '<button class="btn secondary" data-modalclose="1">Cancel</button>' +
        '<button class="btn" id="member-save"' + (m.busy ? ' disabled' : '') + '>' +
          (m.busy ? 'Saving…' : 'Save') + '</button>' +
      '</div>';

  }else if(m.kind === 'item'){
    const editing = !!m.item;
    const it = editing ? (itemByCode(m.item) || {}) : {};
    const cats = STATE.data.categories || [];
    const brands = (STATE.data.brands || []).filter(function(b){ return b.live; });
    const allBrands = (STATE.data.brands || []);
    const brandList = brands.length ? brands : allBrands;
    inner =
      '<div class="modal-head"><div class="modal-title">' +
        (editing ? 'Edit ' + esc(m.item) : 'Add an item') + '</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="modal-sub">' + (editing
        ? 'The part number itself cannot be changed — every movement on the ledger points at it. ' +
          'If the code is wrong, deactivate this one and add the right one.'
        : 'A part number has to exist before anything can be posted against it. Nothing is ' +
          'created automatically by an upload: a mistyped code would quietly become a new SKU ' +
          'and split the position for that product across two of them.') + '</div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Part number</label>' +
        '<input type="text" id="item-code" autocapitalize="characters" spellcheck="false" ' +
          'placeholder="e.g. 9G158ET" value="' + attr(editing ? m.item : '') + '"' +
          (editing ? ' disabled' : '') + '></div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Description</label>' +
        '<input type="text" id="item-name" placeholder="e.g. HP ProBook 440 G11 14 i7 16GB/512" ' +
          'value="' + attr(it.name || '') + '"></div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Category</label>' +
        '<select id="item-category">' +
          cats.map(function(c){
            return '<option value="' + attr(c.category) + '"' +
              (it.category === c.category ? ' selected' : '') + '>' + esc(c.category) +
              ' (' + (c.landedPct * 100).toFixed(1) + '% landed)</option>';
          }).join('') +
        '</select></div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Brand</label>' +
        '<select id="item-brand">' +
          brandList.map(function(b){
            return '<option value="' + attr(b.brand) + '"' +
              ((it.brand || (brandList.length === 1 ? brandList[0].brand : '')) === b.brand ? ' selected' : '') +
              '>' + esc(b.brand) + ' · ' + esc(b.businessUnit) + '</option>';
          }).join('') +
        '</select></div>' +
      '<label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px;">' +
        '<input type="checkbox" id="item-b2b" style="width:auto;"' + (it.b2b ? ' checked' : '') + '> ' +
        'Reseller-owned (B2B) — fixed cost and price, kept out of the weighted average</label>' +
      (editing && it.consolidatedQty > 0
        ? '<div class="banner" style="margin-top:14px;"><div>!</div><div>This item holds ' +
          fmtNum(it.consolidatedQty) + ' units. Changing its category moves it onto a different ' +
          'landed percentage and revalues all of it.</div></div>'
        : '') +
      (m.error ? '<div class="auth-msg err" style="margin-top:12px;">' + esc(m.error) + '</div>' : '') +
      '<div class="modal-actions">' +
        (editing
          ? '<button class="btn secondary" id="item-toggle-active">' +
            (it.active === false ? 'Reactivate' : 'Deactivate') + '</button>'
          : '') +
        '<button class="btn secondary" data-modalclose="1">Cancel</button>' +
        '<button class="btn" id="item-save"' + (m.busy ? ' disabled' : '') + '>' +
          (m.busy ? 'Saving…' : (editing ? 'Save changes' : 'Add item')) + '</button>' +
      '</div>';

  }else if(m.kind === 'type'){
    const editing = !!m.code;
    const t = editing
      ? ((STATE.data.movementTypes || []).filter(function(x){ return x.code === m.code; })[0] || {})
      : {};
    const behaviours = STATE.data.behaviours || [];
    const chosen = m.behaviour || t.behaviour || 'out-mainwh';
    const consumes = (chosen === 'out-mainwh' || chosen === 'out-git');
    inner =
      '<div class="modal-head"><div class="modal-title">' +
        (editing ? 'Edit ' + esc(t.label || m.code) : 'Add a movement type') + '</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="modal-sub">' + (editing && t.builtIn
        ? 'This is one of the seven movements Stockflow is built on. You can change how it is worded; ' +
          'what it does to stock is fixed, because every row already on the ledger was recorded under it.'
        : 'A type has to say what it does to stock. That is what lets you add one without anyone ' +
          'touching the stock calculations — and what stops a movement nothing knows how to apply.') +
      '</div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Code (what appears on the ledger)</label>' +
        '<input type="text" id="type-code" placeholder="e.g. Write-off-Damaged" ' +
          'value="' + attr(editing ? m.code : '') + '"' + (editing ? ' disabled' : '') + '></div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Shown as (what people pick from the list)</label>' +
        '<input type="text" id="type-label" placeholder="e.g. Write-off — damaged" ' +
          'value="' + attr(t.label || '') + '"></div>' +
      '<div class="field" style="margin-bottom:12px;"><label>Which business? ' +
        '<span style="color:var(--text-faint);font-weight:400;">— optional</span></label>' +
        '<select id="type-businesstype">' +
          businessTypeOptions(t.businessType || '', 'None — chosen per movement') + '</select>' +
        '<div style="font-size:11px;color:var(--text-faint);margin-top:6px;">' +
        'Stamped on every movement posted under this type, and overridable on the form. ' +
        'Leave it as None and the business is chosen per movement — which is what lets one ' +
        'type serve both books instead of needing a copy of it for each.</div></div>' +
      '<div class="field" style="margin-bottom:6px;"><label>What does it do to stock?</label>' +
        '<select id="type-behaviour"' + ((editing && t.builtIn) ? ' disabled' : '') + '>' +
          behaviours.map(function(b){
            return '<option value="' + attr(b.id) + '"' + (chosen === b.id ? ' selected' : '') + '>' +
              esc(b.label) + '</option>';
          }).join('') +
        '</select></div>' +
      (consumes
        ? '<label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px;margin-top:10px;">' +
          '<input type="checkbox" id="type-issale" style="width:auto;"' + (t.isSale ? ' checked' : '') + '> ' +
          'This is a sale — it should count towards sold units, revenue and achieved margin</label>' +
          '<div style="font-size:11px;color:var(--text-faint);margin-top:6px;">' +
          'Leave it unticked for a write-off, damage or a count shortfall: the stock leaves, but ' +
          'counting it as sold would flatter the sold figure with stock nobody paid for. ' +
          'It is reported as written off instead.</div>'
        : '<div style="font-size:11px;color:var(--text-faint);margin-top:6px;">' +
          'Only a movement that takes stock out can be a sale.</div>') +
      (m.error ? '<div class="auth-msg err" style="margin-top:12px;">' + esc(m.error) + '</div>' : '') +
      '<div class="modal-actions">' +
        (editing && !t.builtIn
          ? '<button class="btn danger" id="type-delete">Delete</button>' +
            '<button class="btn secondary" id="type-retire">' +
            (t.active ? 'Retire' : 'Put back in use') + '</button>'
          : '') +
        '<button class="btn secondary" data-modalclose="1">Cancel</button>' +
        '<button class="btn" id="type-save"' + (m.busy ? ' disabled' : '') + '>' +
          (m.busy ? 'Saving…' : (editing ? 'Save' : 'Add type')) + '</button>' +
      '</div>';

  }else if(m.kind === 'brand'){
    inner = brandModal();

  }else if(m.kind === 'diag'){
    inner =
      '<div class="modal-head"><div class="modal-title">' + esc(m.title || 'Connection check') + '</div>' +
        '<button class="modal-close" data-modalclose="1">&times;</button></div>' +
      '<div class="diag">' + esc(m.text || '') + '</div>' +
      '<div class="modal-actions"><button class="btn secondary" data-modalclose="1">Close</button></div>';
  }

  return '<div class="modal-overlay show" id="modal"><div class="modal-box' +
    (m.kind === 'diag' ? ' wide' : '') + '">' + inner + '</div></div>';
}

function openModal(m){ STATE.modal = m; render(); }
function closeModal(){
  STATE.modal = null;
  render();
  /* Anything that changed while the dialog was open is applied now. */
  if(STATE.stale) refreshData();
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function bindHandlers(){
  if(STATE.phase === 'fatal'){
    on('#fatal-retry', 'click', function(){ boot(); });
    on('#fatal-check', 'click', async function(){
      const out = document.getElementById('fatal-diag');
      out.innerHTML = '<div class="diag">Checking…</div>';
      const lines = await connectionCheck();
      out.innerHTML = '<div class="diag">' + esc(lines.join('\n')) + '</div>';
    });
    return;
  }

  if(STATE.phase === 'auth'){ bindAuth(); return; }
  if(STATE.phase !== 'app') return;

  on('.nav-item', 'click', function(e){
    STATE.tab = e.currentTarget.dataset.tab;
    render();
    if(STATE.tab === 'ledger' && !STATE.views.ledger.data){ loadLedger(); loadImports(); }
    if(STATE.tab === 'audit' && !STATE.views.audit.data) loadAudit();
    if((STATE.tab === 'overview' || STATE.tab === 'analytics') && !STATE.activity.data) loadActivity();
  });
  on('#sign-out', 'click', function(){
    setSessionToken('');
    STATE.session = null; STATE.data = null; STATE.phase = 'auth';
    STATE.auth = {step: 'email', email: lastEmail(), message: 'Signed out.', messageKind: 'info', busy: false, needsBootstrap: false};
    render();
  });
  on('#refresh-now', 'click', function(){ refreshData(); });
  on('#brand-switch', 'click', function(){ openModal({kind: 'brand'}); });
  on('[data-brand]', 'click', function(e){
    const brand = e.currentTarget.dataset.brand;
    const counts = brandsWithStock();
    if(brand && !counts[brand]){
      toast(brand + ' has no items in Stockflow yet — it is scaffolded, not switched off.', true);
      return;
    }
    STATE.activeBrand = brand || null;
    /* A change of scope returns every view to page one; page 4 of a list
       that is now nine rows long is an empty screen. */
    Object.keys(STATE.views).forEach(function(k){ STATE.views[k].page = 1; });
    STATE.modal = null;
    render();
    /* The movement views are filtered on the server, so they have to be
       asked again; the position screens re-filter in place. */
    if(STATE.views.ledger.data) loadLedger();
    if(STATE.views.imports.data) loadImports();
    toast(brand ? 'Viewing ' + brand : 'Viewing every brand');
  });
  on('#foot-check, #access-check', 'click', async function(){
    openModal({kind: 'diag', title: 'Connection check', text: 'Checking both hops…'});
    const lines = await connectionCheck();
    if(STATE.modal && STATE.modal.kind === 'diag'){
      STATE.modal.text = lines.join('\n');
      render();
    }
  });
  on('[data-modalclose]', 'click', function(){ closeModal(); });
  on('#modal', 'click', function(e){ if(e.target.id === 'modal') closeModal(); });

  /* client-side view controls */
  on('[data-sort]', 'click', function(e){
    const viewId = e.currentTarget.dataset.sort, field = e.currentTarget.dataset.field;
    const v = STATE.views[viewId];
    if(v.sortBy === field) v.sortDir = v.sortDir === 'asc' ? 'desc' : 'asc';
    else { v.sortBy = field; v.sortDir = 'asc'; }
    v.page = 1;              // a change of sort always returns to page one
    render();
  });
  on('[data-page]', 'click', function(e){
    STATE.views[e.currentTarget.dataset.page].page = Number(e.currentTarget.dataset.to);
    render();
  });
  on('[data-clearview]', 'click', function(e){
    const v = STATE.views[e.currentTarget.dataset.clearview];
    v.search = ''; v.category = ''; v.location = ''; v.flagged = false; v.page = 1;
    render();
  });
  ['git', 'mainwh', 'consolidated', 'itemmaster', 'simulator'].forEach(function(viewId){
    const v = STATE.views[viewId];
    on('#vf-' + viewId + '-search', 'input', debounce(function(e){
      v.search = e.target.value; v.page = 1; render();
    }, 200));
    on('#vf-' + viewId + '-category', 'change', function(e){ v.category = e.target.value; v.page = 1; render(); });
    on('#vf-' + viewId + '-location', 'change', function(e){ v.location = e.target.value; v.page = 1; render(); });
    on('#vf-' + viewId + '-flagged', 'change', function(e){ v.flagged = e.target.checked; v.page = 1; render(); });
  });

  bindLedger();
  bindItemMaster();
  bindSimulator();
  bindCategory();
  bindTypes();
  bindB2B();
  bindAnalytics();
  bindActivity();
  bindAudit();
  bindAccess();
  bindModalActions();
}

function debounce(fn, ms){
  let timer = null;
  return function(){
    const args = arguments, self = this;
    clearTimeout(timer);
    timer = setTimeout(function(){ fn.apply(self, args); }, ms);
  };
}

function lastEmail(){
  try{ return localStorage.getItem(EMAIL_KEY) || ''; }catch(e){ return ''; }
}

/* ---------------- Sign-in ---------------- */
function bindAuth(){
  const a = STATE.auth;
  const send = async function(){
    const input = document.getElementById('auth-email');
    const email = String(input ? input.value : a.email).trim();
    if(!email){ a.message = 'Enter your work email address.'; a.messageKind = 'err'; render(); return; }
    a.email = email; a.busy = true; a.message = null; render();
    try{
      const res = await rpc('requestOtp', {email: email});
      try{ localStorage.setItem(EMAIL_KEY, email); }catch(e){}
      a.step = 'code'; a.busy = false;
      a.message = 'A ' + res.expiresInMinutes + '-minute code is on its way to ' + email + '.';
      a.messageKind = 'info';
    }catch(err){
      a.busy = false;
      /* A lost reply on requestOtp means the email really was sent. */
      if(err.replyLost){
        a.step = 'code';
        a.message = 'The reply was lost on the way back, but the request did reach the server — ' +
          'so the code has probably been sent. Check your email.';
        a.messageKind = 'info';
      }else{
        const d = diagnose(err);
        a.message = d.detail; a.messageKind = 'err';
      }
    }
    render();
  };

  on('#auth-send', 'click', send);
  on('#auth-resend', 'click', send);
  on('#auth-email', 'keydown', function(e){ if(e.key === 'Enter') send(); });

  on('#auth-back', 'click', function(){
    STATE.auth = {step: 'email', email: a.email, message: null, messageKind: 'info', busy: false, needsBootstrap: false};
    render();
  });

  const verify = async function(){
    const input = document.getElementById('auth-code');
    const code = String(input ? input.value : '').replace(/\D/g, '');
    if(code.length !== 6){ a.message = 'Enter the 6-digit code from your email.'; a.messageKind = 'err'; render(); return; }
    a.busy = true; a.message = null; render();
    try{
      const res = await rpc('verifyOtp', {email: a.email, code: code});
      setSessionToken(res.sessionToken);
      STATE.session = res.session;
      await loadApp();
    }catch(err){
      a.busy = false;
      a.message = diagnose(err).detail; a.messageKind = 'err';
      render();
    }
  };
  on('#auth-verify', 'click', verify);
  on('#auth-code', 'keydown', function(e){ if(e.key === 'Enter') verify(); });

  on('#bootstrap-btn', 'click', async function(){
    const name = (document.getElementById('bootstrap-name') || {}).value || '';
    const email = (document.getElementById('bootstrap-email') || {}).value || '';
    a.busy = true; a.message = null; render();
    try{
      await rpc('createFirstAdmin', {name: name.trim(), email: email.trim()});
      STATE.auth = {step: 'email', email: email.trim(), busy: false, needsBootstrap: false,
        message: 'Admin created. Now sign in with an emailed code, like everyone else.', messageKind: 'info'};
    }catch(err){
      a.busy = false; a.message = diagnose(err).detail; a.messageKind = 'err';
    }
    render();
  });

  on('#auth-check', 'click', async function(){
    const out = document.getElementById('auth-diag');
    out.innerHTML = '<div class="diag" style="margin-top:14px;">Checking…</div>';
    const lines = await connectionCheck();
    out.innerHTML = '<div class="diag" style="margin-top:14px;">' + esc(lines.join('\n')) + '</div>';
  });
}
</script>

<script>
/* ---------------- Ledger handlers ---------------- */
function bindLedger(){
  if(STATE.tab !== 'ledger') return;

  /* Which fields a type needs. The prototype hid the FOB box for
     non-purchases and nothing else; there are more fields now. */
  const syncFields = function(){
    const typeEl = document.getElementById('f-type');
    if(!typeEl) return;
    const type = typeEl.value;
    const show = function(id, on){
      const el = document.getElementById(id);
      if(el) el.style.display = on ? 'flex' : 'none';
    };
    const need = txnFieldsFor(type);
    show('f-fob-wrap', need.fob);
    const fobLabel = document.querySelector('#f-fob-wrap label');
    if(fobLabel) fobLabel.textContent = need.fobLabel;
    show('f-loc-wrap', need.location);
    show('f-toloc-wrap', need.toLocation);
    show('f-sell-wrap', need.sellPrice);
    const locLabel = document.querySelector('#f-loc-wrap label');
    if(locLabel) locLabel.textContent = need.locLabel;
  };
  on('#f-type', 'change', syncFields);
  syncFields();

  /* Confirms the code as it is typed, so a typo is caught here rather
     than by a refused submission. Updates one element — re-rendering the
     screen on every keystroke would throw the caret away. */
  const showItemHint = function(){
    const input = document.getElementById('f-item');
    const hint = document.getElementById('f-item-hint');
    if(!input || !hint) return;
    const code = String(input.value || '').trim().toUpperCase();
    if(!code){ hint.textContent = ''; hint.style.color = 'var(--text-faint)'; return; }
    const match = itemByCode(code);
    if(match){
      hint.textContent = match.name + (match.b2b ? ' · B2B' : '') +
        ' · ' + match.category + ' · ' + fmtNumPlain(match.mwQty) + ' in Main WH, ' +
        fmtNumPlain(match.gitQty) + ' in GIT';
      hint.style.color = 'var(--flow)';
    }else{
      hint.textContent = 'No item with that number. Check the code, or pick from the list.';
      hint.style.color = 'var(--amber)';
    }
  };
  on('#f-item', 'input', showItemHint);
  on('#f-item', 'change', function(){
    /* Part numbers are upper case; typing one in lower case should not
       be a different thing. The server uppercases too — this is so the
       person sees what will actually be posted. */
    const input = document.getElementById('f-item');
    if(input) input.value = String(input.value || '').trim().toUpperCase();
    showItemHint();
  });
  showItemHint();

  /* ---- Child items ----
     Every keystroke is written straight into STATE rather than left on
     the element. The screen is rebuilt whenever anything else lands —
     a background refresh, another user's write — and a half-typed
     accessory sitting only in the DOM would go with it. */
  on('[data-cf]', 'input', function(e){
    const el = e.currentTarget;
    const kid = (STATE.txnChildren || [])[Number(el.dataset.ci)];
    if(kid) kid[el.dataset.cf] = el.value;
  });
  on('[data-cf]', 'change', function(e){
    const el = e.currentTarget;
    const kid = (STATE.txnChildren || [])[Number(el.dataset.ci)];
    if(!kid) return;
    if(el.dataset.cf === 'item') el.value = String(el.value || '').trim().toUpperCase();
    kid[el.dataset.cf] = el.value;
    /* A type change moves which boxes that child shows, so this one has
       to redraw. Nothing else does. */
    if(el.dataset.cf === 'type') render();
  });
  on('#f-txnref', 'input', function(e){ STATE.txnRef = e.currentTarget.value; });
  on('#txn-add-child', 'click', function(){
    /* Seeded from the parent, because an accessory almost always
       arrives the same way and into the same warehouse as the machine
       it ships inside. Every one of them is still editable. */
    const val = function(id){ const el = document.getElementById(id); return el ? el.value : ''; };
    STATE.txnChildren = (STATE.txnChildren || []).concat([{
      item: '', type: val('f-type'), qty: val('f-qty'), fob: '',
      ref: val('f-ref'), notes: '',
      location: val('f-location'), toLocation: val('f-tolocation'), sellPrice: ''
    }]);
    render();
  });
  on('[data-child-remove]', 'click', function(e){
    const i = Number(e.currentTarget.dataset.childRemove);
    STATE.txnChildren = (STATE.txnChildren || []).filter(function(_, n){ return n !== i; });
    render();
  });

  on('#log-btn', 'click', async function(){
    const val = function(id){ const el = document.getElementById(id); return el ? el.value : ''; };
    const data = {
      date: val('f-date'), item: val('f-item'), type: val('f-type'),
      qty: val('f-qty'), fob: val('f-fob'), ref: val('f-ref'), notes: val('f-notes'),
      partner: val('f-partner'), businessType: val('f-businesstype'),
      location: val('f-location'), toLocation: val('f-tolocation'), sellPrice: val('f-sellprice')
    };
    const kids = (STATE.txnChildren || []).slice();
    if(kids.length) data.txnRef = String(STATE.txnRef || '').trim();
    const dup = document.getElementById('f-allow-dup');
    if(!data.qty){ toast('Enter a quantity greater than 0', true); return; }
    /* Caught here rather than by the server, only because "child item 2
       has no part number" is a more useful sentence than a refusal
       naming a row the person cannot see. */
    const blank = kids.map(function(c, i){ return {c: c, n: i + 1}; })
      .filter(function(x){ return !String(x.c.item || '').trim() || !String(x.c.qty || '').trim(); });
    if(blank.length){
      toast('Child item ' + blank[0].n + ' needs a part number and a quantity', true);
      return;
    }
    STATE.busy = 'post'; render();
    try{
      const res = await mutate('postTransaction', {
        data: data, children: kids, allowDuplicate: !!(dup && dup.checked)
      });
      toast('Logged: ' + data.type + ' — ' + data.item + ' × ' + data.qty +
        (kids.length ? ' with ' + kids.length + ' child item' + (kids.length === 1 ? '' : 's') +
          ' (' + ((res && res.txnRef) || '') + ')' : ''));
      ['f-qty', 'f-fob', 'f-ref', 'f-notes', 'f-sellprice'].forEach(function(id){
        const el = document.getElementById(id); if(el) el.value = '';
      });
      const d = document.getElementById('f-allow-dup'); if(d) d.checked = false;

async function checkBulk(text, fileName){
  STATE.bulk.error = null; STATE.bulk.preview = null; STATE.bulk.ignored = null;
  if(fileName !== undefined) STATE.bulk.fileName = fileName || null;
  /* Kept so the file can be re-read under the other date order without
     asking the person to paste it again. */
  STATE.bulk.rawText = text;
  STATE.bulk.delimiter = null;
  STATE.bulk.dateInfo = null;
  STATE.bulk.busy = true; render();
  const parsed = csvToObjects(text);
  STATE.bulk.delimiter = parsed.delimiter;
  if(parsed.error){
    /* "Your file is malformed" and "Stockflow hit an internal error" are
       different problems and are reported differently. This is the first. */
    STATE.bulk.busy = false;
    STATE.bulk.error = 'That file could not be read: ' + parsed.error;
    render();
    return;
  }
  if(!parsed.rows.length){
    STATE.bulk.busy = false;
    STATE.bulk.error = 'The file has a header row but no data rows underneath it.';
    render();
    return;
  }
  /* Excel's date rewriting, undone before the rows go anywhere. */
  const preferred = STATE.bulk.dateOrder ||
    ((STATE.data && STATE.data.settings && STATE.data.settings.csvDateOrder) || 'DMY');
  const dated = normaliseCsvDates(parsed.rows, preferred);
  STATE.bulk.dateInfo = dated.info;
  if(dated.info.conflict){
    STATE.bulk.busy = false;
    STATE.bulk.error = 'This file contradicts itself on dates: some read as day/month ' +
      '(like 25/08/2026) and others as month/day (like 08/25/2026), so there is no one ' +
      'reading that fits. Fix the dates in the file, or write them as YYYY-MM-DD.';
    render();
    return;
  }

  /* ONE staged set of rows, and both the preview and the commit send
     exactly it. They were briefly allowed to differ — the preview went
     on sending `parsed.rows` while the commit sent the date-converted
     `dated.rows` — so every upload with a local-format date was refused
     at the preview and never reached the commit that would have worked.
     Whatever is previewed must be what is posted; nothing else may be
     in scope to send by mistake. */
  STATE.bulk.rows = dated.rows;
  STATE.bulk.ignored = parsed.ignoredColumns;
  try{
    const preview = await rpc('bulkPostTransactions', {
      rows: STATE.bulk.rows, dryRun: true, skipInvalid: true,
      allowRepeats: !!STATE.bulk.allowRepeats,
      createMissingItems: autoCreateItems()
    });
    STATE.bulk.preview = preview;
    STATE.bulk.busy = false;
    if(preview.duplicateBatch){
      STATE.bulk.error = 'These exact rows were already imported on ' +
        String(preview.duplicateBatch.importedAt).slice(0, 10) + ' by ' + preview.duplicateBatch.importedBy +
        '. Importing them again would double every quantity. Only continue if this really is a ' +
        'second, genuine set of movements.';
    }
  }catch(err){
    STATE.bulk.busy = false;
    const d = diagnose(err);
    STATE.bulk.error = (err.internal ? 'Stockflow hit an internal error — this is not a problem with your file. ' : '') + d.detail;
  }
  render();
}

async function commitBulk(force){
  const skipEl = document.getElementById('bulk-skip');
  STATE.bulk.busy = true; render();
  try{
    const res = await mutate('bulkPostTransactions', {
      rows: STATE.bulk.rows,
      skipInvalid: skipEl ? skipEl.checked : STATE.bulk.skipInvalid,
      allowRepeats: !!STATE.bulk.allowRepeats,
      createMissingItems: autoCreateItems(),
      force: !!force || !!(STATE.bulk.preview && STATE.bulk.preview.duplicateBatch)
    });
    /* allowRepeats resets to false: it answers one file, not a standing
       preference. Left on, the next upload would silently lose the
       protection this whole change exists to add. */
    STATE.bulk = {rows: [], preview: null, busy: false, error: null, skipInvalid: true,
      allowRepeats: false,
      ignored: null, fileName: null, delimiter: null, lastBatchId: null,
      rawText: null, dateOrder: null, dateInfo: null};
    const paste = document.getElementById('bulk-paste');
    if(paste) paste.value = '';
    STATE.bulk.lastBatchId = res.batchId;
    toast(res.imported + ' movement(s) imported' +
      ((res.createdItems && res.createdItems.length)
        ? ', ' + res.createdItems.length + ' new part number(s) created' : '') +
      (res.skipped ? ', ' + res.skipped + ' skipped' : ''));
    await refreshData();
    await loadLedger();
    await loadImports();
  }catch(err){
    STATE.bulk.busy = false;
    STATE.bulk.error = diagnose(err).detail;
    render();
  }
}

/* Everything matching the current filters, not the twenty-five on
   screen. Exporting one visible page and calling it an export is the
   sort of thing nobody notices until they are reconciling against it and
   the totals are short. */
async function exportLedgerCsv(overrides, filenameHint){
  const v = STATE.views.ledger;
  const query = Object.assign({
    pageSize: 'all',
    brand: STATE.activeBrand || '',
    dateFrom: v.dateFrom, dateTo: v.dateTo, item: v.item, type: v.type,
    search: v.search, sortBy: v.sortBy, sortDir: v.sortDir
  }, overrides || {});

  const btn = document.getElementById('export-ledger');
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try{
    const all = await rpc('getLedger', query);
    if(!all.rows.length){ toast('Nothing to export with these filters', true); return; }
    if(all.truncated){
      toast('That is ' + all.total + ' rows; the first ' + all.limit +
        ' were exported. Narrow the date range to get the rest.', true);
    }
    download(filenameHint || ledgerExportName(query), ledgerRowsToCsv(all.rows));
  }catch(err){
    toast(diagnose(err).detail, true);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Export CSV'; }
  }
}

/* A filename that says what is in it, so three exports in a downloads
   folder are still tellable apart a week later. */
function ledgerExportName(q){
  const bits = ['stockflow-ledger'];
  if(q.batchId) bits.push('import-' + q.batchId);
  if(q.brand) bits.push(String(q.brand).toLowerCase().replace(/[^a-z0-9]+/g, '-'));
  if(q.item) bits.push(String(q.item).toLowerCase());
  if(q.type) bits.push(String(q.type).toLowerCase().replace(/[^a-z0-9]+/g, '-'));
  if(q.dateFrom || q.dateTo) bits.push((q.dateFrom || 'start') + '_to_' + (q.dateTo || STATE.today));
  if(bits.length === 1) bits.push('all');
  return bits.join('-') + '.csv';
}

/* A download the page starts itself. Kept to a Blob URL and revoked
   afterwards so a long session does not leak them. */
function download(filename, text){
  try{
    const blob = new Blob([text], {type: 'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('Downloaded ' + filename);
  }catch(err){
    toast('This browser would not start the download.', true);
  }
}

/* Reuses the movement reader, so a tab-separated paste out of Excel and
   a byte-order mark are handled the same way here as there. */
function checkItemImport(text){
  const s = STATE.itemImport;
  s.error = null; s.preview = null; s.busy = true; render();
  const rows = parseCsv(text);
  if(rows.length < 2){
    s.busy = false;
    s.error = 'That needs a header row and at least one item under it.';
    render();
    return;
  }
  const headers = rows[0].map(function(h){ return normaliseHeader(h); });
  const map = {item: 'item', partnumber: 'item', partno: 'item', sku: 'item', code: 'item',
    name: 'name', description: 'name', productdescription: 'name', product: 'name',
    category: 'category', brand: 'brand', b2b: 'b2b'};
  const fields = headers.map(function(h){ return map[h] || h; });
  if(fields.indexOf('item') < 0 || fields.indexOf('name') < 0 || fields.indexOf('category') < 0){
    s.busy = false;
    s.error = 'The header row must include item, name and category. Found: ' +
      rows[0].join(', ') + '. Download the template to get the right shape.';
    render();
    return;
  }
  s.rows = rows.slice(1)
    .filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); })
    .map(function(r){
      const o = {};
      fields.forEach(function(f, i){ o[f] = (r[i] === undefined ? '' : String(r[i]).trim()); });
      return o;
    });

  rpc('bulkAddItems', {rows: s.rows, dryRun: true})
    .then(function(preview){ s.preview = preview; s.busy = false; render(); })
    .catch(function(err){ s.busy = false; s.error = diagnose(err).detail; render(); });
}

async function commitItemImport(){
  const s = STATE.itemImport;
  const skip = document.getElementById('item-import-skip');

  try{

      rows: s.rows, skipInvalid: skip ? skip.checked : s.skipInvalid
    });
    STATE.itemImport = {open: false, rows: [], preview: null, busy: false, error: null, skipInvalid: true};
    toast(res.added + ' item(s) added' + (res.skipped ? ', ' + res.skipped + ' skipped' : ''));
    await refreshData();

    s.busy = false;
    s.error = diagnose(err).detail;
    render();
  }
}

/* ---------------- Movement types ---------------- */
function bindTypes(){
  if(STATE.tab !== 'types' || !STATE.perms.items) return;
  on('#add-type', 'click', function(){ openModal({kind: 'type'}); });
  on('[data-edittype]', 'click', function(e){
    openModal({kind: 'type', code: e.currentTarget.dataset.edittype});
  });
}

/* ---------------- B2B ---------------- */
function bindB2B(){
  if(STATE.tab !== 'b2b' || !STATE.perms.b2b) return;
  on('[data-b2b]', 'change', async function(e){
    const field = e.currentTarget.dataset.b2b;
    const item = e.currentTarget.dataset.item;
    const raw = e.target.value;
    try{
      await mutate('setB2BField', {item: item, field: field, value: raw === '' ? null : raw});
      toast(field + ' saved for ' + item);
      await refreshData();
    }catch(err){
      toast(diagnose(err).detail, !err.probablySucceeded);
      await refreshData();
    }
  });
}

/* ---------------- Analytics ---------------- */
function bindAnalytics(){
  if(STATE.tab !== 'analytics') return;
  on('[data-resolveflag]', 'click', function(e){
    openModal({kind: 'flag', item: e.currentTarget.dataset.resolveflag});
  });
}

/* ---------------- Audit ---------------- */
function bindAudit(){
  if(STATE.tab !== 'audit') return;
  const set = function(key, value){
    const v = STATE.views.audit;
    v[key] = value; v.page = 1;
    loadAudit();
  };
  on('#af-from', 'change', function(e){ set('dateFrom', e.target.value); });
  on('#af-to', 'change', function(e){ set('dateTo', e.target.value); });
  on('#af-entity', 'change', function(e){ set('entity', e.target.value); });
  on('#af-search', 'input', debounce(function(e){ set('search', e.target.value); }, 300));
  on('#af-clear', 'click', function(){
    STATE.views.audit = Object.assign(STATE.views.audit, {page: 1, dateFrom: '', dateTo: '', entity: '', search: ''});
    loadAudit();
  });
  on('[data-spage]', 'click', function(e){
    const viewId = e.currentTarget.dataset.spage;
    STATE.views[viewId].page = Number(e.currentTarget.dataset.to);
    const loaders = {ledger: loadLedger, audit: loadAudit, imports: loadImports};
    (loaders[viewId] || loadAudit)();
  });
  on('#export-audit', 'click', function(){
    const d = STATE.views.audit.data;
    if(!d || !d.rows.length){ toast('Nothing to export', true); return; }
    const header = ['at', 'actor', 'entity', 'key', 'field', 'oldValue', 'newValue', 'reason'];
    download('stockflow-audit.csv', toCsv([header].concat(d.rows.map(function(r){
      return header.map(function(h){ return r[h] || ''; });
    }))));
  });
}

/* ---------------- Access ---------------- */
function bindAccess(){
  if(STATE.tab !== 'access' || !STATE.perms.directory) return;
  on('#add-member', 'click', function(){ openModal({kind: 'member'}); });
  on('[data-editmember]', 'click', function(e){
    openModal({kind: 'member', userId: e.currentTarget.dataset.editmember});
  });
  on('[data-togglemember]', 'click', async function(e){
    const userId = e.currentTarget.dataset.togglemember;
    const m = (STATE.data.directory || []).filter(function(d){ return d.userId === userId; })[0];
    if(!m) return;
    const next = m.status === 'disabled' ? 'active' : 'disabled';
    if(next === 'disabled' && !confirm('Disable ' + m.name + '? Their session ends on their next request.')) return;
    try{
      await mutate('setUserStatus', {userId: userId, status: next});
      toast(m.name + ' is now ' + next);
      await refreshData();
    }catch(err){ toast(diagnose(err).detail, true); }
  });
}

/* ---------------- Modal actions ---------------- */
function bindModalActions(){
  const m = STATE.modal;
  if(!m) return;

  on('#reverse-confirm', 'click', async function(){
    const reason = (document.getElementById('reverse-reason') || {}).value || '';
    m.busy = true; m.error = null; render();
    try{
      const res = await mutate('reverseTransaction', {txnId: m.txnId, reason: reason.trim()});
      const kids = ((res && res.reversedChildren) || []).length;
      STATE.modal = null;
      toast(kids
        ? 'Reversed, with its ' + kids + ' child item' + (kids === 1 ? '' : 's') +
          '. Every row stays on the ledger.'
        : 'Reversed. Both rows stay on the ledger.');
      await refreshData();
      await loadLedger();
    }catch(err){
      m.busy = false;
      m.error = diagnose(err).detail;
      render();
    }
  });

  /* Changing the type changes which fields matter, so the dialog
     re-renders — and remembers what was typed, because losing a
     half-filled correction to a dropdown would be maddening. */
  on('#e-type', 'change', function(e){
    m.type = e.target.value;
    m.error = null;
    render();
  });

  on('#edit-confirm', 'click', async function(){
    const val = function(id){
      const el = document.getElementById(id);
      return el ? String(el.value || '').trim() : '';
    };
    const reason = val('edit-reason');
    const type = val('e-type');
    const need = txnFieldsFor(type);
    /* Fields the new type does not use are sent empty rather than left
       out, so changing a purchase into a transfer clears the cost price
       instead of carrying it silently. */
    const data = {
      date: val('e-date'),
      item: val('e-item'),
      type: type,
      qty: val('e-qty'),
      ref: val('e-ref'),
      notes: val('e-notes'),
      partner: val('e-partner'),
      businessType: val('e-businesstype'),
      fob: need.fob ? val('e-fob') : '',
      location: need.location ? val('e-location') : '',
      toLocation: need.toLocation ? val('e-tolocation') : '',
      sellPrice: need.sellPrice ? val('e-sellprice') : ''
    };
    m.busy = true; m.error = null; render();
    try{
      const res = await mutate('editTransaction', {txnId: m.txnId, data: data, reason: reason});
      STATE.modal = null;
      toast('Corrected' + (res && res.summary ? ' — ' + res.summary : '') + '. Both rows stay on the ledger.');
      await refreshData();
      await loadLedger();
    }catch(err){
      m.busy = false;
      m.error = diagnose(err).detail;
      render();
    }
  });

  on('#flag-confirm', 'click', async function(){
    const note = (document.getElementById('flag-note') || {}).value || '';
    const item = itemByCode(m.item) || {};
    m.busy = true; m.error = null; render();
    try{
      await mutate('resolveItemFlag', {item: m.item, note: note.trim(), reopen: !!item.flagResolvedBy});
      STATE.modal = null;
      toast('Recorded against ' + m.item);
      await refreshData();
    }catch(err){
      m.busy = false; m.error = diagnose(err).detail; render();
    }
  });

  on('#type-behaviour', 'change', function(e){
    /* The sale question only applies to a movement that takes stock out,
       so the form has to redraw when the behaviour changes. */
    m.behaviour = e.target.value;
    render();
  });

  on('#type-save', 'click', async function(){
    const val = function(id){ const el = document.getElementById(id); return el ? el.value : ''; };
    const chk = function(id){ const el = document.getElementById(id); return !!(el && el.checked); };
    const data = {label: val('type-label'), behaviour: val('type-behaviour'),
                  isSale: chk('type-issale'), businessType: val('type-businesstype')};
    m.busy = true; m.error = null; render();
    try{
      if(m.code) await mutate('updateMovementType', {code: m.code, data: data});
      else await mutate('addMovementType', {data: Object.assign({code: val('type-code')}, data)});
      STATE.modal = null;
      toast(m.code ? 'Movement type updated' : 'Movement type added — it is in the list now');
      await refreshData();
    }catch(err){
      m.busy = false; m.error = diagnose(err).detail; render();
    }
  });

  on('#type-retire', 'click', async function(){
    const t = ((STATE.data.movementTypes || []).filter(function(x){ return x.code === m.code; })[0] || {});
    m.busy = true; m.error = null; render();
    try{
      await mutate('updateMovementType', {code: m.code, data: {active: !t.active}});
      STATE.modal = null;
      toast(t.active ? m.code + ' retired — history is untouched' : m.code + ' is back in use');
      await refreshData();
    }catch(err){ m.busy = false; m.error = diagnose(err).detail; render(); }
  });

  on('#type-delete', 'click', async function(){
    if(!confirm('Delete ' + m.code + '? This only works while nothing has ever been recorded under it.')) return;
    m.busy = true; m.error = null; render();
    try{
      await mutate('deleteMovementType', {code: m.code});
      STATE.modal = null;
      toast(m.code + ' deleted');
      await refreshData();
    }catch(err){ m.busy = false; m.error = diagnose(err).detail; render(); }
  });

  on('#item-save', 'click', async function(){
    const val = function(id){ const el = document.getElementById(id); return el ? el.value : ''; };
    const chk = function(id){ const el = document.getElementById(id); return !!(el && el.checked); };
    const data = {name: val('item-name'), category: val('item-category'),
      brand: val('item-brand'), b2b: chk('item-b2b')};
    m.busy = true; m.error = null; render();
    try{
      if(m.item) await mutate('updateItem', {item: m.item, data: data});
      else await mutate('addItem', {data: Object.assign({item: val('item-code')}, data)});
      STATE.modal = null;
      toast(m.item ? m.item + ' updated' : 'Item added — you can post against it now');
      await refreshData();
    }catch(err){
      m.busy = false; m.error = diagnose(err).detail; render();
    }
  });

  on('#item-toggle-active', 'click', async function(){
    const it = itemByCode(m.item) || {};
    const next = it.active === false;
    m.busy = true; m.error = null; render();
    try{
      await mutate('setItemActive', {item: m.item, active: next});
      STATE.modal = null;
      toast(m.item + ' is now ' + (next ? 'active' : 'inactive'));
      await refreshData();
    }catch(err){
      m.busy = false; m.error = diagnose(err).detail; render();
    }
  });

  on('#member-save', 'click', async function(){
    const data = {
      name: (document.getElementById('member-name') || {}).value || '',
      email: (document.getElementById('member-email') || {}).value || '',
      role: (document.getElementById('member-role') || {}).value || 'board'
    };
    m.busy = true; m.error = null; render();
    try{
      if(m.userId) await mutate('updateTeamMember', {userId: m.userId, data: data});
      else await mutate('addTeamMember', {data: data});
      STATE.modal = null;
      toast('Directory updated');
      await refreshData();
    }catch(err){
      m.busy = false; m.error = diagnose(err).detail; render();
    }
  });
}
</script>

<script>
/* ============================================================
   DATA LOADING AND THE BOOT SEQUENCE
   ============================================================ */

async function loadLedger(){
  const v = STATE.views.ledger;
  v.loading = true;
  try{
    /* Both the ledger and the dashboard read the whole ledger to answer
       their own question, so each returns the partner list as a
       by-product. Stashed as it lands, so the pickers and the entry
       form's datalist are populated from whichever screen was opened
       first rather than needing a request of their own. */
    v.data = await rpc('getLedger', {
      page: v.page, pageSize: PAGE_SIZE,
      /* The switcher scopes the movements too. Without this, selecting a
         brand filtered every position screen and left the ledger showing
         everything — which reads as a bug the moment a second brand is
         loaded, and is invisible until then. */
      brand: STATE.activeBrand || '',
      dateFrom: v.dateFrom, dateTo: v.dateTo, item: v.item, type: v.type,
      stage: v.stage, businessType: v.businessType, partner: v.partner,
      search: v.search, sortBy: v.sortBy, sortDir: v.sortDir
    });
    if(v.data && v.data.partners) STATE.data.partners = v.data.partners;
  }catch(err){
    if(!err.sessionInvalid) toast(diagnose(err).detail, true);
  }
  v.loading = false;
  if(!STATE.modal) render();
}

async function loadImports(){
  const v = STATE.views.imports;
  v.loading = true;
  try{
    v.data = await rpc('getImportBatches', {
      page: v.page, pageSize: 10, brand: STATE.activeBrand || ''
    });
  }catch(err){
    if(!err.sessionInvalid) toast(diagnose(err).detail, true);
  }
  v.loading = false;
  if(!STATE.modal) render();
}

async function loadAudit(){
  const v = STATE.views.audit;
  v.loading = true;
  try{
    v.data = await rpc('getAudit', {
      page: v.page, pageSize: PAGE_SIZE,
      dateFrom: v.dateFrom, dateTo: v.dateTo, entity: v.entity, search: v.search
    });
  }catch(err){
    if(!err.sessionInvalid) toast(diagnose(err).detail, true);
  }
  v.loading = false;
  if(!STATE.modal) render();
}

async function refreshData(){
  try{
    const data = await rpc('getBootstrap', {});
    applyBootstrap(data);
    STATE.stale = false;
    if(!STATE.modal) render();
    /* The movement panel is read from the ledger, so it goes stale with
       everything else a write changes. */
    if(STATE.activity.data) loadActivity();
  }catch(err){
    if(!err.sessionInvalid) toast(diagnose(err).detail, true);
  }
}

function applyBootstrap(data){
  STATE.data = data;
  STATE.today = data.today;           // the server's date, always
  STATE.session = data.session;
  STATE.perms = data.perms || STATE.perms;
  STATE.revision = data.revision;
  STATE.marginDraft = {category: {}, sku: {}};
}

async function loadApp(){
  const data = await rpc('getBootstrap', {});
  applyBootstrap(data);
  STATE.phase = 'app';
  render();
  if(STATE.tab === 'ledger'){ loadLedger(); loadImports(); }
  if(STATE.tab === 'overview' || STATE.tab === 'analytics') loadActivity();
  startPolling();
}

function onSessionLost(message){
  setSessionToken('');
  STATE.phase = 'auth';
  STATE.session = null;
  STATE.data = null;
  STATE.auth = {step: 'email', email: lastEmail(), message: message, messageKind: 'err', busy: false, needsBootstrap: false};
  stopPolling();
  render();
}

/* The background poll asks only for a revision number. If it has moved
   it refreshes — unless a dialog is open, in which case it sets the
   stale flag and the strip appears the moment the dialog closes.
   Re-rendering over an open form throws away someone's work. */
let pollTimer = null;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(async function(){
    if(STATE.phase !== 'app') return;
    try{
      const res = await rpc('getRevision', {});
      if(res.today !== STATE.today){
        /* The server's day rolled over while the page was open. Every
           age on screen is now one day out; take the new date. */
        STATE.today = res.today;
        if(!STATE.modal) await refreshData();
        else STATE.stale = true;
        return;
      }
      if(res.revision !== STATE.revision){
        if(STATE.modal) STATE.stale = true;
        else await refreshData();
      }
    }catch(err){ /* a poll that fails is not worth interrupting anyone for */ }
  }, 45000);
}
function stopPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

async function boot(){
  STATE.phase = 'loading';
  STATE.fatal = null;
  render();

  if(!backendUrl()){
    STATE.phase = 'fatal';
    STATE.fatal = {
      title: 'This page has not been pointed at a Google Sheet',
      detail: 'Whoever published stockflow.html needs to set STOCKFLOW_BACKEND_URL near the top of ' +
        'the file to the Apps Script Web App /exec URL. Until then there is nothing for this page to read.'
    };
    render();
    return;
  }

  /* A stored token is tried first, so a returning user goes straight in. */
  if(sessionToken()){
    try{
      await loadApp();
      return;
    }catch(err){
      if(err.sessionInvalid) return;                 // onSessionLost already redrew
      STATE.phase = 'fatal';
      STATE.fatal = diagnose(err);
      render();
      return;
    }
  }

  try{
    const ctx = await rpc('getLoginContext', {});
    STATE.today = ctx.today;
    STATE.phase = 'auth';
    STATE.auth = {
      step: 'email', email: lastEmail(), message: null, messageKind: 'info',
      busy: false, needsBootstrap: !!ctx.needsBootstrap
    };
    if(!ctx.emailConfigured){
      STATE.auth.message = 'This Stockflow Sheet cannot send email yet, so a sign-in code will not ' +
        'arrive. Whoever set it up needs to run configureEmailFromSheet or set POSTMARK_TOKEN and ' +
        'POSTMARK_FROM in Script Properties.';
      STATE.auth.messageKind = 'err';
    }
  }catch(err){
    STATE.phase = 'fatal';
    STATE.fatal = diagnose(err);
  }
  render();
}

/* Only start in a browser. Under Node — where the test suite loads this
   same file to check the CSV parser, the margin resolver, the formatters
   and the tag balance of every screen — there is no document to render
   into and nothing should reach for one. */
if(typeof document !== 'undefined' && typeof window !== 'undefined' && !window.__HEADLESS__){
  boot();
}
</script>
</body>
