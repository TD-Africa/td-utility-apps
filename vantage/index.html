<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TD Africa · Vantage</title>

<!--
  ============================================================
  TD AFRICA · VANTAGE
  Quote and pipeline system of record.

  This is the whole application: one static file. It stores nothing
  itself — every sales team shares one company Google Sheet, reached
  through an Apps Script Web App. Host this file anywhere (GitHub
  Pages, a network share, or just open it from disk).

  SETUP — one line, once, before you publish this file:
  search for VANTAGE_BACKEND_URL and paste the Web App /exec URL for
  the company Sheet between the quotes. Nobody using the app is ever
  asked for it.

  See DEPLOYMENT.md for the full walkthrough.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Excel reading only. CSV upload uses a parser built into this file, so a
     blocked CDN can never stop a bulk import — it only removes .xlsx support.
     Deferred so a slow or blocked CDN cannot hold up the page. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#0B1120;
    --ink-soft:#131C2E;
    --ink-line:#233049;
    --surface:#F4F5F8;
    --card:#FFFFFF;
    --border:#E3E6EC;
    --text:#101828;
    --text-soft:#5B6472;
    --text-faint:#8B93A1;
    --gold:#C89B3C;
    --gold-deep:#9C7623;
    --gold-soft:#F6ECD3;
    --p1:#1D8A5F; --p1-soft:#E4F5EC; --p1-line:#B9E4CE;
    --p2:#2563EB; --p2-soft:#E8EEFE; --p2-line:#C2D3FB;
    --p3:#C6790E; --p3-soft:#FBF0DD; --p3-line:#F0D6A4;
    --danger:#C0362C; --danger-soft:#FBE9E7;
    --won:#1D8A5F;
    --radius:12px;
    --radius-sm:8px;
    --shadow-card: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
    --shadow-pop: 0 12px 32px rgba(11,17,32,0.18), 0 2px 8px rgba(11,17,32,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--surface);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  button{font-family:inherit;cursor:pointer;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--gold-soft);}
  a{color:var(--p2);}

  /* ---------- App shell ---------- */
  #app{min-height:100vh;}
  .shell{display:flex;min-height:100vh;}

  .sidebar{
    width:236px;flex:none;background:var(--ink);color:#DDE3EE;
    display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
    overflow-y:auto;z-index:60;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px 8px;border-bottom:1px solid var(--ink-line);margin-bottom:16px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--gold),var(--gold-deep));
    display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;color:var(--ink);font-size:15px;flex:none;
  }
  .brand-text{line-height:1.15;}
  .brand-text .t1{font-family:'Sora';font-weight:700;font-size:14.5px;color:#fff;}
  .brand-text .t2{font-size:10.5px;color:#8CA0C4;letter-spacing:.04em;text-transform:uppercase;}

  .nav-group{margin-bottom:18px;}
  .nav-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#5E6E8C;padding:0 10px;margin-bottom:6px;font-weight:600;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#B9C4D9;
    font-size:13.5px;font-weight:500;margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left;
  }
  .nav-item:hover{background:var(--ink-soft);color:#fff;}
  .nav-item.active{background:var(--ink-soft);color:#fff;box-shadow:inset 3px 0 0 var(--gold);}
  .nav-icon{width:16px;text-align:center;flex:none;opacity:.9;}
  .nav-count{margin-left:auto;font-size:10.5px;background:var(--ink-line);color:#B9C4D9;padding:1px 7px;border-radius:20px;}
  .nav-count.alert{background:var(--danger);color:#fff;}

  .sidebar-foot{margin-top:auto;border-top:1px solid var(--ink-line);padding-top:14px;}
  .who{display:flex;gap:9px;align-items:center;padding:6px 8px;}
  .who-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;}
  .who-name{font-size:12.5px;font-weight:600;color:#fff;}
  .who-role{font-size:10.5px;color:#8CA0C4;}
  .logout-btn{width:100%;margin-top:10px;background:transparent;border:1px solid var(--ink-line);color:#B9C4D9;padding:7px;border-radius:7px;font-size:12px;}
  .logout-btn:hover{border-color:#5E6E8C;color:#fff;}
  .sheet-link{display:block;margin-top:8px;font-size:10.5px;color:#5E6E8C;text-decoration:none;padding:0 4px;}
  .sheet-link:hover{color:#8CA0C4;text-decoration:underline;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    min-height:62px;flex:none;background:var(--card);border-bottom:1px solid var(--border);
    display:flex;align-items:center;padding:0 26px;gap:16px;position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:17px;}
  .topbar .sub{font-size:12px;color:var(--text-soft);margin-top:1px;}
  .topbar-spacer{flex:1;}
  .nav-toggle{display:none;background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:15px;line-height:1;color:var(--text);}

  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid transparent;
  }
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover:not(:disabled){background:#000;}
  .btn-gold{background:var(--gold);color:#231604;}
  .btn-gold:hover:not(:disabled){background:var(--gold-deep);color:#fff;}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-ghost:hover:not(:disabled){background:var(--surface);}
  .btn-danger-ghost{background:transparent;border-color:var(--danger-soft);color:var(--danger);}
  .btn-danger-ghost:hover:not(:disabled){background:var(--danger-soft);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}

  .content{padding:22px 26px 60px 26px;max-width:1400px;width:100%;}

  .policy-banner{
    background:var(--ink);color:#DDE3EE;border-radius:var(--radius);padding:11px 16px;font-size:12.5px;
    display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;border-left:3px solid var(--gold);line-height:1.5;
  }
  .policy-banner b{color:#fff;}
  .policy-banner .banner-act{margin-left:auto;flex:none;}

  /* Non-blocking alert strip for save failures and stale data */
  .alert-strip{
    display:flex;align-items:center;gap:10px;padding:10px 26px;font-size:12.5px;line-height:1.45;
    border-bottom:1px solid transparent;
  }
  .alert-strip .strip-act{margin-left:auto;flex:none;display:flex;gap:8px;}
  .alert-danger{background:#3A1414;color:#FFD9D2;border-bottom-color:#B23A3A;}
  .alert-warn{background:var(--p3-soft);color:#6B430A;border-bottom-color:var(--p3-line);}
  .alert-info{background:var(--p2-soft);color:#12357E;border-bottom-color:var(--p2-line);}
  .alert-strip button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:7px;padding:4px 10px;font-size:11.5px;font-weight:600;}
  .alert-strip button:hover{background:rgba(255,255,255,.14);}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:16px;}
  .kpi-row{grid-template-columns:repeat(4,1fr);margin-bottom:20px;}
  .kpi-row-3{grid-template-columns:repeat(3,1fr);margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);}
  .card-pad{padding:18px 20px;}
  .kpi{padding:16px 18px;position:relative;overflow:hidden;}
  .kpi .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);font-weight:700;margin-bottom:8px;}
  .kpi .value{font-family:'Sora';font-size:24px;font-weight:700;letter-spacing:-.01em;}
  .kpi .delta{font-size:11.5px;color:var(--text-soft);margin-top:5px;line-height:1.45;}
  .kpi .bar{position:absolute;left:0;bottom:0;height:4px;width:100%;}
  .kpi.p1 .bar{background:var(--p1);} .kpi.p2 .bar{background:var(--p2);} .kpi.p3 .bar{background:var(--p3);} .kpi.gold .bar{background:var(--gold);}
  .kpi.danger .bar{background:var(--danger);}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px 0;gap:12px;flex-wrap:wrap;}
  .section-title h2{font-size:15px;}
  .section-title .hint{font-size:11.5px;color:var(--text-faint);}

  /* Health bar - signature element */
  .healthbar-wrap{padding:18px 20px 16px 20px;}
  .healthbar-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:12px;flex-wrap:wrap;}
  .healthbar-top .total{font-family:'Sora';font-size:20px;font-weight:700;}
  .healthbar-top .label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .healthbar{display:flex;height:14px;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--border);}
  .healthbar .seg{height:100%;transition:width .4s ease;}
  .healthbar-legend{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap;}
  .leg-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-soft);}
  .leg-dot{width:9px;height:9px;border-radius:3px;flex:none;}

  /* Pipeline board */
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
  .col{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .col-head{padding:14px 15px 12px 15px;border-bottom:1px solid var(--border);}
  .col-head .num{
    display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;
    font-family:'IBM Plex Mono';font-size:11px;font-weight:600;margin-right:8px;
  }
  .col1 .num{background:var(--p1-soft);color:var(--p1);}
  .col2 .num{background:var(--p2-soft);color:var(--p2);}
  .col3 .num{background:var(--p3-soft);color:var(--p3);}
  .col-head .title{font-family:'Sora';font-size:13.5px;font-weight:700;}
  .col-head .desc{font-size:11px;color:var(--text-faint);margin-top:4px;margin-left:28px;}
  .col-head .meta{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--text-soft);gap:8px;}
  .col-body{padding:10px;display:flex;flex-direction:column;gap:9px;max-height:640px;overflow-y:auto;}
  .col-empty{padding:26px 10px;text-align:center;color:var(--text-faint);font-size:12px;}
  .col-more{padding:9px;text-align:center;font-size:11.5px;color:var(--text-soft);background:var(--surface);border-radius:var(--radius-sm);}

  .opp-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;cursor:pointer;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .opp-card:hover{box-shadow:var(--shadow-pop);transform:translateY(-1px);border-color:#D2D7E0;}
  .opp-card.no-quote{border-style:dashed;border-color:var(--p2-line);}
  .opp-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .opp-card .cust{font-weight:700;font-size:13px;line-height:1.25;}
  .opp-card .val{font-family:'IBM Plex Mono';font-size:12.5px;font-weight:600;white-space:nowrap;}
  .opp-card .product{font-size:11.5px;color:var(--text-soft);margin-top:3px;}
  .opp-card .row2{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:6px;flex-wrap:wrap;}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
  .tag-bg{background:var(--surface);color:var(--text-soft);border:1px solid var(--border);}
  .age-chip{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;}
  .age-ok{background:var(--p1-soft);color:var(--p1);}
  .age-warn{background:var(--p3-soft);color:var(--p3);}
  .age-hot{background:var(--danger-soft);color:var(--danger);}
  .opp-card .rep{font-size:11px;color:var(--text-faint);margin-top:6px;}
  .flag-chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--danger-soft);color:var(--danger);}

  /* Table */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);padding:9px 12px;border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap;}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.tr-hover:hover{background:var(--surface);cursor:pointer;}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--text);}
  th .sort-arrow{opacity:.45;margin-left:3px;}
  th.sorted .sort-arrow{opacity:1;color:var(--gold-deep);}
  .num-cell{text-align:right;}

  .pager{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--text-soft);flex-wrap:wrap;}
  .pager .pager-spacer{flex:1;}

  /* filters bar */
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .filters select,.filters input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;background:var(--card);color:var(--text);}
  .filters input[type=text]{min-width:220px;}
  .filters .flex-spacer{flex:1;}
  .filters .filter-summary{font-size:12px;color:var(--text-faint);}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(11,17,32,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
  .modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;box-shadow:var(--shadow-pop);}
  .modal.modal-wide{max-width:760px;}
  .modal.modal-xwide{max-width:960px;}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);gap:12px;}
  .modal-head h3{font-size:15.5px;}
  .modal-close{background:transparent;border:none;font-size:19px;color:var(--text-faint);line-height:1;padding:4px;flex:none;}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
  .modal-error{background:var(--danger-soft);color:var(--danger);border:1px solid #F0C4BF;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.45;}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:13px;}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:13px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);background:#fff;}
  .field input[readonly]{background:#EEF0F4;color:var(--text-soft);}
  .field textarea{resize:vertical;min-height:64px;}
  .field-hint{font-size:11px;color:var(--text-faint);margin-top:4px;line-height:1.5;}
  .field-hint.danger{color:var(--danger);}
  .field-boxed{background:var(--surface);border-radius:8px;padding:10px 12px;}
  .inline-check{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:0;}
  .inline-check input{width:auto;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px;}
  .login-card{width:100%;max-width:440px;background:var(--card);border-radius:16px;padding:32px 30px;box-shadow:var(--shadow-pop);}
  .login-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:22px;}
  .login-mark{height:64px;width:auto;margin-bottom:12px;}
  .login-brand h1{font-size:18px;}
  .login-brand p{font-size:12px;color:var(--text-soft);margin-top:6px;text-align:center;line-height:1.55;}

  .detail-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;}
  .detail-block{margin-bottom:16px;}
  .detail-block h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:8px;font-weight:700;}
  .kv{display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--border);gap:12px;}
  .kv span:first-child{color:var(--text-soft);flex:none;}
  .kv span:last-child{font-weight:600;text-align:right;}
  .status-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;white-space:nowrap;}
  .st-open{background:var(--p2-soft);color:var(--p2);}
  .st-sop{background:var(--p1-soft);color:var(--p1);}
  .st-invoiced{background:#E4F5EC;color:var(--won);}
  .st-lost{background:var(--danger-soft);color:var(--danger);}
  .st-neutral{background:var(--surface);color:var(--text-soft);}

  .history-item{font-size:12px;padding:8px 0;border-bottom:1px solid var(--border);line-height:1.5;}
  .history-item:last-child{border-bottom:none;}
  .history-item .h-time{color:var(--text-faint);font-size:10.5px;margin-top:2px;}
  .note-item{background:var(--surface);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:12.5px;line-height:1.5;}
  .note-item .n-meta{font-size:10.5px;color:var(--text-faint);margin-bottom:3px;}

  .action-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
  .empty-state .big{font-size:34px;margin-bottom:10px;}
  .empty-cell{text-align:center;color:var(--text-faint);padding:24px;}

  .ref-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px;gap:12px;flex-wrap:wrap;}
  .ref-row:last-child{border-bottom:none;}
  .ref-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .rb-so{background:var(--p2-soft);color:var(--p2);}
  .rb-inv{background:#E4F5EC;color:var(--won);}
  .rb-none{background:var(--surface);color:var(--text-soft);}

  .toast-stack{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:9px;max-width:420px;line-height:1.45;}
  .toast .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;}
  .toast.toast-error{background:#3A1414;color:#FFD9D2;}
  .toast.toast-error .dot{background:#FF7A6B;}

  .bar-chart-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-chart-label{width:172px;flex:none;font-size:12px;color:var(--text-soft);}
  .bar-chart-track{flex:1;height:16px;background:var(--surface);border-radius:6px;overflow:hidden;min-width:60px;}
  .bar-chart-fill{height:100%;border-radius:6px;}
  .bar-chart-val{width:104px;flex:none;text-align:right;font-family:'IBM Plex Mono';font-size:11.5px;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .avatar-sm{width:26px;height:26px;border-radius:50%;background:var(--gold-soft);color:var(--gold-deep);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:10.5px;}

  /* ---- Line-item grid ----
     Cell sizing is expressed as flex-basis, not width, and every rule is
     scoped under .line-item-row / .li-head. Both details matter: these inputs
     sit inside a .field, and `.field input{width:100%}` outranks a bare
     `.li-sku{width:110px}` on specificity — which stretched every cell to the
     full row width and, with flex-shrink:0, overflowed the row to the right.
     Header and row share one set of numbers so they cannot drift apart. */
  .line-item-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
  .li-head{display:flex;gap:8px;padding:0 0 4px 0;font-size:10.5px;text-transform:uppercase;color:var(--text-faint);font-weight:700;}
  .line-item-row input{
    min-width:0;padding:8px 10px;border:1px solid var(--border);border-radius:7px;
    font-size:12.5px;background:var(--surface);color:var(--text);
  }
  .line-item-row input:focus{outline:2px solid var(--gold);border-color:var(--gold);background:#fff;}

  .line-item-row .li-sn,       .li-head .li-sn       {flex:0 0 26px;}
  .line-item-row .li-desc,     .li-head .li-desc     {flex:1 1 140px;min-width:80px;}
  .line-item-row .li-sku,      .li-head .li-sku      {flex:0 1 110px;}
  .line-item-row .li-qty,      .li-head .li-qty      {flex:0 1 68px;}
  .line-item-row .li-price,    .li-head .li-price    {flex:0 1 118px;}
  /* Wide enough for a nine-figure naira subtotal — the one column where
     clipping would actually mislead someone. */
  .line-item-row .li-subtotal, .li-head .li-subtotal {flex:0 0 126px;text-align:right;}
  .line-item-row .li-remove,   .li-head .li-gap      {flex:0 0 30px;}

  .li-sn{padding:8px 0;font-size:12px;color:var(--text-faint);text-align:center;}
  .li-head .li-sn{padding:0;}
  .line-item-row .li-subtotal{padding:8px 0;font-size:12.5px;color:var(--text-soft);}
  .line-item-row .li-remove{padding:6px 0;justify-content:center;}
  .li-scroll{max-height:320px;overflow-y:auto;padding-right:4px;}
  .total-display{padding:9px 11px;background:var(--gold-soft);border-radius:8px;font-weight:700;font-size:14px;}

  .spinner{
    width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
    display:inline-block;animation:spin .7s linear infinite;
  }
  .spinner-dark{border-color:rgba(16,24,40,.2);border-top-color:var(--text);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-overlay{
    position:fixed;inset:0;background:rgba(244,245,248,.6);z-index:150;
    display:flex;align-items:center;justify-content:center;
  }
  .busy-pill{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:180;
    background:var(--ink);color:#fff;padding:7px 15px;border-radius:20px;font-size:12px;
    display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-pop);
  }

  .scrim{position:fixed;inset:0;background:rgba(11,17,32,.45);z-index:55;display:none;}

  @media (max-width: 1180px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width: 980px){
    .board{grid-template-columns:1fr;}
    .kpi-row,.kpi-row-3{grid-template-columns:repeat(2,1fr);}
    .field-row,.field-row-3{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:1fr;}
    .two-col{grid-template-columns:1fr;}
    .content{padding:18px 16px 60px 16px;}
    .topbar{padding:0 16px;}
    .alert-strip{padding:10px 16px;}
    .nav-toggle{display:inline-flex;}
    /* The sidebar becomes a drawer rather than disappearing — the prototype
       hid it outright below this width, which left no way to navigate at all. */
    .sidebar{
      position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);
      transition:transform .22s ease;box-shadow:var(--shadow-pop);
    }
    body.nav-open .sidebar{transform:translateX(0);}
    body.nav-open .scrim{display:block;}
    .bar-chart-label{width:120px;}
    .bar-chart-val{width:88px;}
    /* Narrow screens: the row wraps into S/N + description, then SKU, then
       qty / price / subtotal. Scoped to match the desktop rules above. */
    .li-head{display:none;}
    .line-item-row{flex-wrap:wrap;}
    .line-item-row .li-desc{flex:1 1 calc(100% - 70px);}
    .line-item-row .li-sku{flex:1 1 100%;}
    .line-item-row .li-qty,.line-item-row .li-price{flex:1 1 38%;}
    .line-item-row .li-subtotal{flex:1 1 auto;text-align:left;padding-top:8px;}
  }
  @media (max-width: 620px){
    .kpi-row,.kpi-row-3{grid-template-columns:1fr;}
    .modal-foot{justify-content:stretch;}
    .modal-foot .btn{flex:1;justify-content:center;}
  }

  @media print{
    .sidebar,.topbar,.alert-strip,.toast-stack,.scrim{display:none !important;}
    .content{padding:0;max-width:none;}
    .card{break-inside:avoid;box-shadow:none;}
  }
</style>
</head>

<div id="app"></div>
<div class="scrim" id="nav-scrim"></div>
<div class="toast-stack" id="toast-stack"></div>

  list:      ['All Opportunities', 'Search, sort and export the full book'],
  analytics: ['Analytics', 'Pipeline health across Business Groups and reps'],
  orders:    ['Orders & Invoices', 'Record the Dynamics 365 references against each quote'],
  compliance:['Compliance', 'Orders raised outside Vantage, and lost-record cleanup'],
  directory: ['Team Directory', 'Everyone with access to Vantage'],
  activity:  ['Activity Log', 'Who did what, across every opportunity'],
  settings:  ['Settings', 'Reporting rate, pipeline windows and the underlying Sheet']
};

/* ---------------- Server bridge ----------------
   This page is static — it can live on GitHub Pages, a network share, or your
   own desktop. All data lives in a Google Sheet behind an Apps Script Web App,
   reached over HTTP.

   Two constraints shape the calls below, both from Apps Script:

     1. It cannot answer a CORS preflight. So every request must be a "simple"
        cross-origin request, which means the Content-Type has to be one of
        the safelisted values. We send text/plain and parse the JSON body
        server-side. Sending application/json would trigger a preflight and
        every call would fail.
     2. /exec answers with a 302 to script.googleusercontent.com. fetch follows
        it automatically, and that final response is the one carrying the
        CORS header. Nothing to do, but it is why a call makes two hops. */

/* ============================================================
   ▼▼▼  THE ONLY THING YOU NEED TO SET  ▼▼▼

   Paste the Apps Script Web App URL for the company Vantage Sheet between
   the quotes below. It ends in /exec. Set it once, here, before you publish
   this file — the whole sales team then just opens the app and starts work.

   Get it from: the Apps Script editor → Deploy → Manage deployments →
   copy the Web app URL.
   ============================================================ */

const VANTAGE_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwlVL4ME_APkG5ZeHqroCMDYg22ROYOyOaJIXfkQtIRoBg9eItI0yWHBMkWySzvJaUTgg/exec';

/* ============================================================
   ▲▲▲  NOTHING BELOW HERE NEEDS EDITING  ▲▲▲
   ============================================================ */

function backendUrl(){
  return String(VANTAGE_BACKEND_URL || '').trim();
}
/* Catches the three things people paste by mistake: the script editor URL, the
   /dev test URL, and the Google Sheet's own link. Only a deployed Web App
   /exec address will work. */
function isValidBackendUrl(url){
  return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(\?|$)/.test(String(url || '').trim());
}
function isConfigured(){
  return isValidBackendUrl(backendUrl());
}

/* The access code, if the Sheet has one set, is the only thing standing in
   front of a publicly-callable endpoint — so it is deliberately NOT stored in
   this file, which is readable by anyone who can open the site. Each person
   types it once and their own browser remembers it. If the Sheet has no code
   set, nobody is ever asked. */
const ACCESS_CODE_KEY = 'vantage_access_code';
let memoryAccessCode = '';

function accessCode(){
  if(memoryAccessCode) return memoryAccessCode;
  try{ return window.localStorage.getItem(ACCESS_CODE_KEY) || ''; }catch(e){ return ''; }
}
function setAccessCode(code){
  memoryAccessCode = code || '';
  try{
    if(memoryAccessCode) window.localStorage.setItem(ACCESS_CODE_KEY, memoryAccessCode);
    else window.localStorage.removeItem(ACCESS_CODE_KEY);
  }catch(e){ /* private browsing — the in-memory value still works this session */ }
}

/* Reads are safe to repeat, so a one-off transport hiccup is retried rather
   than shown to anyone. Writes are not in this list: repeating one could send a
   second sign-in code or create a second quote. */
const RETRYABLE_ACTIONS = {
  getBootstrap: true, getRevision: true, getLoginContext: true,
  getOpportunityDetail: true, getActivityFeed: true, getLineItemsFor: true
};

/* Set once any call has succeeded. After that we know the deployment exists, so
   a later 404 is a transport failure rather than a wrong URL — and the two need
   very different advice. */
let backendProvenAlive = false;

/* Every server call goes through here, so a failure surfaces in one place
   instead of being swallowed. `action` names a function in Code.gs.

   An Apps Script /exec POST does not answer directly: it runs the script, then
   302-redirects to script.googleusercontent.com, which serves the payload. fetch
   follows that automatically — but the two hops fail differently, and it matters
   which one did. A failure on the second hop means the script already ran. For a
   write like requestOtp that means the email really was sent, even though the
   caller saw an error. Anything transport-level is therefore flagged so callers
   can say so instead of claiming the action failed. */
async function rpc(action, payload){
  const url = backendUrl();
  if(!url){
    throw new Error('This copy of Vantage has not been pointed at a Google Sheet yet. ' +
      'Whoever published it needs to set VANTAGE_BACKEND_URL in vantage.html.');
  }

  const attempts = RETRYABLE_ACTIONS[action] ? 2 : 1;
  let lastError = null;

  for(let attempt = 1; attempt <= attempts; attempt++){
    try{
      return await rpcOnce(action, payload, url);
    }catch(err){
      lastError = err;
      /* Only a transport failure is worth repeating; an application error would
         come back the same way every time. */
      if(!err.transport || attempt === attempts) throw err;
      await new Promise(function(resolve){ setTimeout(resolve, 700 * attempt); });
    }
  }
  throw lastError;
}

async function rpcOnce(action, payload, url){
  let res;
  try{
    res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action: action, payload: payload,
        sessionToken: sessionToken(), accessCode: accessCode()
      }),
      redirect: 'follow'
    });
  }catch(err){
    /* A cross-origin failure lands here with no detail, by design. The causes
       worth naming are the ones the person can actually fix. */
    const e = new Error('Could not reach the Vantage backend. Check your internet connection, ' +
      'and that the Web App is deployed with "Who has access" set to Anyone.');
    e.transport = true;
    throw e;
  }

  if(!res.ok){
    if(res.status === 404 && backendProvenAlive){
      /* This deployment has already answered in this session, so it exists. A
         404 now is Google's content-serving hop failing, not a wrong URL. */
      const e = new Error('Google did not return the reply, though the request itself went through. ' +
        'This usually clears on a second try.');
      e.transport = true;
      throw e;
    }
    if(res.status === 404){
      const e = new Error('Nothing is deployed at the address this page is pointed at, so the Google Sheet ' +
        'backend cannot be reached. Copy the current Web app URL from the Apps Script editor ' +
        '(Deploy → Manage deployments) and set VANTAGE_BACKEND_URL in vantage.html to match.');
      e.transport = true;
      throw e;
    }
    const e = new Error('The backend returned HTTP ' + res.status + '. Re-deploy the Web App and try again.');
    if(res.status >= 500) e.transport = true;
    throw e;
  }

  const text = await res.text();
  let data;
  try{
    data = JSON.parse(text);
  }catch(err){
    /* Almost always a Google sign-in page served instead of our JSON, which
       means the deployment is not open to anonymous callers. */
    throw new Error('The backend replied with a sign-in page instead of data. ' +
      'Re-deploy the Web App with "Execute as: Me" and "Who has access: Anyone".');
  }

  backendProvenAlive = true;

  if(data.error){
    if(data.error === 'ACCESS_CODE_REQUIRED'){
      const e = new Error('This Vantage Sheet needs an access code.');
      e.accessCodeRequired = true;
      throw e;
    }
    /* Handled in one place so that every screen reacts the same way to a token
       that has expired, been revoked, or belongs to a disabled account. */
    if(data.error === 'SESSION_REQUIRED' || data.error === 'SESSION_INVALID' || data.error === 'SESSION_EXPIRED'){
      const message = data.error === 'SESSION_EXPIRED'
        ? 'Your session has expired. Sign in again to carry on.'
        : 'Please sign in again.';
      onSessionLost(message);
      const e = new Error(message);
      e.sessionInvalid = true;
      throw e;
    }
    throw new Error(data.error);
  }
  return data.result;
}

/* Wraps a write: shows the busy pill, records the failure if it fails, and
   keeps a retry closure so the user can try the same call again from the
   alert strip. The prototype set a lastSaveFailed flag and never showed it. */
async function mutate(label, fnName, payload, options){
  const opts = options || {};
  STATE.busy = label;
  STATE.modalBusy = true;
  STATE.modalError = null;
  render();
  try{
    const res = await rpc(fnName, payload);
    STATE.saveError = null;
    if(res && res.revision){
      STATE.revision = res.revision;
      STATE.staleRevision = null;
    }
    return res;
  }catch(err){
    const message = String(err.message || err);
    if(opts.inModal){
      STATE.modalError = message;
    }else{
      STATE.saveError = {
        message: message,
        label: label,
        retry: function(){ return mutate(label, fnName, payload, options); }
      };
      toast(message, true);
    }
    throw err;
  }finally{
    STATE.busy = null;
    STATE.modalBusy = false;
  }
}

/* ---------------- Connection check ----------------
   An /exec call is two hops: the script runs at script.google.com, which then
   302-redirects to script.googleusercontent.com carrying a single-use content
   key, and the reply is served from there.

   The distinction that matters when something breaks:

     · fetch throws       → the host was never reached (offline, DNS, firewall)
     · a 404 comes back   → something answered and rejected the content key.
                            Anything that pre-fetches or follows redirects — a
                            proxy, web filter, or security scanner — consumes
                            that single-use key, so the browser's own request
                            then finds it already spent.

   This probes both hops and reports which failed, so a network team is handed
   evidence rather than a guess. */
async function connectionCheck(){
  const url = backendUrl();
  const lines = [
    'Vantage connection check',
    'When    : ' + new Date().toISOString(),
    'Page    : ' + location.origin,
    'Backend : ' + (url || '(not set)'),
    ''
  ];
  if(!url){
    lines.push('No backend URL is configured, so there is nothing to test.');
    return lines;
  }

  const probe = async function(label, init){
    const started = Date.now();
    try{
      const res = await fetch(url, init);
      const took = Date.now() - started;
      const body = await res.text();
      let shape;
      try{
        const parsed = JSON.parse(body);
        shape = (parsed.result && parsed.result.app === 'vantage') ? 'Vantage JSON'
          : (parsed.error ? 'JSON error: ' + parsed.error : 'JSON, unrecognised');
      }catch(e){
        shape = /<html|<!doctype/i.test(body) ? 'an HTML page (usually a Google sign-in)' : 'not JSON';
      }
      lines.push(label + ': HTTP ' + res.status + ' in ' + took + 'ms');
      lines.push('        replied from : ' + (res.url || '(not reported)'));
      lines.push('        body         : ' + shape);
      return {status: res.status, finalUrl: res.url || '', shape: shape};
    }catch(err){
      lines.push(label + ': could not connect (' + (Date.now() - started) + 'ms)');
      lines.push('        ' + String(err.message || err));
      return {status: 0, finalUrl: '', shape: 'no reply'};
    }
  };

  const get = await probe('GET   ', {method: 'GET', redirect: 'follow'});
  lines.push('');
  const post = await probe('POST  ', {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action: 'getLoginContext'}),
    redirect: 'follow'
  });

  lines.push('');
  lines.push('What this means:');
  const reachedContentHost = (get.finalUrl + post.finalUrl).indexOf('googleusercontent') >= 0;

  if(post.shape.indexOf('JSON') >= 0){
    lines.push('  The backend is reachable from this device and answering normally.');
  }else if(post.status === 0 && get.status === 0){
    lines.push('  Nothing answered at all — this device is offline, or script.google.com is blocked.');
  }else if(post.status === 404 || get.status === 404){
    lines.push('  Something answered but rejected the one-time key in Google\'s redirect.');
    lines.push('  That key is good for a single request. Anything on this network that follows or');
    lines.push('  pre-fetches redirects — a proxy, web filter, or security scanner — spends it first,');
    lines.push('  so the browser then finds it used.');
    lines.push('  Decisive test: load this page on a phone hotspot. If it works there, it is the network.');
  }else if(post.shape.indexOf('HTML') >= 0){
    lines.push('  A Google sign-in page came back instead of data. Re-deploy the Web App with');
    lines.push('  "Execute as: Me" and "Who has access: Anyone".');
  }else{
    lines.push('  Unexpected reply — the HTTP status above is the thing to look into.');
  }
  if(!reachedContentHost && post.status !== 0){
    lines.push('  Note: nothing replied from script.googleusercontent.com. Apps Script always serves');
    lines.push('  replies from there, so it looks like that host was never reached.');
  }

  lines.push('');
  lines.push('Both hosts must be reachable AND exempt from redirect pre-fetching / inspection:');
  lines.push('  script.google.com');
  lines.push('  script.googleusercontent.com');
  return lines;
}

/* ---------------- Session ----------------
   Sign-in is by emailed one-time code. What this browser holds afterwards is a
   signed token; the identity behind it is decided by the server on every call. */
const SESSION_TOKEN_KEY = 'vantage_session';
let memoryToken = '';

/* What this browser holds is a signed token, not an identity. The server
   decides who that token belongs to on every single call, which is why a page
   can no longer act as somebody else simply by saying it is them. */
function sessionToken(){
  if(memoryToken) return memoryToken;
  try{ return window.localStorage.getItem(SESSION_TOKEN_KEY) || ''; }catch(e){ return ''; }
}
function setSessionToken(token){
  memoryToken = token || '';
  try{
    if(memoryToken) window.localStorage.setItem(SESSION_TOKEN_KEY, memoryToken);
    else window.localStorage.removeItem(SESSION_TOKEN_KEY);
  }catch(e){ /* private browsing — the in-memory token lasts the session */ }
}

/* Drops the token and everything read with it, so no other person's data is
   left on screen or in memory after a sign-out. */
function signOut(){
  setSessionToken('');
  STATE.session = null;
  STATE.bootstrapped = false;
  STATE.opportunities = [];
  STATE.directory = [];
  STATE.leakage = [];
  STATE.activity = null;
  STATE.modal = null;
  STATE.detail = null;
  STATE.saveError = null;
  STATE.staleRevision = null;
  if(typeof stopPolling === 'function') stopPolling();
}

function onSessionLost(message){
  signOut();
  STATE.loading = false;
  STATE.login = {step: 'email', email: (STATE.login && STATE.login.email) || '', error: message, busy: false};
  render();
}

/* ---------------- Formatting ---------------- */

function escapeHtml(str){
  return String(str === null || str === undefined ? '' : str)
    .replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
}
function fmtNumber(n, dp){
  const digits = dp === undefined ? 2 : dp;
  return (Number(n) || 0).toLocaleString('en-US', {minimumFractionDigits:digits, maximumFractionDigits:digits});
}
function fmtMoney(value, currency){
  return (currency === 'USD' ? '$' : '₦') + fmtNumber(value);
}
function fmtUSD(value){ return '$' + fmtNumber(value); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(String(iso).slice(0,10) + 'T00:00:00');
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}) + ' · ' +
         d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}
function todayStr(){
  return STATE.today || new Date().toISOString().slice(0,10);
}
/* Signed, deliberately unclamped: a future-dated quote should read as
   negative age rather than silently showing "0 days old". */
function daysBetween(fromStr, toStr){
  if(!fromStr) return null;
  const a = new Date(String(fromStr).slice(0,10) + 'T00:00:00Z').getTime();
  const b = new Date(String(toStr || todayStr()).slice(0,10) + 'T00:00:00Z').getTime();
  if(isNaN(a) || isNaN(b)) return null;
  return Math.round((b - a) / 86400000);
}
function ageOf(o){ return daysBetween(o.dateRaised, todayStr()); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  return daysBetween(todayStr(), dateStr);
}
function initials(name){
  return String(name || '?').trim().split(/\s+/).slice(0,2)
    .map(function(w){ return w[0] ? w[0].toUpperCase() : ''; }).join('');
}
function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
}
function roleLabel(roleId){
  const r = (STATE.refData.roles || []).filter(function(x){ return x.id === roleId; })[0];
  return r ? r.label : roleId;
}
function pluralize(n, word, plural){
  return n === 1 ? word : (plural || word + 's');
}

/* Reporting currency. Each quote keeps the currency it was raised in;
   conversion happens only here, at aggregation time. */
function toUSD(value, currency){
  const rate = Number(STATE.settings.fxRate) || 1650;
  const n = Number(value) || 0;
  return currency === 'USD' ? n : n / rate;
}
function usdOf(o){ return toUSD(o.value, o.currency); }

function displayRef(o){
  return o.quoteNumber || o.placeholderRef || '—';
}
function isOpenActive(o){
  return o.status === 'open' || o.status === 'sop_raised';
}

/* A quote's validity window has lapsed. Only meaningful for a sent quote
   that is still open — nothing in the prototype tracked this at all. */
function expiryDateOf(o){
  if(!o.quoteSent || !o.dateRaised) return null;
  const days = Number(o.validityDays) || 30;
  const d = new Date(String(o.dateRaised).slice(0,10) + 'T00:00:00Z');
  if(isNaN(d)) return null;
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0,10);
}
function daysToExpiry(o){
  const exp = expiryDateOf(o);
  return exp ? daysBetween(todayStr(), exp) : null;
}
function isExpired(o){
  if(!isOpenActive(o) || o.status === 'sop_raised') return false;
  const d = daysToExpiry(o);
  return d !== null && d < 0;
}
/* Sitting in Pipeline 2 past the configured window means it belongs in
   Pipeline 3. Surfaced as a nudge — Vantage never moves a record itself. */
function needsReprofile(o){
  if(o.status !== 'open' || Number(o.pipeline) !== 2) return false;
  const age = ageOf(o);
  return age !== null && age > (Number(STATE.settings.agingThresholdDays) || 30);
}

/* ---------------- Scoping & filtering ---------------- */

/* Role scoping is a convenience so people see their own work first. With no
   authentication it is not a security boundary, and the server does not
   rely on it for reads. */
/* Both of these get asked for several times while drawing one screen — the
   sidebar wants the counts, then the view wants the same figures again. They are
   pure functions of state, so the answer is kept for the duration of a single
   render and discarded at the start of the next. */
let renderMemo = {key: null, scoped: null, analytics: null};
function resetRenderMemo(){ renderMemo = {key: null, scoped: null, analytics: null}; }

/* Keyed on who is asking, so swapping user can never be served another
   person's cached view. Data changes are handled by the explicit resets in
   render(), applyBootstrap() and upsertOpportunity(). */
function memoKey(){
  const s = STATE.session;
  return s ? [s.userId, s.role, s.businessGroup, s.businessUnit || ''].join('|') : '';
}

function scopedOpportunities(){
  const key = memoKey();
  if(renderMemo.scoped && renderMemo.key === key) return renderMemo.scoped;
  renderMemo = {key: key, scoped: computeScopedOpportunities(), analytics: null};
  return renderMemo.scoped;
}

/* Figures for the signed-in user's scope. Prefer this over calling
   computeAnalytics(scopedOpportunities()) again. */
function analytics(){
  const list = scopedOpportunities();
  if(!renderMemo.analytics) renderMemo.analytics = computeAnalytics(list);
  return renderMemo.analytics;
}

/* Mirrors scopeOpportunitiesForActor_ on the server, which is what actually
   enforces this — the payload has already been narrowed. This only keeps the
   interface consistent. */
function computeScopedOpportunities(){
  const s = STATE.session;
  if(!s) return [];
  if(s.role === 'admin') return STATE.opportunities.slice();
  if(s.role === 'head'){
    return STATE.opportunities.filter(function(o){ return o.businessGroup === s.businessGroup; });
  }
  const ownOnly = (STATE.settings.repScope !== 'unit') || !s.businessUnit;
  return STATE.opportunities.filter(function(o){
    if(o.businessGroup !== s.businessGroup) return false;
    if(s.businessUnit && o.businessUnit !== s.businessUnit) return false;
    if(!ownOnly) return true;
    return o.salesRepId ? o.salesRepId === s.userId : o.salesRep === s.name;
  });
}
function scopedLeakage(){
  const s = STATE.session;
  if(!s || s.role === 'admin') return STATE.leakage.slice();
  return STATE.leakage.filter(function(l){ return l.businessGroup === s.businessGroup; });
}
function scopedDirectory(){
  const s = STATE.session;
  if(!s || s.role === 'admin') return STATE.directory.slice();
  return STATE.directory.filter(function(d){ return d.businessGroup === s.businessGroup; });
}

function applyFilters(list){
  const f = STATE.filters;
  const q = f.q.trim().toLowerCase();
  return list.filter(function(o){
    if(f.bg !== 'all' && o.businessGroup !== f.bg) return false;
    if(f.rep !== 'all' && o.salesRep !== f.rep) return false;
    if(f.status === 'open' && !isOpenActive(o)) return false;
    if(f.status === 'invoiced' && o.status !== 'invoiced') return false;
    if(f.status === 'lost' && o.status !== 'lost') return false;
    if(f.unit !== 'all' && o.businessUnit !== f.unit) return false;
    if(!withinDateRange(o[f.dateField || 'dateRaised'], f.from, f.to)) return false;
    if(q){
      const hay = [o.customerName, o.quoteNumber, o.placeholderRef, o.productLine,
        o.partnerName, o.businessUnit, o.salesRep, o.soNumber, o.invoiceNumber]
        .join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}
function filtersActive(){
  const f = STATE.filters;
  return f.bg !== 'all' || f.unit !== 'all' || f.rep !== 'all' || f.q.trim() !== '' ||
    f.status !== 'open' || !!f.from || !!f.to || !!f.flag;
}

/* Every unit present in what this session can see, so the dropdown never offers
   a unit whose records they cannot reach. */
function unitsInScope(){
  const seen = {};
  scopedOpportunities().forEach(function(o){ if(o.businessUnit) seen[o.businessUnit] = true; });
  return Object.keys(seen).sort();
}

/* Inclusive on both ends, comparing dates only — a timestamp field is cut to its
   date so "to: today" includes everything logged today. */
function withinDateRange(value, from, to){
  if(!from && !to) return true;
  const d = String(value || '').slice(0, 10);
  if(!d) return false;
  if(from && d < from) return false;
  if(to && d > to) return false;
  return true;
}
function repsInScope(list){
  const names = {};
  list.forEach(function(o){ if(o.salesRep) names[o.salesRep] = true; });
  return Object.keys(names).sort();
}
/* The units a session may file against: their own if they are a rep, otherwise
   every unit of the selected group. */
function businessUnitsAvailable(businessGroup){
  const s = STATE.session;
  if(s && s.role === 'rep' && s.businessUnit) return [s.businessUnit];
  return STATE.refData.businessUnitMap[businessGroup] || [];
}

function businessGroupsAvailable(){
  const s = STATE.session;
  if(!s) return [];
  return s.role === 'admin' ? (STATE.refData.businessGroups || []) : [s.businessGroup];
}
/* Mirrors deletionAllowed_ on the server, so the button is only offered when
   pressing it would actually work. The server decides regardless. */
function canDelete(o){
  const s = STATE.session;
  if(!s || s.role !== 'admin') return false;
  if(o.soNumber || o.invoiceNumber || o.status === 'invoiced') return false;
  if(o.status === 'lost'){
    const daysLost = o.lostAt ? daysBetween(String(o.lostAt).slice(0, 10), todayStr()) : null;
    if(daysLost !== null && daysLost >= (Number(STATE.settings.lostDeleteAfterDays) || 90)) return true;
  }
  const age = o.createdAt ? daysBetween(String(o.createdAt).slice(0, 10), todayStr()) : null;
  return age !== null && age <= (Number(STATE.settings.mistakeWindowDays) || 30);
}

/* Whether this session may act on a record. Heads and admins may act within
   their scope; a rep only on their own. Mirrored on the server. */
function canAct(o){
  const s = STATE.session;
  if(!s) return false;
  if(s.role !== 'rep') return true;
  return o.salesRepId ? o.salesRepId === s.userId : o.salesRep === s.name;
}

/* ---------------- Analytics ---------------- */

/* Quotes duplicated for a second partner on the same deal share an
   opportunityId. Value totals keep the highest-value quote per group so one
   deal is never counted twice; counts stay per-quote because each quote is
   separately actionable. */
function dedupeByOpportunity(list){
  const best = {};
  const singles = [];
  list.forEach(function(o){
    if(!o.opportunityId){ singles.push(o); return; }
    const held = best[o.opportunityId];
    if(!held || usdOf(o) > usdOf(held)) best[o.opportunityId] = o;
  });
  return singles.concat(Object.keys(best).map(function(k){ return best[k]; }));
}

function computeAnalytics(list){
  const sumUSD = function(arr){ return arr.reduce(function(a,o){ return a + usdOf(o); }, 0); };
  const sumNative = function(arr, ccy){
    return arr.filter(function(o){ return ccy === 'USD' ? o.currency === 'USD' : o.currency !== 'USD'; })
      .reduce(function(a,o){ return a + (Number(o.value) || 0); }, 0);
  };

  const open = list.filter(isOpenActive);
  const p1 = open.filter(function(o){ return Number(o.pipeline) === 1; });
  const p2 = open.filter(function(o){ return Number(o.pipeline) === 2; });
  const p3 = open.filter(function(o){ return Number(o.pipeline) === 3; });
  const invoiced = list.filter(function(o){ return o.status === 'invoiced'; });
  const lost = list.filter(function(o){ return o.status === 'lost'; });

  const dedupedOpen = dedupeByOpportunity(open);
  const totalOpenUSD = sumUSD(dedupedOpen);
  const p1Value = sumUSD(dedupedOpen.filter(function(o){ return Number(o.pipeline) === 1; }));
  const p2Value = sumUSD(dedupedOpen.filter(function(o){ return Number(o.pipeline) === 2; }));
  const p3Value = sumUSD(dedupedOpen.filter(function(o){ return Number(o.pipeline) === 3; }));

  /* Win rate both ways. Count alone treats a ₦500m loss and a ₦50k loss as
     equal, which flattered the prototype's number. */
  const winBase = invoiced.length + lost.length;
  const winRateCount = winBase ? Math.round((invoiced.length / winBase) * 100) : null;
  const wonValue = sumUSD(invoiced);
  const lostValue = sumUSD(lost);
  const winRateValue = (wonValue + lostValue) ? Math.round((wonValue / (wonValue + lostValue)) * 100) : null;

  /* Days from raise to the actual invoice date. The prototype measured raise
     date to *today*, so the figure crept upward forever after a deal closed.
     Records invoiced before this field existed are excluded and counted. */
  const cycleDays = [];
  let cycleUnknown = 0;
  invoiced.forEach(function(o){
    const d = o.invoicedAt ? daysBetween(o.dateRaised, String(o.invoicedAt).slice(0,10)) : null;
    if(d === null || d < 0) cycleUnknown++;
    else cycleDays.push(d);
  });
  const avgDaysToInvoice = cycleDays.length
    ? Math.round(cycleDays.reduce(function(a,b){ return a+b; },0) / cycleDays.length) : null;

  const byBG = {};
  (STATE.refData.businessGroups || []).forEach(function(bg){ byBG[bg] = 0; });
  const byRep = {}, byUnit = {}, byOrderType = {};
  dedupedOpen.forEach(function(o){
    byBG[o.businessGroup] = (byBG[o.businessGroup] || 0) + usdOf(o);
    byRep[o.salesRep] = (byRep[o.salesRep] || 0) + usdOf(o);
    const unit = o.businessUnit || '(No Business Unit set)';
    byUnit[unit] = (byUnit[unit] || 0) + usdOf(o);
    const ot = o.orderType || '(No Order Type set)';
    byOrderType[ot] = (byOrderType[ot] || 0) + usdOf(o);
  });

  const agingBuckets = {'0-30':0, '31-60':0, '61-90':0, '90+':0};
  dedupedOpen.filter(function(o){ return Number(o.pipeline) !== 1; }).forEach(function(o){
    const d = ageOf(o) || 0;
    const v = usdOf(o);
    if(d <= 30) agingBuckets['0-30'] += v;
    else if(d <= 60) agingBuckets['31-60'] += v;
    else if(d <= 90) agingBuckets['61-90'] += v;
    else agingBuckets['90+'] += v;
  });

  const forecastBuckets = {'Next 30 days':0, '31-60 days':0, '61-90 days':0, 'Beyond 90 days / undated':0};
  dedupedOpen.forEach(function(o){
    const weighted = usdOf(o) * ((Number(o.probability) || 0) / 100);
    const days = o.expectedCloseDate ? daysUntil(o.expectedCloseDate) : null;
    if(days === null || days > 90) forecastBuckets['Beyond 90 days / undated'] += weighted;
    else if(days <= 30) forecastBuckets['Next 30 days'] += weighted;
    else if(days <= 60) forecastBuckets['31-60 days'] += weighted;
    else forecastBuckets['61-90 days'] += weighted;
  });
  const totalWeightedForecastUSD = Object.keys(forecastBuckets)
    .reduce(function(a,k){ return a + forecastBuckets[k]; }, 0);

  const bgWinRate = {};
  (STATE.refData.businessGroups || []).forEach(function(bg){
    const w = invoiced.filter(function(o){ return o.businessGroup === bg; }).length;
    const l = lost.filter(function(o){ return o.businessGroup === bg; }).length;
    bgWinRate[bg] = (w + l) ? Math.round((w / (w + l)) * 100) : null;
  });

  /* Loss reasons are now a fixed taxonomy, so they can finally be grouped. */
  const lossReasons = {};
  lost.forEach(function(o){
    const key = o.lossReasonCode || '(No reason recorded)';
    if(!lossReasons[key]) lossReasons[key] = {count:0, value:0};
    lossReasons[key].count++;
    lossReasons[key].value += usdOf(o);
  });

  const topAgingRisk = p3.filter(function(o){ return (ageOf(o) || 0) > 60; })
    .sort(function(a,b){ return usdOf(b) - usdOf(a); }).slice(0,5);

  const nowMs = Date.now();
  const inWindow = function(o, fromDays, toDays){
    const t = new Date(o.createdAt).getTime();
    if(isNaN(t)) return false;
    const age = nowMs - t;
    return age > fromDays * 86400000 && age <= toDays * 86400000;
  };
  const last30 = list.filter(function(o){ return inWindow(o, -1, 30); });
  const prev30 = list.filter(function(o){ return inWindow(o, 30, 60); });
  const momentum = {
    last30Count: last30.length, prev30Count: prev30.length,
    last30ValueUSD: sumUSD(last30), prev30ValueUSD: sumUSD(prev30)
  };

  return {
    open: open, p1: p1, p2: p2, p3: p3, invoiced: invoiced, lost: lost,
    totalOpenUSD: totalOpenUSD, p1Value: p1Value, p2Value: p2Value, p3Value: p3Value,
    ngnOpenNative: sumNative(dedupedOpen, 'NGN'), usdOpenNative: sumNative(dedupedOpen, 'USD'),
    fxRate: Number(STATE.settings.fxRate) || 1650,
    linkedDealsCollapsed: open.length - dedupedOpen.length,
    winRateCount: winRateCount, winRateValue: winRateValue,
    wonValueUSD: wonValue, lostValueUSD: lostValue,
    avgDaysToInvoice: avgDaysToInvoice, cycleUnknown: cycleUnknown,
    byBG: byBG, byRep: byRep, byUnit: byUnit, byOrderType: byOrderType,
    agingBuckets: agingBuckets, forecastBuckets: forecastBuckets,
    totalWeightedForecastUSD: totalWeightedForecastUSD,
    bgWinRate: bgWinRate, lossReasons: lossReasons,
    topAgingRisk: topAgingRisk, momentum: momentum,
    noQuoteYet: open.filter(function(o){ return o.quoteSent === false; }),
    expired: open.filter(isExpired),
    dueForReprofile: open.filter(needsReprofile)
  };
}

/* ---------------- Toasts ---------------- */

function toast(message, isError){
  const stack = document.getElementById('toast-stack');
  if(!stack) return;
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' toast-error' : '');
  el.innerHTML = '<span class="dot"></span><span>' + escapeHtml(message) + '</span>';
  stack.appendChild(el);
  setTimeout(function(){ el.remove(); }, isError ? 6000 : 3200);
}
</script>
<script>
/* ============================================================
   VANTAGE CLIENT · shell, entry screen, dashboard, board
   ============================================================ */

/* Focus and scroll survive a re-render. The prototype re-rendered the whole
   document on every keystroke and papered over the lost caret with a
   value-reassignment hack on one specific input; this handles every field. */
/* Raw contents of the line-item rows, exactly as typed — including a row that
   is still half-filled. Deliberately not collectLineItems(), which normalises
   and drops rows and would turn an untouched row into a real line. */
function snapshotLineItemRows(){
  const container = document.getElementById('line-items-container');
  if(!container) return null;
  return Array.prototype.slice.call(container.querySelectorAll('.line-item-row')).map(function(row){
    return {
      description: row.querySelector('.li-desc').value,
      sku: row.querySelector('.li-sku').value,
      qty: row.querySelector('.li-qty').value,
      unitPrice: row.querySelector('.li-price').value
    };
  });
}

function modalKey(){
  return STATE.modal ? JSON.stringify(STATE.modal) : '';
}

function captureUiState(){
  const el = document.activeElement;
  const snap = {scrollY: window.scrollY, focusId: null, start: null, end: null, scrolls: {},
    modalKey: modalKey(), values: {}, lineItems: null, recipients: null, ccs: null};

  /* Everything typed into the open dialog, so a redraw cannot silently discard
     work in progress. */
  if(snap.modalKey){
    document.querySelectorAll('.overlay input[id], .overlay select[id], .overlay textarea[id]')
      .forEach(function(field){
        snap.values[field.id] = (field.type === 'checkbox') ? field.checked : field.value;
      });
    snap.lineItems = snapshotLineItemRows();
    if(document.getElementById('recipients-container')) snap.recipients = collectRecipients('recipients-container');
    if(document.getElementById('cc-container')) snap.ccs = collectRecipients('cc-container');
  }
  if(el && el.id){
    snap.focusId = el.id;
    try{ snap.start = el.selectionStart; snap.end = el.selectionEnd; }catch(e){}
  }
  document.querySelectorAll('[data-keep-scroll]').forEach(function(node){
    snap.scrolls[node.getAttribute('data-keep-scroll')] = node.scrollTop;
  });
  return snap;
}
function restoreUiState(snap){
  if(!snap) return;

  /* Only ever restore into the same dialog — never carry one form's contents
     into another. */
  if(snap.modalKey && snap.modalKey === modalKey()){
    if(snap.lineItems && snap.lineItems.length){
      const container = document.getElementById('line-items-container');
      if(container){
        container.innerHTML = '';
        snap.lineItems.forEach(function(li){ addLineItemRow(li); });
      }
    }
    if(snap.recipients && snap.recipients.length){
      const box = document.getElementById('recipients-container');
      if(box){ box.innerHTML = ''; snap.recipients.forEach(function(a){ addRecipientRow('recipients-container', a); }); }
    }
    if(snap.ccs && snap.ccs.length){
      const box = document.getElementById('cc-container');
      if(box){ box.innerHTML = ''; snap.ccs.forEach(function(a){ addRecipientRow('cc-container', a); }); }
    }
    Object.keys(snap.values).forEach(function(id){
      const field = document.getElementById(id);
      if(!field) return;
      if(field.type === 'checkbox') field.checked = snap.values[id];
      else field.value = snap.values[id];
    });
    if(document.getElementById('quote-total-display')) recalcQuoteTotal();
  }

  Object.keys(snap.scrolls).forEach(function(key){
    const node = document.querySelector('[data-keep-scroll="' + key + '"]');
    if(node) node.scrollTop = snap.scrolls[key];
  });
  if(snap.focusId){
    const el = document.getElementById(snap.focusId);
    if(el){
      el.focus();
      if(snap.start !== null && el.setSelectionRange){
        try{ el.setSelectionRange(snap.start, snap.end); }catch(e){}
      }
    }
  }
  window.scrollTo(0, snap.scrollY);
}

function render(){
  const app = document.getElementById('app');
  const snap = captureUiState();
  resetRenderMemo();

  if(STATE.fatalError){
    app.innerHTML = renderFatal();
    wireFatal();
    return;
  }
  if(STATE.needsAccessCode){
    app.innerHTML = renderUnlock();
    wireUnlock();
    restoreUiState(snap);
    return;
  }
  if(STATE.loading && !STATE.bootstrapped){
    app.innerHTML = renderLoading();
    return;
  }
  if(!STATE.session){
    app.innerHTML = renderLogin();
    wireLogin();
    restoreUiState(snap);
    return;
  }

  app.innerHTML =
    '<div class="shell">' +
      renderSidebar() +
      '<div class="main">' +
        renderTopbar() +
        renderAlerts() +
        '<div class="content">' +
          renderPolicyBanner() +
          renderCurrentView() +
        '</div>' +
      '</div>' +
    '</div>' +
    (STATE.modal ? renderModal() : '') +
    (STATE.busy ? '<div class="busy-pill"><span class="spinner"></span>' + escapeHtml(STATE.busy) + '</div>' : '');

  wireAll();
  restoreUiState(snap);
}

function renderLoading(){
  return '<div class="login-wrap"><div style="color:#8CA0C4;font-family:Sora;font-size:14px;display:flex;align-items:center;gap:10px;">' +
    '<span class="spinner"></span>Loading Vantage…</div></div>';
}

function renderFatal(){
  return '<div class="login-wrap"><div class="login-card">' +
    '<h1 style="font-size:17px;margin-bottom:10px;">Vantage could not start</h1>' +
    '<div style="font-size:12.5px;color:var(--text-soft);line-height:1.6;margin-bottom:16px;">' +
      escapeHtml(STATE.fatalError) +
    '</div>' +
    '<div class="field-hint" style="margin-bottom:16px;">' + fatalHint(STATE.fatalError) + '</div>' +
    (backendUrl()
      ? '<div class="field-hint" style="margin-bottom:16px;">This page is pointed at:<br>' +
        '<span class="mono" style="font-size:10.5px;word-break:break-all;color:var(--text-soft);">' +
        escapeHtml(backendUrl()) + '</span></div>'
      : '') +
    '<button class="btn btn-gold" id="fatal-retry" style="width:100%;justify-content:center;">Try again</button>' +
    '<button class="btn btn-ghost btn-sm" id="fatal-check" style="width:100%;justify-content:center;margin-top:10px;">Run connection check</button>' +
    '<pre id="fatal-check-out" style="display:none;white-space:pre-wrap;word-break:break-word;font-family:monospace;' +
      'font-size:10.5px;line-height:1.55;background:var(--surface);border:1px solid var(--border);border-radius:8px;' +
      'padding:12px;margin-top:12px;max-height:300px;overflow:auto;"></pre>' +
    '</div></div>';
}

/* The generic "run setupVantage" advice was wrong for most failures and sent
   people down the wrong path. Match the actual cause instead. */
function fatalHint(message){
  const text = String(message || '');
  if(/Unknown action/i.test(text)){
    return 'The Google Sheet backend is running an <b>older version of Code.gs</b> than this page expects. ' +
      'Saving in the Apps Script editor is not enough — the deployment has to be republished: ' +
      '<b>Deploy → Manage deployments → ✏️ → Version: New version → Deploy</b>. ' +
      'Keep the same deployment so the link does not change.';
  }
  if(/Missing tab|setupVantage/i.test(text)){
    return 'Open the Apps Script editor and run <b>setupVantage</b> once to create the tabs in the Sheet.';
  }
  if(/No spreadsheet is attached/i.test(text)){
    return 'The script is not bound to a Sheet. Open it via <b>Extensions → Apps Script</b> from inside the ' +
      'Sheet, or set the <b>VANTAGE_SHEET_ID</b> script property.';
  }
  if(/did not return the reply|did not confirm the request/i.test(text)){
    return 'The request reached Google but the reply did not come back. This is Google\'s ' +
      'content-serving step failing, not your Sheet. Try again. If it happens repeatedly for the same ' +
      'person, have them try a private window, or check that <b>script.googleusercontent.com</b> is not ' +
      'blocked on the network — that is the address Apps Script serves replies from.';
  }
  if(/Nothing is deployed at the address|HTTP 404/i.test(text)){
    return 'The address below is not serving a Vantage backend. In the Apps Script editor open ' +
      '<b>Deploy → Manage deployments</b>, copy the <b>Web app URL</b> shown there, and set ' +
      '<b>VANTAGE_BACKEND_URL</b> in vantage.html to exactly that. Creating a <i>new deployment</i> ' +
      'rather than a new <i>version</i> changes this URL, which is the usual cause.';
  }
  if(/sign-in page|Who has access/i.test(text)){
    return 'Re-deploy the Web App with <b>Execute as: Me</b> and <b>Who has access: Anyone</b>.';
  }
  return 'Check that the Web App is deployed and reachable. Opening the /exec URL in a browser should return JSON.';
}
function wireFatal(){
  const btn = document.getElementById('fatal-retry');
  if(btn) btn.addEventListener('click', function(){ boot(); });
  const check = document.getElementById('fatal-check');
  if(check) check.addEventListener('click', async function(){
    const out = document.getElementById('fatal-check-out');
    check.disabled = true;
    check.textContent = 'Checking…';
    out.style.display = 'block';
    out.textContent = 'Running two probes…';
    try{
      out.textContent = (await connectionCheck()).join('\n');
    }catch(err){
      out.textContent = 'The check itself failed: ' + String(err.message || err);
    }
    check.disabled = false;
    check.textContent = 'Run connection check again';
  });
}

/* ---------------- Access code ----------------
   Only ever shown when the company Sheet has an `accessCode` set on its
   Settings tab. If it is blank, nobody sees this screen. One field, typed once
   per browser — the code cannot live in this file, because the file is
   readable by anyone who can open the site. */

function renderUnlock(){
  return '<div class="login-wrap"><div class="login-card">' +
    '<div class="login-brand">' +
      '<img class="login-mark" src="data:image/png;base64,' + TD_AFRICA_LOGO_B64 + '" alt="TD Africa">' +
      '<h1>Vantage</h1>' +
      '<p>Enter the team access code to open Vantage. You only do this once on this device.</p>' +
    '</div>' +
    (STATE.unlockError ? '<div class="modal-error">' + escapeHtml(STATE.unlockError) + '</div>' : '') +
    '<form id="unlock-form">' +
      '<div class="field"><label>Team access code</label>' +
        '<input type="password" id="ul-code" autocomplete="off" spellcheck="false" required autofocus>' +
        '<div class="field-hint">Your Vantage administrator has it. It is the same code for everyone.</div></div>' +
      '<button type="submit" class="btn btn-gold" style="width:100%;justify-content:center;padding:11px;"' +
        (STATE.unlocking ? ' disabled' : '') + '>' +
        (STATE.unlocking ? '<span class="spinner"></span>Checking…' : 'Open Vantage') + '</button>' +
    '</form>' +
    '</div></div>';
}

function wireUnlock(){
  const form = document.getElementById('unlock-form');
  if(!form) return;
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const code = document.getElementById('ul-code').value.trim();
    if(!code) return;
    STATE.unlocking = true;
    STATE.unlockError = null;
    render();
    setAccessCode(code);
    try{
      /* The cheapest authenticated call there is — if it comes back, the code
         is right and boot() can proceed. */
      await rpc('getRevision');
      STATE.needsAccessCode = false;
      STATE.unlocking = false;
      await boot();
    }catch(err){
      setAccessCode('');
      STATE.unlocking = false;
      STATE.unlockError = (err && err.accessCodeRequired)
        ? 'That code was not accepted. Check it with your administrator.'
        : String(err.message || err);
      render();
    }
  });
}

/* Counts down the resend button in place, rather than re-rendering the whole
   screen every second and fighting the code field for focus. */
let resendTimer = null;
function startResendTicker(){
  if(resendTimer) clearInterval(resendTimer);
  const tick = function(){
    const btn = document.getElementById('resend-btn');
    if(!btn){ clearInterval(resendTimer); resendTimer = null; return; }
    const left = Math.ceil(((loginState().resendAt || 0) - Date.now()) / 1000);
    if(left > 0){
      btn.disabled = true;
      btn.textContent = 'Send a new code (' + left + 's)';
    }else{
      btn.disabled = false;
      btn.textContent = 'Send a new code';
      clearInterval(resendTimer);
      resendTimer = null;
    }
  };
  tick();
  resendTimer = setInterval(tick, 1000);
}

async function requestCode(email){
  const L = loginState();
  L.busy = true;
  L.error = null;
  render();
  try{
    const res = await rpc('requestOtp', {email: email});
    L.step = 'code';
    L.email = res.email;
    L.name = res.name;
    L.role = res.role;
    L.expiresInMinutes = res.expiresInMinutes;
    L.resendAt = Date.now() + (res.resendInSeconds || 45) * 1000;
    L.error = null;
  }catch(err){
    if(err && err.transport){
      /* The request reached Google and the script ran — the reply was lost on the
         way back. The code has almost certainly been sent, so move on to the code
         step rather than insisting the whole thing failed and making them ask for
         a second one. */
      L.step = 'code';
      L.email = email;
      L.expiresInMinutes = L.expiresInMinutes || 10;
      L.resendAt = Date.now() + 45000;
      L.error = 'Google did not confirm the request, but your code was most likely sent. ' +
        'Check your email and enter it below. If nothing arrives, ask for a new code in a moment.';
    }else{
      L.error = String(err.message || err);
    }
  }finally{
    L.busy = false;
    render();
    if(loginState().step === 'code') startResendTicker();
  }
}

function wireLogin(){
  const L = loginState();

  const emailForm = document.getElementById('email-form');
  if(emailForm) emailForm.addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('li-email').value.trim();
    if(!isValidEmail(email)){
      L.error = 'That does not look like a valid email address.';
      render();
      return;
    }
    L.email = email;
    requestCode(email);
  });

  const bootstrapForm = document.getElementById('bootstrap-form');
  if(bootstrapForm) bootstrapForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const name = document.getElementById('bs-name').value.trim();
    const email = document.getElementById('bs-email').value.trim();
    if(!name) return;
    if(!isValidEmail(email)){
      L.error = 'Enter a valid work email address.';
      render();
      return;
    }
    L.busy = true; L.error = null; L.name = name; L.email = email;
    render();
    try{
      await rpc('createFirstAdmin', {name: name, email: email});
      L.busy = false;
      /* The account exists, but they still confirm the mailbox before getting in. */
      await requestCode(email);
      return;
    }catch(err){
      L.error = String(err.message || err);
      L.busy = false;
      render();
    }
  });

  const codeForm = document.getElementById('code-form');
  if(codeForm){
    const input = document.getElementById('li-code');
    const submit = async function(){
      const code = input.value.replace(/\D/g, '');
      if(code.length !== 6){
        L.error = 'Enter the 6-digit code from your email.';
        render();
        return;
      }
      L.busy = true; L.error = null; render();
      try{
        const res = await rpc('verifyOtp', {email: L.email, code: code});
        setSessionToken(res.sessionToken);
        STATE.login = null;
        if(resendTimer){ clearInterval(resendTimer); resendTimer = null; }
        await boot();
        toast('Signed in as ' + res.session.name);
        return;
      }catch(err){
        /* A single-use code is consumed the moment the server accepts it. If the
           reply was lost, the code is spent and retyping it cannot work — say so
           plainly rather than letting them wear down their attempts. */
        L.error = (err && err.transport)
          ? 'Google did not return the reply, so this code has been used up without signing you in. ' +
            'Ask for a new code and try once more.'
          : String(err.message || err);
        L.busy = false;
        const el = document.getElementById('li-code');
        if(el) el.value = '';
        render();
      }
    };
    codeForm.addEventListener('submit', function(e){ e.preventDefault(); submit(); });
    /* Typing or pasting the sixth digit submits — the usual expectation for a
       one-time code, and it removes a step on a phone. */
    if(input) input.addEventListener('input', function(){
      const digits = input.value.replace(/\D/g, '').slice(0, 6);
      if(input.value !== digits) input.value = digits;
      if(digits.length === 6 && !L.busy) submit();
    });
    startResendTicker();
  }

  const resend = document.getElementById('resend-btn');
  if(resend) resend.addEventListener('click', function(){
    if((loginState().resendAt || 0) > Date.now()) return;
    requestCode(loginState().email);
  });

  const change = document.getElementById('change-email-btn');
  if(change) change.addEventListener('click', function(){
    if(resendTimer){ clearInterval(resendTimer); resendTimer = null; }
    STATE.login = {step: 'email', email: L.email, error: null, busy: false};
    render();
  });
}

function resetPages(){
  Object.keys(STATE.pages).forEach(function(k){ STATE.pages[k] = 1; });
}
function pageOf(view){ return Math.max(1, STATE.pages[view] || 1); }

/* Slices a list for the named view and clamps the page if the list shrank
   under it — otherwise filtering down to two rows while on page 5 shows an
   empty table with no hint why. */
function paginate(view, list){
  const size = STATE.pageSize;
  const pageCount = Math.max(1, Math.ceil(list.length / size));
  const page = Math.min(pageOf(view), pageCount);
  STATE.pages[view] = page;
  return {rows: list.slice((page - 1) * size, page * size), page: page, pageCount: pageCount, total: list.length};
}

function renderPager(view, p, noun){
  if(p.total === 0) return '';
  const first = (p.page - 1) * STATE.pageSize + 1;
  const last = Math.min(p.page * STATE.pageSize, p.total);
  return '<div class="pager">' +
    '<span>' + first + '–' + last + ' of ' + p.total + ' ' + (noun || 'records') + '</span>' +
    '<button class="btn btn-ghost btn-sm" data-page-view="' + view + '" data-page-step="-1"' +
      (p.page <= 1 ? ' disabled' : '') + '>Previous</button>' +
    '<span>Page ' + p.page + ' of ' + p.pageCount + '</span>' +
    '<button class="btn btn-ghost btn-sm" data-page-view="' + view + '" data-page-step="1"' +
      (p.page >= p.pageCount ? ' disabled' : '') + '>Next</button>' +
    '<select id="page-size"><option value="25"' + (STATE.pageSize === 25 ? ' selected' : '') + '>25 per page</option>' +
      '<option value="50"' + (STATE.pageSize === 50 ? ' selected' : '') + '>50 per page</option>' +
