/* ---------------- Email quote ----------------
   No mail server exists behind Vantage, so this composes the message and
   hands off to the user's own mail application. A mailto link cannot carry
   an attachment, which the copy says plainly rather than failing silently. */

function plainTextQuoteBody(o, lineItems){
  const lines = (lineItems && lineItems.length)
    ? lineItems
    : [{description: o.productLine || 'Quoted solution', qty: 1, unitPrice: o.value, subtotal: o.value}];
  const expiry = expiryDateOf(o);
  return [
    'Dear ' + (o.contactPerson || o.customerName) + ',',
    '',
    'Please find our quote ' + displayRef(o) + ' for your review' +
      (expiry ? ', valid until ' + fmtDate(expiry) + '.' : '.'),
    '',
    lines.map(function(li){
      return '- ' + li.description + ' x' + li.qty + ' @ ' + fmtMoney(li.unitPrice, o.currency) +
        ' = ' + fmtMoney(li.subtotal, o.currency);
    }).join('\n'),
    '',
    'Total: ' + fmtMoney(o.value, o.currency),
    '',
    'The formatted quote document is attached.',
    '',
    'Kind regards,',
    o.salesRep,
    'TD Africa'
  ].join('\n');
}

let recipientSeq = 0;
function addRecipientRow(containerId, prefill){
  const container = document.getElementById(containerId);
  if(!container) return;
  recipientSeq++;
  const rowId = 'rcpt-' + recipientSeq;
  container.insertAdjacentHTML('beforeend',
    '<div class="line-item-row" data-recipient-row="' + rowId + '" style="align-items:center;">' +
      '<input type="email" class="recipient-input" list="known-emails" placeholder="name@company.com" ' +
        'value="' + escapeHtml(prefill || '') + '" style="flex:1;">' +
      '<button type="button" class="recipient-remove btn btn-ghost btn-sm">✕</button>' +
    '</div>');
  const row = container.querySelector('[data-recipient-row="' + rowId + '"]');
  row.querySelector('.recipient-remove').addEventListener('click', function(){ row.remove(); });
}
function collectRecipients(containerId){
  const container = document.getElementById(containerId);
  if(!container) return [];
  return Array.prototype.slice.call(container.querySelectorAll('.recipient-input'))
    .map(function(i){ return i.value.trim(); })
    .filter(function(v){ return v.length > 0; });
}
function knownEmails(){
  const set = {};
  STATE.opportunities.forEach(function(o){ if(o.contactEmail) set[o.contactEmail] = true; });
  return Object.keys(set).sort();
}

function renderEmailModal(){
  const o = currentOpp();
  if(!o) return '';
  const d = STATE.detail && STATE.detail.id === o.id ? STATE.detail : {};
  return overlay(
    modalHead('Email quote — ' + escapeHtml(o.customerName), escapeHtml(displayRef(o))) +
    '<datalist id="known-emails">' +
      knownEmails().map(function(e){ return '<option value="' + escapeHtml(e) + '">'; }).join('') +
    '</datalist>' +
    '<div class="modal-body">' +
      modalErrorBlock() +
      '<div class="field-hint" style="margin-bottom:14px;">This opens your own email application with the recipients, subject and quote text already filled in. ' +
        '<b>Attach the formatted quote document</b> (Generate Quote Document) before you send — a link like this cannot attach a file for you.</div>' +
      '<div class="field"><label>Recipients</label>' +
        '<div id="recipients-container" class="li-scroll" style="max-height:200px;"></div>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="add-recipient-btn" style="margin-top:6px;">＋ Add recipient</button>' +
        '<div class="field-hint">Start typing to reuse an address already in Vantage, or enter a new one.</div></div>' +
      '<div class="field"><label>Cc (optional)</label>' +
        '<div id="cc-container" class="li-scroll" style="max-height:160px;"></div>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="add-cc-btn" style="margin-top:6px;">＋ Add Cc</button></div>' +
      '<div class="field"><label>Subject</label>' +
        '<input type="text" id="email-subject" value="' +
          escapeHtml('Quote ' + displayRef(o) + ' — ' + o.customerName + ' — TD Africa') + '"></div>' +
      '<div class="field"><label>Message</label>' +
        '<textarea id="email-body" style="min-height:200px;font-family:\'IBM Plex Mono\',monospace;font-size:12px;">' +
          escapeHtml(plainTextQuoteBody(o, d.lineItems)) + '</textarea></div>' +
    '</div><div class="modal-foot">' +
      '<button type="button" class="btn btn-ghost" data-close-modal="1">Cancel</button>' +
      '<button type="button" class="btn btn-gold" id="send-email-btn"' + (STATE.modalBusy ? ' disabled' : '') + '>' +
        (STATE.modalBusy ? '<span class="spinner"></span>Opening…' : 'Open in Email App') + '</button>' +
    '</div>'
  );
}

/* ---------------- Close lost ----------------
   A fixed reason list replaces the prototype's prompt() box, so losses can
   actually be grouped and analysed. */

function renderLostModal(){
  const o = currentOpp();
  if(!o) return '';

    modalHead('Mark closed lost — ' + escapeHtml(o.customerName), escapeHtml(displayRef(o)) + ' · ' + fmtMoney(o.value, o.currency)) +
    '<form id="lost-form"><div class="modal-body">' +
      modalErrorBlock() +
      '<div class="field-hint" style="margin-bottom:14px;">Recording a reason from this list is what makes the "Why we lose" analysis possible. The opportunity leaves the board but stays on record, and can be reopened.</div>' +
      '<div class="field"><label>Reason</label><select id="lost-reason" required>' +
        '<option value="">Select a reason…</option>' +

          return '<option value="' + escapeHtml(r) + '">' + escapeHtml(r) + '</option>';

        (STATE.modalBusy ? '<span class="spinner spinner-dark"></span>Saving…' : 'Mark closed lost') + '</button>' +
    '</div></form>', 'modal'
  );
}

/* Validity has to be chosen deliberately: it is printed in the terms the
   customer reads, and it drives when Vantage marks the quote expired. It used to
   be a fixed 30 days in the document's small print regardless of the record. */
function renderValidityModal(){
  const o = currentOpp();
  if(!o) return '';
  const options = STATE.refData.quoteValidityOptions || [7, 14, 30, 45, 60, 90];
  const current = Number(o.validityDays) || 0;
  return overlay(
    modalHead('Quote validity — ' + escapeHtml(o.customerName), escapeHtml(displayRef(o))) +
    '<form id="validity-form"><div class="modal-body">' +
      modalErrorBlock() +
      '<div class="field-hint" style="margin-bottom:14px;">The document states how long the prices hold. ' +
        'Whatever you choose is printed in the terms and recorded against the quote, so Vantage flags it as ' +
        'expired on the same date the customer sees.</div>' +
      '<div class="field"><label>Prices valid for</label>' +
        '<select id="qv-days" required autofocus>' +
          '<option value="">Select a validity period…</option>' +
          options.map(function(d){
            return '<option value="' + d + '"' + (d === current ? ' selected' : '') + '>' + d + ' days' +
              (d === current ? ' (currently recorded)' : '') + '</option>';
          }).join('') +
        '</select>' +
        '<div class="field-hint">Valid until ' +
          '<span id="qv-until" class="mono">' + (current ? fmtDate(expiryDateOf(o)) : '—') + '</span>' +
          ', counted from the date raised (' + fmtDate(o.dateRaised) + ').</div>' +

    '</div><div class="modal-foot">' +

        (o.status === 'invoiced'

        '<option value="2">Pipeline 2 — fresh</option><option value="3">Pipeline 3 — aging</option></select></div>' +
    '</div><div class="modal-foot">' +
      '<button type="button" class="btn btn-ghost" data-close-modal="1">Cancel</button>' +

  );

/* ---------------- Team member edit ----------------
   Renaming used to orphan every quote, because the display name was the
   only link. Records now carry a stable user id, so a rename is safe. */

function renderMemberModal(){
  const userId = STATE.modal.userId;
  const m = STATE.directory.filter(function(d){ return d.userId === userId; })[0];
  if(!m) return '';
  return overlay(
    modalHead('Edit team member', escapeHtml(m.name)) +
    '<form id="member-form"><div class="modal-body">' +
      modalErrorBlock() +
      '<div class="field"><label>Full name</label>' +
        '<input type="text" id="mem-name" value="' + escapeHtml(m.name) + '" required>' +
        '<div class="field-hint">Renaming updates the name shown on every quote they own — the link itself is by id, so nothing is orphaned.</div></div>' +
      '<div class="field"><label>Work email</label>' +
        '<input type="email" id="mem-email" value="' + escapeHtml(m.email || '') + '" spellcheck="false" required>' +
        '<div class="field-hint">Changing this signs them out of every device — the address is part of what their session is signed against.</div></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Role</label><select id="mem-role">' +
          (STATE.refData.roles || []).map(function(r){
            return '<option value="' + r.id + '"' + (r.id === m.role ? ' selected' : '') + '>' + escapeHtml(r.label) + '</option>';
          }).join('') + '</select></div>' +
        '<div class="field"><label>Business Group</label><select id="mem-bg">' +
          '<option value="">— Not applicable for Admin —</option>' +
          (STATE.refData.businessGroups || []).map(function(bg){
            return '<option value="' + escapeHtml(bg) + '"' + (bg === m.businessGroup ? ' selected' : '') + '>' + escapeHtml(bg) + '</option>';
          }).join('') + '</select></div>' +
      '</div>' +
      '<div class="field"><label>Business Unit</label><select id="mem-bu">' +
        '<option value="">— Whole group (Heads and Admins) —</option>' +
        (STATE.refData.businessUnitMap[m.businessGroup] || []).map(function(bu){
          return '<option value="' + escapeHtml(bu) + '"' + (bu === m.businessUnit ? ' selected' : '') + '>' + escapeHtml(bu) + '</option>';
        }).join('') + '</select>' +
        '<div class="field-hint">Required for a Sales Rep — it decides which records they can see.</div></div>' +
    '</div><div class="modal-foot">' +
      '<button type="button" class="btn btn-ghost" data-close-modal="1">Cancel</button>' +
      submitBtn('Save changes', 'Saving…') +
    '</div></form>', 'modal'
  );
}

/* ---------------- Bulk upload ---------------- */

function renderBulkModal(){
  const s = STATE.session;
  const scopeNote = s.role === 'admin'
    ? 'You can import for any Business Group and any sales rep named in the file.'
    : 'Every imported quote is assigned to ' + escapeHtml(s.businessGroup) +
      (s.role === 'rep' ? ', under your name (' + escapeHtml(s.name) + ')' : '') +
      ', whatever the file says, so access stays scoped correctly.';

  return overlay(
    modalHead('Bulk upload quotes', 'CSV or Excel') +

        '<b>Rows sharing an Opportunity Ref become one quote with several line items.</b> ' +
        'A row with the Opportunity Ref left blank becomes a quote of its own. Every quote gets its own TDQ number.<br>' +
        'The ref is only used to group the rows in your file — it is not a field on the quote, which is why ' +
        'the Raise New Quote form has no equivalent: every line you add there already belongs to that one quote. ' +
        'It is recorded in the quote\'s history so you can trace it back to your spreadsheet. ' +
        scopeNote + '</div>' +
      '<div class="action-row" style="margin-bottom:16px;">' +
        '<button type="button" class="btn btn-ghost btn-sm" id="bulk-template-btn">Download CSV template</button>' +
        '<label class="btn btn-gold btn-sm" style="margin:0;">Choose file (.csv or .xlsx)' +
          '<input type="file" id="bulk-file" accept=".csv,.xlsx,.xls" style="display:none;"></label>' +
      '</div>' +
      '<div id="bulk-status" class="field-hint" style="margin-bottom:10px;">No file selected yet.</div>' +
      '<div id="bulk-preview" style="max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:8px;"></div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button type="button" class="btn btn-ghost" data-close-modal="1">Cancel</button>' +
      '<button type="button" class="btn btn-gold" id="bulk-import-btn" disabled>Import quotes</button>' +
    '</div>', 'modal-xwide'
  );
}

<script>
/* ============================================================
   VANTAGE CLIENT · bulk upload, CSV export, quote document
   ============================================================ */

/* ---------------- File delivery ----------------
   The app runs inside a sandboxed Apps Script iframe, where a blob download
   triggered from an anchor is unreliable. Writing into a window we opened
   ourselves is not sandboxed, so the download proceeds — and if the browser
   blocks the click, the user still has a visible link to press. */
function deliverFile(filename, mime, content){
  const win = window.open('', '_blank');
  if(!win){
    toast('Allow pop-ups for Vantage so files can be delivered, then try again.', true);
    return;
  }
  let b64;
  try{
    b64 = btoa(unescape(encodeURIComponent(content)));
  }catch(e){
    toast('That file could not be encoded for download.', true);
    win.close();
    return;
  }
  const href = 'data:' + mime + ';base64,' + b64;
  win.document.write(
    '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + escapeHtml(filename) + '</title>' +
    '<style>body{font-family:system-ui,sans-serif;padding:50px;text-align:center;color:#101828;}' +
    'a{display:inline-block;margin-top:16px;background:#C89B3C;color:#231604;padding:11px 20px;' +
    'border-radius:8px;text-decoration:none;font-weight:600;}</style></head><body>' +
    '<h3 style="font-weight:600;">' + escapeHtml(filename) + '</h3>' +
    '<p style="color:#5B6472;font-size:13px;">Your download should start automatically.</p>' +
    '<a id="dl" href="' + href + '" download="' + escapeHtml(filename) + '">Download it now</a>' +
    '<script>setTimeout(function(){document.getElementById("dl").click();},250);<\/script>' +
    '</body></html>'
  );
  win.document.close();
}

function csvCell(value){
  const s = (value === null || value === undefined) ? '' : String(value);
  return '"' + s.replace(/"/g, '""') + '"';
}
function toCsv(rows){
  return '﻿' + rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
}
function stamp(){
  const d = new Date();
  const pad = function(n){ return String(n).padStart(2, '0'); };
  return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());
}

/* ---------------- Export ----------------
   The prototype could download a blank template but never the actual
   pipeline. This exports exactly what the current filters show. */

const EXPORT_COLUMNS = [
  ['Reference', function(o){ return displayRef(o); }],
  ['Quote sent', function(o){ return o.quoteSent === false ? 'No' : 'Yes'; }],
  ['Deal ID', function(o){ return o.opportunityId; }],
  ['Customer', function(o){ return o.customerName; }],
  ['Partner', function(o){ return o.partnerName; }],
  ['Contact person', function(o){ return o.contactPerson; }],
  ['Contact email', function(o){ return o.contactEmail; }],
  ['Business Group', function(o){ return o.businessGroup; }],
  ['Business Unit', function(o){ return o.businessUnit; }],
  ['Order Type', function(o){ return o.orderType; }],
  ['Delivery terms', function(o){ return o.deliveryTerms; }],
  ['Product summary', function(o){ return o.productLine; }],
  ['Currency', function(o){ return o.currency; }],
  ['Value (native)', function(o){ return Number(o.value) || 0; }],
  ['Value (USD)', function(o){ return Math.round(usdOf(o) * 100) / 100; }],
  ['FX rate used', function(){ return Number(STATE.settings.fxRate) || 0; }],
  ['Date raised', function(o){ return o.dateRaised; }],
  ['Validity (days)', function(o){ return o.validityDays; }],
  ['Valid until', function(o){ return expiryDateOf(o) || ''; }],
  ['Expired', function(o){ return isExpired(o) ? 'Yes' : 'No'; }],
  ['Age (days)', function(o){ const a = ageOf(o); return a === null ? '' : a; }],
  ['Expected close', function(o){ return o.expectedCloseDate; }],
  ['Probability %', function(o){ return o.probability; }],
  ['Weighted value (USD)', function(o){ return Math.round(usdOf(o) * ((Number(o.probability) || 0) / 100) * 100) / 100; }],
  ['Pipeline', function(o){ return o.pipeline || ''; }],
  ['Status', function(o){ return o.status; }],
  ['Sales rep', function(o){ return o.salesRep; }],
  ['Sales Order #', function(o){ return o.soNumber; }],
  ['Invoice #', function(o){ return o.invoiceNumber; }],
  ['Invoiced at', function(o){ return o.invoicedAt; }],
  ['Loss reason', function(o){ return o.lossReasonCode; }],
  ['Loss detail', function(o){ return o.lossReasonNote; }],
  ['Lost at', function(o){ return o.lostAt; }],
  ['Raised by', function(o){ return o.createdBy; }],
  ['Created at', function(o){ return o.createdAt; }],
  ['Last touched by', function(o){ return o.updatedBy; }],
  ['Last touched at', function(o){ return o.updatedAt; }]
];

function currentExportSet(){
  const scoped = scopedOpportunities();
  /* Honour whatever the user is looking at, rather than silently exporting
     something different from what is on screen. */
  return (STATE.view === 'list' || STATE.view === 'board' || STATE.view === 'orders')
    ? applyFlagFilter(applyFilters(scoped))
    : scoped;
}

function exportOpportunitiesCsv(){
  const list = currentExportSet();
  if(!list.length){ toast('Nothing to export with the current filters.', true); return; }
  const rows = [EXPORT_COLUMNS.map(function(c){ return c[0]; })];
  sortOpportunities(list).forEach(function(o){
    rows.push(EXPORT_COLUMNS.map(function(c){ return c[1](o); }));
  });
  deliverFile('Vantage-opportunities-' + stamp() + '.csv', 'text/csv', toCsv(rows));
  toast(list.length + ' ' + pluralize(list.length, 'record') + ' exported');
}

async function exportWithLineItemsCsv(){
  const list = currentExportSet();
  if(!list.length){ toast('Nothing to export with the current filters.', true); return; }
  STATE.busy = 'Collecting line items…';
  render();
  try{
    const res = await rpc('getLineItemsFor', {ids: list.map(function(o){ return o.id; })});
    const byOpp = {};
    (res.lineItems || []).forEach(function(li){
      if(!byOpp[li.oppId]) byOpp[li.oppId] = [];
      byOpp[li.oppId].push(li);
    });
    const rows = [['Reference', 'Customer', 'Business Group', 'Business Unit', 'Sales rep', 'Status',
      'Pipeline', 'Currency', 'Line #', 'Description', 'SKU', 'Qty', 'Unit price', 'Subtotal', 'Quote total']];
    sortOpportunities(list).forEach(function(o){
      const items = (byOpp[o.id] || []).sort(function(a, b){ return (a.seq || 0) - (b.seq || 0); });
      const base = [displayRef(o), o.customerName, o.businessGroup, o.businessUnit, o.salesRep,
        o.status, o.pipeline || '', o.currency];
      if(!items.length){
        rows.push(base.concat(['', o.productLine || '(no line items)', '', '', '', '', Number(o.value) || 0]));
      }else{
        items.forEach(function(li){
          rows.push(base.concat([li.seq, li.description, li.sku, li.qty, li.unitPrice, li.subtotal, Number(o.value) || 0]));
        });
      }
    });
    deliverFile('Vantage-line-items-' + stamp() + '.csv', 'text/csv', toCsv(rows));
    toast('Exported ' + list.length + ' ' + pluralize(list.length, 'quote') + ' with their line items');
  }catch(err){
    toast(String(err.message || err), true);
  }finally{
    STATE.busy = null;
    render();
  }
}

/* ---------------- Bulk upload: parsing ----------------
   CSV is parsed by this hand-written reader — no library, no network — so a
   corporate network that blocks the CDN can never stop a CSV import. Only
   .xlsx depends on the external SheetJS bundle. */

function detectDelimiter(text){
  const first = (text.split(/\r?\n/)[0] || '');
  const counts = {
    ',': (first.match(/,/g) || []).length,
    ';': (first.match(/;/g) || []).length,
    '\t': (first.match(/\t/g) || []).length
  };
  let best = ',';
  if(counts[';'] > counts[best]) best = ';';
  if(counts['\t'] > counts[best]) best = '\t';
  return best;
}

function parseCsvText(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const delimiter = detectDelimiter(text);
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i + 1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      }else field += c;
    }else{
      if(c === '"') inQuotes = true;
      else if(c === delimiter){ row.push(field); field = ''; }
      else if(c === '\r'){ /* handled by \n */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  while(rows.length && rows[rows.length - 1].every(function(v){ return v === ''; })) rows.pop();
  if(!rows.length) return [];
  const headers = rows[0].map(function(h){ return h.trim(); });
  return rows.slice(1).map(function(r){
    const obj = {};
    headers.forEach(function(h, i){ obj[h] = r[i] !== undefined ? r[i] : ''; });
    return obj;
  });
}

const HEADER_ALIASES = {
  customerName:     ['customer name', 'customer', 'client', 'client name', 'end user'],
  partnerName:      ['partner name', 'partner', 'channel partner'],
  businessGroup:    ['business group', 'bg', 'group'],
  businessUnit:     ['business unit', 'unit', 'bu'],
  orderType:        ['order type', 'type'],
  contactPerson:    ['contact person', 'contact', 'contact name'],
  contactEmail:     ['contact email', 'email'],
  /* The column that says which lines belong to the same quote. Named
     "Quote Group" originally, which nobody read as "the opportunity these lines
     belong to" — so the preferred name is now Opportunity Ref, and every
     earlier spelling still works so existing files keep importing. */
  quoteGroup:       ['opportunity ref', 'opportunity reference', 'opportunity', 'opportunity id',
                     'opp ref', 'deal', 'deal ref', 'quote group', 'quote ref', 'quote reference',
                     'group id', 'line group'],
  itemDescription:  ['item description', 'description', 'product', 'product line', 'solution', 'item'],
  sku:              ['sku', 'product code', 'code', 'part number', 'part no'],
  quantity:         ['quantity', 'qty'],
  unitPrice:        ['unit price', 'price', 'value', 'quote value', 'amount'],
  currency:         ['currency', 'ccy'],
  dateRaised:       ['date raised', 'quote date', 'date'],
  expectedCloseDate:['expected close date', 'close date', 'expected close'],
  salesRep:         ['sales rep', 'rep', 'sales representative', 'owner'],
  probability:      ['probability', 'probability %', 'probability(%)'],
  pipeline:         ['pipeline', 'pipeline bucket', 'bucket'],
  validityDays:     ['validity', 'validity days', 'quote validity'],
  notes:            ['notes', 'remarks', 'remark', 'status', 'status note']
};

const BG_ALIASES = {
  'mobile': 'Mobile',
  'enterprise alpha': 'Enterprise Alpha', 'ent alpha': 'Enterprise Alpha',
  'enterprise beta': 'Enterprise Beta', 'ent beta': 'Enterprise Beta',
  'mainstream': 'Mainstream',
  'mls': 'Modern Lifestyle Solution (MLS)',
  'modern lifestyle solution': 'Modern Lifestyle Solution (MLS)',
  'modern lifestyle solution (mls)': 'Modern Lifestyle Solution (MLS)',
  'alt computing': 'ALT Computing', 'alt': 'ALT Computing',
  'software': 'Software'
};

function buildHeaderMap(sampleRow){
  const map = {};
  const keys = Object.keys(sampleRow);
  Object.keys(HEADER_ALIASES).forEach(function(field){
    const match = keys.filter(function(k){
      return HEADER_ALIASES[field].indexOf(String(k || '').trim().toLowerCase()) >= 0;
    })[0];
    if(match) map[field] = match;
  });
  return map;
}

function normalizeBusinessGroup(raw){
  if(!raw) return null;
  const key = String(raw).trim().toLowerCase();
  const groups = STATE.refData.businessGroups || [];
  const direct = groups.filter(function(bg){ return bg.toLowerCase() === key; })[0];
  if(direct) return direct;
  const aliased = BG_ALIASES[key];
  return (aliased && groups.indexOf(aliased) >= 0) ? aliased : null;
}
function normalizeBusinessUnit(businessGroup, raw){
  if(!raw || !businessGroup) return null;
  const key = String(raw).trim().toLowerCase();
  const units = STATE.refData.businessUnitMap[businessGroup] || [];
  return units.filter(function(u){ return u.toLowerCase() === key; })[0] || null;
}

function parseFlexibleDate(val){
  if(val === null || val === undefined || val === '') return null;
  if(val instanceof Date && !isNaN(val)) return val.toISOString().slice(0, 10);
  if(typeof val === 'number' && val > 20000 && val < 80000){
    const dt = new Date(Date.UTC(1899, 11, 30) + val * 86400000);
    if(!isNaN(dt)) return dt.toISOString().slice(0, 10);
  }
  const str = String(val).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  const dmy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(dmy){
    let y = dmy[3];
    if(y.length === 2) y = '20' + y;
    const dt = new Date(Number(y), Number(dmy[2]) - 1, Number(dmy[1]));
    if(!isNaN(dt)){
      return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    }
  }
  const parsed = new Date(str);
  return isNaN(parsed) ? null : parsed.toISOString().slice(0, 10);
}

function parseBulkRow(row, headerMap, rowIndex){
  const s = STATE.session;
  const get = function(field){ return headerMap[field] ? row[headerMap[field]] : ''; };

  const customerName = String(get('customerName') || '').trim();
  let businessGroup = normalizeBusinessGroup(get('businessGroup'));
  if(s.role === 'rep' || s.role === 'head') businessGroup = s.businessGroup;
  const businessUnitRaw = String(get('businessUnit') || '').trim();
  const businessUnit = businessGroup ? normalizeBusinessUnit(businessGroup, businessUnitRaw) : null;
  const quantity = Number(get('quantity')) || 1;
  /* Blank and zero mean different things here. A blank price column is almost
     always a mistake; an explicit 0 is a deliberate no-charge line. */
  const rawUnitPrice = get('unitPrice');
  const unitPriceBlank = (rawUnitPrice === '' || rawUnitPrice === null || rawUnitPrice === undefined);
  const unitPrice = Number(rawUnitPrice);
  let salesRep = String(get('salesRep') || '').trim();
  if(s.role === 'rep') salesRep = s.name;
  let pipeline = Number(get('pipeline'));
  const dateRaised = parseFlexibleDate(get('dateRaised')) || todayStr();

  const errors = [];
  if(!customerName) errors.push('Missing customer name');
  if(!businessGroup) errors.push('Unrecognised Business Group "' + String(get('businessGroup') || '') + '"');
  if(businessGroup && !businessUnit){
    errors.push(businessUnitRaw
      ? 'Unrecognised Business Unit "' + businessUnitRaw + '" for ' + businessGroup
      : 'Missing Business Unit');
  }
  const itemDescription = String(get('itemDescription') || '').trim();
  const skuValue = String(get('sku') || '').trim();
  if(!itemDescription && !skuValue) errors.push('Missing item description and SKU — one of them is needed');
  if(unitPriceBlank) errors.push('Missing unit price — enter 0 for a no-charge line');
  else if(isNaN(unitPrice) || unitPrice < 0) errors.push('Unit price "' + rawUnitPrice + '" is not a valid amount');
  if(!quantity || quantity <= 0) errors.push('Quantity must be greater than zero');
  if(!salesRep) errors.push('Missing sales rep');
  if([1, 2, 3].indexOf(pipeline) < 0) errors.push('Invalid Pipeline value "' + String(get('pipeline') || '') + '" (must be 1, 2 or 3)');

  return {
    rowIndex: rowIndex,
    quoteGroup: String(get('quoteGroup') || '').trim(),
    customerName: customerName,
    partnerName: String(get('partnerName') || '').trim(),
    businessGroup: businessGroup,
    businessUnit: businessUnit,
    orderType: String(get('orderType') || '').trim(),
    contactPerson: String(get('contactPerson') || '').trim(),
    contactEmail: String(get('contactEmail') || '').trim(),
    lineItem: {
      description: itemDescription || skuValue,
      sku: skuValue,
      qty: quantity, unitPrice: unitPrice, subtotal: quantity * unitPrice
    },
    currency: (String(get('currency') || 'NGN').trim().toUpperCase() === 'USD') ? 'USD' : 'NGN',
    dateRaised: dateRaised,
    expectedCloseDate: parseFlexibleDate(get('expectedCloseDate')) || '',
    salesRep: salesRep,
    probability: Number(get('probability')) || 50,
    validityDays: Number(get('validityDays')) || 30,
    pipeline: pipeline,
    importNote: String(get('notes') || '').trim(),
    rowErrors: errors
  };
}

/* Rows sharing a non-empty Quote Group become one multi-line quote. A row
   with no Quote Group is its own single-line quote, so a spreadsheet with
   no such column at all still imports correctly. */
function groupBulkRows(parsed){
  const groups = [];
  const index = {};
  parsed.forEach(function(r, i){
    const key = r.quoteGroup ? 'g:' + r.quoteGroup.toLowerCase() : 'single:' + i;
    if(!index[key]){ index[key] = {key: key, rows: []}; groups.push(index[key]); }
    index[key].rows.push(r);
  });
  return groups;
}

function validateBulkGroup(group){
  const rows = group.rows;
  const first = rows[0];
  const indexes = rows.map(function(r){ return r.rowIndex; });
  const errors = [];

  if(rows.length > 1){
    const customers = {}, bgs = {};
    rows.forEach(function(r){ customers[r.customerName] = true; bgs[r.businessGroup] = true; });
    if(Object.keys(customers).length > 1) errors.push('Rows ' + indexes.join(', ') + ' share a Quote Group but name different customers');
    if(Object.keys(bgs).length > 1) errors.push('Rows ' + indexes.join(', ') + ' share a Quote Group but sit in different Business Groups');
  }
  rows.forEach(function(r){
    r.rowErrors.forEach(function(e){
      const msg = rows.length > 1 ? 'Row ' + r.rowIndex + ': ' + e : e;
      if(errors.indexOf(msg) < 0) errors.push(msg);
    });
  });

  const lineItems = rows
    .filter(function(r){ return (r.lineItem.description || r.lineItem.sku) && r.lineItem.qty > 0; })
    .map(function(r){ return r.lineItem; });
  const total = lineItems.reduce(function(a, li){ return a + li.subtotal; }, 0);
  const rowLabel = indexes.length > 1 ? indexes[0] + '–' + indexes[indexes.length - 1] : String(indexes[0]);

  return {
    ok: errors.length === 0 && lineItems.length > 0,
    errors: errors,
    rowLabel: rowLabel,
    opportunityRef: first.quoteGroup || '',
    importNote: rows.map(function(r){ return r.importNote; }).filter(Boolean).join(' / '),
    data: {
      customerName: first.customerName, partnerName: first.partnerName,
      businessGroup: first.businessGroup, businessUnit: first.businessUnit,
      orderType: first.orderType, contactPerson: first.contactPerson, contactEmail: first.contactEmail,
      lineItems: lineItems, currency: first.currency, dateRaised: first.dateRaised,
      expectedCloseDate: first.expectedCloseDate, salesRep: first.salesRep,
      probability: first.probability, validityDays: first.validityDays, pipeline: first.pipeline
    },
    preview: {
      lineCount: rows.length, total: total, currency: first.currency, pipeline: first.pipeline,
      itemSummary: rows.map(function(r){ return r.lineItem.description; }).slice(0, 3).join(', ') +
        (rows.length > 3 ? ', +' + (rows.length - 3) + ' more' : '')
    }
  };
}

let BULK_READY = [];

function processBulkRows(rows){
  const statusEl = document.getElementById('bulk-status');
  const previewEl = document.getElementById('bulk-preview');
  const importBtn = document.getElementById('bulk-import-btn');
  BULK_READY = [];
  if(importBtn) importBtn.disabled = true;

  if(!rows.length){
    statusEl.textContent = 'That file has no data rows.';
    previewEl.innerHTML = '';
    return;
  }
  const headerMap = buildHeaderMap(rows[0]);
  const required = ['customerName', 'businessGroup', 'unitPrice', 'pipeline'];
  const missing = required.filter(function(f){ return !headerMap[f]; });
  if(missing.length){
    const labels = {customerName: 'Customer Name', businessGroup: 'Business Group', unitPrice: 'Unit Price', pipeline: 'Pipeline'};
    statusEl.innerHTML = 'Could not find required ' + pluralize(missing.length, 'column') + ': <b>' +
      missing.map(function(f){ return labels[f]; }).join(', ') + '</b>. Check the headers against the template.';
    previewEl.innerHTML = '';
    return;
  }

  const parsed = rows.map(function(r, i){ return parseBulkRow(r, headerMap, i + 2); });
  const results = groupBulkRows(parsed).map(validateBulkGroup);
  const valid = results.filter(function(r){ return r.ok; });
  const invalid = results.filter(function(r){ return !r.ok; });
  BULK_READY = valid.map(function(r){
    return {rowLabel: r.rowLabel, importNote: r.importNote, opportunityRef: r.opportunityRef, data: r.data};
  });

  /* The commonest and most expensive mistake is leaving Opportunity Ref blank on
     rows that belong to one quote: every line then imports as its own quote, and
     there is no obvious sign anything is wrong. Spot the rows that look like they
     belong together and say so before anything is written. */
  const ungrouped = {};
  parsed.forEach(function(r){
    if(r.quoteGroup) return;
    const key = String(r.customerName || '').toLowerCase() + '|' + String(r.businessGroup || '');
    if(!ungrouped[key]) ungrouped[key] = [];
    ungrouped[key].push(r.rowIndex);
  });
  const looksSplit = Object.keys(ungrouped)
    .filter(function(k){ return ungrouped[k].length > 1; })
    .map(function(k){ return {customer: k.split('|')[0], rows: ungrouped[k]}; });

function handleBulkFile(file){
  const statusEl = document.getElementById('bulk-status');
  const previewEl = document.getElementById('bulk-preview');
  statusEl.textContent = 'Reading file…';
  previewEl.innerHTML = '';
  BULK_READY = [];

  const isCsv = /\.csv$/i.test(file.name) || file.type === 'text/csv';
  const reader = new FileReader();

  if(isCsv){
    reader.onload = function(e){
      try{ processBulkRows(parseCsvText(e.target.result)); }
      catch(err){
        /* A malformed file and a fault in Vantage are different problems, and
           blaming the file for a bug in here sends people looking in the wrong
           place. A ReferenceError or TypeError is ours, not theirs. */
        const ours = (err instanceof ReferenceError) || (err instanceof TypeError);
        statusEl.textContent = ours
          ? 'Vantage hit an internal error reading that file — this is a fault in the app, not in your CSV. ' +
            'Please report it: ' + String(err.message || err)
          : 'Could not read that CSV. Check it is a plain CSV export and try again.';
        console.error(err);
      }
    };
    reader.onerror = function(){ statusEl.textContent = 'Could not read the file from disk. Try selecting it again.'; };
    reader.readAsText(file);
    return;
  }

  if(typeof XLSX === 'undefined'){
    statusEl.innerHTML = 'This looks like an Excel file, but the Excel-reading component could not load — usually a company network blocking external scripts. ' +
      '<b>Save the file as CSV</b> (File → Save As → CSV) and upload that instead; CSV needs no external component and always works.';
    return;
  }
  reader.onload = function(e){
    try{
      const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array', raw: true, cellText: true, cellDates: false});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      processBulkRows(XLSX.utils.sheet_to_json(sheet, {defval: '', raw: true}));
    }catch(err){
      const ours = (err instanceof ReferenceError) || (err instanceof TypeError);
      statusEl.textContent = ours
        ? 'Vantage hit an internal error reading that file — this is a fault in the app, not in your spreadsheet. ' +
          'Please report it: ' + String(err.message || err)
        : 'Could not read that file. Upload a .csv or .xlsx matching the template, or save it as CSV.';
      console.error(err);
    }
  };
  reader.onerror = function(){ statusEl.textContent = 'Could not read the file from disk. Try selecting it again.'; };
  reader.readAsArrayBuffer(file);
}
