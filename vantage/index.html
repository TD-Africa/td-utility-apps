          return '<option value="' + escapeHtml(u) + '"' + (STATE.filters.unit === u ? ' selected' : '') + '>' +
            escapeHtml(u) + '</option>';
        }).join('') + '</select>'
      : '') +
    '<select id="filter-date-field">' +
      [['dateRaised', 'Date raised'], ['expectedCloseDate', 'Expected close'], ['updatedAt', 'Last touched']]
        .map(function(pair){
          return '<option value="' + pair[0] + '"' + (STATE.filters.dateField === pair[0] ? ' selected' : '') + '>' +
            pair[1] + '</option>';
        }).join('') +
    '</select>' +
    '<input type="date" id="filter-from" value="' + escapeHtml(STATE.filters.from) + '" title="From">' +
    '<input type="date" id="filter-to" value="' + escapeHtml(STATE.filters.to) + '" title="To">' +
    (filtersActive() ? '<button class="btn btn-ghost btn-sm" data-clear-filters="1">Clear filters</button>' : '') +
    '<div class="flex-spacer"></div>' +
    '<span class="filter-summary">' + summaryHtml + '</span>' +
  '</div>';
}

/* ---------------- Pipeline Board ---------------- */

function renderBoard(){
  const scoped = scopedOpportunities();
  const filtered = applyFilters(scoped);
  const open = filtered.filter(isOpenActive);
  const totalUSD = open.reduce(function(acc, o){ return acc + usdOf(o); }, 0);

  return renderFilterBar(open, open.length + ' open · ' + fmtUSD(totalUSD) + ' (USD equivalent)') +
    '<div class="board">' +
      [1, 2, 3].map(function(p){
        return renderColumn(p, open.filter(function(o){ return Number(o.pipeline) === p; }));
      }).join('') +
    '</div>';
}

const BOARD_PAGE = 60;

function renderColumn(p, items){
  const meta = PIPELINE_META[p];
  /* Column totals are USD-equivalent. The prototype summed the raw values of
     NGN and USD quotes together and labelled the result with a naira sign. */
  const totalUSD = items.reduce(function(acc, o){ return acc + usdOf(o); }, 0);
  const sorted = items.slice().sort(function(a, b){ return (ageOf(b) || 0) - (ageOf(a) || 0); });
  const shown = sorted.slice(0, BOARD_PAGE);

  return '<div class="col col' + p + '">' +
    '<div class="col-head">' +
      '<div><span class="num">' + p + '</span><span class="title">' + meta.label + '</span></div>' +
      '<div class="desc">' + meta.sub + '</div>' +
      '<div class="meta"><span>' + items.length + ' ' + pluralize(items.length, 'opportunity', 'opportunities') + '</span>' +
        '<span class="mono">' + fmtUSD(totalUSD) + '</span></div>' +
    '</div>' +
    '<div class="col-body" data-keep-scroll="col' + p + '">' +
      (shown.length
        ? shown.map(function(o){ return renderOppCard(o, p); }).join('') +
          (sorted.length > shown.length
            ? '<div class="col-more">Showing the ' + shown.length + ' oldest of ' + sorted.length +
              ' — use All Opportunities to see the rest.</div>'
            : '')
        : '<div class="col-empty">Nothing here right now.</div>') +
    '</div>' +
  '</div>';
}

function renderOppCard(o, p){
  const days = ageOf(o);
  let ageClass = 'age-ok';
  if(p !== 1 && days !== null){
    if(days > 60) ageClass = 'age-hot';
    else if(days > 30) ageClass = 'age-warn';
  }
  const noQuote = o.quoteSent === false;
  const flags = [];
  if(isExpired(o)) flags.push('<span class="flag-chip">Expired</span>');
  if(needsReprofile(o)) flags.push('<span class="flag-chip" style="background:var(--p3-soft);color:var(--p3);">Due P3</span>');
  if(days !== null && days < 0) flags.push('<span class="flag-chip">Future-dated</span>');

  let chip;
  if(noQuote) chip = '<span class="age-chip" style="background:var(--p2-soft);color:var(--p2);">No quote yet</span>';
  else if(p === 1) chip = '<span class="age-chip age-ok">' + (o.soNumber ? 'SO ' + escapeHtml(o.soNumber) : 'Logged') + '</span>';
  else chip = '<span class="age-chip ' + ageClass + '">' + (days === null ? '—' : days + 'd aged') + '</span>';

  return '<div class="opp-card' + (noQuote ? ' no-quote' : '') + '" data-open-detail="' + escapeHtml(o.id) + '">' +
    '<div class="row1">' +
      '<div class="cust">' + escapeHtml(o.customerName) + '</div>' +
      '<div class="val mono">' + (o.value ? fmtMoney(o.value, o.currency) : '—') + '</div>' +
    '</div>' +
    '<div class="product">' + escapeHtml(o.productLine || '—') + ' · <span class="mono">' + escapeHtml(displayRef(o)) + '</span></div>' +
    '<div class="row2">' +
      '<span class="tag tag-bg">' + escapeHtml(o.businessGroup) +
        (o.businessUnit ? ' / ' + escapeHtml(o.businessUnit) : '') + '</span>' +
      chip +
    '</div>' +
    (flags.length ? '<div class="row2" style="margin-top:6px;">' + flags.join('') + '</div>' : '') +
    '<div class="rep">' + escapeHtml(o.salesRep) + '</div>' +
  '</div>';
}
</script>
<script>
/* ============================================================
   VANTAGE CLIENT · list, analytics, orders, compliance,
   directory, activity, settings
   ============================================================ */

/* ---------------- All Opportunities (sortable, paginated, exportable) ----
   The prototype had no such screen: every table was a hard slice of 8, 10
   or 25 rows with no sorting, paging or way to get the data out. */

const LIST_COLUMNS = [
  {key:'customerName',     label:'Customer'},
  {key:'ref',              label:'Ref'},
  {key:'businessGroup',    label:'Business Group'},
  {key:'businessUnit',     label:'Business Unit'},
  {key:'salesRep',         label:'Rep'},
  {key:'valueUSD',         label:'Value (USD)', numeric:true},
  {key:'value',            label:'Native value', numeric:true},
  {key:'pipeline',         label:'P'},
  {key:'age',              label:'Age', numeric:true},
  {key:'expectedCloseDate',label:'Exp. close'},
  {key:'probability',      label:'Prob.', numeric:true},
  {key:'status',           label:'Status'},
  {key:'updatedAt',        label:'Last touched'}
];

function sortValue(o, key){
  switch(key){
    case 'ref': return displayRef(o);
    case 'valueUSD': return usdOf(o);
    case 'value': return Number(o.value) || 0;
    case 'age': { const a = ageOf(o); return a === null ? -99999 : a; }
    case 'pipeline': return Number(o.pipeline) || 99;
    case 'probability': return Number(o.probability) || 0;
    default: return String(o[key] === undefined || o[key] === null ? '' : o[key]).toLowerCase();
  }
}

function sortOpportunities(list){
  const key = STATE.sort.key;
  const dir = STATE.sort.dir === 'asc' ? 1 : -1;
  return list.slice().sort(function(a, b){
    const va = sortValue(a, key), vb = sortValue(b, key);
    if(va < vb) return -1 * dir;
    if(va > vb) return 1 * dir;
    return String(a.id).localeCompare(String(b.id));
  });
}

/* The dashboard nudges deep-link into this view with a flag applied. */
function applyFlagFilter(list){
  if(STATE.filters.flag === 'reprofile') return list.filter(needsReprofile);
  if(STATE.filters.flag === 'expired') return list.filter(isExpired);
  if(STATE.filters.flag === 'noquote') return list.filter(function(o){ return o.quoteSent === false && isOpenActive(o); });
  return list;
}

function renderList(){
  const scoped = scopedOpportunities();
  const filtered = applyFlagFilter(applyFilters(scoped));
  const sorted = sortOpportunities(filtered);
  const totalUSD = filtered.reduce(function(acc, o){ return acc + usdOf(o); }, 0);

  const paged = paginate('list', sorted);
  const slice = paged.rows;

  const flagBanner = STATE.filters.flag
    ? '<div class="policy-banner" style="border-left-color:var(--p2);">' +
      '<span>◆</span><span>Showing only ' +
      (STATE.filters.flag === 'reprofile' ? 'Pipeline 2 quotes that have aged past ' + STATE.settings.agingThresholdDays + ' days'
        : STATE.filters.flag === 'expired' ? 'quotes whose validity window has lapsed'
        : 'opportunities booked without a quote') +
      '.</span><span class="banner-act"><button class="btn btn-ghost btn-sm" data-clear-flag="1">Show everything</button></span></div>'
    : '';

  const header = LIST_COLUMNS.map(function(c){
    const isSorted = STATE.sort.key === c.key;
    return '<th class="sortable' + (isSorted ? ' sorted' : '') + (c.numeric ? ' num-cell' : '') +
      '" data-sort="' + c.key + '">' + c.label +
      '<span class="sort-arrow">' + (isSorted ? (STATE.sort.dir === 'asc' ? '▲' : '▼') : '↕') + '</span></th>';
  }).join('');

  const body = slice.length
    ? slice.map(function(o){
        const age = ageOf(o);
        const flags = (isExpired(o) ? ' <span class="flag-chip">Expired</span>' : '') +
          (needsReprofile(o) ? ' <span class="flag-chip" style="background:var(--p3-soft);color:var(--p3);">Due P3</span>' : '');
        return '<tr class="tr-hover" data-open-detail="' + escapeHtml(o.id) + '">' +
          '<td><b>' + escapeHtml(o.customerName) + '</b>' + flags +
            (o.partnerName ? '<div style="color:var(--text-faint);font-size:11px;">via ' + escapeHtml(o.partnerName) + '</div>' : '') + '</td>' +
          '<td class="mono">' + escapeHtml(displayRef(o)) + '</td>' +
          '<td>' + escapeHtml(o.businessGroup) + '</td>' +
          '<td>' + escapeHtml(o.businessUnit || '—') + '</td>' +
          '<td>' + escapeHtml(o.salesRep) + '</td>' +
          '<td class="mono num-cell">' + fmtUSD(usdOf(o)) + '</td>' +
          '<td class="mono num-cell">' + fmtMoney(o.value, o.currency) + '</td>' +
          '<td>' + pipelineTag(o) + '</td>' +
          '<td class="num-cell">' + (age === null ? '—' : age + 'd') + '</td>' +
          '<td>' + (o.expectedCloseDate ? fmtDate(o.expectedCloseDate) : '—') + '</td>' +
          '<td class="num-cell">' + (Number(o.probability) || 0) + '%</td>' +
          '<td>' + statusPill(o) + '</td>' +
          '<td>' + fmtDateTime(o.updatedAt) + '</td>' +
        '</tr>';
      }).join('')
    : '<tr><td colspan="' + LIST_COLUMNS.length + '" class="empty-cell">Nothing matches these filters.</td></tr>';

  return flagBanner +
    renderFilterBar(filtered, filtered.length + ' ' + pluralize(filtered.length, 'record') + ' · ' + fmtUSD(totalUSD)) +
    '<div class="card">' +
      '<div class="table-wrap"><table><thead><tr>' + header + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
      renderPager('list', paged, 'opportunities').replace('<div class="pager-spacer"></div>',
        '<div class="pager-spacer"></div>' +
        '<button class="btn btn-ghost btn-sm" data-export-csv="1">Export these ' + filtered.length + ' to CSV</button>' +
        '<button class="btn btn-ghost btn-sm" data-export-lines="1">Export with line items</button>') +
    '</div>';
}

/* ---------------- Analytics ---------------- */

function barRow(label, value, max, color, labelStyle){
  return '<div class="bar-chart-row">' +
    '<div class="bar-chart-label"' + (labelStyle ? ' style="' + labelStyle + '"' : '') + '>' + escapeHtml(label) + '</div>' +
    '<div class="bar-chart-track"><div class="bar-chart-fill" style="width:' +
      Math.max(2, (value / (max || 1)) * 100) + '%;background:' + color + ';"></div></div>' +
    '<div class="bar-chart-val">' + fmtUSD(value) + '</div>' +
  '</div>';
}
function barBlock(entries, color){
  if(!entries.length) return '<div class="empty-state" style="padding:20px;">No open data yet.</div>';
  const max = Math.max.apply(null, [1].concat(entries.map(function(e){ return e[1]; })));
  return entries.map(function(e){
    const isMissing = e[0].indexOf('(No ') === 0;
    return barRow(e[0], e[1], max, isMissing ? 'var(--danger)' : color, isMissing ? 'color:var(--danger);' : '');
  }).join('');
}
function sortedEntries(obj, includeZero){
  return Object.keys(obj)
    .map(function(k){ return [k, obj[k]]; })
    .filter(function(e){ return includeZero || e[1] > 0; })
    .sort(function(a, b){ return b[1] - a[1]; });
}

function renderAnalytics(){
  const s = STATE.session;
  const isAdmin = s.role === 'admin';
  const a = analytics();

  const momentumDelta = a.momentum.prev30ValueUSD
    ? Math.round(((a.momentum.last30ValueUSD - a.momentum.prev30ValueUSD) / a.momentum.prev30ValueUSD) * 100)
    : null;

  let out =
    '<div class="card card-pad" style="margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">' +
      '<div style="flex:1;min-width:240px;">' +
        '<div class="eyebrow" style="font-size:10.5px;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:4px;">Reporting currency</div>' +
        '<div style="font-size:13px;color:var(--text-soft);line-height:1.5;">Naira quotes are converted to USD at the current rate so mixed-currency totals can be added up. Each quote keeps the currency it was raised in.</div>' +
      '</div>' +
      '<div class="mono" style="font-size:14px;font-weight:700;">₦' + fmtNumber(a.fxRate, 0) + ' = $1</div>' +
      (isAdmin ? '<button class="btn btn-ghost btn-sm" data-nav="settings">Change rate</button>' : '') +
    '</div>';

  out += '<div class="grid kpi-row">' +
    kpiCard('Total open pipeline (USD)', fmtUSD(a.totalOpenUSD), 'gold', nativeBreakdown(a)) +
    kpiCard('Win rate by value', a.winRateValue !== null ? a.winRateValue + '%' : '—', 'p1',
      a.winRateCount !== null
        ? a.winRateCount + '% by deal count · ' + fmtUSD(a.wonValueUSD) + ' won vs ' + fmtUSD(a.lostValueUSD) + ' lost'
        : 'No closed deals yet') +
    kpiCard('Avg. days quote → invoice', a.avgDaysToInvoice !== null ? a.avgDaysToInvoice + ' days' : '—', 'p2',
      a.cycleUnknown ? a.cycleUnknown + ' invoiced ' + pluralize(a.cycleUnknown, 'record') + ' predate invoice-date tracking and are excluded' : 'Measured from date raised to the recorded invoice date') +
    kpiCard('Closed lost', a.lost.length, 'p3', fmtUSD(a.lostValueUSD) + ' of lost value') +
  '</div>';

  const forecastEntries = Object.keys(a.forecastBuckets).map(function(k){ return [k, a.forecastBuckets[k]]; });
  const forecastMax = Math.max.apply(null, [1].concat(forecastEntries.map(function(e){ return e[1]; })));
  out += '<div class="section-title"><h2>Forecast</h2><span class="hint">Probability-weighted open pipeline, by expected close window</span></div>' +
    '<div class="card card-pad" style="margin-bottom:20px;">' +
      '<div style="font-family:Sora;font-size:20px;font-weight:700;margin-bottom:14px;">' + fmtUSD(a.totalWeightedForecastUSD) +
        ' <span style="font-size:12px;font-weight:400;color:var(--text-faint);">weighted forecast across all open opportunities</span></div>' +
      forecastEntries.map(function(e){ return barRow(e[0], e[1], forecastMax, 'var(--gold)'); }).join('') +
      '<div class="field-hint" style="margin-top:8px;">Each opportunity\'s USD value multiplied by its probability of close, then bucketed by days until its expected close date. Undated opportunities fall into the last bucket.</div>' +
    '</div>';

  out += '<div class="two-col">' +
    '<div class="card card-pad">' +
      '<h4 style="font-family:Sora;font-size:13.5px;margin-bottom:14px;">' +
        (isAdmin ? 'Open value by Business Group (USD)' : 'Open value by sales rep (USD)') + '</h4>' +
      barBlock(sortedEntries(isAdmin ? a.byBG : a.byRep, isAdmin), 'var(--gold)') +
    '</div>' +
    '<div class="card card-pad">' +
      '<h4 style="font-family:Sora;font-size:13.5px;margin-bottom:14px;">Aging distribution (open quotes outside Pipeline 1, USD)</h4>' +
      Object.keys(a.agingBuckets).map(function(k){
        const max = Math.max.apply(null, [1].concat(Object.keys(a.agingBuckets).map(function(x){ return a.agingBuckets[x]; })));
        const color = k === '90+' ? 'var(--danger)' : (k === '61-90' ? 'var(--p3)' : 'var(--p2)');
        return barRow(k + ' days', a.agingBuckets[k], max, color);
      }).join('') +
    '</div>' +
  '</div>';

  if(isAdmin){
    out += '<div class="section-title"><h2>Sales rep leaderboard</h2><span class="hint">Open pipeline value, company-wide (USD)</span></div>' +
      '<div class="card card-pad">' + barBlock(sortedEntries(a.byRep), 'var(--p2)') + '</div>';
  }

  out += '<div class="two-col" style="margin-top:16px;">' +
    '<div class="card card-pad">' +
      '<h4 style="font-family:Sora;font-size:13.5px;margin-bottom:14px;">Open value by Business Unit</h4>' +
      barBlock(sortedEntries(a.byUnit), 'var(--gold)') +
    '</div>' +
    '<div class="card card-pad">' +
      '<h4 style="font-family:Sora;font-size:13.5px;margin-bottom:14px;">Open value by Order Type</h4>' +
      barBlock(sortedEntries(a.byOrderType), 'var(--p1)') +
    '</div>' +
  '</div>';

  const lossEntries = Object.keys(a.lossReasons).map(function(k){
    return [k, a.lossReasons[k].value, a.lossReasons[k].count];
  }).sort(function(x, y){ return y[1] - x[1]; });
  out += '<div class="section-title"><h2>Why we lose</h2><span class="hint">Closed-lost value by recorded reason</span></div>' +
    '<div class="card card-pad">' +
      (lossEntries.length
        ? (function(){
            const max = Math.max.apply(null, [1].concat(lossEntries.map(function(e){ return e[1]; })));
            return lossEntries.map(function(e){
              return '<div class="bar-chart-row">' +
                '<div class="bar-chart-label">' + escapeHtml(e[0]) + '</div>' +
                '<div class="bar-chart-track"><div class="bar-chart-fill" style="width:' +
                  Math.max(2, (e[1] / max) * 100) + '%;background:var(--danger);"></div></div>' +
                '<div class="bar-chart-val">' + fmtUSD(e[1]) + ' · ' + e[2] + '</div></div>';
            }).join('');
          })()
        : '<div class="field-hint">Nothing closed lost yet.</div>') +
    '</div>';

  out += '<div class="section-title"><h2>Insights</h2><span class="hint">Where to look first</span></div>' +
    '<div class="two-col">' +
      '<div class="card card-pad">' +
        '<h4 style="font-family:Sora;font-size:13.5px;margin-bottom:12px;">Top aging risk</h4>' +
        (a.topAgingRisk.length
          ? a.topAgingRisk.map(function(o){
              return '<div class="kv"><span>' + escapeHtml(o.customerName) +
                ' <span class="mono" style="color:var(--text-faint);">· ' + escapeHtml(displayRef(o)) + '</span></span>' +
                '<span>' + fmtUSD(usdOf(o)) + ' · ' + (ageOf(o) || 0) + 'd</span></div>';
            }).join('')
          : '<div class="field-hint">No Pipeline 3 quotes past 60 days. Clean aging book.</div>') +
      '</div>' +
      '<div class="card card-pad">' +
        '<h4 style="font-family:Sora;font-size:13.5px;margin-bottom:12px;">Pipeline momentum</h4>' +
        '<div class="kv"><span>New opportunities, last 30 days</span><span>' + a.momentum.last30Count + ' · ' + fmtUSD(a.momentum.last30ValueUSD) + '</span></div>' +
        '<div class="kv"><span>Previous 30 days</span><span>' + a.momentum.prev30Count + ' · ' + fmtUSD(a.momentum.prev30ValueUSD) + '</span></div>' +
        '<div class="kv"><span>Change in value</span><span style="font-weight:700;color:' +
          (momentumDelta === null ? 'var(--text-soft)' : (momentumDelta >= 0 ? 'var(--p1)' : 'var(--danger)')) + ';">' +
          (momentumDelta === null ? '—' : (momentumDelta >= 0 ? '+' : '') + momentumDelta + '%') + '</span></div>' +
      '</div>' +
    '</div>';

  if(isAdmin){
    out += '<div class="section-title"><h2>Win rate by Business Group</h2><span class="hint">By deal count</span></div>' +
      '<div class="card card-pad">' +
        (STATE.refData.businessGroups || []).map(function(bg){
          return '<div class="kv"><span>' + escapeHtml(bg) + '</span><span>' +
            (a.bgWinRate[bg] === null ? 'No closed deals yet' : a.bgWinRate[bg] + '%') + '</span></div>';
        }).join('') +
      '</div>';
  }

  out += '<div class="section-title"><h2>Funnel</h2><span class="hint">Pipeline 2 → Pipeline 3 → Pipeline 1 → Invoiced</span></div>' +
    '<div class="card card-pad" style="display:flex;align-items:stretch;">' +
      [['Pipeline 2', a.p2.length, 'p2'], ['Pipeline 3', a.p3.length, 'p3'],
       ['Pipeline 1', a.p1.length, 'p1'], ['Invoiced', a.invoiced.length, 'gold']].map(function(st){
        return '<div style="flex:1;text-align:center;padding:10px;border-right:1px solid var(--border);">' +
          '<div style="font-family:Sora;font-size:22px;font-weight:700;color:var(--' + st[2] + ');">' + st[1] + '</div>' +
          '<div style="font-size:11.5px;color:var(--text-soft);margin-top:4px;">' + st[0] + '</div></div>';
      }).join('') +
    '</div>';

  return out;
}

/* ---------------- Orders & Invoices ----------------
   Replaces the prototype's simulated "Connected to Microsoft Dynamics 365"
   screen. Nothing here talks to D365: the reps record the real references
   they raised there, so Vantage can be reconciled against it. */

function renderOrders(){
  const scoped = scopedOpportunities();
  const filtered = applyFilters(scoped);
  const withSO = filtered.filter(function(o){ return o.soNumber; }).length;
  const withInv = filtered.filter(function(o){ return o.invoiceNumber; }).length;
  const awaiting = filtered.filter(function(o){ return Number(o.pipeline) === 1 && !o.invoiceNumber; });

  const ordered = filtered.slice().sort(function(a, b){
    return String(b.updatedAt).localeCompare(String(a.updatedAt));
  });
  const pagedOrders = paginate('orders', ordered);
  const rows = pagedOrders.rows;

  return '<div class="policy-banner" style="border-left-color:var(--p2);">' +
      '<span>ⓘ</span><span>Vantage does not connect to Dynamics 365 in this build. Raise the Sales Order and the invoice in D365 as usual, then record the reference here so the two systems can be reconciled.</span></div>' +

    '<div class="grid kpi-row-3">' +
      kpiCard('Sales Orders recorded', withSO, 'p2', 'of ' + filtered.length + ' in scope') +
      kpiCard('Invoices recorded', withInv, 'p1', 'closed won') +
      kpiCard('Awaiting invoice', awaiting.length, 'gold', fmtUSD(awaiting.reduce(function(acc, o){ return acc + usdOf(o); }, 0)) + ' in Pipeline 1') +
    '</div>' +

    '<div class="section-title"><h2>Quote → Sales Order → Invoice</h2></div>' +
    '<div class="card card-pad" style="margin-bottom:20px;">' +
      '<div style="display:flex;justify-content:space-between;text-align:center;gap:10px;flex-wrap:wrap;">' +
        [['①', 'Quote raised in Vantage'], ['②', 'Sales Order raised in D365, reference recorded here → Pipeline 1'],
         ['③', 'Invoice raised in D365, reference recorded here'], ['④', 'Opportunity closed won and leaves the board']]
          .map(function(st){
            return '<div style="flex:1;min-width:150px;"><div style="font-size:22px;">' + st[0] + '</div>' +
              '<div style="font-size:12px;margin-top:6px;line-height:1.45;">' + st[1] + '</div></div>';
          }).join('') +
      '</div>' +
    '</div>' +

    renderFilterBar(filtered, filtered.length + ' in scope') +

    '<div class="card">' +
      (rows.length
        ? rows.map(function(o){
            let badge;
            if(o.invoiceNumber) badge = '<span class="ref-badge rb-inv">Invoice ' + escapeHtml(o.invoiceNumber) + '</span>';
            else if(o.soNumber) badge = '<span class="ref-badge rb-so">SO ' + escapeHtml(o.soNumber) + '</span>';
            else badge = '<span class="ref-badge rb-none">No reference yet</span>';
            const act = canAct(o)
              ? (Number(o.pipeline) === 1 && !o.invoiceNumber
                  ? '<button class="btn btn-primary btn-sm" data-open-invoice="' + escapeHtml(o.id) + '">Record invoice</button>'
                  : (o.status === 'open' && o.quoteSent && Number(o.pipeline) !== 1
                      ? '<button class="btn btn-ghost btn-sm" data-open-so="' + escapeHtml(o.id) + '">Record Sales Order</button>'
                      : ''))
              : '';
            return '<div class="ref-row">' +
              '<div><b>' + escapeHtml(o.customerName) + '</b> <span class="mono" style="color:var(--text-faint);">· ' +
                escapeHtml(displayRef(o)) + '</span>' +
                '<div style="color:var(--text-faint);font-size:11px;">' + escapeHtml(o.businessGroup) + ' · ' +
                escapeHtml(o.salesRep) + ' · ' + fmtMoney(o.value, o.currency) + '</div></div>' +
              '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' + badge + act +
                '<button class="btn btn-ghost btn-sm" data-open-detail="' + escapeHtml(o.id) + '">Open</button></div>' +
            '</div>';
          }).join('')
        : '<div class="empty-state">No opportunities match these filters.</div>') +
      renderPager('orders', pagedOrders, 'opportunities') +
    '</div>';
}

/* ---------------- Compliance ---------------- */

function renderCompliance(){
  const s = STATE.session;
  const scope = scopedLeakage();
  const open = scope.filter(function(l){ return !l.resolved; });
  const inScopeQuotes = scopedOpportunities().length;
  const bgs = businessGroupsAvailable();
  const window = Number(STATE.settings.lostDeleteAfterDays) || 90;

  const q = STATE.filters.q.trim().toLowerCase();
  const leakRows = scope.slice()
    .filter(function(l){
      if(!withinDateRange(l.dateDetected, STATE.filters.from, STATE.filters.to)) return false;
      if(STATE.filters.bg !== 'all' && l.businessGroup !== STATE.filters.bg) return false;
      if(!q) return true;
      return (l.soNumber + ' ' + l.customerName + ' ' + l.detectedBy + ' ' + (l.note || ''))
        .toLowerCase().indexOf(q) >= 0;
    })
    .sort(function(a, b){ return String(b.dateDetected).localeCompare(String(a.dateDetected)); });
  const pagedLeaks = paginate('compliance', leakRows);

  const lostScope = scopedOpportunities().filter(function(o){ return o.status === 'lost'; })
    .sort(function(a, b){ return String(a.lostAt).localeCompare(String(b.lostAt)); });
  const pagedLost = paginate('lost', lostScope);

  return '<div class="grid kpi-row-3">' +
      kpiCard('Quotes logged in Vantage', inScopeQuotes, 'p1') +
      kpiCard('Off-platform orders logged', scope.length, 'p3') +
      kpiCard('Unresolved', open.length, open.length ? 'danger' : 'gold') +
    '</div>' +

    '<div class="section-title"><h2>Log an off-platform order</h2>' +
      '<span class="hint">Any Dynamics 365 Sales Order with no matching Vantage quote</span></div>' +
    '<div class="card card-pad" style="margin-bottom:22px;">' +
      '<form id="leak-form">' +
        '<div class="field-row">' +
          '<div class="field"><label>D365 Sales Order number</label><input type="text" id="lk-so" placeholder="e.g. SO-004821" required></div>' +
          '<div class="field"><label>Customer name</label><input type="text" id="lk-customer" required></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Business Group</label><select id="lk-bg" required' + (s.role !== 'admin' ? ' disabled' : '') + '>' +
            bgs.map(function(bg){ return '<option value="' + escapeHtml(bg) + '">' + escapeHtml(bg) + '</option>'; }).join('') +
          '</select></div>' +
          '<div class="field"><label>Value</label><div style="display:flex;gap:8px;">' +
            '<select id="lk-currency" style="flex:none;width:96px;"><option value="NGN">NGN</option><option value="USD">USD</option></select>' +
            '<input type="number" id="lk-value" min="0" step="any" style="flex:1;">' +
          '</div></div>' +
        '</div>' +
        '<div class="field"><label>Note</label><textarea id="lk-note" placeholder="How was this found? Who is following up with the rep or Business Group Head?"></textarea></div>' +
        '<button type="submit" class="btn btn-primary btn-sm">Log off-platform order</button>' +
      '</form>' +
    '</div>' +

    '<div class="section-title"><h2>Register</h2>' +
      '<span class="hint">Search and narrow by date detected</span></div>' +
    '<div class="filters">' +
      '<input type="text" id="filter-q" placeholder="Search SO number, customer, note…" value="' +
        escapeHtml(STATE.filters.q) + '">' +
      (s.role === 'admin'
        ? '<select id="filter-bg"><option value="all">All Business Groups</option>' +
          bgs.map(function(bg){
            return '<option value="' + escapeHtml(bg) + '"' + (STATE.filters.bg === bg ? ' selected' : '') + '>' +
              escapeHtml(bg) + '</option>';
          }).join('') + '</select>'
        : '') +
      '<input type="date" id="filter-from" value="' + escapeHtml(STATE.filters.from) + '" title="Detected from">' +
      '<input type="date" id="filter-to" value="' + escapeHtml(STATE.filters.to) + '" title="Detected to">' +
      (filtersActive() ? '<button class="btn btn-ghost btn-sm" data-clear-filters="1">Clear filters</button>' : '') +
      '<div class="flex-spacer"></div>' +
      '<span class="filter-summary">' + leakRows.length + ' of ' + scope.length + ' shown</span>' +
    '</div>' +
    '<div class="card"><div class="table-wrap"><table>' +
      '<thead><tr><th>SO #</th><th>Customer</th><th>Business Group</th><th class="num-cell">Value</th>' +
        '<th>Logged by</th><th>When</th><th>Status</th><th></th></tr></thead><tbody>' +
      (pagedLeaks.rows.length
        ? pagedLeaks.rows.map(function(l){
            return '<tr>' +
              '<td class="mono">' + escapeHtml(l.soNumber) + '</td>' +
              '<td>' + escapeHtml(l.customerName) +
                (l.note ? '<div style="color:var(--text-faint);font-size:11px;">' + escapeHtml(l.note) + '</div>' : '') + '</td>' +
              '<td>' + escapeHtml(l.businessGroup) + '</td>' +
              '<td class="mono num-cell">' + fmtMoney(l.value, l.currency) + '</td>' +
              '<td>' + escapeHtml(l.detectedBy) + '</td>' +
              '<td>' + fmtDateTime(l.dateDetected) + '</td>' +
              '<td>' + (l.resolved
                ? '<span class="status-pill st-invoiced">Resolved</span>' +
                  '<div style="color:var(--text-faint);font-size:10.5px;margin-top:2px;">' + escapeHtml(l.resolvedBy || '') + '</div>'
                : '<span class="status-pill st-lost">Open</span>') + '</td>' +
              '<td><div style="display:flex;gap:6px;flex-wrap:wrap;">' +
                (l.resolved
                  ? '<button class="btn btn-ghost btn-sm" data-unresolve-leak="' + escapeHtml(l.id) + '">Reopen</button>'
                  : '<button class="btn btn-ghost btn-sm" data-resolve-leak="' + escapeHtml(l.id) + '">Mark resolved</button>') +
                (s.role === 'admin'
                  ? '<button class="btn btn-danger-ghost btn-sm" data-delete-leak="' + escapeHtml(l.id) + '">Delete</button>' : '') +
              '</div></td>' +
            '</tr>';
          }).join('')
        : '<tr><td colspan="8" class="empty-cell">' +
          (scope.length ? 'Nothing matches these filters.' : 'Nothing logged. Every Dynamics 365 order in scope matches a Vantage quote.') +
          '</td></tr>') +
    '</tbody></table></div>' + renderPager('compliance', pagedLeaks, 'entries') + '</div>' +

    '<div class="section-title"><h2>Lost opportunity cleanup</h2>' +
      '<span class="hint">Closed-lost records can be permanently deleted by an Admin after ' + window + ' days</span></div>' +
    '<div class="card table-wrap"><table>' +
      '<thead><tr><th>Customer</th><th>Business Group</th><th class="num-cell">Value</th><th>Reason</th>' +
        '<th>Lost on</th><th class="num-cell">Days ago</th><th></th></tr></thead><tbody>' +
      (pagedLost.rows.length
        ? pagedLost.rows.map(function(o){
            const daysLost = o.lostAt ? daysBetween(String(o.lostAt).slice(0, 10), todayStr()) : 0;
            const eligible = daysLost !== null && daysLost >= window;
            return '<tr>' +
              '<td>' + escapeHtml(o.customerName) + ' <span class="mono" style="color:var(--text-faint);">· ' +
                escapeHtml(displayRef(o)) + '</span></td>' +
              '<td>' + escapeHtml(o.businessGroup) + '</td>' +
              '<td class="mono num-cell">' + fmtMoney(o.value, o.currency) + '</td>' +
              '<td>' + escapeHtml(o.lossReasonCode || '—') +
                (o.lossReasonNote ? '<div style="color:var(--text-faint);font-size:11px;">' + escapeHtml(o.lossReasonNote) + '</div>' : '') + '</td>' +
              '<td>' + (o.lostAt ? fmtDate(String(o.lostAt).slice(0, 10)) : '—') + '</td>' +
              '<td class="num-cell">' + (daysLost === null ? '—' : daysLost + 'd') + '</td>' +
              '<td>' + (s.role !== 'admin'
                ? '<span class="field-hint">Admin only</span>'
                : (eligible
                    ? '<button class="btn btn-danger-ghost btn-sm" data-delete-lost="' + escapeHtml(o.id) + '">Delete</button>'
                    : '<span class="field-hint">Eligible in ' + (window - daysLost) + 'd</span>')) + '</td>' +
            '</tr>';
          }).join('')
        : '<tr><td colspan="7" class="empty-cell">No lost opportunities in scope.</td></tr>') +
    '</tbody></table>' + renderPager('lost', pagedLost, 'lost records') + '</div>';
}

/* ---------------- Team Directory ---------------- */

function renderDirectory(){
  const s = STATE.session;
  const isAdmin = s.role === 'admin';
  const dir = scopedDirectory();
  const activeAdmins = STATE.directory.filter(function(d){
    return d.role === 'admin' && d.status !== 'disabled';
  }).length;

  const canManage = function(d){
    if(isAdmin) return true;
    return s.role === 'head' && d.role === 'rep' && d.businessGroup === s.businessGroup;
  };

  const dq = STATE.filters.q.trim().toLowerCase();
  const dirRows = dir.slice()
    .filter(function(d){
      if(STATE.filters.status === 'open' && d.status === 'disabled') return false;
      if(STATE.filters.status === 'lost' && d.status !== 'disabled') return false;
      if(!dq) return true;
      return [d.name, d.email, d.businessGroup, d.businessUnit, roleLabel(d.role)]
        .join(' ').toLowerCase().indexOf(dq) >= 0;
    })
    .sort(function(a, b){ return String(a.name).localeCompare(String(b.name)); });
  const pagedDir = paginate('directory', dirRows);

  return '<div class="policy-banner" style="border-left-color:var(--gold);">' +
      '<span>◆</span><span>Access is assigned here, not chosen at sign-in. ' +
      (isAdmin
        ? 'You can add anyone to any role and Business Group.'
        : 'You can add and manage Sales Reps in ' + escapeHtml(s.businessGroup) + '. Adding a Business Group Head or Admin needs an Executive / Admin.') +
      '</span></div>' +

    '<div class="section-title"><h2>Add team member</h2></div>' +
    '<div class="card card-pad" style="margin-bottom:20px;">' +
      '<form id="add-member-form">' +
        '<div class="field-row">' +
          '<div class="field"><label>Full name</label><input type="text" id="atm-name" autocomplete="off" required></div>' +
          '<div class="field"><label>Work email</label>' +
            '<input type="email" id="atm-email" autocomplete="off" spellcheck="false" placeholder="name@tdafrica.com" required>' +
            '<div class="field-hint">How they sign in — a one-time code goes here.</div></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Role</label><select id="atm-role"' + (isAdmin ? '' : ' disabled') + '>' +
            (isAdmin
              ? (STATE.refData.roles || []).map(function(r){ return '<option value="' + r.id + '">' + escapeHtml(r.label) + '</option>'; }).join('')
              : '<option value="rep">' + escapeHtml(roleLabel('rep')) + '</option>') +
          '</select></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Business Group</label><select id="atm-bg"' + (isAdmin ? '' : ' disabled') + '>' +
            (isAdmin
              ? '<option value="">— Not applicable for Admin —</option>' +
                (STATE.refData.businessGroups || []).map(function(bg){ return '<option value="' + escapeHtml(bg) + '">' + escapeHtml(bg) + '</option>'; }).join('')
              : '<option value="' + escapeHtml(s.businessGroup) + '" selected>' + escapeHtml(s.businessGroup) + '</option>') +
          '</select></div>' +
          '<div class="field"><label>Business Unit</label><select id="atm-bu">' +
            (STATE.refData.businessUnitMap[isAdmin ? (STATE.refData.businessGroups[0] || '') : s.businessGroup] || [])
              .map(function(bu){ return '<option value="' + escapeHtml(bu) + '">' + escapeHtml(bu) + '</option>'; }).join('') +
          '</select>' +
          '<div class="field-hint">A Sales Rep works inside one unit and sees only its records. Heads and Admins span their whole group, so this is ignored for them.</div>' +
          '</div>' +
        '</div>' +
        '<button type="submit" class="btn btn-gold btn-sm">Add to Vantage</button>' +

    '<div class="section-title"><h2>Team directory</h2>' +
      '<span class="hint">' + dir.length + ' ' + pluralize(dir.length, 'person', 'people') + '</span></div>' +
    '<div class="filters">' +
      '<input type="text" id="filter-q" placeholder="Search name, email, unit…" value="' +
        escapeHtml(STATE.filters.q) + '">' +
      '<select id="filter-status">' +
        [['open', 'Active only'], ['all', 'Everyone'], ['lost', 'Disabled only']].map(function(pair){
          return '<option value="' + pair[0] + '"' + (STATE.filters.status === pair[0] ? ' selected' : '') + '>' +
            pair[1] + '</option>';
        }).join('') +
      '</select>' +
      (filtersActive() ? '<button class="btn btn-ghost btn-sm" data-clear-filters="1">Clear filters</button>' : '') +
      '<div class="flex-spacer"></div>' +
      '<span class="filter-summary">' + pagedDir.total + ' shown</span>' +
    '</div>' +
    '<div class="card"><div class="table-wrap"><table>' +
      '<thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Business Group</th><th>Business Unit</th>' +
        '<th>Status</th><th>Added by</th><th>Last active</th><th></th></tr></thead><tbody>' +
      (pagedDir.rows.length
        ? pagedDir.rows.map(function(d){
            const isLastAdmin = d.role === 'admin' && activeAdmins <= 1 && d.status !== 'disabled';
            let actions = '';
            if(canManage(d)){
              actions += isAdmin
                ? '<button class="btn btn-ghost btn-sm" data-edit-member="' + escapeHtml(d.userId) + '">Edit</button>' : '';
              actions += d.status === 'disabled'
                ? '<button class="btn btn-ghost btn-sm" data-enable-user="' + escapeHtml(d.userId) + '">Enable</button>'
                : (isLastAdmin
                    ? '<span class="field-hint">Last active Admin</span>'
                    : '<button class="btn btn-danger-ghost btn-sm" data-disable-user="' + escapeHtml(d.userId) + '">Disable</button>');
            }

              '<td><span class="avatar-sm">' + escapeHtml(initials(d.name)) + '</span>&nbsp; ' + escapeHtml(d.name) + '</td>' +
              '<td>' + (d.email
                ? '<span class="mono" style="font-size:11.5px;">' + escapeHtml(d.email) + '</span>'
                : '<span style="color:var(--danger);">No email — cannot sign in</span>') + '</td>' +
              '<td>' + escapeHtml(roleLabel(d.role)) + '</td>' +
              '<td>' + escapeHtml(d.businessGroup || 'All Groups') + '</td>' +
              '<td>' + (d.role === 'rep'
                ? (d.businessUnit
                    ? escapeHtml(d.businessUnit)
                    : '<span style="color:var(--danger);">Not set — sees only their own</span>')
                : '<span style="color:var(--text-faint);">Whole group</span>') + '</td>' +
              '<td>' + (d.status === 'disabled'
                ? '<span class="status-pill st-lost">Disabled</span>'
                : '<span class="status-pill st-invoiced">Active</span>') + '</td>' +
              '<td>' + escapeHtml(d.addedBy || '—') + '</td>' +
              '<td>' + (d.lastActive ? fmtDateTime(d.lastActive) : 'Never') + '</td>' +
              '<td><div style="display:flex;gap:6px;flex-wrap:wrap;">' + actions + '</div></td>' +
            '</tr>';
          }).join('')
        : '<tr><td colspan="9" class="empty-cell">' +
          (dir.length ? 'Nobody matches these filters.' : 'No one added yet.') + '</td></tr>') +
    '</tbody></table></div>' + renderPager('directory', pagedDir, 'people') + '</div>';
}

/* ---------------- Activity log ----------------
   With no sign-in, the history is the only accountability there is, so it
   gets its own screen rather than living only inside each record. */

function renderActivity(){
  if(!STATE.activity){
    return '<div class="card empty-state"><span class="spinner spinner-dark"></span>' +
      '<div style="margin-top:12px;">Loading the activity log…</div></div>';
  }
  if(STATE.activity.error){
    return '<div class="card empty-state"><div class="big">⚠</div>' + escapeHtml(STATE.activity.error) +
      '<div style="margin-top:14px;"><button class="btn btn-ghost btn-sm" data-reload-activity="1">Try again</button></div></div>';
  }

  const s = STATE.session;
  const q = STATE.filters.q.trim().toLowerCase();
  let items = STATE.activity.items || [];
  if(s.role !== 'admin'){
    items = items.filter(function(it){ return !it.businessGroup || it.businessGroup === s.businessGroup; });
  }
  if(q){
    items = items.filter(function(it){
      return (it.actor + ' ' + it.customerName + ' ' + it.quoteNumber + ' ' + it.detail).toLowerCase().indexOf(q) >= 0;
    });
  }
  /* Entries carry a timestamp, so the range is compared on its date part. */
  items = items.filter(function(it){
    return withinDateRange(it.ts, STATE.filters.from, STATE.filters.to);
  });
  const actors = Object.keys(items.reduce(function(acc, it){ acc[it.actor] = true; return acc; }, {})).sort();
  if(STATE.filters.rep !== 'all'){
    items = items.filter(function(it){ return it.actor === STATE.filters.rep; });
  }
  const pagedActivity = paginate('activity', items);

  return '<div class="filters">' +
      '<input type="text" id="filter-q" placeholder="Search by person, customer, ref or wording…" value="' + escapeHtml(STATE.filters.q) + '">' +
      '<select id="filter-rep"><option value="all">Everyone</option>' +
        actors.map(function(a){
          return '<option value="' + escapeHtml(a) + '"' + (STATE.filters.rep === a ? ' selected' : '') + '>' +
            escapeHtml(a) + '</option>';
        }).join('') + '</select>' +
      '<input type="date" id="filter-from" value="' + escapeHtml(STATE.filters.from) + '" title="From">' +
      '<input type="date" id="filter-to" value="' + escapeHtml(STATE.filters.to) + '" title="To">' +
      (filtersActive() ? '<button class="btn btn-ghost btn-sm" data-clear-filters="1">Clear filters</button>' : '') +
      '<button class="btn btn-ghost btn-sm" data-reload-activity="1">Refresh</button>' +
      '<div class="flex-spacer"></div>' +
      '<span class="filter-summary">' + items.length + ' ' + pluralize(items.length, 'entry', 'entries') + '</span>' +
    '</div>' +
    '<div class="card table-wrap"><table>' +
      '<thead><tr><th>When</th><th>Who</th><th>What</th><th>Opportunity</th></tr></thead><tbody>' +
      (pagedActivity.rows.length
        ? pagedActivity.rows.map(function(it){
            return '<tr' + (it.oppId && it.oppId !== '__deleted__' ? ' class="tr-hover" data-open-detail="' + escapeHtml(it.oppId) + '"' : '') + '>' +
              '<td style="white-space:nowrap;">' + fmtDateTime(it.ts) + '</td>' +
              '<td><b>' + escapeHtml(it.actor) + '</b></td>' +
              '<td>' + escapeHtml(it.detail) + '</td>' +
              '<td>' + escapeHtml(it.customerName) +
                (it.quoteNumber ? ' <span class="mono" style="color:var(--text-faint);">· ' + escapeHtml(it.quoteNumber) + '</span>' : '') + '</td>' +
            '</tr>';
          }).join('')
        : '<tr><td colspan="4" class="empty-cell">Nothing matches these filters.</td></tr>') +
    '</tbody></table>' + renderPager('activity', pagedActivity, 'entries') + '</div>';
}

          : '') +
        '<button class="btn btn-ghost btn-sm" data-export-csv="1">Export all opportunities to CSV</button>' +
        '<button class="btn btn-ghost btn-sm" data-export-lines="1">Export with line items</button>' +
        '<button class="btn btn-ghost btn-sm" data-connection-check="1">Run connection check</button>' +
        (accessCode()
          ? '<button class="btn btn-ghost btn-sm" data-forget-code="1">Forget access code on this device</button>'
          : '') +
      '</div>' +
      '<pre id="settings-check-out" style="display:none;white-space:pre-wrap;word-break:break-word;' +
        'font-family:monospace;font-size:10.5px;line-height:1.55;background:var(--surface);' +
        'border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px;max-height:320px;overflow:auto;"></pre>' +
      '<div class="field-hint" style="margin-top:10px;">Every Vantage user shares this one Sheet. The app points at it through <b>VANTAGE_BACKEND_URL</b> in vantage.html, set once when the file is published.<br>' +
      'To set or change the shared access code, edit the <b>accessCode</b> row on the <b>Settings</b> tab of the Sheet. Blank means no code is asked for — and the Web App link alone then grants read and write to anyone who has it.</div>' +
      '<div class="field-hint" style="margin-top:12px;">Business Groups, Business Units, Order Types and loss reasons are edited directly in the <b>RefData</b> tab of the Sheet — add a row, set <b>active</b> to TRUE, then reload Vantage.</div>' +
    '</div>' +

    '<div class="section-title"><h2>Bulk imports</h2>' +
      '<span class="hint">Undo an import that grouped wrongly</span></div>' +
    '<div class="card">' +
      (STATE.importBatches === null
        ? '<div class="card-pad field-hint"><span class="spinner spinner-dark"></span> Loading recent imports…</div>'
        : (!STATE.importBatches.length
            ? '<div class="card-pad field-hint">No bulk imports found.</div>'
            : '<div class="table-wrap"><table><thead><tr><th>Imported</th><th>By</th>' +
              '<th class="num-cell">Records</th><th>Customers</th><th>Can be removed</th><th></th></tr></thead><tbody>' +
              STATE.importBatches.map(function(b){
                return '<tr>' +
                  '<td>' + fmtDateTime(b.importedAt) + '</td>' +
                  '<td>' + escapeHtml(b.importedBy || '—') + '</td>' +
                  '<td class="num-cell">' + b.total + '</td>' +
                  '<td>' + escapeHtml(b.customers.join(', ')) +
                    (b.customerCount > b.customers.length ? ' +' + (b.customerCount - b.customers.length) + ' more' : '') + '</td>' +
                  '<td>' + b.removable + ' of ' + b.total +
                    (b.blocked ? '<div class="field-hint">' + b.blocked + ' progressed to D365 or too old</div>' : '') + '</td>' +
                  '<td>' + (b.removable
                    ? '<button class="btn btn-danger-ghost btn-sm" data-undo-import="' + escapeHtml(b.key) + '">Undo import</button>'
                    : '<span class="field-hint">Nothing removable</span>') + '</td>' +
                '</tr>';
              }).join('') + '</tbody></table></div>')) +
      '<div class="card-pad field-hint">Undoing an import removes only records that never progressed — anything with a ' +
      'Sales Order or invoice against it stays. Records older than ' +
      (Number(STATE.settings.mistakeWindowDays) || 30) + ' days count as real pipeline and are kept too. ' +
      'Every removal is recorded in the Activity Log.</div>' +
    '</div>' +

    '<div class="section-title"><h2>Known limits of this build</h2></div>' +
    '<div class="card card-pad">' +
      '<div class="field-hint" style="font-size:12px;line-height:1.7;">' +
        '<b>No sign-in.</b> Names identify who did what; they do not restrict who can do it. Anyone with the link can act as anyone in the directory.<br>' +
        '<b>No Dynamics 365 connection.</b> Sales Order and invoice references are typed in by hand.<br>' +
        '<b>No email delivery.</b> Emailing a quote opens your own mail app with everything pre-filled; you attach the document and send it yourself.<br>' +
        '<b>No file attachments</b> on opportunities.<br>' +
        'This is a stop-gap while the full platform is built. Treat the Sheet as the record of truth and keep a copy.' +
      '</div>' +
    '</div>';
}
</script>
<script>
/* ============================================================
   VANTAGE CLIENT · modal router, opportunity form, line-item
   builder, opportunity detail
   ============================================================ */

function modalType(){
  if(typeof STATE.modal === 'string') return STATE.modal;
  return STATE.modal ? STATE.modal.type : null;
}
function modalId(){
  return (STATE.modal && typeof STATE.modal === 'object') ? STATE.modal.id : null;
}
function currentOpp(){
  const id = modalId();
  return id ? STATE.opportunities.filter(function(o){ return o.id === id; })[0] : null;
}

function renderModal(){
  switch(modalType()){
    case 'new':       return renderOpportunityForm('new');
    case 'edit':      return renderOpportunityForm('edit');
    case 'bulk':      return renderBulkModal();
    case 'detail':    return renderDetailModal();
    case 'sendQuote': return renderSendQuoteModal();
    case 'duplicate': return renderDuplicateModal();
    case 'email':     return renderEmailModal();
    case 'lost':      return renderLostModal();
    case 'so':        return renderSoModal();
    case 'invoice':   return renderInvoiceModal();
    case 'reopen':    return renderReopenModal();
    case 'validity':  return renderValidityModal();
    case 'member':    return renderMemberModal();
    default:          return '';
  }
}

function overlay(inner, width){
  return '<div class="overlay" data-close-overlay="1">' +
    '<div class="modal ' + (width || 'modal-wide') + '" data-stop="1">' + inner + '</div></div>';
}
function modalHead(title, subtitle){
  return '<div class="modal-head"><div><h3>' + title + '</h3>' +
    (subtitle ? '<div style="font-size:11.5px;color:var(--text-faint);margin-top:2px;">' + subtitle + '</div>' : '') +
    '</div><button class="modal-close" data-close-modal="1" aria-label="Close">✕</button></div>';
}
function modalErrorBlock(){
  return STATE.modalError ? '<div class="modal-error">' + escapeHtml(STATE.modalError) + '</div>' : '';
}
function submitBtn(label, busyLabel){
  return '<button type="submit" class="btn btn-gold"' + (STATE.modalBusy ? ' disabled' : '') + '>' +
    (STATE.modalBusy ? '<span class="spinner"></span>' + (busyLabel || 'Saving…') : label) + '</button>';
}

/* ---------------- Line-item builder ----------------
   Operates directly on the DOM so typing in a row is never wiped by an
   app-level re-render. */

let lineItemSeq = 0;

function lineItemRowHtml(rowId, prefill){
  const p = prefill || {};
  return '<div class="line-item-row" data-row-id="' + rowId + '">' +
    '<div class="li-sn">–</div>' +
    '<input type="text" class="li-desc" placeholder="Item / solution description" value="' + escapeHtml(p.description || '') + '">' +
    '<input type="text" class="li-sku" placeholder="SKU / code" value="' + escapeHtml(p.sku || '') + '">' +
    '<input type="number" class="li-qty" placeholder="Qty" min="0" step="any" value="' + (p.qty !== undefined && p.qty !== null ? escapeHtml(p.qty) : 1) + '">' +
    '<input type="number" class="li-price" placeholder="Unit price" min="0" step="any" value="' + (p.unitPrice !== undefined && p.unitPrice !== null ? escapeHtml(p.unitPrice) : '') + '">' +
    '<div class="li-subtotal mono">—</div>' +
    '<button type="button" class="li-remove btn btn-ghost btn-sm" aria-label="Remove line">✕</button>' +
  '</div>';
}
function currencySymbol(){
  const sel = document.getElementById('f-currency');
  return (sel && sel.value === 'USD') ? '$' : '₦';
}
function renumberLineItems(){
  const container = document.getElementById('line-items-container');
  if(!container) return;
  container.querySelectorAll('.line-item-row').forEach(function(row, i){
    row.querySelector('.li-sn').textContent = String(i + 1);
  });
}
function addLineItemRow(prefill){
  const container = document.getElementById('line-items-container');
  if(!container) return;
  lineItemSeq++;
  const rowId = 'li-' + lineItemSeq;
  container.insertAdjacentHTML('beforeend', lineItemRowHtml(rowId, prefill));
  const row = container.querySelector('[data-row-id="' + rowId + '"]');
  row.querySelector('.li-qty').addEventListener('input', recalcQuoteTotal);
  row.querySelector('.li-price').addEventListener('input', recalcQuoteTotal);
  row.querySelector('.li-remove').addEventListener('click', function(){
    row.remove();
    recalcQuoteTotal();
    renumberLineItems();
  });
  recalcQuoteTotal();
  renumberLineItems();
}
function recalcQuoteTotal(){
  const container = document.getElementById('line-items-container');
  const display = document.getElementById('quote-total-display');
  if(!container || !display) return;
  let total = 0;
  container.querySelectorAll('.line-item-row').forEach(function(row){
    const qty = Number(row.querySelector('.li-qty').value) || 0;
    const price = Number(row.querySelector('.li-price').value) || 0;
    const subtotal = qty * price;
    row.querySelector('.li-subtotal').textContent = subtotal ? currencySymbol() + fmtNumber(subtotal) : '—';
    total += subtotal;
  });
  display.textContent = currencySymbol() + fmtNumber(total);
}
function collectLineItems(){
  const container = document.getElementById('line-items-container');
  const items = [];
  if(!container) return items;
  container.querySelectorAll('.line-item-row').forEach(function(row){
    const description = row.querySelector('.li-desc').value.trim();
    const sku = row.querySelector('.li-sku').value.trim();
    const qty = Number(row.querySelector('.li-qty').value) || 0;
    const unitPrice = Number(row.querySelector('.li-price').value) || 0;
    /* Identified by what it is, not by what it costs — a zero price is a valid
       line. Rows with neither a description nor a SKU are the untouched blank
       row the form always leaves ready, and are not lines at all. */
    if(description || sku){
      items.push({
        description: description || sku, sku: sku, qty: qty,
        unitPrice: unitPrice, subtotal: qty * unitPrice
      });
    }
  });
  return items;
}
function lineItemsBlock(scrollClass){
  return '<div class="field">' +
      '<label>Quote line items</label>' +
      '<div class="field-hint" style="margin-bottom:8px;">Every line below belongs to this one quote — add as many as it needs. The total is calculated from them; nothing is pasted in from an outside document. Leave the price at 0 for a no-charge line such as a bundled accessory. Rows with no description are ignored.</div>' +
      /* Same classes as the row itself, so the two stay aligned by construction. */
      '<div class="li-head">' +
        '<div class="li-sn">S/N</div>' +
        '<div class="li-desc">Description</div>' +
        '<div class="li-sku">SKU / Code</div>' +
        '<div class="li-qty">Qty</div>' +
        '<div class="li-price">Unit price</div>' +
        '<div class="li-subtotal">Subtotal</div>' +
        '<div class="li-gap"></div>' +
      '</div>' +
      '<div id="line-items-container" class="' + (scrollClass || 'li-scroll') + '" data-keep-scroll="lineitems"></div>' +
      '<button type="button" class="btn btn-ghost btn-sm" id="add-line-item-btn" style="margin-top:6px;">＋ Add line</button>' +
    '</div>' +
    '<div class="field"><label>Quote total</label>' +
      '<div id="quote-total-display" class="mono total-display">₦0.00</div></div>';
}

/* ---------------- Opportunity form (raise & edit) ----------------
   One form for both, so editing covers every field that creating does. The
   prototype's edit could only change customer, partner, currency and lines,
   which made a wrong Business Unit or close date permanent. */

function renderOpportunityForm(mode){
  const s = STATE.session;
  const isEdit = mode === 'edit';
  const o = isEdit ? currentOpp() : null;
  if(isEdit && !o) return '';
  if(isEdit && STATE.detail && STATE.detail.id === o.id && STATE.detail.loading){
    return overlay(modalHead('Loading quote…') +
      '<div class="modal-body" style="text-align:center;padding:50px;"><span class="spinner spinner-dark"></span></div>');
  }

  const bgLocked = s.role !== 'admin';
  const currentBg = isEdit ? o.businessGroup : (bgLocked ? s.businessGroup : (STATE.refData.businessGroups[0] || ''));
  const units = businessUnitsAvailable(currentBg);
  const noQuote = isEdit ? (o.quoteSent === false) : false;
  const today = todayStr();

  const opt = function(value, label, selected){
    return '<option value="' + escapeHtml(value) + '"' + (selected ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
  };

  return overlay(
    modalHead(
      isEdit ? 'Edit ' + (noQuote ? 'opportunity' : 'quote') : '<span id="form-title">Raise new quote</span>',
      isEdit ? escapeHtml(displayRef(o)) + ' · ' + escapeHtml(o.customerName) : 'Every field here is editable later'
    ) +
    '<form id="opp-form" data-mode="' + mode + '">' +
    '<div class="modal-body">' +
      modalErrorBlock() +

      '<div class="field-row">' +
        '<div class="field"><label>Customer / End User name</label>' +
          '<input type="text" id="f-customer" value="' + escapeHtml(isEdit ? o.customerName : '') + '" required></div>' +
        '<div class="field"><label>Partner name (if via a channel partner)</label>' +
          '<input type="text" id="f-partner" placeholder="Leave blank if direct" value="' + escapeHtml(isEdit ? o.partnerName : '') + '"></div>' +
      '</div>' +

      '<div class="field-row">' +
        '<div class="field"><label>Business Group</label>' +
          '<select id="f-bg"' + ((bgLocked || isEdit) ? ' disabled' : '') + ' required>' +
            (STATE.refData.businessGroups || []).map(function(bg){ return opt(bg, bg, bg === currentBg); }).join('') +
          '</select>' +
          (isEdit ? '<div class="field-hint">A quote cannot change Business Group — raise it under the correct group instead.</div>' : '') +
        '</div>' +
        '<div class="field"><label>Business Unit</label>' +
          '<select id="f-bu"' + ((s.role === 'rep' && s.businessUnit) ? ' disabled' : '') + ' required>' +
            units.map(function(bu){ return opt(bu, bu, isEdit ? bu === o.businessUnit : bu === (s.businessUnit || '')); }).join('') +
          '</select>' +
          ((s.role === 'rep' && s.businessUnit)
            ? '<div class="field-hint">You raise quotes inside ' + escapeHtml(s.businessUnit) + '.</div>' : '') +
        '</div>' +
      '</div>' +

      '<div class="field-row">' +
        '<div class="field"><label>Contact person</label>' +
          '<input type="text" id="f-contact" value="' + escapeHtml(isEdit ? o.contactPerson : '') + '"></div>' +
        '<div class="field"><label>Contact email</label>' +
          '<input type="email" id="f-email" value="' + escapeHtml(isEdit ? o.contactEmail : '') + '">' +
          '<div class="field-hint" id="email-hint"></div></div>' +
      '</div>' +

      '<div class="field-row">' +
        '<div class="field"><label>Order Type</label><select id="f-order-type">' +
          opt('', '— Select —', isEdit && !o.orderType) +
          (STATE.refData.orderTypes || []).map(function(t){ return opt(t, t, isEdit && t === o.orderType); }).join('') +
        '</select></div>' +
        '<div class="field"><label>Delivery terms (optional)</label>' +
          '<input type="text" id="f-delivery" placeholder="e.g. D2D or FOB" value="' + escapeHtml(isEdit ? o.deliveryTerms : '') + '"></div>' +
      '</div>' +

      (!isEdit
        ? '<div class="field field-boxed">' +
            '<label class="inline-check"><input type="checkbox" id="f-no-quote"> Book this opportunity without sending a quote yet</label>' +
            '<div class="field-hint" style="margin-top:5px;">For a lead or early-stage opportunity that has no price yet. It gets a placeholder reference now and its TDQ number when you send the quote from its detail view.</div>' +
          '</div>'
        : (noQuote
            ? '<div class="policy-banner" style="border-left-color:var(--p2);">' +
              '<span>◇</span><span>No quote has been sent for this opportunity yet, so it has a placeholder reference (' +
              escapeHtml(o.placeholderRef) + ') rather than a TDQ number.</span></div>'
            : '')) +

      '<div class="field-row">' +
        '<div class="field"><label>Currency</label><select id="f-currency">' +
          opt('NGN', 'NGN — Naira', isEdit ? o.currency === 'NGN' : true) +
          opt('USD', 'USD — Dollar', isEdit && o.currency === 'USD') +
        '</select></div>' +
        '<div class="field"><label>Quote validity (days)</label>' +
          '<input type="number" id="f-validity" min="1" max="365" value="' + escapeHtml(isEdit ? (o.validityDays || 30) : 30) + '">' +
          '<div class="field-hint">Vantage flags the quote as expired once this window passes.</div></div>' +
      '</div>' +

      '<div id="quote-items-block"' + (noQuote ? ' style="display:none;"' : '') + '>' + lineItemsBlock() + '</div>' +

      '<div id="no-quote-block"' + (noQuote ? '' : ' style="display:none;"') + '>' +
        '<div class="field"><label>Estimated opportunity value (optional)</label>' +
          '<input type="number" id="f-estimated" min="0" step="any" placeholder="Rough size of the opportunity, if known" value="' +
            escapeHtml(noQuote && o.value ? o.value : '') + '">' +
          '<div class="field-hint">A placeholder for pipeline reporting only. It is not a quote and produces no TDQ number.</div></div>' +
      '</div>' +

      '<div class="field-row">' +
        '<div class="field"><label>Date raised</label>' +
          '<input type="date" id="f-date" value="' + escapeHtml(isEdit ? o.dateRaised : today) + '" required>' +
          '<div class="field-hint" id="pipeline-hint"></div></div>' +
        '<div class="field"><label>Expected close date</label>' +
          '<input type="date" id="f-close" value="' + escapeHtml(isEdit ? o.expectedCloseDate : '') + '">' +
          '<div class="field-hint">Drives the forecast. It does not decide the pipeline bucket.</div></div>' +
      '</div>' +

      '<div class="field-row">' +
        '<div class="field"><label>Sales rep</label>' +
          (s.role === 'rep'
            ? '<input type="text" id="f-rep" value="' + escapeHtml(isEdit ? o.salesRep : s.name) + '" readonly>'
            : '<select id="f-rep">' + repOptionsFor(currentBg, isEdit ? o.salesRep : s.name) + '</select>') +
          '<div class="field-hint">' + (s.role === 'rep' ? 'A rep can only file quotes under their own name.' : 'Pick who owns this opportunity.') + '</div></div>' +
        '<div class="field"><label>Probability of close (%)</label>' +
          '<input type="number" id="f-prob" min="0" max="100" value="' + escapeHtml(isEdit ? o.probability : 50) + '"></div>' +
      '</div>' +

      '<div class="field"><label>Pipeline</label>' +
        '<select id="f-pipeline" required>' +
          opt('2', 'Pipeline 2 — quote sent, still fresh', isEdit ? Number(o.pipeline) === 2 : true) +
          opt('3', 'Pipeline 3 — quote sent, aging', isEdit && Number(o.pipeline) === 3) +
          (isEdit && Number(o.pipeline) === 1
            ? opt('1', 'Pipeline 1 — Sales Order raised', true)
            : '') +
        '</select>' +
        '<div class="field-hint">Pipeline 2 and 3 are about how long the quote has been out, so the bucket is suggested from the date raised. ' +
          (isEdit && Number(o.pipeline) === 1 ? 'This opportunity has a Sales Order against it and stays in Pipeline 1 until invoiced.' : 'Change it whenever you need to.') +
        '</div></div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button type="button" class="btn btn-ghost" data-close-modal="1">Cancel</button>' +
      submitBtn(isEdit ? 'Save changes' : '<span id="form-submit-label">Raise quote</span>', isEdit ? 'Saving…' : 'Raising…') +
    '</div></form>'
  );
}

/* Reps available to own a quote: everyone active in that Business Group,
   plus whatever name is already on the record so an import from outside the
   directory is never silently reassigned. */
function repOptionsFor(businessGroup, selected){
  const names = STATE.directory
    .filter(function(d){
      return d.status !== 'disabled' && (d.role === 'admin' || d.businessGroup === businessGroup);
    })
    .map(function(d){ return d.name; });
  if(selected && names.indexOf(selected) === -1) names.unshift(selected);
  return names.map(function(n){
    return '<option value="' + escapeHtml(n) + '"' + (n === selected ? ' selected' : '') + '>' + escapeHtml(n) + '</option>';
  }).join('');
}

/* ---------------- Opportunity detail ---------------- */

function renderDetailModal(){
  const o = currentOpp();
  if(!o) return '';
  const d = STATE.detail && STATE.detail.id === o.id ? STATE.detail : {loading: true};
  const act = canAct(o);
  const age = ageOf(o);
  const openActive = isOpenActive(o);
  const expiry = expiryDateOf(o);
  const toExpiry = daysToExpiry(o);

  const notices = [];
  if(o.quoteSent === false){
    notices.push('<div class="policy-banner" style="border-left-color:var(--p2);"><span>◇</span><span>' +
      'Booked without a quote. It holds placeholder reference <b>' + escapeHtml(o.placeholderRef) + '</b>, not a TDQ number. ' +
      (act ? 'Use Send Quote once it is priced.' : '') + '</span></div>');
  }
  if(isExpired(o)){
    notices.push('<div class="policy-banner" style="border-left-color:var(--danger);background:#221012;"><span>⌛</span><span>' +
      'This quote\'s ' + (o.validityDays || 30) + '-day validity lapsed on ' + fmtDate(expiry) + '. Re-quote or extend the validity before pursuing it.</span></div>');
  }
  if(needsReprofile(o)){
    notices.push('<div class="policy-banner" style="border-left-color:var(--p3);"><span>⏳</span><span>' +
      'In Pipeline 2 but ' + age + ' days old, past the ' + STATE.settings.agingThresholdDays + '-day window. It belongs in Pipeline 3.' +
      '</span>' + (act ? '<span class="banner-act"><button class="btn btn-ghost btn-sm" data-reprofile-to="3" data-opp="' + escapeHtml(o.id) + '">Move to P3</button></span>' : '') + '</div>');
  }
  if(age !== null && age < 0){
    notices.push('<div class="policy-banner" style="border-left-color:var(--p3);"><span>⚠</span><span>' +
      'The date raised is ' + Math.abs(age) + ' days in the future. Correct it so aging and forecasting are accurate.</span></div>');
  }

  const linked = o.opportunityId
    ? STATE.opportunities.filter(function(x){ return x.opportunityId === o.opportunityId && x.id !== o.id; })
    : [];

  return overlay(
    modalHead(
      escapeHtml(o.customerName),
      escapeHtml(displayRef(o)) + ' · ' + escapeHtml(o.businessGroup) +
        (o.partnerName ? ' · via ' + escapeHtml(o.partnerName) : '')
    ) +
    '<div class="modal-body">' +
      modalErrorBlock() +
      notices.join('') +
      '<div class="detail-grid">' +
        '<div>' +
          '<div class="detail-block"><h4>Opportunity details</h4>' +
            kv('Status', statusPill(o)) +
            kv('Pipeline', Number(o.pipeline) ? PIPELINE_META[Number(o.pipeline)].label : 'Closed') +
            kv('Business Unit', o.businessUnit ? escapeHtml(o.businessUnit) : '<span style="color:var(--danger);">Not set</span>') +
            kv('Order Type', escapeHtml(o.orderType || '—')) +
            (o.deliveryTerms ? kv('Delivery terms', escapeHtml(o.deliveryTerms)) : '') +
            kv('Value', fmtMoney(o.value, o.currency) +
              ' <span style="color:var(--text-faint);font-weight:400;">(' + fmtUSD(usdOf(o)) + ' at ₦' + fmtNumber(STATE.settings.fxRate, 0) + ')</span>') +
            kv('Date raised', fmtDate(o.dateRaised) + (age === null ? '' : ' · ' + age + 'd ago')) +
            (o.quoteSent !== false ? kv('Valid until', expiry ? fmtDate(expiry) +
              (toExpiry !== null ? ' · ' + (toExpiry < 0 ? Math.abs(toExpiry) + 'd overdue' : toExpiry + 'd left') : '') : '—') : '') +
            kv('Expected close', fmtDate(o.expectedCloseDate)) +
            kv('Probability', (Number(o.probability) || 0) + '%') +
            kv('Sales rep', escapeHtml(o.salesRep)) +
            kv('Contact', escapeHtml(o.contactPerson || '—') + (o.contactEmail ? ' · ' + escapeHtml(o.contactEmail) : '')) +
            (o.lossReasonCode ? kv('Loss reason', escapeHtml(o.lossReasonCode) + (o.lossReasonNote ? ' — ' + escapeHtml(o.lossReasonNote) : '')) : '') +
            kv('Raised by', escapeHtml(o.createdBy) + ' on ' + fmtDateTime(o.createdAt)) +
            kv('Last touched', escapeHtml(o.updatedBy || '—') + ' · ' + fmtDateTime(o.updatedAt)) +
          '</div>' +

          '<div class="detail-block"><h4>Quote line items</h4>' + renderDetailLineItems(o, d) + '</div>' +

          (linked.length
            ? '<div class="detail-block"><h4>Linked quotes on this deal</h4>' +
              '<div class="field-hint" style="margin-bottom:8px;">Same underlying deal, quoted to a different partner — they share Deal ID <span class="mono">' +
              escapeHtml(o.opportunityId) + '</span>. Reporting counts the highest-value quote once.</div>' +
              linked.map(function(x){
                return '<div class="kv"><span>' + escapeHtml(x.partnerName || 'No partner') +
                  ' <span class="mono" style="color:var(--text-faint);">· ' + escapeHtml(displayRef(x)) + '</span></span>' +
                  '<span>' + fmtMoney(x.value, x.currency) + ' <button class="btn btn-ghost btn-sm" data-open-detail="' +
                  escapeHtml(x.id) + '">Open</button></span></div>';
              }).join('') + '</div>'
            : '') +

          '<div class="detail-block"><h4>Dynamics 365 references</h4>' +
            '<div class="field-hint" style="margin-bottom:8px;">Typed in by hand — Vantage does not connect to D365 in this build.</div>' +
            kv('Sales Order #', o.soNumber ? '<span class="mono">' + escapeHtml(o.soNumber) + '</span>' : '—') +
            kv('SO recorded', o.soRaisedAt ? fmtDateTime(o.soRaisedAt) : '—') +
            kv('Invoice #', o.invoiceNumber ? '<span class="mono">' + escapeHtml(o.invoiceNumber) + '</span>' : '—') +
            kv('Invoiced', o.invoicedAt ? fmtDateTime(o.invoicedAt) : '—') +
          '</div>' +

          (act ? '<div class="detail-block"><h4>Actions</h4><div class="action-row">' + detailActions(o, openActive) + '</div></div>'
               : '<div class="field-hint">You can view this opportunity. Only ' + escapeHtml(o.salesRep) +
                 ', a Business Group Head, or an Admin can act on it.</div>') +
        '</div>' +

        '<div>' +
          '<div class="detail-block"><h4>Notes' + (d.notes ? ' (' + d.notes.length + ')' : '') + '</h4>' +
            (d.loading
              ? '<div class="field-hint"><span class="spinner spinner-dark"></span> Loading…</div>'
              : (d.notes && d.notes.length
                  ? d.notes.slice().reverse().map(function(n){
                      return '<div class="note-item"><div class="n-meta">' + escapeHtml(n.author) + ' · ' +
                        fmtDateTime(n.ts) + '</div>' + escapeHtml(n.text) + '</div>';
                    }).join('')
                  : '<div class="field-hint">No notes yet.</div>')) +
            '<div style="display:flex;gap:8px;margin-top:10px;">' +
              '<input type="text" id="new-note-input" placeholder="Add a note…" ' +
                'style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;">' +
              '<button class="btn btn-ghost btn-sm" data-add-note="' + escapeHtml(o.id) + '">Add</button>' +
            '</div>' +
          '</div>' +
          '<div class="detail-block"><h4>Activity history</h4>' +
            (d.loading
              ? '<div class="field-hint"><span class="spinner spinner-dark"></span> Loading…</div>'
              : (d.history && d.history.length
                  ? d.history.slice().reverse().map(function(h){
                      return '<div class="history-item">' + escapeHtml(h.detail) +
                        '<div class="h-time">' + escapeHtml(h.actor) + ' · ' + fmtDateTime(h.ts) + '</div></div>';
                    }).join('')
                  : '<div class="field-hint">Nothing recorded yet.</div>')) +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn btn-ghost" data-close-modal="1">Close</button></div>',
    'modal-xwide'
  );
}

function kv(label, value){
  return '<div class="kv"><span>' + label + '</span><span>' + value + '</span></div>';
}

function renderDetailLineItems(o, d){
  if(d.loading) return '<div class="field-hint"><span class="spinner spinner-dark"></span> Loading line items…</div>';
  if(!d.lineItems || !d.lineItems.length){
    return '<div class="field-hint">' + escapeHtml(o.productLine || 'No line items recorded for this opportunity.') + '</div>';
  }
  return '<div class="table-wrap"><table>' +
    '<thead><tr><th>Item</th><th>SKU</th><th class="num-cell">Qty</th><th class="num-cell">Unit price</th><th class="num-cell">Subtotal</th></tr></thead>' +
    '<tbody>' +
      d.lineItems.map(function(li){
        return '<tr><td>' + escapeHtml(li.description) + '</td><td class="mono">' + escapeHtml(li.sku || '—') + '</td>' +
          '<td class="num-cell">' + fmtNumber(li.qty, 0) + '</td>' +
          '<td class="num-cell mono">' + fmtMoney(li.unitPrice, o.currency) + '</td>' +
          '<td class="num-cell mono">' + fmtMoney(li.subtotal, o.currency) + '</td></tr>';
      }).join('') +
      '<tr><td colspan="4" style="text-align:right;font-weight:700;">Total</td>' +
        '<td class="num-cell mono" style="font-weight:700;">' + fmtMoney(o.value, o.currency) + '</td></tr>' +
    '</tbody></table></div>';
}

function detailActions(o, openActive){
  const id = escapeHtml(o.id);
  const sent = o.quoteSent !== false;
  const p = Number(o.pipeline);
  const out = [];

  if(!sent && o.status === 'open') out.push('<button class="btn btn-gold btn-sm" data-send-quote="' + id + '">Send Quote Now</button>');
  if(sent) out.push('<button class="btn btn-gold btn-sm" data-open-validity="' + id + '">Generate Quote Document</button>');
  if(sent) out.push('<button class="btn btn-primary btn-sm" data-email-quote="' + id + '">Email Quote</button>');
  if(o.status !== 'invoiced') out.push('<button class="btn btn-ghost btn-sm" data-edit-opp="' + id + '">Edit</button>');
  if(sent) out.push('<button class="btn btn-ghost btn-sm" data-duplicate-quote="' + id + '">Duplicate for Another Partner</button>');
  if(o.status === 'open' && p !== 1){
    out.push('<select data-reprofile-select="' + id + '" style="padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;">' +
      '<option value="">Reprofile to…</option>' +
      '<option value="2"' + (p === 2 ? ' selected' : '') + '>Pipeline 2 (fresh)</option>' +
      '<option value="3"' + (p === 3 ? ' selected' : '') + '>Pipeline 3 (aging)</option></select>');
  }
  if(o.status === 'open' && sent && p !== 1){
    out.push('<button class="btn btn-primary btn-sm" data-open-so="' + id + '">Record Sales Order</button>');
  }
  if(p === 1 && o.status !== 'invoiced'){
    out.push('<button class="btn btn-primary btn-sm" data-open-invoice="' + id + '">Record Invoice</button>');
  }
  if(openActive) out.push('<button class="btn btn-danger-ghost btn-sm" data-open-lost="' + id + '">Mark Closed Lost</button>');
  if(o.status === 'lost' || o.status === 'invoiced'){
    out.push('<button class="btn btn-ghost btn-sm" data-open-reopen="' + id + '">Reopen</button>');
  }
  if(canDelete(o)){
    out.push('<button class="btn btn-danger-ghost btn-sm" data-delete-opp="' + id + '">Delete</button>');
  }
  return out.join('');
}
</script>
<script>

          }).join('') + '</select></div>' +

          }).join('') + '</select></div>' +

      '<div class="field-row">' +
        '<div class="field"><label>Currency</label><select id="f-currency">' +

          '<option value="USD"' + (src.currency === 'USD' ? ' selected' : '') + '>USD — Dollar</option>' +
        '</select></div>' +
        '<div class="field"><label>Delivery terms (optional)</label>' +

    '</div><div class="modal-foot">' +
