<script>
/* ============================================================
   VANTAGE CLIENT · event wiring, live-refresh polling, boot
   ============================================================ */

function on(selector, event, handler){
  document.querySelectorAll(selector).forEach(function(el){ el.addEventListener(event, handler); });
}
function attr(el, name){ return el.getAttribute(name); }

/* ---------------- Local state upkeep ---------------- */

function upsertOpportunity(o){
  if(!o) return;
  resetRenderMemo();
  const i = STATE.opportunities.findIndex(function(x){ return x.id === o.id; });
  if(i >= 0){
    STATE.opportunities[i] = Object.assign({}, STATE.opportunities[i], o);
  }else{
    STATE.opportunities.unshift(o);
  }
}
function upsertMember(m){
  if(!m) return;
  const i = STATE.directory.findIndex(function(x){ return x.userId === m.userId; });
  if(i >= 0) STATE.directory[i] = m; else STATE.directory.push(m);
}
function upsertLeak(l){
  if(!l) return;
  const i = STATE.leakage.findIndex(function(x){ return x.id === l.id; });
  if(i >= 0) STATE.leakage[i] = l; else STATE.leakage.push(l);
}
/* Defends against a payload from an older or partly-configured backend. A
   missing `settings` or `refData` used to take the whole app down with a message
   that named neither — so every field falls back to something renderable. */
function applyBootstrap(data){
  resetRenderMemo();
  const d = data || {};
  const ref = d.refData || {};
  STATE.refData = {
    businessGroups: ref.businessGroups || [],
    businessUnitMap: ref.businessUnitMap || {},
    orderTypes: ref.orderTypes || [],
    lossReasons: ref.lossReasons || [],
    quoteValidityOptions: (ref.quoteValidityOptions && ref.quoteValidityOptions.length)
      ? ref.quoteValidityOptions : [7, 14, 30, 45, 60, 90],
    roles: ref.roles || [
      {id: 'rep', label: 'Sales Representative'},
      {id: 'head', label: 'Business Group Head'},
      {id: 'admin', label: 'Executive / Admin'}
    ]
  };
  const set = d.settings || {};
  STATE.settings = {
    fxRate: Number(set.fxRate) || 1650,
    agingThresholdDays: Number(set.agingThresholdDays) || 30,
    lostDeleteAfterDays: Number(set.lostDeleteAfterDays) || 90,
    mistakeWindowDays: Number(set.mistakeWindowDays) || 30,
    repScope: set.repScope === 'own' ? 'own' : 'unit'
  };
  STATE.directory = d.directory || [];
  STATE.opportunities = d.opportunities || [];
  STATE.leakage = d.leakage || [];
  STATE.revision = d.revision || 0;
  STATE.staleRevision = null;
  STATE.today = d.today || new Date().toISOString().slice(0, 10);
  STATE.spreadsheetUrl = d.spreadsheetUrl || '';
}

async function reloadAll(silent){
  if(!silent){ STATE.busy = 'Refreshing…'; render(); }
  try{
    const data = await rpc('getBootstrap');
    applyBootstrap(data);
    /* Keep the open record's detail in step with the reloaded list. */
    if(STATE.detail && STATE.detail.id){
      const still = STATE.opportunities.some(function(o){ return o.id === STATE.detail.id; });
      if(!still){ STATE.modal = null; STATE.detail = null; }
    }
    if(STATE.view === 'activity') loadActivity();
  }catch(err){
    toast(String(err.message || err), true);
  }finally{
    STATE.busy = null;
    render();
  }
}

async function openDetail(id){
  STATE.modal = {type: 'detail', id: id};
  STATE.modalError = null;
  STATE.detail = {id: id, loading: true};
  render();
  try{
    const res = await rpc('getOpportunityDetail', {id: id});
    upsertOpportunity(res.opportunity);
    STATE.detail = {id: id, loading: false, lineItems: res.lineItems, notes: res.notes, history: res.history};
  }catch(err){
    STATE.detail = {id: id, loading: false, lineItems: [], notes: [], history: []};
    STATE.modalError = String(err.message || err);
  }
  render();
}
/* Modals that prefill from line items need the detail loaded first. */
async function ensureDetail(id){
  if(STATE.detail && STATE.detail.id === id && !STATE.detail.loading) return;
  STATE.detail = {id: id, loading: true};
  render();
  try{
    const res = await rpc('getOpportunityDetail', {id: id});
    upsertOpportunity(res.opportunity);
    STATE.detail = {id: id, loading: false, lineItems: res.lineItems, notes: res.notes, history: res.history};
  }catch(err){
    STATE.detail = {id: id, loading: false, lineItems: [], notes: [], history: []};
    toast(String(err.message || err), true);
  }
}
async function loadImportBatches(){
  STATE.importBatches = null;
  render();
  try{
    const res = await rpc('listImportBatches', {});
    STATE.importBatches = res.batches || [];
  }catch(err){
    STATE.importBatches = [];
    toast(String(err.message || err), true);
  }
  render();
}

async function loadActivity(){
  STATE.activity = null;
  render();
  try{
    const res = await rpc('getActivityFeed', {limit: 400});
    STATE.activity = {items: res.items};
  }catch(err){
    STATE.activity = {error: String(err.message || err), items: []};
  }
  render();
}

function closeModal(){
  STATE.modal = null;
  STATE.modalError = null;
  STATE.detail = null;
  render();
}
function backToDetail(id){
  STATE.modal = {type: 'detail', id: id};
  STATE.modalError = null;
  render();
}

/* ---------------- Main wiring ---------------- */

function wireAll(){
  /* Navigation */
  on('[data-nav]', 'click', function(e){
    STATE.view = attr(e.currentTarget, 'data-nav');
    STATE.filters.flag = null;
    resetPages();
    document.body.classList.remove('nav-open');
    if(STATE.view === 'activity' && !STATE.activity){ loadActivity(); return; }
    if(STATE.view === 'settings' && STATE.importBatches === null){ loadImportBatches(); return; }
    render();
  });
  on('[data-nav-filter]', 'click', function(e){
    STATE.view = 'list';
    STATE.filters.flag = attr(e.currentTarget, 'data-nav-filter');
    STATE.filters.status = 'open';
    resetPages();
    render();
  });
  on('[data-clear-flag]', 'click', function(){ STATE.filters.flag = null; resetPages(); render(); });
  on('[data-clear-filters]', 'click', function(){
    STATE.filters = {bg: 'all', unit: 'all', rep: 'all', status: 'open', q: '',
      flag: null, from: '', to: '', dateField: 'dateRaised'};
    resetPages();
    render();
  });

  const navToggle = document.getElementById('nav-toggle');
  if(navToggle) navToggle.addEventListener('click', function(){ document.body.classList.toggle('nav-open'); });
  const scrim = document.getElementById('nav-scrim');
  if(scrim) scrim.onclick = function(){ document.body.classList.remove('nav-open'); };

  const switchBtn = document.getElementById('switch-user-btn');
  if(switchBtn) switchBtn.addEventListener('click', function(){
    if(!confirm('Sign out of Vantage on this device?')) return;
    signOut();
    STATE.login = {step: 'email', email: '', error: null, busy: false};
    render();
  });

  /* Alert strip */
  on('[data-retry-save]', 'click', async function(){
    const pending = STATE.saveError;
    if(!pending) return;
    STATE.saveError = null;
    render();
    try{ await pending.retry(); toast('Saved on retry'); await reloadAll(true); }
    catch(err){ /* mutate() has already re-recorded the failure */ render(); }
  });
  on('[data-dismiss-save]', 'click', function(){ STATE.saveError = null; render(); });
  on('[data-refresh-now]', 'click', function(){ reloadAll(false); });
  on('[data-connection-check]', 'click', async function(e){
    const btn = e.currentTarget;
    const out = document.getElementById('settings-check-out');
    if(!out) return;
    btn.disabled = true;
    out.style.display = 'block';
    out.textContent = 'Running two probes…';
    try{
      out.textContent = (await connectionCheck()).join('\n');
    }catch(err){
      out.textContent = 'The check itself failed: ' + String(err.message || err);
    }
    btn.disabled = false;
  });
  on('[data-forget-code]', 'click', function(){
    if(!confirm('Forget the access code on this device? You will be asked for it again next time.')) return;
    setAccessCode('');
    STATE.needsAccessCode = true;
    STATE.unlockError = null;
    STATE.modal = null;
    render();
  });
  on('[data-reload-activity]', 'click', function(){ loadActivity(); });
  on('[data-undo-import]', 'click', async function(e){
    const key = attr(e.currentTarget, 'data-undo-import');
    const batch = (STATE.importBatches || []).filter(function(b){ return b.key === key; })[0];
    if(!batch) return;
    if(!confirm('Remove ' + batch.removable + ' of the ' + batch.total + ' records from this import?\n\n' +
      (batch.blocked ? batch.blocked + ' will be kept because they have progressed or are too old.\n\n' : '') +
      'This cannot be undone.')) return;
    try{
      const res = await mutate('Undoing import…', 'undoImportBatch', {key: key}, {});
      await reloadAll(true);
      STATE.importBatches = null;
      loadImportBatches();
      toast(res.removed + ' ' + pluralize(res.removed, 'record') + ' removed' +
        (res.kept && res.kept.length ? ', ' + res.kept.length + ' kept' : ''));
    }catch(err){ render(); }
  });

  /* Openers */
  on('[data-open-new]', 'click', function(){
    STATE.modal = 'new'; STATE.modalError = null; STATE.detail = null;
    document.body.classList.remove('nav-open');
    render();
  });
  on('[data-open-bulk]', 'click', function(){
    STATE.modal = 'bulk'; STATE.modalError = null;
    document.body.classList.remove('nav-open');
    render();
  });
  on('[data-open-detail]', 'click', function(e){ openDetail(attr(e.currentTarget, 'data-open-detail')); });
  on('[data-edit-opp]', 'click', async function(e){
    const id = attr(e.currentTarget, 'data-edit-opp');
    await ensureDetail(id);
    STATE.modal = {type: 'edit', id: id}; STATE.modalError = null;
    render();
  });
  on('[data-send-quote]', 'click', function(e){
    STATE.modal = {type: 'sendQuote', id: attr(e.currentTarget, 'data-send-quote')};
    STATE.modalError = null; render();
  });
  on('[data-duplicate-quote]', 'click', async function(e){
    const id = attr(e.currentTarget, 'data-duplicate-quote');
    await ensureDetail(id);
    STATE.modal = {type: 'duplicate', id: id}; STATE.modalError = null; render();
  });
  on('[data-email-quote]', 'click', async function(e){
    const id = attr(e.currentTarget, 'data-email-quote');
    await ensureDetail(id);
    STATE.modal = {type: 'email', id: id}; STATE.modalError = null; render();
  });
  on('[data-open-lost]', 'click', function(e){
    STATE.modal = {type: 'lost', id: attr(e.currentTarget, 'data-open-lost')}; STATE.modalError = null; render();
  });
  on('[data-open-so]', 'click', function(e){
    STATE.modal = {type: 'so', id: attr(e.currentTarget, 'data-open-so')}; STATE.modalError = null; render();
  });
  on('[data-open-invoice]', 'click', function(e){
    STATE.modal = {type: 'invoice', id: attr(e.currentTarget, 'data-open-invoice')}; STATE.modalError = null; render();
  });
  on('[data-open-reopen]', 'click', function(e){
    STATE.modal = {type: 'reopen', id: attr(e.currentTarget, 'data-open-reopen')}; STATE.modalError = null; render();
  });
  on('[data-edit-member]', 'click', function(e){
    STATE.modal = {type: 'member', userId: attr(e.currentTarget, 'data-edit-member')};
    STATE.modalError = null; render();
  });
  on('[data-open-validity]', 'click', async function(e){
    const id = attr(e.currentTarget, 'data-open-validity');
    await ensureDetail(id);
    STATE.modal = {type: 'validity', id: id};
    STATE.modalError = null;
    render();
  });
  on('[data-export-csv]', 'click', function(){ document.body.classList.remove('nav-open'); exportOpportunitiesCsv(); });
  on('[data-export-lines]', 'click', function(){ document.body.classList.remove('nav-open'); exportWithLineItemsCsv(); });

  /* Modal chrome */
  on('[data-close-modal]', 'click', closeModal);
  on('[data-close-overlay]', 'click', function(e){ if(e.target === e.currentTarget) closeModal(); });
  on('[data-stop]', 'click', function(e){ e.stopPropagation(); });

  /* Filters */
  const q = document.getElementById('filter-q');
  if(q) q.addEventListener('input', function(){
    STATE.filters.q = q.value;
    resetPages();
    scheduleRender();
  });
  /* Every filter resets paging: staying on page 6 of a list that just shrank to
     one page shows an empty table for no visible reason. */
  [['filter-bg', 'bg'], ['filter-unit', 'unit'], ['filter-rep', 'rep'], ['filter-status', 'status'],
   ['filter-date-field', 'dateField'], ['filter-from', 'from'], ['filter-to', 'to']]
    .forEach(function(pair){
      const el = document.getElementById(pair[0]);
      if(!el) return;
      el.addEventListener('change', function(){
        STATE.filters[pair[1]] = el.value;
        resetPages();
        render();
      });
    });

  /* Sorting & paging */
  on('[data-sort]', 'click', function(e){
    const key = attr(e.currentTarget, 'data-sort');
    if(STATE.sort.key === key){
      STATE.sort.dir = STATE.sort.dir === 'asc' ? 'desc' : 'asc';
    }else{
      STATE.sort = {key: key, dir: 'asc'};
    }
    resetPages();
    render();
  });
  on('[data-page-view]', 'click', function(e){
    const view = attr(e.currentTarget, 'data-page-view');
    const step = Number(attr(e.currentTarget, 'data-page-step')) || 0;
    STATE.pages[view] = Math.max(1, pageOf(view) + step);
    render();
  });
  const pageSize = document.getElementById('page-size');
  if(pageSize) pageSize.addEventListener('change', function(){
    STATE.pageSize = Number(pageSize.value) || 25;
    resetPages();
    render();
  });

  wireOpportunityForm();
  wireSecondaryForms();
  wireRecordActions();
  wireDirectoryAndCompliance();
  wireBulk();
  wireEmail();
}

/* Search re-renders are debounced so a fast typist is not fighting the DOM.
   Focus and caret are restored by render() itself. */
let renderTimer = null;
function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 160);
}

/* ---------------- Opportunity form ---------------- */

function wireOpportunityForm(){
  const form = document.getElementById('opp-form');
  if(!form) return;
  const mode = attr(form, 'data-mode');
  const isEdit = mode === 'edit';
  const o = isEdit ? currentOpp() : null;

  const container = document.getElementById('line-items-container');
  if(container && !container.querySelector('.line-item-row')){
    const seed = (isEdit && STATE.detail && STATE.detail.lineItems) ? STATE.detail.lineItems : [];
    if(seed.length) seed.forEach(function(li){ addLineItemRow(li); });
    else addLineItemRow();
  }

  const addBtn = document.getElementById('add-line-item-btn');
  if(addBtn) addBtn.addEventListener('click', function(){ addLineItemRow(); });
  const ccy = document.getElementById('f-currency');
  if(ccy) ccy.addEventListener('change', recalcQuoteTotal);

  /* Business Unit and the rep list both follow the selected Business Group. */
  const bg = document.getElementById('f-bg');
  const bu = document.getElementById('f-bu');
  if(bg && bu) bg.addEventListener('change', function(){
    const units = businessUnitsAvailable(bg.value);
    bu.innerHTML = units.map(function(u){
      return '<option value="' + escapeHtml(u) + '">' + escapeHtml(u) + '</option>';
    }).join('');
    const rep = document.getElementById('f-rep');
    if(rep && rep.tagName === 'SELECT') rep.innerHTML = repOptionsFor(bg.value, STATE.session.name);
  });

  const email = document.getElementById('f-email');
  const emailHint = document.getElementById('email-hint');
  if(email && emailHint) email.addEventListener('blur', function(){
    if(email.value && !isValidEmail(email.value)){
      emailHint.textContent = 'That does not look like a valid email address.';
      emailHint.classList.add('danger');
    }else{
      emailHint.textContent = '';
      emailHint.classList.remove('danger');
    }
  });

  /* Book-without-quote swaps the line builder for an estimate and blocks
     Pipeline 1, since no Sales Order can exist without a quote. */
  const noQuote = document.getElementById('f-no-quote');
  if(noQuote) noQuote.addEventListener('change', function(){
    const on = noQuote.checked;
    document.getElementById('quote-items-block').style.display = on ? 'none' : 'block';
    document.getElementById('no-quote-block').style.display = on ? 'block' : 'none';
    const title = document.getElementById('form-title');
    const label = document.getElementById('form-submit-label');
    if(title) title.textContent = on ? 'Book opportunity' : 'Raise new quote';
    if(label) label.textContent = on ? 'Book opportunity' : 'Raise quote';
  });

  /* The bucket follows how long the quote has been out, which is what the
     P2/P3 labels and the aging charts mean. */
  const dateInput = document.getElementById('f-date');
  const pipelineSel = document.getElementById('f-pipeline');
  const pipelineHint = document.getElementById('pipeline-hint');
  if(dateInput && pipelineSel) dateInput.addEventListener('change', function(){
    if(isEdit && Number(o.pipeline) === 1) return;
    const age = daysBetween(dateInput.value, todayStr());
    if(age === null) return;
    const threshold = Number(STATE.settings.agingThresholdDays) || 30;
    const suggested = age > threshold ? '3' : '2';
    pipelineSel.value = suggested;
    if(pipelineHint){
      pipelineHint.textContent = age < 0
        ? 'That date is in the future — check it.'
        : 'This quote is ' + age + ' ' + pluralize(age, 'day') + ' old, so Pipeline ' + suggested + ' is suggested.';
    }
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const booked = noQuote && noQuote.checked;
    const emailVal = document.getElementById('f-email').value.trim();
    if(emailVal && !isValidEmail(emailVal)){
      STATE.modalError = 'The contact email is not a valid address. Correct it before saving.';
      render();
      return;
    }
    const repEl = document.getElementById('f-rep');
    const data = {
      customerName: document.getElementById('f-customer').value.trim(),
      partnerName: document.getElementById('f-partner').value.trim(),
      businessGroup: document.getElementById('f-bg').value,
      businessUnit: document.getElementById('f-bu').value,
      orderType: document.getElementById('f-order-type').value,
      deliveryTerms: document.getElementById('f-delivery').value.trim(),
      contactPerson: document.getElementById('f-contact').value.trim(),
      contactEmail: emailVal,
      currency: document.getElementById('f-currency').value,
      validityDays: document.getElementById('f-validity').value,
      dateRaised: document.getElementById('f-date').value,
      expectedCloseDate: document.getElementById('f-close').value,
      salesRep: repEl.value.trim(),
      probability: document.getElementById('f-prob').value,
      pipeline: document.getElementById('f-pipeline').value,
      lineItems: booked ? [] : collectLineItems(),
      estimatedValue: booked ? Number(document.getElementById('f-estimated').value) || 0 : undefined,
      quoteSent: !booked
    };
    if(!booked){
      if(!data.lineItems.length){
        STATE.modalError = 'Add at least one line item with a description' +
          (isEdit ? '. A zero price is fine.' : ', or tick "Book this opportunity without sending a quote yet". A zero price is fine.');
        render();
        return;
      }
      /* Say which line is short rather than dropping it on save. */
      const noQty = data.lineItems
        .map(function(li, i){ return {li: li, n: i + 1}; })
        .filter(function(entry){ return !(Number(entry.li.qty) > 0); });
      if(noQty.length){
        STATE.modalError = 'Line ' + noQty.map(function(e){ return e.n; }).join(', ') +
          ' needs a quantity greater than zero.';
        render();
        return;
      }
    }

    try{
      if(isEdit){
        const res = await mutate('Saving changes…', 'editOpportunity',
          {id: o.id, data: data}, {inModal: true});
        upsertOpportunity(res.opportunity);
        toast('Quote updated');
        /* Refetch rather than patch: the edit appends a history entry naming
           every changed field, and that entry should be visible immediately. */
        openDetail(o.id);
      }else{
        const res = await mutate('Saving…', 'createOpportunity',
          {data: data}, {inModal: true});
        upsertOpportunity(res.opportunity);
        closeModal();
        toast(booked
          ? 'Opportunity booked as ' + res.opportunity.placeholderRef + ' — send the quote when it is ready'
          : 'Quote ' + res.opportunity.quoteNumber + ' raised and logged');
      }
    }catch(err){ render(); }
  });
}

/* ---------------- Secondary forms ---------------- */

function wireSecondaryForms(){
  const sendForm = document.getElementById('send-quote-form');
  if(sendForm){
    const container = document.getElementById('line-items-container');
    if(container && !container.querySelector('.line-item-row')) addLineItemRow();
    const addBtn = document.getElementById('add-line-item-btn');
    if(addBtn) addBtn.addEventListener('click', function(){ addLineItemRow(); });
    const ccy = document.getElementById('f-currency');
    if(ccy) ccy.addEventListener('change', recalcQuoteTotal);
    sendForm.addEventListener('submit', async function(e){
      e.preventDefault();
      const id = modalId();
      const lineItems = collectLineItems();
      if(!lineItems.length){
        STATE.modalError = 'Add at least one line item with a quantity and a unit price.';
        render(); return;
      }
      try{
        const res = await mutate('Sending quote…', 'sendQuoteForOpportunity', {
          id: id, lineItems: lineItems,
          currency: document.getElementById('f-currency').value,
          validityDays: document.getElementById('f-validity').value
        }, {inModal: true});
        upsertOpportunity(res.opportunity);
        toast('Quote ' + res.opportunity.quoteNumber + ' sent and numbered');
        openDetail(id);
      }catch(err){ render(); }
    });
  }

  const dupForm = document.getElementById('duplicate-form');
  if(dupForm){
    const container = document.getElementById('line-items-container');
    if(container && !container.querySelector('.line-item-row')){
      const seed = (STATE.detail && STATE.detail.lineItems) || [];
      if(seed.length) seed.forEach(function(li){ addLineItemRow(li); });
      else addLineItemRow();
    }
    const addBtn = document.getElementById('add-line-item-btn');
    if(addBtn) addBtn.addEventListener('click', function(){ addLineItemRow(); });
    const ccy = document.getElementById('f-currency');
    if(ccy) ccy.addEventListener('change', recalcQuoteTotal);
    dupForm.addEventListener('submit', async function(e){
      e.preventDefault();
      const sourceId = modalId();
      const lineItems = collectLineItems();
      if(!lineItems.length){
        STATE.modalError = 'Add at least one line item with a quantity and a unit price.';
        render(); return;
      }
      try{
        const res = await mutate('Creating linked quote…', 'duplicateQuoteForPartner', {
          sourceId: sourceId,
          data: {
            customerName: document.getElementById('dup-customer').value.trim(),
            partnerName: document.getElementById('dup-partner').value.trim(),
            businessUnit: document.getElementById('dup-bu').value,
            orderType: document.getElementById('dup-order-type').value,
            deliveryTerms: document.getElementById('dup-delivery').value.trim(),
            currency: document.getElementById('f-currency').value,
            lineItems: lineItems
          }
        }, {inModal: true});
        upsertOpportunity(res.opportunity);
        toast('Linked quote ' + res.opportunity.quoteNumber + ' created');
        openDetail(res.opportunity.id);
      }catch(err){ render(); }
    });
  }

  const lostForm = document.getElementById('lost-form');
  if(lostForm){
    const reason = document.getElementById('lost-reason');
    const req = document.getElementById('lost-note-req');
    if(reason && req) reason.addEventListener('change', function(){
      req.textContent = reason.value === 'Other' ? '(required)' : '(optional)';
    });
    lostForm.addEventListener('submit', async function(e){
      e.preventDefault();
      const id = modalId();
      try{
        const res = await mutate('Closing…', 'markLost', {
          id: id,
          reasonCode: document.getElementById('lost-reason').value,
          reasonNote: document.getElementById('lost-note').value
        }, {inModal: true});
        upsertOpportunity(res.opportunity);
        toast(res.opportunity.customerName + ' marked closed lost');
        openDetail(id);
      }catch(err){ render(); }
    });
  }

  const soForm = document.getElementById('so-form');
  if(soForm) soForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const id = modalId();
    try{
      const res = await mutate('Recording…', 'raiseSalesOrder', {
        id: id, soNumber: document.getElementById('so-number').value
      }, {inModal: true});
      upsertOpportunity(res.opportunity);
      toast('Sales Order ' + res.opportunity.soNumber + ' recorded — moved to Pipeline 1');
      openDetail(id);
    }catch(err){ render(); }
  });

  const invForm = document.getElementById('invoice-form');
  if(invForm) invForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const id = modalId();
    try{
      const res = await mutate('Recording…', 'markInvoiced', {
        id: id, invoiceNumber: document.getElementById('invoice-number').value
      }, {inModal: true});
      upsertOpportunity(res.opportunity);
      toast(res.opportunity.customerName + ' invoiced — closed won');
      openDetail(id);
    }catch(err){ render(); }
  });

  const validityForm = document.getElementById('validity-form');
  if(validityForm){
    const daysSel = document.getElementById('qv-days');
    const until = document.getElementById('qv-until');
    const o = currentOpp();
    /* Show the date the customer will read, as it is chosen. */
    if(daysSel && until && o) daysSel.addEventListener('change', function(){
      const days = Number(daysSel.value);
      until.textContent = days
        ? fmtDate(expiryDateOf(Object.assign({}, o, {validityDays: days})))
        : '—';
    });
    validityForm.addEventListener('submit', async function(e){
      e.preventDefault();
      const id = modalId();
      const days = Number(document.getElementById('qv-days').value);
      if(!days){
        STATE.modalError = 'Choose how long the prices are valid before generating the document.';
        render();
        return;
      }
      try{
        const res = await mutate('Recording validity…', 'setQuoteValidity',
          {id: id, validityDays: days}, {inModal: true});
        upsertOpportunity(res.opportunity);
        STATE.modal = {type: 'detail', id: id};
        STATE.modalError = null;
        render();
        /* Print from the saved record, so document and Vantage cannot disagree. */
        generateQuoteDocument(id);
        toast('Quote document generated, valid ' + days + ' days');
      }catch(err){ render(); }
    });
  }

  const reopenForm = document.getElementById('reopen-form');
  if(reopenForm) reopenForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const id = modalId();
    try{
      const res = await mutate('Reopening…', 'reopenOpportunity', {
        id: id, pipeline: document.getElementById('reopen-pipeline').value
      }, {inModal: true});
      upsertOpportunity(res.opportunity);
      toast('Reopened into Pipeline ' + res.opportunity.pipeline);
      openDetail(id);
    }catch(err){ render(); }
  });

  const memberForm = document.getElementById('member-form');
  if(memberForm) memberForm.addEventListener('submit', async function(e){
    e.preventDefault();
    try{
      const res = await mutate('Saving…', 'updateTeamMember', {
        userId: STATE.modal.userId,
        data: {
          name: document.getElementById('mem-name').value,
          email: document.getElementById('mem-email').value,
          role: document.getElementById('mem-role').value,
          businessGroup: document.getElementById('mem-bg').value,
          businessUnit: document.getElementById('mem-bu').value
        }
      }, {inModal: true});
      upsertMember(res.member);
      /* A rename changes stored display names on their quotes, so pull fresh. */
      if(res.opportunitiesUpdated) await reloadAll(true);
      if(STATE.session && STATE.session.userId === res.member.userId){
        /* Editing your own row can change your name, role, group or address.
           A changed address invalidates the token, and the next call will send
           you back to sign-in — which is the correct outcome. */
        STATE.session = Object.assign({}, STATE.session, {
          name: res.member.name, email: res.member.email,
          role: res.member.role, businessGroup: res.member.businessGroup
        });
      }
      closeModal();
      toast('Team member updated' + (res.opportunitiesUpdated ? ' — ' + res.opportunitiesUpdated + ' quotes relabelled' : ''));
    }catch(err){ render(); }
  });

  const settingsForm = document.getElementById('settings-form');
  if(settingsForm) settingsForm.addEventListener('submit', async function(e){
    e.preventDefault();
    try{
      const res = await mutate('Saving settings…', 'saveSettings', {
                data: {
          fxRate: document.getElementById('set-fx').value,
          agingThresholdDays: document.getElementById('set-aging').value,
          lostDeleteAfterDays: document.getElementById('set-delete').value,
          repScope: document.getElementById('set-rep-scope').value
        }
      }, {});
      STATE.settings = res.settings;
      toast('Settings saved');
      render();
    }catch(err){ render(); }
  });
}

/* ---------------- Record actions ---------------- */

function wireRecordActions(){
  on('[data-reprofile-select]', 'change', async function(e){
    const el = e.currentTarget;
    if(!el.value) return;
    await doReprofile(attr(el, 'data-reprofile-select'), el.value);
  });
  on('[data-reprofile-to]', 'click', async function(e){
    const el = e.currentTarget;
    await doReprofile(attr(el, 'data-opp'), attr(el, 'data-reprofile-to'));
  });

  on('[data-add-note]', 'click', async function(e){
    const id = attr(e.currentTarget, 'data-add-note');
    const input = document.getElementById('new-note-input');
    if(!input || !input.value.trim()) return;
    const text = input.value.trim();
    try{
      const res = await mutate('Adding note…', 'addNote', {id: id, text: text}, {inModal: true});
      upsertOpportunity(res.opportunity);
      if(STATE.detail && STATE.detail.id === id){
        STATE.detail.notes = (STATE.detail.notes || []).concat([res.note]);
      }
      render();
    }catch(err){ render(); }
  });

  on('[data-delete-opp]', 'click', async function(e){
    const id = attr(e.currentTarget, 'data-delete-opp');
    const o = STATE.opportunities.filter(function(x){ return x.id === id; })[0];
    if(!o) return;
    if(!confirm('Permanently delete ' + displayRef(o) + ' — ' + o.customerName + ', ' +
      fmtMoney(o.value, o.currency) + '?\n\nIts line items, notes and history go with it. ' +
      'A record of the deletion stays in the Activity Log. This cannot be undone.')) return;
    try{
      await mutate('Deleting…', 'deleteOpportunity', {id: id}, {});
      STATE.opportunities = STATE.opportunities.filter(function(x){ return x.id !== id; });
      STATE.activity = null;
      closeModal();
      toast(displayRef(o) + ' deleted');
    }catch(err){ render(); }
  });

  on('[data-delete-lost]', 'click', async function(e){
    const id = attr(e.currentTarget, 'data-delete-lost');
    const o = STATE.opportunities.filter(function(x){ return x.id === id; })[0];
    if(!o) return;
    if(!confirm('Permanently delete the closed-lost opportunity ' + displayRef(o) + ' for ' + o.customerName +
      '?\n\nIts line items, notes and history go with it. A record of the deletion stays in the Activity Log. This cannot be undone.')) return;
    try{
      await mutate('Deleting…', 'deleteLostOpportunity', {id: id}, {});
      STATE.opportunities = STATE.opportunities.filter(function(x){ return x.id !== id; });
      if(STATE.activity) STATE.activity = null;
      toast(displayRef(o) + ' deleted');
      render();
    }catch(err){ render(); }
  });
}

async function doReprofile(id, pipeline){
  try{
    const res = await mutate('Reprofiling…', 'reprofileOpportunity',
      {id: id, pipeline: pipeline}, {inModal: !!STATE.modal});
    upsertOpportunity(res.opportunity);
    if(!res.unchanged) toast(res.opportunity.customerName + ' moved to Pipeline ' + res.opportunity.pipeline);
    render();
  }catch(err){ render(); }
}

/* ---------------- Directory & compliance ---------------- */

function wireDirectoryAndCompliance(){
  const atmBg = document.getElementById('atm-bg');
  const atmBu = document.getElementById('atm-bu');
  const atmRole = document.getElementById('atm-role');
  if(atmBg && atmBu) atmBg.addEventListener('change', function(){
    const units = STATE.refData.businessUnitMap[atmBg.value] || [];
    atmBu.innerHTML = units.map(function(bu){
      return '<option value="' + escapeHtml(bu) + '">' + escapeHtml(bu) + '</option>';
    }).join('');
  });
  /* Only a rep is pinned to a unit, so grey it out for the others rather than
     letting someone set a value that will be ignored. */
  if(atmRole && atmBu){
    const syncUnitEnabled = function(){
      atmBu.disabled = atmRole.value !== 'rep';
    };
    atmRole.addEventListener('change', syncUnitEnabled);
    syncUnitEnabled();
  }

  const memBg = document.getElementById('mem-bg');
  const memBu = document.getElementById('mem-bu');
  const memRole = document.getElementById('mem-role');
  if(memBg && memBu) memBg.addEventListener('change', function(){
    const units = STATE.refData.businessUnitMap[memBg.value] || [];
    memBu.innerHTML = '<option value="">— Whole group (Heads and Admins) —</option>' +
      units.map(function(bu){ return '<option value="' + escapeHtml(bu) + '">' + escapeHtml(bu) + '</option>'; }).join('');
  });
  if(memRole && memBu){
    const syncMemUnit = function(){ memBu.disabled = memRole.value !== 'rep'; };
    memRole.addEventListener('change', syncMemUnit);
    syncMemUnit();
  }

  const addMember = document.getElementById('add-member-form');
  if(addMember) addMember.addEventListener('submit', async function(e){
    e.preventDefault();
    const nameEl = document.getElementById('atm-name');
    try{
      const res = await mutate('Adding…', 'addTeamMember', {
                data: {
          name: nameEl.value,
          email: document.getElementById('atm-email').value,
          role: document.getElementById('atm-role').value,
          businessGroup: document.getElementById('atm-bg').value,
          businessUnit: document.getElementById('atm-bu').value
        }
      }, {});
      upsertMember(res.member);
      nameEl.value = '';
      document.getElementById('atm-email').value = '';
      toast(res.member.name + ' added — they can now enter Vantage');
      render();
    }catch(err){ render(); }
  });

  on('[data-disable-user]', 'click', async function(e){
    const userId = attr(e.currentTarget, 'data-disable-user');
    const m = STATE.directory.filter(function(d){ return d.userId === userId; })[0];
    if(!m || !confirm('Disable ' + m.name + '\'s access to Vantage? Their quotes and history stay intact.')) return;
    await setMemberStatus(userId, 'disabled');
  });
  on('[data-enable-user]', 'click', function(e){
    setMemberStatus(attr(e.currentTarget, 'data-enable-user'), 'active');
  });

  const leakForm = document.getElementById('leak-form');
  if(leakForm) leakForm.addEventListener('submit', async function(e){
    e.preventDefault();
    try{
      const res = await mutate('Logging…', 'logLeakage', {
                data: {
          soNumber: document.getElementById('lk-so').value,
          customerName: document.getElementById('lk-customer').value,
          businessGroup: document.getElementById('lk-bg').value,
          currency: document.getElementById('lk-currency').value,
          value: document.getElementById('lk-value').value,
          note: document.getElementById('lk-note').value
        }
      }, {});
      upsertLeak(res.leak);
      toast('Off-platform order ' + res.leak.soNumber + ' logged for follow-up');
      render();
    }catch(err){ render(); }
  });

  on('[data-resolve-leak]', 'click', function(e){ setLeakResolved(attr(e.currentTarget, 'data-resolve-leak'), true); });
  on('[data-unresolve-leak]', 'click', function(e){ setLeakResolved(attr(e.currentTarget, 'data-unresolve-leak'), false); });
  on('[data-delete-leak]', 'click', async function(e){
    const id = attr(e.currentTarget, 'data-delete-leak');
    const l = STATE.leakage.filter(function(x){ return x.id === id; })[0];
    if(!l || !confirm('Remove the compliance entry for ' + l.soNumber + '? This cannot be undone.')) return;
    try{
      await mutate('Deleting…', 'deleteLeakage', {id: id}, {});
      STATE.leakage = STATE.leakage.filter(function(x){ return x.id !== id; });
      toast('Entry removed');
      render();
    }catch(err){ render(); }
  });
}

async function setMemberStatus(userId, status){
  try{
    const res = await mutate('Updating access…', 'setUserStatus',
      {userId: userId, status: status}, {});
    upsertMember(res.member);
    toast(res.member.name + ' ' + (status === 'disabled' ? 'disabled' : 'enabled'));
    render();
  }catch(err){ render(); }
}
async function setLeakResolved(id, resolved){
  try{
    const res = await mutate('Updating…', 'setLeakageResolved',
      {id: id, resolved: resolved}, {});
    upsertLeak(res.leak);
    render();
  }catch(err){ render(); }
}

/* ---------------- Bulk upload ---------------- */

function wireBulk(){
  const templateBtn = document.getElementById('bulk-template-btn');
  if(templateBtn) templateBtn.addEventListener('click', downloadBulkTemplate);

  const fileInput = document.getElementById('bulk-file');
  if(fileInput) fileInput.addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) handleBulkFile(e.target.files[0]);
  });

  const importBtn = document.getElementById('bulk-import-btn');
  if(importBtn) importBtn.addEventListener('click', async function(){
    if(!BULK_READY.length) return;
    importBtn.disabled = true;
    importBtn.innerHTML = '<span class="spinner"></span>Importing…';
    const count = BULK_READY.length;
    try{
      const res = await mutate('Importing ' + count + ' ' + pluralize(count, 'quote') + '…',
        'bulkCreateOpportunities', {groups: BULK_READY}, {inModal: true});
      BULK_READY = [];
      await reloadAll(true);
      closeModal();
      if(res.rejected && res.rejected.length){
        toast(res.created + ' imported; ' + res.rejected.length + ' rejected by validation — ' +
          res.rejected[0].rowLabel + ': ' + res.rejected[0].message, true);
      }else{
        toast(res.created + ' ' + pluralize(res.created, 'quote') + ' imported into Vantage');
      }
    }catch(err){ render(); }
  });
}

/* ---------------- Email ---------------- */

function wireEmail(){
  const btn = document.getElementById('send-email-btn');
  if(!btn) return;
  const o = currentOpp();
  const recipients = document.getElementById('recipients-container');
  if(recipients && !recipients.querySelector('[data-recipient-row]')){
    addRecipientRow('recipients-container', o && o.contactEmail ? o.contactEmail : '');
  }
  const addR = document.getElementById('add-recipient-btn');
  if(addR) addR.addEventListener('click', function(){ addRecipientRow('recipients-container'); });
  const addC = document.getElementById('add-cc-btn');
  if(addC) addC.addEventListener('click', function(){ addRecipientRow('cc-container'); });

  btn.addEventListener('click', async function(){
    const to = collectRecipients('recipients-container');
    const cc = collectRecipients('cc-container');
    if(!to.length){
      STATE.modalError = 'Add at least one recipient before opening your email app.';
      render(); return;
    }
    const bad = to.concat(cc).filter(function(a){ return !isValidEmail(a); });
    if(bad.length){
      STATE.modalError = 'These addresses do not look valid: ' + bad.join(', ');
      render(); return;
    }
    const subject = document.getElementById('email-subject').value;
    const body = document.getElementById('email-body').value;
    const id = modalId();

    /* Open the mail client first: if logging fails we have still done the
       thing the user asked for, and the failure is reported separately. */
    const mailto = 'mailto:' + encodeURIComponent(to.join(',')) +
      '?' + (cc.length ? 'cc=' + encodeURIComponent(cc.join(',')) + '&' : '') +
      'subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    window.open(mailto, '_blank');

    try{
      const res = await mutate('Logging…', 'logQuoteEmailed',
        {id: id, to: to, cc: cc}, {inModal: true});
      upsertOpportunity(res.opportunity);
      toast('Email app opened for ' + to.length + ' ' + pluralize(to.length, 'recipient') +
        ' — attach the quote document before sending');
      openDetail(id);
    }catch(err){ render(); }
  });
}

/* ---------------- Live refresh ----------------
   The Sheet is shared, so another user's change can land at any time. Rather
   than silently overwriting what is on screen, Vantage polls the revision
   counter and offers to pull the change in. */

let pollTimer = null;
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
function startPolling(){
  stopPolling();
  pollTimer = setInterval(async function(){
    if(document.hidden || STATE.busy || STATE.modalBusy || STATE.needsAccessCode) return;
    try{
      const rev = await rpc('getRevision');
      if(rev && rev !== STATE.revision && rev !== STATE.staleRevision){
        STATE.staleRevision = rev;
        /* Record it, but do not redraw while someone is filling in a form.
           render() rebuilds the whole page, so a colleague saving anything used
           to wipe an open quote mid-entry. The notice appears once the form is
           closed, where it can actually be seen and acted on. */
        if(!STATE.modal) render();
      }
    }catch(err){
      /* A dropped poll is not worth interrupting anyone over — but a rejected
         access code will never fix itself, so stop polling and ask for it. */
      if(err && err.accessCodeRequired){
        clearInterval(pollTimer);
        pollTimer = null;
        setAccessCode('');
        STATE.needsAccessCode = true;
        STATE.unlockError = 'The access code has changed. Enter the new one to carry on.';
        render();
      }
    }
  }, 45000);
}

/* ---------------- Boot ---------------- */

async function boot(){
  /* A published copy with no backend set is a mistake by whoever deployed it,
     not something a salesperson can fix — so say so in those terms. */
  if(!isConfigured()){
    STATE.loading = false;
    STATE.fatalError = backendUrl()
      ? 'VANTAGE_BACKEND_URL in this file is not a valid Apps Script Web App address. ' +
        'It must start with https://script.google.com/macros/s/ and end with /exec.'
      : 'This copy of Vantage has not been pointed at the company Google Sheet yet. ' +
        'Whoever published it needs to set VANTAGE_BACKEND_URL near the top of vantage.html.';
    render();
    return;
  }
  STATE.needsAccessCode = false;
  STATE.loading = true;
  STATE.fatalError = null;
  render();

  try{
    if(sessionToken()){
      try{
        const data = await rpc('getBootstrap');
        /* No `me` means the backend accepted the token but did not say who it
           belongs to — an older Code.gs that ignores the payload. Bouncing to
           the sign-in screen would just loop, so name the real cause. */
        if(!data || !data.me || !data.me.userId){
          throw new Error('The backend accepted your sign-in but did not return who you are. ' +
            'Its Code.gs is older than this page expects — republish the Web App as a new version.');
        }
        applyBootstrap(data);
        /* Identity comes from the server's reading of the token. */
        STATE.session = data.me;
        STATE.login = null;
        STATE.loading = false;
        STATE.bootstrapped = true;
        render();
        startPolling();
        return;
      }catch(err){
        if(!(err && err.sessionInvalid)) throw err;
        /* Token no longer good — fall through to sign-in. */
      }
    }

    const ctx = await rpc('getLoginContext');
    STATE.loading = false;
    STATE.login = {
      step: ctx.needsBootstrap ? 'bootstrap' : 'email',
      email: (STATE.login && STATE.login.email) || '',
      error: (STATE.login && STATE.login.error) || null,
      busy: false
    };
    render();
  }catch(err){
    STATE.loading = false;
    if(err && err.accessCodeRequired){
      STATE.needsAccessCode = true;
      if(accessCode()){
        setAccessCode('');
        STATE.unlockError = 'The code saved on this device was not accepted. Enter the current one.';
      }
    }else if(!(err && err.sessionInvalid)){
      STATE.fatalError = String(err.message || err);
    }
    render();
  }
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && STATE.modal && !STATE.modalBusy) closeModal();
});

/* The test harness loads this file to exercise the pure logic and sets this
   flag so the app does not try to reach a backend. */
if(!window.__VANTAGE_TEST) boot();
</script>
