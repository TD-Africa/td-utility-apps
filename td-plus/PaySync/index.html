/* ---------------- Bulk payslip delivery ----------------
   Four stages, because sending payslips to hundreds of people is irreversible
   and slow enough that silence would be alarming: work out what will happen,
   show it, send in batches with visible progress, then report per person. */
function modalBulkPayslip(m){
  if(m.stage === 'loading'){
    return modalShell({
      cls:'narrow', title:'Email payslips',
      body:'<div class="empty">Working out who these will go to…</div>'
    });
  }

  const pv = m.preview;
  const n = pv.counts.sendable;

  if(m.stage === 'sending' || m.stage === 'done'){
    const p = m.progress;
    const done = m.stage === 'done';
    const pctDone = p.total ? Math.round((p.attempted / p.total) * 100) : 100;
    return modalShell({
      cls:'narrow',
      title: done ? 'Payslips sent' : 'Sending payslips…',
      sub: pv.label,
      noClose: !done,
      body:
        '<div class="rec" style="margin:0 0 12px">' +
          '<div class="rr"><span class="rlbl">Sent</span><span class="rval" ' +
            'style="color:var(--grn)">' + p.sent + '</span></div>' +
          (p.failed ? '<div class="rr var"><span class="rlbl">Failed</span>' +
            '<span class="rval var">' + p.failed + '</span></div>' : '') +
          '<div class="rr"><span class="rlbl">Remaining</span><span class="rval">' +
            Math.max(0, p.total - p.attempted) + '</span></div>' +
        '</div>' +
        '<div class="buc-bar" style="height:8px"><div class="buc-fill" style="height:8px;width:' +
          pctDone + '%;background:var(--grn)"></div></div>' +
        (done ? '' : '<p style="margin-top:10px;color:var(--t2)">Leave this open. Sending in ' +
          'batches of ' + pv.batchSize + ' so nothing times out — anyone already sent stays ' +
          'sent even if this stops.</p>') +
        (m.error ? '<div class="alert err" style="margin-top:12px"><div><strong>The batch stopped.' +
          '</strong><br>' + esc(m.error) + '<br><br>Nobody has been sent twice — every send is ' +
          'logged, so starting again picks up only those still outstanding.</div></div>' : '') +
        (m.failures.length
          ? '<div class="note red" style="margin-top:12px"><strong>These did not go out:</strong>' +
            '<ul style="margin:6px 0 0 18px">' + m.failures.slice(0, 12).map(function(f){
              return '<li>' + esc(f.name || f.emp_no) + ' — ' + esc(f.error) + '</li>';
            }).join('') + '</ul>' +
            (m.failures.length > 12 ? '<div style="margin-top:6px">…and ' +
              (m.failures.length - 12) + ' more. The full list is on the PayslipSends tab.</div>' : '') +
            '</div>'
          : '') +
        (done && !m.failures.length && !m.error
          ? '<div class="note green" style="margin-top:12px">All ' + p.sent + ' went out. ' +
            'Each one is recorded, so sending again will not post a duplicate.</div>'
          : ''),
      footer: done
        ? '<button class="btn btn-f" data-act="close-modal">Done</button>'
        : '<span class="left">Do not close this window</span>'
    });
  }

  /* ── the preview ── */
  const needsConfirm = n > 50;
  const list = function(title, rows, tone, extra){
    if(!rows.length) return '';
    return '<div class="note ' + tone + '" style="margin-bottom:10px"><strong>' + esc(title) +
      '</strong>' + (extra ? ' ' + extra : '') +
      '<ul style="margin:6px 0 0 18px;max-height:130px;overflow:auto">' +
      rows.slice(0, 40).map(function(r){
        return '<li>' + esc(r.name || r.emp_no) + ' (' + esc(r.emp_no) + ')' +
          (r.sentAt ? ' — sent ' + esc(shortDate(r.sentAt)) : '') + '</li>';
      }).join('') +
      (rows.length > 40 ? '<li>…and ' + (rows.length - 40) + ' more</li>' : '') +
      '</ul></div>';
  };

  return modalShell({
    cls:'narrow',
    title:'Email payslips — ' + pv.label,
    sub: n ? n + ' will be sent' : 'Nothing to send',
    body:
      pv.warnings.map(function(w){
        return '<div class="note amber" style="margin-bottom:10px">' + esc(w) + '</div>';
      }).join('') +
      (n
        ? '<div class="note green" style="margin-bottom:10px"><strong>' + n + ' payslip' +
          (n === 1 ? '' : 's') + ' will be emailed</strong> for ' + esc(pv.label) +
          ', each to the address on that person’s staff record.</div>'
        : '<div class="note grey" style="margin-bottom:10px">Nobody in this selection can be sent ' +
          'a payslip right now. The reasons are below.</div>') +
      list('No email address on file — these will be skipped', pv.noEmail, 'red',
        'Add an address on the staff record to include them.') +
      list('Already received a payslip for this period', pv.alreadySent, 'grey',
        'Left out unless you tick the box below.') +
      list('Being sent by someone else right now', pv.inFlight, 'amber',
        'Wait for their batch to finish.') +
      list('Not on this period’s register', pv.unknown, 'amber', '') +
      (pv.counts.alreadySent
        ? '<div class="fld" style="margin-bottom:10px"><label><input type="checkbox" id="bp-resend"' +
          (m.resend ? ' checked' : '') + ' data-act="bulk-resend"> Send again to the ' +
          pv.counts.alreadySent + ' who already have one</label>' +
          '<span class="hint">Only for a corrected payslip — they will receive a second email.</span>' +
          '</div>'
        : '') +
      (needsConfirm
        ? '<div class="fld"><label><input type="checkbox" id="bp-confirm"> I have checked the ' +
          'figures — send ' + n + ' payslips</label></div>'
        : ''),
    footer:
      (n ? busyBtn('Send ' + n + ' payslip' + (n === 1 ? '' : 's'), 'bulk-payslip-send') : '') +
      '<button class="btn btn-ghost" data-act="close-modal">' + (n ? 'Cancel' : 'Close') + '</button>'
  });
}

async function openBulkPayslip(resend){
  STATE.modal = {kind:'bulkPayslip', stage:'loading', resend:!!resend,
    batchId:'', progress:null, failures:[], error:null};
  render();
  try{
    const pv = await rpc('previewPayslipBatch',
      {period:STATE.period, emp_nos:selectedEmpNos(), resend:!!resend});
    if(!STATE.modal || STATE.modal.kind !== 'bulkPayslip') return;
    STATE.modal.preview = pv;
    STATE.modal.stage = 'preview';
  }catch(err){
    STATE.modal = null;
    toast(String(err.message || err), true);

/* Loops the server's batch endpoint until nothing is left. Each call is a
   write and is never retried automatically — a lost reply is reported, and
   because every send is logged, starting again resumes rather than repeats. */
async function runBulkPayslipSend(){
  const m = STATE.modal;
  const empNos = m.preview.sendable.map(function(s){ return s.emp_no; });
  m.batchId = 'BPS-' + STATE.period.replace('-', '') + '-' +
    Math.random().toString(36).slice(2, 8).toUpperCase();
  m.stage = 'sending';
  m.progress = {sent:0, failed:0, attempted:0, total:empNos.length};
  m.failures = [];
  m.error = null;
  render();

  let guard = 0;
  try{
    while(guard++ < 400){
      const res = await rpc('sendPayslipBatch', {
        period: STATE.period, emp_nos: empNos, batchId: m.batchId, resend: m.resend
      });
      m.progress.sent += res.sent;
      m.progress.attempted += res.attempted;
      m.progress.failed += res.failed.length;
      res.failed.forEach(function(f){ m.failures.push(f); });
      if(res.revision) STATE.revision = res.revision;
      render();
      if(res.remaining === 0) break;
      /* Nothing moved — everything left is claimed by another batch, or the
         quota has run out. Stop rather than spin. */
      if(res.attempted === 0){
        m.error = 'Stopped with ' + res.remaining + ' still to send. They are either part of ' +
          'another batch running right now, or the daily email quota has run out. Nothing has ' +
          'been sent twice — try again later and it will pick up where it left off.';
        break;
      }
    }
  }catch(err){
    m.error = String(err.message || err);
  }
  m.stage = 'done';
  render();
  /* Refresh so the register shows who now has a payslip. */
  await loadPeriod(STATE.period, true);
}

/* Recomputed as you type, from the same effect flags the server uses, so the
   figure on screen is the figure that will be applied. */
function fieldChangePreview(m){
  const e = staffIndex()[m.emp_no] || {};
  const spec = REGISTER_FIELDS[m.register] || [];
  const isPay = m.register === 'payroll';
  let net = 0;
  let touched = 0;
  spec.forEach(function(f){
    const el = document.getElementById('fc-' + f.field);
    const v = el && el.value !== '' ? Number(el.value) : 0;
    if(!v || isNaN(v)) return;
    touched++;
    if(f.effect === 'earn') net += v;
    else if(f.effect === 'ded') net -= v;
  });
  if(!touched) return 'Nothing entered yet.';
  const before = Number(isPay ? e.netPay : e.netSecurity) || 0;
  return '<strong>' + touched + ' element' + (touched === 1 ? '' : 's') + ' changed.</strong> ' +
    'Net ' + (isPay ? 'payroll' : 'security') + ' ' +
    (net >= 0 ? 'rises' : 'falls') + ' by <strong>' + esc(money(Math.abs(net))) + '</strong> — ' +
    esc(money(before)) + ' → <strong>' + esc(money(before + net)) + '</strong>.';
}

/* ============================================================
   CSV EXPORT
   ------------------------------------------------------------
   Every export honours the filters actually on screen and the columns actually
   shown (gap G2). The prototype exported all 317 staff and the same nine
   columns whichever register you were on, so the payroll and security detail
   could not be exported at all.

   A UTF-8 BOM is written so Excel renders ₦ rather than mojibake.
   ============================================================ */
function downloadCsv(filename, rows, opts){
  const o = opts || {};
  const csv = rows.map(function(r){
    return r.map(function(v){
      const s = (v === null || v === undefined) ? '' : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\r\n');
  /* Excel needs the BOM to render ₦; a machine-read import does not want it
     sitting inside the first column name. */
  const blob = new Blob([(o.bom === false ? '' : '﻿') + csv],
    {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* The same journal in the shape Dynamics 365's general journal import expects.
   Its columns, their order and their spelling are fixed by D365, so the file is
   built from the column list the server sends rather than assembled here — the
   two cannot drift.

   Deliberately written without a UTF-8 BOM, unlike the other exports. Those are
   opened in Excel and need it for the naira sign; this one is read by an
   importer, where a BOM would land inside the first column name. */
async function exportD365(){
  STATE.busy = 'Building the D365 file';
  render();
  try{
    const f = STATE.jnl;
    const res = await rpc('getD365Export', {
      period: STATE.period,
      filters: {q:f.q, category:f.category, section:f.section, businessUnit:f.businessUnit}
    });
    const out = [res.columns];
    res.rows.forEach(function(r){

      stamp() + (res.batchRef ? '_' + res.batchRef : '_DRAFT') + '.csv', out, {bom:false});

      (res.source === 'posted' ? ' — batch ' + res.batchRef : ' as a draft') + '.' +
      (res.missingAccount ? ' ' + res.missingAccount + ' have no loan account.' : ''));
  }catch(err){

  }finally{
    STATE.busy = null;
    render();
  }
}

async function exportHistory(){
  STATE.busy = 'Building the audit export';
  render();
  try{
    const f = STATE.hist;
    const all = [];
    let page = 1;
    let pageCount = 1;
    /* Paged out of the server rather than asking for everything at once — the
       audit trail grows without bound by design. */
    do{
      const res = await rpc('getHistoryPage', {
        page: page, pageSize: 1000,
        filters: {q:f.q, entity:f.entity, action:f.action, actorId:f.actorId, from:f.from, to:f.to}
      });
      pageCount = res.pageCount;
      res.rows.forEach(function(r){ all.push(r); });
      page++;
    }while(page <= pageCount && page <= 25);

    const out = [['PaySync audit trail', 'Exported ' + new Date().toISOString(),
        all.length + ' entries'],
      ['When','Who','Role','Period','Record type','Reference','Action','Detail','Was','Became']];
    all.forEach(function(h){
      out.push([h.ts, h.actor, h.actorRole, h.period, h.entity, h.entityId, h.action,
        h.detail, h.oldValue, h.newValue]);
    });
    downloadCsv('PaySync_audit_' + stamp() + '.csv', out);
    toast(all.length + ' audit entries exported.');
  }catch(err){
    toast(String(err.message || err), true);
  }finally{
    STATE.busy = null;
    render();
  }
}

function exportChanges(){
  const idx = staffIndex();
  const f = STATE.chg;
  let rows = STATE.movements.slice();
  if(!f.showReversed) rows = rows.filter(function(m){ return !m.reversedAt; });
  if(f.type) rows = rows.filter(function(m){ return m.type === f.type; });
  if(f.q){
    const q = f.q.toUpperCase();
    rows = rows.filter(function(m){
      const e = idx[m.emp_no] || {};
      return (m.emp_no || '').toUpperCase().indexOf(q) >= 0 ||
        ((m.name || e.name) || '').toUpperCase().indexOf(q) >= 0 ||
        (m.reason || '').toUpperCase().indexOf(q) >= 0;
    });

  const out = [['PaySync movements', periodLabel(STATE.period), 'Exported ' + new Date().toISOString(),
      rows.length + ' rows'],
    ['#','Source','Period','Emp no','Name','Business unit','Org','Type','Payroll','Security','Reason',
      'Staff status set','Recorded by','Recorded at','Reversed by','Reversed at','Reversal reason']];
  rows.sort(function(a, b){
    if(!!a.derived !== !!b.derived) return a.derived ? -1 : 1;

  }).forEach(function(m){
    const e = idx[m.emp_no] || {};

      m.period, m.emp_no, m.name || e.name || '', e.bus_unit || '', e.org || '', m.type,
      Number(m.pay || 0).toFixed(2), Number(m.sec || 0).toFixed(2), m.reason, m.staffStatus || '',

}

/* ============================================================
   ACTIONS
   ============================================================ */
function scopeOf(path){
  if(!path) return null;
  if(path.indexOf('reg.') === 0) return STATE.reg[path.slice(4)];
  if(STATE.reg[path]) return STATE.reg[path];
  return STATE[path];
}
function val(id){
  const e = document.getElementById(id);
  return e ? e.value.trim() : '';
}
function numVal(id){
  const e = document.getElementById(id);
  if(!e || e.value === '') return '';
  return Number(e.value);
}
function checked(id){
  const e = document.getElementById(id);
  return !!(e && e.checked);
}
function closeModal(){
  STATE.modal = null;
  STATE.modalError = null;
  render();
}

/* One delegated listener for the whole application. Every button carries
   data-act, so nothing depends on a handler surviving a re-render. */
document.addEventListener('click', function(ev){
  /* Selection checkboxes are handled here rather than on 'change', so the
     click never bubbles into a row action and the state lands before the
     re-render reads it back. */
  const pick = ev.target.getAttribute && ev.target.getAttribute('data-pick');
  if(pick !== null && pick !== undefined){
    if(ev.target.checked) STATE.sel[pick] = true; else delete STATE.sel[pick];
    render();
    return;
  }
  const pickPage = ev.target.getAttribute && ev.target.getAttribute('data-pick-page');
  if(pickPage){
    const f = STATE.reg[pickPage];
    const page = paginate(filteredStaff(pickPage), f).rows;
    const turningOn = ev.target.checked;
    page.forEach(function(e){
      if(turningOn) STATE.sel[e.emp_no] = true; else delete STATE.sel[e.emp_no];
    });
    render();
    return;
  }
  const nav = ev.target.closest('[data-nav]');
  if(nav){
    STATE.view = nav.getAttribute('data-nav');
    render();
    return;
  }
  const pageBtn = ev.target.closest('[data-page]');
  if(pageBtn && !pageBtn.disabled){
    const parts = pageBtn.getAttribute('data-page').split(':');
    const scope = scopeOf(parts[0]);
    if(scope){ scope.page = Number(parts[1]); render(); }
    return;
  }
  const sortTh = ev.target.closest('[data-sort]');
  if(sortTh){
    const parts = sortTh.getAttribute('data-sort').split(':');
    const scope = scopeOf(parts[0]);
    if(scope){
      if(scope.sort === parts[1]) scope.dir = -scope.dir;
      else{ scope.sort = parts[1]; scope.dir = 1; }
      scope.page = 1;
      render();
    }
    return;
  }
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  const raw = el.getAttribute('data-act');
  const idx = raw.indexOf(':');
  const act = idx < 0 ? raw : raw.slice(0, idx);
  const arg = idx < 0 ? '' : raw.slice(idx + 1);
  handleAction(act, arg, ev, el);
});

/* Enter submits the sign-in steps — a code screen you have to reach for the
   mouse on is a code screen people mistype. */
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape' && STATE.modal && !STATE.modalBusy){
    if(STATE.modal.kind === 'bulkPayslip' && STATE.modal.stage === 'sending') return;
    closeModal();
    return;
  }
  if(ev.key !== 'Enter') return;
  if(!STATE.session){
    if(STATE.login.step === 'email') handleAction('request-otp');
    else if(STATE.login.step === 'code') handleAction('verify-otp');
    else if(STATE.login.step === 'bootstrap') handleAction('bootstrap-admin');
  }else if(STATE.needsAccessCode){
    handleAction('unlock');
  }
});

/* Filter inputs are debounced so a 317-row re-render does not fight the
   keyboard, and the value lives in STATE rather than the DOM so a redraw
   never loses it. */
/* The preview updates the one element that changed rather than re-rendering
   the page, so a form of eighteen number inputs stays responsive. */
document.addEventListener('input', function(ev){
  if(!ev.target.getAttribute || !ev.target.getAttribute('data-fc')) return;
  const box = document.getElementById('fc-preview');
  if(box && STATE.modal && STATE.modal.kind === 'fieldChange'){
    box.innerHTML = fieldChangePreview(STATE.modal);
  }
});

let filterTimer = null;
document.addEventListener('input', function(ev){
  const f = ev.target.getAttribute && ev.target.getAttribute('data-filter');
  if(!f) return;
  const parts = f.split(':');
  const scope = scopeOf(parts[0]);
  if(!scope) return;
  const value = ev.target.value;
  if(filterTimer) clearTimeout(filterTimer);
  filterTimer = setTimeout(function(){
    scope[parts[1]] = value;
    scope.page = 1;
    render();
  }, 220);
});

document.addEventListener('change', function(ev){
  const chk = ev.target.getAttribute && ev.target.getAttribute('data-filter-check');
  if(chk){
    const parts = chk.split(':');
    const scope = scopeOf(parts[0]);
    if(scope){ scope[parts[1]] = ev.target.checked; scope.page = 1; render(); }
    return;
  }
  const act = ev.target.getAttribute && ev.target.getAttribute('data-act');
  if(act && act.indexOf('filter:') === 0){
    const parts = act.slice(7).split(':');
    const scope = scopeOf(parts[0]);
    if(scope){
      let v = ev.target.value;
      if(parts[1] === 'pageSize') v = Number(v);
      scope[parts[1]] = v;
      scope.page = 1;
      render();
    }
    return;
  }
  if(act === 'period-code'){
    /* Re-render so the Name placeholder follows the code being typed. */
    render();
    return;
  }
  if(act === 'movement-emp'){
    STATE.modal.emp_no = ev.target.value;
    render();
  }else if(act === 'movement-type'){
    STATE.modal.type = ev.target.value;
    render();
  }
});

async function handleAction(act, arg, ev, el){
  try{
    switch(act){

      /* ---- sign in ---- */
      case 'request-otp': {
        const email = val('otp-email');
        if(!email){ STATE.login.error = 'Enter your work email address.'; return render(); }
        STATE.login.busy = true; STATE.login.error = null; render();
        try{
          const res = await rpc('requestOtp', {email:email});
          STATE.login.email = res.email;
          STATE.login.step = 'code';
          startResendCountdown(res.resendInSeconds || 45);
        }catch(err){
          STATE.login.error = String(err.message || err);
        }finally{
          STATE.login.busy = false; render();
        }
        return;
      }
      case 'resend-otp': {
        STATE.login.busy = true; STATE.login.error = null; render();
        try{
          const res = await rpc('requestOtp', {email:STATE.login.email});
          startResendCountdown(res.resendInSeconds || 45);
          toast('A new code is on its way.');
        }catch(err){
          STATE.login.error = String(err.message || err);
        }finally{
          STATE.login.busy = false; render();
        }
        return;
      }
      case 'change-email':
        STATE.login.step = 'email'; STATE.login.error = null;
        return render();
      case 'verify-otp': {
        const code = val('otp-code');
        if(code.length !== 6){ STATE.login.error = 'Enter the 6-digit code from your email.'; return render(); }
        STATE.login.busy = true; STATE.login.error = null; render();
        try{
          const res = await rpc('verifyOtp', {email:STATE.login.email, code:code});
          setSessionToken(res.sessionToken);
          STATE.session = res.session;
          STATE.login.busy = false;
          await boot();
        }catch(err){
          STATE.login.error = String(err.message || err);
          STATE.login.busy = false;
          render();
        }
        return;
      }
      case 'bootstrap-admin': {
        const email = val('bs-email');
        const name = val('bs-name');
        if(!email){ STATE.login.error = 'Enter your work email address.'; return render(); }
        STATE.login.busy = true; STATE.login.error = null; render();
        try{
          await rpc('createFirstAdmin', {email:email, name:name});
          STATE.login.step = 'email';
          STATE.login.needsBootstrap = false;
          toast('You are the Administrator. Now sign in with that address.');
        }catch(err){
          STATE.login.error = String(err.message || err);
        }finally{
          STATE.login.busy = false; render();
        }
        return;
      }
      case 'unlock':
        setAccessCode(val('unlock-code'));
        STATE.needsAccessCode = false;
        STATE.login.error = null;
        return boot();
      case 'sign-out':
        signOut();
        return;

      /* ---- chrome ---- */
      case 'open-periods': STATE.modal = {kind:'periods'}; return render();
      case 'open-account': STATE.modal = {kind:'account'}; return render();
      case 'close-modal':
        if(STATE.modal && STATE.modal.kind === 'bulkPayslip' && STATE.modal.stage === 'sending'){
          return;
        }
        return closeModal();
      case 'modal-backdrop':
        if(STATE.modal && STATE.modal.kind === 'bulkPayslip' && STATE.modal.stage === 'sending'){
          return;
        }
        if(ev.target.classList.contains('ov') && !STATE.modalBusy) closeModal();
        return;
      case 'print': window.print(); return;
      case 'dismiss-save': STATE.saveError = null; return render();
      case 'retry-save': {
        const r = STATE.saveError && STATE.saveError.retry;
        STATE.saveError = null;
        if(r) await r();
        return;
      }
      case 'dismiss-stale': STATE.staleRevision = null; return render();
      case 'reload-data': STATE.staleRevision = null; return loadPeriod(STATE.period);
      case 'retry-boot': STATE.fatalError = null; return boot();
      case 'switch-period':
        closeModal();
        return loadPeriod(arg);

      case 'conn-check': {
        STATE.busy = 'Checking the connection';
        render();
        STATE.diagnostics = await connectionCheck();
        STATE.busy = null;
        if(STATE.session) STATE.modal = {kind:'diagnostics'};
        return render();
      }
      case 'copy-diagnostics':
        try{
          await navigator.clipboard.writeText((STATE.diagnostics || []).join('\n'));
          toast('Copied.');
        }catch(e){ toast('Could not copy — select the text and copy it manually.', true); }
        return;

      /* ---- exports ---- */
      case 'select-filtered': {
        filteredStaff(arg).forEach(function(e){ STATE.sel[e.emp_no] = true; });
        toast(selCount() + ' selected.');
        return render();
      }
      case 'clear-selection':
        STATE.sel = {};
        return render();
      case 'bulk-payslip':
        if(!selCount()){ toast('Select some staff first.', true); return; }
        return openBulkPayslip(false);
      case 'bulk-resend':
        /* Re-running the preview is what recalculates who is eligible. */
        return openBulkPayslip(!STATE.modal.resend);
      case 'bulk-payslip-send': {
        const need = STATE.modal.preview.counts.sendable > 50;
        if(need && !checked('bp-confirm')){
          STATE.modalError = 'Tick the box to confirm you have checked the figures. ' +
            'These emails cannot be recalled.';
          return render();
        }
        return runBulkPayslipSend();
      }
      case 'export-register': return exportRegister(arg);
      case 'export-changes': return exportChanges();
      case 'export-journal': return exportJournal();
      case 'export-d365': return exportD365();
      case 'export-history': return exportHistory();
      case 'export-schemes': return exportSchemes();
      case 'export-proration': return exportProration();
      case 'export-structure': return exportStructure();
      case 'export-bg': return exportBgCost();
      case 'clear-history-filters':
        STATE.hist = Object.assign(STATE.hist, {q:'', entity:'', action:'', actorId:'',
          from:'', to:'', page:1, key:''});
        return render();

      /* ---- payslip ---- */
      case 'payslip': {
        STATE.modal = {kind:'payslip', emp_no:arg, payslip:null};
        render();
        try{
          const res = await rpc('getPayslip', {period:STATE.period, emp_no:arg});
          if(STATE.modal && STATE.modal.kind === 'payslip' && STATE.modal.emp_no === arg){
            STATE.modal.payslip = res.payslip;
          }
        }catch(err){
          STATE.modalError = String(err.message || err);
        }
        return render();
      }
      case 'send-payslip': {
        const email = val('ps-email');
        try{
          const res = await mutate('Sending the payslip', 'sendPayslip',
            {period:STATE.period, emp_no:arg, email:email}, {inModal:true});
          toast('Payslip sent to ' + res.sentTo + '.');
          closeModal();
        }catch(e){ render(); }
        return;
      }

      /* ---- movements ---- */
      case 'new-movement':
        STATE.modal = {kind:'movement', emp_no:'', type:'A'};
        return render();
      case 'save-movement': {
        const m = STATE.modal;
        const isPromo = m.type === 'PROMO' || m.type === 'CONF';
        const movement = {
          emp_no: val('mv-emp'), type: val('mv-type'), reason: val('mv-reason'),
          staffStatus: val('mv-status')
        };
        if(isPromo){
          movement.newNetPay = numVal('mv-npay');
          movement.newNetSecurity = numVal('mv-nsec');
        }else{
          movement.pay = numVal('mv-pay') || 0;
          movement.sec = numVal('mv-sec') || 0;
        }
        if(movement.emp_no === '__new__'){
          movement.newHire = {
            emp_no: val('mv-nh-empno'),
            name: val('mv-nh-name'), grade: val('mv-nh-grade'),
            staff_type: val('mv-nh-type'), bus_unit: val('mv-nh-bu'), email: val('mv-nh-email')
          };
        }
        try{
          const res = await mutate('Saving the movement', 'saveMovement',
            {period:STATE.period, movement:movement}, {inModal:true});
          closeModal();
          toast(res.createdNewHire
            ? 'New hire ' + res.staff.emp_no + ' added on ' + money(res.staff.netPay) + ' net payroll.'
            : 'Movement saved.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }
      case 'reverse-movement': {
        const mv = STATE.movements.filter(function(x){ return x.id === arg; })[0];
        STATE.modal = {
          kind:'confirm', title:'Reverse this movement?', danger:true, needsReason:true,
          reasonHint:'e.g. entered against the wrong employee',
          confirmLabel:'Reverse it',
          message:'This takes back <strong>' + esc(money(mv ? mv.pay : 0)) + '</strong> of payroll and ' +
            '<strong>' + esc(money(mv ? mv.sec : 0)) + '</strong> of security from ' +
            esc(mv ? mv.emp_no : '') + '. The movement row stays on the register marked reversed — ' +
            'nothing is deleted.',
          action:'reverseMovement', payload:{id:arg}, busyLabel:'Reversing the movement'
        };
        return render();
      }

      /* ---- staff ---- */
      case 'new-staff': STATE.modal = {kind:'staff', emp_no:''}; return render();
      case 'edit-staff': STATE.modal = {kind:'staff', emp_no:arg}; return render();
      case 'save-staff': {
        const existing = STATE.modal.emp_no;
        const staff = {emp_no: val('st-emp_no'), name: val('st-name'), email: val('st-email'),
          status: val('st-status'), grade: val('st-grade'), salary_group: val('st-salary_group'),
          staff_type: val('st-staff_type'), bus_unit: val('st-bus_unit'), org: val('st-org'),
          emp_account: val('st-emp_account')};
        STAFF_EDIT_GROUPS.forEach(function(g){
          g[1].forEach(function(k){ staff[k] = numVal('st-' + k) || 0; });
        });
        try{
          await mutate('Saving the staff record', 'saveStaff',
            {period:STATE.period, mode: existing ? 'edit' : 'create', staff:staff}, {inModal:true});
          closeModal();
          toast('Staff record saved.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }
      case 'renumber':
        STATE.modal = {kind:'renumber', emp_no:arg};
        return render();
      case 'renumber-save': {
        const from = STATE.modal.emp_no;
        try{
          const res = await mutate('Changing the employee number', 'changeEmployeeNumber', {
            emp_no: from, newEmpNo: val('rn-new'), reason: val('rn-reason')
          }, {inModal:true});
          closeModal();
          /* A stale selection would still hold the old number. */
          if(STATE.sel[from]){ delete STATE.sel[from]; STATE.sel[res.to] = true; }
          const tabs = Object.keys(res.moved).length;
          toast(res.name + ' is now ' + res.to + ' — updated across ' + tabs +
            ' record type' + (tabs === 1 ? '' : 's') + '.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }
      case 'field-change': {
        const parts = arg.split(':');
        STATE.modal = {kind:'fieldChange', register:parts[0], emp_no:parts[1]};
        return render();
      }
      case 'field-change-save': {
        const m = STATE.modal;
        const spec = REGISTER_FIELDS[m.register] || [];
        const deltas = {};
        spec.forEach(function(f){
          const v = numVal('fc-' + f.field);
          if(v !== '' && Number(v)) deltas[f.field] = Number(v);
        });
        try{
          const res = await mutate('Applying the change', 'applyFieldChange', {
            period: STATE.period, register: m.register, emp_no: m.emp_no,
            reason: val('fc-reason'), deltas: deltas
          }, {inModal:true});
          closeModal();
          toast(res.detail + ' — net ' + (res.net >= 0 ? '+' : '−') + money(Math.abs(res.net)) + '.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }
      case 'delete-staff': {
        const e = staffIndex()[arg];
        STATE.modal = {
          kind:'confirm', title:'Remove ' + (e ? e.name : arg) + '?', danger:true, needsReason:true,
          reasonHint:'e.g. duplicate record',
          confirmLabel:'Remove from the register',
          message:'This takes ' + esc(e ? e.name : arg) + ' off the ' + esc(periodLabel(STATE.period)) +
            ' register and out of every total, the journal and the cost allocation. The row is kept ' +
            'with a tombstone so the removal stays auditable — it is not erased.',
          action:'deleteStaff', payload:{period:STATE.period, emp_no:arg},
          busyLabel:'Removing the staff record'
        };
        return render();
      }

      /* ---- schemes ---- */
      case 'new-scheme': STATE.modal = {kind:'scheme'}; return render();
      case 'save-scheme': {
        try{
          const res = await mutate('Saving the scheme', 'saveScheme', {
            period:STATE.period,
            scheme:{emp_no:val('sc-emp'), type:val('sc-type'), description:val('sc-desc'),
              totalAmount:numVal('sc-total'), monthlyDeduction:numVal('sc-monthly'),
              startPeriod:val('sc-start'), account:val('sc-acct')}
          }, {inModal:true});
          closeModal();
          toast(res.firstInstalmentApplied
            ? 'Scheme saved and the first instalment taken.'
            : 'Scheme saved. It starts in ' + periodLabel(res.scheme.startPeriod) + '.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }
      case 'edit-scheme':
        STATE.modal = {kind:'schemeEdit', id:arg};
        return render();
      case 'scheme-edit-save': {
        try{
          const res = await mutate('Saving the scheme', 'updateScheme', {
            period: STATE.period, id: STATE.modal.id,
            description: val('se-desc'), account: val('se-acct'),
            totalAmount: numVal('se-total'), monthlyDeduction: numVal('se-monthly'),
            reason: val('se-reason')
          }, {inModal:true});
          closeModal();
          toast(res.changed.length
            ? 'Scheme updated' + (res.adjustedThisPeriod
                ? ' — this period adjusted by ' + (res.adjustedThisPeriod > 0 ? '+' : '−') +
                  money(Math.abs(res.adjustedThisPeriod))
                : '') + '.'
            : 'Nothing changed.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }
      case 'cancel-scheme': {
        const s = STATE.schemes.filter(function(x){ return x.id === arg; })[0];
        STATE.modal = {
          kind:'confirm', title:'Cancel this scheme?', danger:true, needsReason:true,
          confirmLabel:'Cancel the scheme',
          message:'This stops the scheme and takes back the instalment applied in ' +
            esc(periodLabel(STATE.period)) + ', if there is one. Instalments already posted into a ' +
            'closed period stay posted — their journals have gone to the ledger. Remaining balance: ' +
            '<strong>' + esc(money(s ? s.balance : 0)) + '</strong>.',
          action:'reverseScheme', payload:{period:STATE.period, id:arg},
          busyLabel:'Cancelling the scheme'
        };
        return render();
      }

      /* ---- proration ---- */
      case 'new-proration': STATE.modal = {kind:'proration'}; return render();
      case 'save-proration': {
        try{
          await mutate('Saving the proration entry', 'saveProration', {
            period:STATE.period,
            proration:{emp_no:val('pr-emp'), daysWorked:numVal('pr-days'),
              workingDays:numVal('pr-wdays'), reason:val('pr-reason')}
          }, {inModal:true});
          closeModal();
          toast('Proration recorded as pending. Press Apply when you are ready to change the pay.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }
      case 'apply-proration': {
        const p = STATE.proration.filter(function(x){ return x.id === arg; })[0];
        STATE.modal = {
          kind:'confirm', title:'Apply this proration?', needsReason:false,
          confirmLabel:'Apply it', tone:'blue',
          message:'This withholds the shortfall from ' + esc(p ? p.emp_no : '') + '’s pay for ' +
            esc(periodLabel(STATE.period)) + '. The figures are recalculated now against their ' +
            'current net, so anything recorded since this entry was created is taken into account.',
          action:'applyProration', payload:{id:arg}, busyLabel:'Applying the proration',
          onDone:function(res){
            toast(res.recomputed
              ? 'Applied — the figures were recalculated because the net had moved since the entry was created.'
              : 'Proration applied.');
          }
        };
        return render();
      }
      case 'reverse-proration': {
        const p = STATE.proration.filter(function(x){ return x.id === arg; })[0];
        const wasApplied = p && p.status === 'APPLIED';
        STATE.modal = {
          kind:'confirm', title: wasApplied ? 'Reverse this proration?' : 'Cancel this entry?',
          danger:true, needsReason:true, confirmLabel: wasApplied ? 'Reverse it' : 'Cancel it',
          message: wasApplied
            ? 'This puts <strong>' + esc(money(p.dedPay)) + '</strong> of payroll and <strong>' +
              esc(money(p.dedSec)) + '</strong> of security back. The entry stays on the register ' +
              'marked reversed, so both states remain visible.'
            : 'This cancels a pending entry. Nobody’s pay has changed, so nothing is put back.',
          action:'reverseProration', payload:{id:arg}, busyLabel:'Reversing the proration'
        };
        return render();
      }

      /* ---- structure ---- */
      case 'edit-structure': STATE.modal = {kind:'structure', grade:arg}; return render();
      case 'save-structure': {
        const structure = {grade: val('ss-grade'), salary_group: val('ss-salary_group')};
        STRUCT_FIELDS.forEach(function(k){ structure[k] = numVal('ss-' + k) || 0; });
        try{
          await mutate('Saving the grade structure', 'saveGradeStructure',
            {structure:structure}, {inModal:true});
          closeModal();
          toast('Grade structure saved. New hires on this grade start on these figures.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }

      /* ---- people ---- */
      case 'new-user': STATE.modal = {kind:'user', userId:''}; return render();
      case 'edit-user': STATE.modal = {kind:'user', userId:arg}; return render();
      case 'save-user': {
        const payload = {name: val('us-name'), email: val('us-email'), role: val('us-role')};
        const editing = STATE.modal.userId;
        try{
          if(editing) payload.userId = editing;
          await mutate('Saving', editing ? 'updateTeamMember' : 'addTeamMember', payload, {inModal:true});
          closeModal();
          toast('Saved.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }
      case 'toggle-user': {
        const u = STATE.directory.filter(function(x){ return x.userId === arg; })[0];
        const disabling = u && u.status === 'active';
        STATE.modal = {
          kind:'confirm', title:(disabling ? 'Disable ' : 'Enable ') + (u ? u.name : ''),
          danger:disabling, confirmLabel:disabling ? 'Disable' : 'Enable',
          message: disabling
            ? 'They will be signed out immediately — the Directory is checked on every request, so ' +
              'they do not stay in until their session expires.'
            : 'They will be able to sign in again with their work email.',
          action:'setUserStatus', payload:{userId:arg, status:disabling ? 'disabled' : 'active'},
          busyLabel:'Updating access'
        };
        return render();
      }
      case 'save-settings': {
        const settings = {};
        ['otpMinutes','otpMaxAttempts','otpMaxPerHour','otpResendSeconds','sessionDays',
         'defaultWorkingDays','journalPageSize','journalExportMax','assertionToleranceNaira']
          .forEach(function(k){
            const v = numVal('set-' + k);
            if(v !== '') settings[k] = v;
          });
        try{
          const res = await mutate('Saving settings', 'saveSettings', {settings:settings});
          toast(res.changed.length ? res.changed.length + ' setting(s) changed.' : 'Nothing changed.');
          await loadPeriod(STATE.period, true);
        }catch(e){ /* surfaced by mutate */ }
        return;
      }

      /* ---- periods ---- */
      case 'new-period': STATE.modal = {kind:'period'}; return render();
      case 'save-period': {
        try{
          const res = await mutate('Creating the period', 'createPeriod', {
            period: val('pd-period'), label: val('pd-label'),
            workingDays: numVal('pd-wdays'), rollForward: checked('pd-roll')
          }, {inModal:true});
          closeModal();
          toast(res.label + ' created — ' + res.rolledForward + ' staff rolled forward, ' +
            res.schemesAdvanced + ' scheme instalment(s) applied.');
          await loadPeriod(res.period);
        }catch(e){ render(); }
        return;
      }
      case 'edit-controls':
        STATE.modal = {kind:'controls', period: arg || STATE.period};
        return render();
      case 'save-controls': {
        const target = STATE.modal.period || STATE.period;
        try{
          const res = await mutate('Saving the period', 'savePeriodControls', {
            period: target, label: val('ct-label'),
            controlPay: numVal('ct-pay'), controlSec: numVal('ct-sec'),
            workingDays: numVal('ct-wdays')
          }, {inModal:true});
          closeModal();
          toast(res.periodRow && res.periodRow.label
            ? 'Saved — this month is now called “' + res.periodRow.label + '”.'
            : 'Period saved.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }
      case 'close-period': {
        const summary = STATE.journalSummary;
        STATE.modal = {
          kind:'confirm', title:'Close ' + periodLabel(arg) + '?', confirmLabel:'Close the period',
          tone:'amber',
          message:'Closing freezes the journal and stamps it with a batch reference. After that ' +
            '<strong>nothing in this period can change</strong> — not a movement, not a staff edit, ' +
            'not even for an Administrator — until it is reopened.<br><br>' +
            (summary && summary.available
              ? 'The journal will post <strong>' + summary.entries.toLocaleString() + ' rows</strong>, ' +
                'debits ' + esc(money(summary.debit)) + ' against credits ' + esc(money(summary.credit)) + '.' +
                (summary.missingAccount
                  ? '<br><br><strong style="color:var(--red)">' + summary.missingAccount +
                    ' EMP-account posting(s) worth ' + esc(money(summary.missingAccountAmount)) +
                    ' have no loan account.</strong> They will post to “EMP ACCT - INPUT REQUIRED”. ' +
                    'Tick below only if you accept that.'
                  : '')
              : ''),
          extra: (summary && summary.available && summary.missingAccount)
            ? '<div class="fld" style="margin-top:10px"><label><input type="checkbox" id="cf-accept"> ' +
              'I accept the postings with no loan account</label></div>'
            : '',
          action:'closePeriod', payload:{period:arg}, busyLabel:'Closing the period',
          collect:function(p){ p.acceptMissingAccounts = checked('cf-accept'); return p; },
          onDone:function(res){
            toast('Closed. Journal ' + res.batchRef + ' posted — ' + res.journalRows + ' rows.');
          }
        };
        return render();
      }
      case 'reopen-period': {
        const p = STATE.periods.filter(function(x){ return x.period === arg; })[0];
        STATE.modal = {
          kind:'confirm', title:'Reopen ' + periodLabel(arg) + '?', danger:true, needsReason:true,
          confirmLabel:'Reopen the period',
          reasonHint:'e.g. commission correction from Finance',
          message:'This <strong>withdraws journal ' + esc(p ? p.journalBatchRef : '') + '</strong> and ' +
            'discards its posted rows. If Finance has already imported that CSV into the ledger, the ' +
            'ledger and PaySync will disagree until they import the replacement.<br><br>' +
            'Re-closing issues a <strong>new</strong> batch reference, never the same one again, so the ' +
            'two exports can always be told apart.',
          action:'reopenPeriod', payload:{period:arg}, busyLabel:'Reopening the period',
          onDone:function(res){
            toast('Reopened. Journal ' + res.withdrawnBatchRef + ' withdrawn (' +
              res.discardedRows + ' rows discarded).');
          }
        };
        return render();
      }

      case 'confirm-action': {
        const m = STATE.modal;
        let payload = Object.assign({}, m.payload);
        if(m.needsReason){
          const reason = val('cf-reason');
          if(!reason){
            STATE.modalError = 'A reason is required — it goes into the audit trail.';
            return render();
          }
          payload.reason = reason;
        }
        if(m.collect) payload = m.collect(payload);
        const done = m.onDone;
        try{
          const res = await mutate(m.busyLabel || 'Working', m.action, payload, {inModal:true});
          closeModal();
          if(done) done(res); else toast('Done.');
          await loadPeriod(STATE.period, true);
        }catch(e){ render(); }
        return;
      }

      default: return;
    }
  }catch(err){
    STATE.modalError = String(err.message || err);
    render();
  }
}

let resendTimer = null;
function startResendCountdown(seconds){
  STATE.login.resendIn = seconds;
  if(resendTimer) clearInterval(resendTimer);
  resendTimer = setInterval(function(){
    STATE.login.resendIn--;
    if(STATE.login.resendIn <= 0){ clearInterval(resendTimer); resendTimer = null; }
    if(!STATE.session) render();
  }, 1000);
}

/* ============================================================
   SESSION AND BOOT
   ============================================================ */
function onSessionLost(message){
  setSessionToken('');
  STATE.session = null;
  STATE.bootstrapped = false;
  STATE.staff = [];
  STATE.movements = [];
  STATE.modal = null;
  STATE.login = Object.assign(STATE.login, {step:'email', busy:false, error:message});
  stopPolling();
  render();
}

function signOut(){
  setSessionToken('');
  STATE.session = null;
  STATE.bootstrapped = false;
  STATE.staff = [];
  STATE.movements = [];
  STATE.schemes = [];
  STATE.proration = [];
  STATE.reconciliation = null;
  STATE.modal = null;
  STATE.login = {step:'email', email:'', busy:false, error:null, resendIn:0,
    needsBootstrap:false, emailConfigured:true, name:''};
  stopPolling();
  render();
}

function absorb(data){
  const previousPeriod = STATE.period;
  STATE.period = data.period || STATE.period;
  if(data.periods) STATE.periods = data.periods;
  if(data.periodRow) STATE.periodRow = data.periodRow;
  if(data.staff) STATE.staff = data.staff;
  if(data.movements) STATE.movements = data.movements;
  if(data.schemes) STATE.schemes = data.schemes;
  if(data.schemeLedger) STATE.schemeLedger = data.schemeLedger;
  if(data.proration) STATE.proration = data.proration;
  if(data.reconciliation) STATE.reconciliation = data.reconciliation;
  if(data.journalSummary !== undefined) STATE.journalSummary = data.journalSummary;
  if(data.refData) STATE.refData = data.refData;
  if(data.salaryStructure) STATE.salaryStructure = data.salaryStructure;
  if(data.directory) STATE.directory = data.directory;
  if(data.settings) STATE.settings = data.settings;
  if(data.session) STATE.session = data.session;
  if(data.revision) STATE.revision = data.revision;
  if(data.period && data.period !== previousPeriod) STATE.sel = {};
  STATE.staleRevision = null;
  /* Server-paged views must refetch — their cached page is now stale. */
  STATE.jnl.key = '';
  STATE.hist.key = '';
  try{ window.localStorage.setItem(PERIOD_KEY, STATE.period); }catch(e){}
}

async function boot(){
  STATE.loading = true;
  STATE.fatalError = null;
  render();

  if(!isConfigured()){
    STATE.loading = false;
    STATE.fatalError = backendUrl()
      ? 'PAYSYNC_BACKEND_URL in this file is not an Apps Script Web App address. It must be the ' +
        'deployed /exec URL from Deploy → Manage deployments — not the editor link, not the /dev URL, ' +
        'and not the Google Sheet itself.'
      : 'This copy of PaySync has not been pointed at a Google Sheet yet. Whoever published it needs ' +
        'to set PAYSYNC_BACKEND_URL near the top of paysync.html.';
    return render();
  }

  /* No token yet — find out whether this Sheet even has an Administrator
     before showing a sign-in box that cannot possibly work. */
  if(!sessionToken()){
    try{
      const ctx = await rpc('getLoginContext', {});
      STATE.login.needsBootstrap = ctx.needsBootstrap;
      STATE.login.emailConfigured = ctx.emailConfigured;
      if(ctx.needsBootstrap) STATE.login.step = 'bootstrap';
    }catch(err){
      if(err.accessCodeRequired){ STATE.needsAccessCode = true; STATE.loading = false; return render(); }
      STATE.fatalError = String(err.message || err);
    }
    STATE.loading = false;
    return render();
  }

  try{
    let period = '';
    try{ period = window.localStorage.getItem(PERIOD_KEY) || ''; }catch(e){}
    const data = await rpc('getBootstrap', {period:period});
    STATE.needsSetup = !!data.needsSetup;
    STATE.setupMessage = data.message || '';
    absorb(data);
    STATE.bootstrapped = true;
    STATE.loading = false;
    startPolling();
    render();
  }catch(err){
    STATE.loading = false;
    if(err.accessCodeRequired){ STATE.needsAccessCode = true; return render(); }
    if(err.sessionInvalid) return;          // onSessionLost already re-rendered
    STATE.fatalError = String(err.message || err);
    render();
  }
}

async function loadPeriod(period, quiet){
  if(!quiet){ STATE.busy = 'Loading ' + periodLabel(period); render(); }
  try{
    const data = await rpc('getPeriodData', {period:period});
    absorb(data);
  }catch(err){
    toast(String(err.message || err), true);
  }finally{
    STATE.busy = null;
    render();
  }
}

/* ============================================================
   POLLING
   ------------------------------------------------------------
   Checks the revision counter every 45 seconds. It NEVER re-renders over an
   open form: it sets a flag and the user pulls the change in when they are
   ready. Vantage lost a rep's half-typed quote to exactly this poll, and a
   payroll run is worse to lose.
   ============================================================ */
let pollTimer = null;
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
function startPolling(){
  stopPolling();
  pollTimer = setInterval(async function(){
    if(!STATE.session || STATE.busy || STATE.modalBusy || document.hidden) return;
    try{
      const rev = await rpc('getRevision', {});
      if(rev && rev !== STATE.revision && rev !== STATE.staleRevision){
        if(STATE.modal){
          /* A dialog is open and may hold unsaved input. Flag it; show it when
             the dialog closes. */
          STATE.staleRevision = rev;
          return;
        }
        STATE.staleRevision = rev;
        render();
      }
    }catch(err){ /* a transient poll failure is not worth interrupting anyone for */ }
  }, 45000);
}

/* A bulk send is the one thing here that cannot be undone by reloading, so
   closing the tab mid-batch gets the browser's own confirmation. */
window.addEventListener('beforeunload', function(ev){
  if(STATE.modal && STATE.modal.kind === 'bulkPayslip' && STATE.modal.stage === 'sending'){
    ev.preventDefault();
    ev.returnValue = '';
    return '';
  }
});

/* ============================================================
   START
   ============================================================ */
boot();
</script>
