<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaySync | Payroll Platform | TD Plus</title>
<style>
/* ============================================================
   PaySync — the prototype's palette and type scale, unchanged.
   Everything the prototype used is here, PLUS the fifteen classes it
   referenced but never defined (defect D16): the .ps-* payslip set, which
   lived only inside the print-window template string, and .user-bar,
   .role-badge, .rb-*, .form-panel, .btn-sm and .btn-r, which existed nowhere
   at all. Three whole screens rendered unstyled because of it.
   ============================================================ */
/* ══════════════════════ BRAND — TD PLUS ══════════════════════
   Everything that differs between one company's PaySync and another's lives
   between this marker and END BRAND, and in the BRAND object in the script
   below. Nothing outside those two blocks carries a brand colour or name.

   The palette is deliberately the same as TD Africa's — these are sister
   companies and share an identity. The organisation name in the header and
   the logo box are what tell the deployments apart on screen.

   To brand a new deployment: copy this file, replace these two blocks, and
   clear PAYSYNC_BACKEND_URL. `diff` the two files afterwards — anything
   outside the brand blocks that differs is drift, and should be reconciled.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* Accent — primary actions, active nav, links */
  --w:#6B1F2A;--wd:#4A1320;--wm:#8B2636;--wl:#F4ECED;
  --accent-ink:#6B1F2A;         /* accent as TEXT on a light surface */
  --on-accent:#FFFFFF;          /* text ON the accent colour */
  --logo-bg:#F4ECED;--logo-fg:#4A1320;
  --on-tint:#4A1320;              /* text on a --wl tinted panel */
  --login-logo-bg:#4A1320;--login-logo-fg:#FFFFFF;
  --login-grad:linear-gradient(160deg,#4A1320,#6B1F2A 55%,#8B2636);
  --focus-ring:0 0 0 3px rgba(107,31,42,.09);
  /* Surfaces */
  --bg:#EEEAE6;--sf:#FFFFFF;--bdr:#DDD8D3;--lt:#F6F4F1;
  --row-hover:#EEF2FF;
  --input-bg:#FFFFFF;
  --closed-bg:#EFEBE9;--closed-bdr:#BCAAA4;
  --mon-closed:#3A2F2C;           /* period chip when the month is closed */
  --toast-ok:#1B5E20;--toast-err:#B71C1C;
  /* Text */
  --t1:#181818;--t2:#545250;--t3:#767270;
  /* Semantic — a dark brand needs darker tints, which is why they are here */
  --grn:#1B5E20;--gnl:#EAF3DE;--gnm:#2E7D32;
  --red:#B71C1C;--rdl:#FFEBEE;
  --amb:#BF360C;--aml:#FBE9E7;
  --blu:#0D47A1;--bll:#E3F2FD;
  --pur:#4527A0;--pul:#EDE7F6;
  --tl:#37474F;--tll:#ECEFF1;
  --gld:#9A530B;--gdl:#FFF8E1;
  --neutral-bg:#EEECEA;--neutral-fg:#3A3835;
  /* Payslip column headers */
  --ps-pay:#1B5E20;--ps-ded:#9C1B1B;--ps-sec:#185FA5;--ps-sded:#1B3A6B;
  /* Charts */
  --chart-prior-pay:#B5D4F4;--chart-this-pay:#6B1F2A;
  --chart-prior-sec:#CE93D8;--chart-this-sec:#4527A0;
  /* Shape */
  --r:9px;--r2:5px;--sh:0 1px 3px rgba(0,0,0,.07);
}
/* ════════════════════════ END BRAND ════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:13px;color:var(--t1);background:var(--bg)}
.top{background:var(--wd);color:#fff;min-height:54px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:400;box-shadow:0 2px 12px rgba(0,0,0,.3);gap:12px;flex-wrap:wrap}
.top-l{display:flex;align-items:center;gap:14px}
.logo{width:38px;height:38px;background:var(--logo-bg);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--logo-fg);flex-shrink:0}
.top-h1{font-size:14.5px;font-weight:700}.top-sub{font-size:10px;opacity:.55;margin-top:1px}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-mon{background:var(--wm);border-radius:var(--r2);padding:5px 12px;font-size:12px;font-weight:700;border:none;color:#fff;cursor:pointer;font-family:inherit}
.top-mon:hover{background:var(--w);color:var(--on-accent)}
.top-mon.closed{background:var(--mon-closed)}
.top-user{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border-radius:20px;padding:4px 12px 4px 8px;cursor:pointer;border:none;color:#fff;font-family:inherit}
.top-user:hover{background:rgba(255,255,255,.22)}
.top-av{width:26px;height:26px;background:var(--logo-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--logo-fg)}
.top-un{font-size:11.5px;font-weight:600}
.nav{background:var(--sf);border-bottom:2px solid var(--bdr);display:flex;padding:0 22px;position:sticky;top:54px;z-index:300;overflow-x:auto}
.nb{padding:13px 15px;border:none;background:transparent;cursor:pointer;font-size:12.5px;color:var(--t2);border-bottom:3px solid transparent;font-weight:500;white-space:nowrap;transition:all .13s;position:relative;font-family:inherit}
.nb:hover{background:var(--lt);color:var(--t1)}.nb.on{color:var(--accent-ink);border-bottom-color:var(--w);font-weight:700}
.nb.waiting{opacity:.45}
.nb-dot{position:absolute;top:9px;right:8px;min-width:7px;height:7px;padding:0 3px;background:var(--red);border-radius:6px;color:#fff;font-size:8px;line-height:7px;font-weight:700}
.content{padding:20px 22px;max-width:1600px;margin:0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.krow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh)}
.kpi-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.kpi-v{font-size:20px;font-weight:700;line-height:1.1;word-break:break-word}
.kpi-s{font-size:10px;color:var(--t3);margin-top:4px}
.kpi.wn .kpi-v{color:var(--accent-ink)}.kpi.gn .kpi-v{color:var(--grn)}.kpi.bl .kpi-v{color:var(--blu)}
.kpi.rd .kpi-v{color:var(--red)}.kpi.am .kpi-v{color:var(--amb)}.kpi.pr .kpi-v{color:var(--pur)}
.card{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh)}
.card-h{font-size:13px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
.ctrls{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.ctrls input[type=text],.ctrls input[type=date],.ctrls input[type=number]{padding:7px 11px;border:1px solid var(--bdr);border-radius:var(--r2);font-size:12px;background:var(--input-bg);color:var(--t1);outline:none;font-family:inherit}
.ctrls input[type=text]{width:210px}
.ctrls input:focus,.ctrls select:focus{border-color:var(--w)}
.ctrls select{padding:7px 11px;border:1px solid var(--bdr);border-radius:var(--r2);font-size:12px;background:var(--input-bg);color:var(--t1);cursor:pointer;outline:none;font-family:inherit}
.ctrls label{font-size:11px;color:var(--t3)}
.chip{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--bdr);color:var(--t3);background:var(--lt);white-space:nowrap}
.btn{padding:7px 14px;border-radius:var(--r2);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;white-space:nowrap;font-family:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-w{background:var(--sf);color:var(--accent-ink);border:1.5px solid var(--w)}.btn-w:hover:not(:disabled){background:var(--w);color:var(--on-accent)}
.btn-f{background:var(--w);color:var(--on-accent);border:1.5px solid var(--w)}.btn-f:hover:not(:disabled){background:var(--wd)}
.btn-g{background:var(--sf);color:var(--grn);border:1.5px solid var(--grn)}.btn-g:hover:not(:disabled){background:var(--grn);color:#fff}
/* D16: .btn-sm and .btn-r were used on every Delete / Apply / Payslip button and defined nowhere. */
.btn-sm{padding:3px 9px;font-size:10px;border-radius:4px;font-weight:600}
.btn-r{background:var(--sf);color:var(--red);border:1.5px solid var(--red)}.btn-r:hover:not(:disabled){background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--t2);border:1px solid var(--bdr)}.btn-ghost:hover:not(:disabled){background:var(--lt);color:var(--t1)}
.tw{border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.ts{overflow-x:auto;max-height:560px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11.5px}
thead{position:sticky;top:0;z-index:5}
.hg{background:var(--wm);color:#fff;padding:5px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;text-align:center;border-right:1px solid rgba(255,255,255,.1)}
.hc{background:var(--wd);color:#fff;padding:7px 9px;white-space:nowrap;font-weight:500;font-size:11px;border-right:1px solid rgba(255,255,255,.06);text-align:left}
.hc.r{text-align:right}.hc.c{text-align:center}
.hc.sortable{cursor:pointer;user-select:none}.hc.sortable:hover{background:var(--w);color:var(--on-accent)}
.hc .sort-ind{opacity:.5;font-size:9px;margin-left:3px}
tbody tr:nth-child(even){background:var(--lt)}
tbody tr:hover{background:var(--row-hover)!important}
td{padding:6px 9px;border-bottom:1px solid #EDEBE8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.c{text-align:center}
td.earn{background:var(--gnl);color:var(--grn);text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
td.ded{background:var(--rdl);color:var(--red);text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
td.net{background:var(--wl);color:var(--on-tint);text-align:right;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}
td.emp-acct{background:var(--gdl);color:var(--gld);text-align:right;font-weight:700;font-size:11px;font-variant-numeric:tabular-nums}
td.nm{font-weight:600;max-width:190px}
td.nm.exited{text-decoration:line-through;color:var(--red)}
td.nm.suspended{color:var(--amb)}
td.nm.newhire{color:var(--grn)}
td.muted{font-size:10px;color:var(--t3)}
.tf{padding:9px 13px;background:var(--wd);color:#fff;font-weight:700;font-size:11.5px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;white-space:nowrap}
.bACT{background:var(--neutral-bg);color:var(--neutral-fg)}.bNEW{background:var(--gnl);color:var(--grn)}
.bEXI{background:var(--rdl);color:var(--red)}.bSUS{background:var(--aml);color:var(--amb)}
.bSAL{background:var(--pul);color:var(--pur)}.bSUP{background:var(--tll);color:var(--tl)}
.bTDS{background:var(--gdl);color:var(--gld)}.bINF{background:var(--bll);color:var(--blu)}
.fp,.form-panel{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.fp h3,.form-panel h3{font-size:13.5px;font-weight:700;margin-bottom:14px;color:var(--accent-ink)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11px;font-weight:600;color:var(--t2)}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--bdr);border-radius:var(--r2);font-size:12px;color:var(--t1);background:var(--input-bg);outline:none;font-family:inherit;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--w)}
.fld .hint{font-size:10px;color:var(--t3)}
.fld.wide{grid-column:1/-1}
.fld-head{font-weight:700;font-size:12.5px;grid-column:1/-1;margin:8px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--bdr)}
/* D16: the user bar and role badges the Schemes / Structure / Proration screens used. */
.user-bar{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:12px;box-shadow:var(--sh);flex-wrap:wrap}
.role-badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.03em}
.rb-ADMIN{background:var(--rdl);color:var(--red)}
.rb-HR{background:var(--tll);color:var(--tl)}
.rb-FINANCE{background:var(--pul);color:var(--pur)}
.rb-AUDIT{background:var(--bll);color:var(--blu)}
.rb-VIEW{background:var(--neutral-bg);color:var(--neutral-fg)}
.bu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:16px}
.buc{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--r);padding:15px;border-left:5px solid var(--w);box-shadow:var(--sh)}
.buc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.buc-name{font-size:13px;font-weight:700}.buc-meta{font-size:10px;color:var(--t3);margin-top:2px}
.buc-tot{text-align:right;flex-shrink:0}.buc-tot-v{font-size:18px;font-weight:800}.buc-tot-l{font-size:9px;color:var(--t3)}
.buc-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.buc-s{background:var(--lt);border-radius:4px;padding:7px 10px;min-width:0}
.buc-sl{font-size:10px;color:var(--t3);margin-bottom:2px}.buc-sv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.buc-bar{height:5px;background:var(--bdr);border-radius:3px;margin-top:10px;overflow:hidden}
.buc-fill{height:5px;border-radius:3px}
.rec{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.rr{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bdr);font-size:12px;gap:8px}
.rr:last-child{border:none}.rr.calc{background:var(--wl)}.rr.var{background:var(--aml);font-weight:700}.rr.sub-t{background:var(--lt);font-weight:700}
.rref{font-size:10px;color:var(--t3);width:26px;flex-shrink:0}.rlbl{flex:1;min-width:0}
.rval{font-weight:700;min-width:150px;text-align:right;font-variant-numeric:tabular-nums}
.rval.calc{color:var(--accent-ink)}.rval.var{color:var(--amb)}
.sec-title{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--on-tint);padding-bottom:8px;border-bottom:2px solid var(--wl);display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sec-title .sub{font-size:11px;font-weight:400;color:var(--t3)}
/* Period bar — on EVERY screen now, not three of twelve (defect D20). */
.month-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 14px;background:var(--wl);border:1px solid var(--bdr);border-radius:8px;font-size:12px;color:var(--on-tint);flex-wrap:wrap}
.month-bar .sep{color:var(--t3)}
.month-bar .spacer{margin-left:auto}
.month-bar.closed{background:var(--closed-bg);border-color:var(--closed-bdr)}
.assert{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.assert.ok{background:var(--gnl);color:var(--grn)}
.assert.bad{background:var(--rdl);color:var(--red)}
.pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pager button{padding:4px 9px;font-size:11px;border-radius:4px;border:1px solid var(--bdr);background:var(--sf);color:var(--t2);cursor:pointer;font-family:inherit}
.pager button:hover:not(:disabled){background:var(--lt);color:var(--t1)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .pg{font-size:11px;color:#fff}
.empty{padding:38px 20px;text-align:center;color:var(--t3);font-size:12.5px}
.note{border-radius:var(--r2);padding:10px 14px;margin-bottom:14px;font-size:12px;font-weight:500;line-height:1.6}
.note.amber{background:var(--gdl);border:1px solid var(--gld);color:var(--amb)}
.note.blue{background:var(--bll);border:1px solid var(--blu);color:var(--blu)}
.note.red{background:var(--rdl);border:1px solid var(--red);color:var(--red)}
.note.green{background:var(--gnl);border:1px solid var(--grn);color:var(--grn)}
.note.grey{background:var(--lt);border:1px solid var(--bdr);color:var(--t2)}
.alert{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:var(--r2);padding:10px 14px;margin-bottom:12px;font-size:12px;line-height:1.55}
.alert.err{background:var(--rdl);border:1px solid var(--red);color:var(--red)}
.alert.warn{background:var(--gdl);border:1px solid var(--gld);color:var(--amb)}
.alert .acts{display:flex;gap:6px;flex-shrink:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.mdl{background:var(--sf);border-radius:12px;width:min(720px,100%);box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden;margin:auto}
.mdl.wide{width:min(980px,100%)}
.mdl.narrow{width:min(460px,100%)}
.mdl-h{background:var(--wd);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mdl-h h3{font-size:14.5px;font-weight:700}
.mdl-h p{font-size:10.5px;opacity:.65;margin-top:2px}
.mdl-x{background:rgba(255,255,255,.18);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:17px;cursor:pointer;line-height:1;flex-shrink:0}
.mdl-x:hover{background:rgba(255,255,255,.35)}
.mdl-b{padding:18px 20px;max-height:70vh;overflow-y:auto}
.mdl-f{padding:12px 20px;background:var(--lt);border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.mdl-f .left{margin-right:auto;font-size:11px;color:var(--t3)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;opacity:.55;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{position:fixed;bottom:18px;right:18px;background:var(--wd);color:#fff;padding:9px 16px;border-radius:22px;font-size:12px;z-index:950;box-shadow:0 6px 24px rgba(0,0,0,.28);display:flex;gap:8px;align-items:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;font-size:12.5px;z-index:960;box-shadow:0 6px 24px rgba(0,0,0,.28);max-width:min(640px,92vw)}
.toast.ok{background:var(--toast-ok);color:#fff}.toast.err{background:var(--toast-err);color:#fff}
/* Sign-in */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--login-grad)}
.login-card{background:var(--sf);border-radius:14px;width:min(430px,100%);padding:30px 30px 26px;box-shadow:0 30px 90px rgba(0,0,0,.4)}
.login-logo{width:52px;height:52px;background:var(--login-logo-bg);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:var(--login-logo-fg);margin-bottom:16px}
.login-card h1{font-size:19px;font-weight:800;color:var(--t1)}
.login-card .lede{font-size:12.5px;color:var(--t2);margin:6px 0 20px;line-height:1.6}
.login-card input{width:100%;padding:11px 13px;border:1px solid var(--bdr);border-radius:7px;font-size:14px;outline:none;font-family:inherit;background:var(--input-bg);color:var(--t1)}
.login-card input:focus{border-color:var(--w);box-shadow:var(--focus-ring)}
.login-card input.code{letter-spacing:9px;text-align:center;font-size:22px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace}
.login-card .btn{width:100%;justify-content:center;padding:11px;font-size:13.5px;margin-top:14px}
.login-meta{font-size:11px;color:var(--t3);margin-top:14px;line-height:1.6;text-align:center}
.login-link{background:none;border:none;color:var(--accent-ink);cursor:pointer;font-size:11.5px;text-decoration:underline;font-family:inherit;padding:0}
.login-err{background:var(--rdl);border:1px solid var(--red);color:var(--red);border-radius:7px;padding:10px 12px;font-size:12px;margin-top:14px;line-height:1.55}

<script>
"use strict";
/* ============================================================
   ▼▼▼  THE ONE THING TO SET BEFORE PUBLISHING THIS FILE  ▼▼▼

   Paste the Apps Script Web App URL for the company PaySync Sheet between the
   quotes below. It ends in /exec. Set it once, here, before you publish — the
   payroll team then just opens the app and starts work. Nobody is ever asked
   to configure anything.

   Get it from: the Apps Script editor → Deploy → Manage deployments →
   copy the Web app URL.
   ============================================================ */

const PAYSYNC_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbw5bWUreILb1Z_018h5zyl77Fm2Lqked69iG1he-iHEhweh3ceK00ducbom-GQazOYI/exec';

/* ============================================================
   ▲▲▲  NOTHING BELOW HERE NEEDS EDITING  ▲▲▲
   ============================================================ */

/* ══════════════════════ BRAND — TD PLUS ══════════════════════
   The second half of the brand block. Colours live in :root above; the words
   and the chart palette live here. Nothing else in this file names a company.
   ═══════════════════════════════════════════════════════════════ */
const BRAND = {
  org: 'TD Plus',
  app: 'PaySync',
  tagline: 'Payroll Platform',
  logo: 'TP',
  /* Shown on the payslip. The server sends its own copy on emailed payslips —
     set orgName and orgAddress on the Settings tab so the two agree. */
  address: 'Lagos, Nigeria',
  /* Business Group identity colours, keyed to the businessGroup rows on THIS
     deployment's RefData tab. Left empty until TD Plus's own groups
     are known — anything unmatched falls back to a neutral grey, so the
     screens work meanwhile. */
  bgColours: {}
};
/* ════════════════════════ END BRAND ════════════════════════ */

function backendUrl(){ return String(PAYSYNC_BACKEND_URL || '').trim(); }

/* Catches the three things people paste by mistake: the script editor URL, the
   /dev test URL, and the Google Sheet's own link. Only a deployed Web App
   /exec address will work. */
function isValidBackendUrl(url){
  return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(\?|$)/.test(String(url || '').trim());
}
function isConfigured(){ return isValidBackendUrl(backendUrl()); }

const ACCESS_CODE_KEY = 'paysync_access_code';
const SESSION_TOKEN_KEY = 'paysync_session';
const PERIOD_KEY = 'paysync_period';

let memoryAccessCode = '';
let memoryToken = '';

function accessCode(){
  if(memoryAccessCode) return memoryAccessCode;
  try{ return window.localStorage.getItem(ACCESS_CODE_KEY) || ''; }catch(e){ return ''; }
}
function setAccessCode(code){
  memoryAccessCode = code || '';
  try{
    if(memoryAccessCode) window.localStorage.setItem(ACCESS_CODE_KEY, memoryAccessCode);
    else window.localStorage.removeItem(ACCESS_CODE_KEY);
  }catch(e){ /* private browsing — the in-memory value still works this session */ }
}

/* What this browser holds is a signed token, not an identity. The server
   decides who that token belongs to on every single call, which is why a page
   can no longer act as somebody else simply by saying it is them. */
function sessionToken(){
  if(memoryToken) return memoryToken;
  try{ return window.localStorage.getItem(SESSION_TOKEN_KEY) || ''; }catch(e){ return ''; }
}
function setSessionToken(token){
  memoryToken = token || '';
  try{
    if(memoryToken) window.localStorage.setItem(SESSION_TOKEN_KEY, memoryToken);
    else window.localStorage.removeItem(SESSION_TOKEN_KEY);
  }catch(e){ /* private browsing — the in-memory token lasts the session */ }
}

/* ============================================================
   TRANSPORT
   ------------------------------------------------------------
   An /exec POST is two hops. The script runs at script.google.com, which then
   302-redirects to script.googleusercontent.com carrying a SINGLE-USE content
   key, and the reply is served from there. fetch follows that automatically,
   but the two hops fail differently and it matters which one did:

     · fetch THROWS   → the host was never reached. The script did not run.
     · a 404 comes back → something answered and rejected the content key. A
       proxy, web filter or security scanner that pre-fetches redirects spent
       the single-use key first. THE SCRIPT ALREADY RAN.

   So reads are retried automatically; writes never are; and when a write's
   reply is lost we say the work probably succeeded rather than claiming it
   failed. Telling someone their payroll save failed when it did not is worse
   than telling them it is uncertain.
   ============================================================ */

const RETRYABLE_ACTIONS = {
  getBootstrap:1, getRevision:1, getLoginContext:1, getPeriodData:1,
  getJournalPage:1, getJournalSummary:1, getJournalExport:1,
  getHistoryPage:1, getPayslip:1, getReconciliation:1, getCostAllocation:1,
  previewPayslipBatch:1
};

/* Set once any call has succeeded. After that we know the deployment exists,
   so a later 404 is a transport failure rather than a wrong URL — and the two
   need very different advice. */
let backendProvenAlive = false;

async function rpc(action, payload){
  const url = backendUrl();
  if(!url){
    throw new Error('This copy of PaySync has not been pointed at a Google Sheet yet. ' +
      'Whoever published it needs to set PAYSYNC_BACKEND_URL near the top of paysync.html.');
  }
  if(!isValidBackendUrl(url)){
    throw new Error('PAYSYNC_BACKEND_URL in this file is not an Apps Script Web App address. ' +
      'It must be the deployed /exec URL from Deploy → Manage deployments — not the editor link, ' +
      'not the /dev URL, and not the Google Sheet itself.');
  }

  const attempts = RETRYABLE_ACTIONS[action] ? 2 : 1;
  let lastError = null;
  for(let attempt = 1; attempt <= attempts; attempt++){
    try{
      return await rpcOnce(action, payload, url);
    }catch(err){
      lastError = err;
      if(!err.transport || attempt === attempts) throw err;
      await new Promise(function(r){ setTimeout(r, 700 * attempt); });
    }
  }
  throw lastError;
}

async function rpcOnce(action, payload, url){
  let res;
  try{
    res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action: action, payload: payload,
        sessionToken: sessionToken(), accessCode: accessCode()
      }),
      redirect:'follow'
    });
  }catch(err){
    const e = new Error('Could not reach the PaySync backend. Check your internet connection, ' +
      'and that the Web App is deployed with "Who has access" set to Anyone.');
    e.transport = true;
    e.neverRan = true;
    throw e;
  }

  if(!res.ok){
    if(res.status === 404 && backendProvenAlive){
      const e = new Error('Google did not return the reply, though the request itself went through. ' +
        'This usually clears on a second try.');
      e.transport = true;
      e.probablyRan = true;
      throw e;
    }
    if(res.status === 404){
      const e = new Error('Nothing is deployed at the address this page points at, so the Google Sheet ' +
        'backend cannot be reached. Copy the current Web app URL from the Apps Script editor ' +
        '(Deploy → Manage deployments) and set PAYSYNC_BACKEND_URL in paysync.html to match.');
      e.transport = true;
      e.neverRan = true;
      throw e;
    }
    const e = new Error('The backend returned HTTP ' + res.status + '. Re-deploy the Web App ' +
      '(Deploy → Manage deployments → New version) and try again.');
    if(res.status >= 500){ e.transport = true; e.probablyRan = true; }
    throw e;
  }

  const text = await res.text();
  let data;
  try{
    data = JSON.parse(text);
  }catch(err){
    throw new Error('The backend replied with a sign-in page instead of data. Re-deploy the Web App ' +
      'with "Execute as: Me" and "Who has access: Anyone". Anything else answers a cross-origin ' +
      'call with a Google sign-in redirect the browser cannot follow.');
  }

  backendProvenAlive = true;

  if(data.error){
    if(data.error === 'ACCESS_CODE_REQUIRED'){
      const e = new Error('This PaySync Sheet needs an access code.');
      e.accessCodeRequired = true;
      throw e;
    }
    if(data.error === 'SESSION_REQUIRED' || data.error === 'SESSION_INVALID' || data.error === 'SESSION_EXPIRED'){
      const message = data.error === 'SESSION_EXPIRED'
        ? 'Your session has expired. Sign in again to carry on.'
        : 'Please sign in again.';
      onSessionLost(message);
      const e = new Error(message);
      e.sessionInvalid = true;
      throw e;
    }
    throw new Error(data.error);
  }
  return data.result;
}

/* Wraps a write. Shows the busy pill, records the failure with a retry closure
   so the user can try the same call again from the alert strip, and — when the
   reply was lost on the second hop — says the work probably succeeded. */
async function mutate(label, action, payload, opts){
  const o = opts || {};
  STATE.busy = label;
  if(o.inModal) STATE.modalBusy = true;
  STATE.modalError = null;
  render();
  try{
    const res = await rpc(action, payload);
    STATE.saveError = null;
    if(res && res.revision){
      STATE.revision = res.revision;
      STATE.staleRevision = null;
    }
    return res;
  }catch(err){
    let message = String(err.message || err);
    if(err.probablyRan){
      message = 'The reply was lost on the way back, but the request did reach Google and the save ' +
        'has probably gone through. Reload before trying again, so you do not record it twice. ' +
        '(' + message + ')';
    }
    if(o.inModal) STATE.modalError = message;
    else{
      STATE.saveError = {
        message: message, label: label,
        retry: err.probablyRan ? null : function(){ return mutate(label, action, payload, opts); }
      };
      toast(message, true);
    }
    throw err;
  }finally{
    STATE.busy = null;
    STATE.modalBusy = false;
  }
}

/* ---------------- Connection check ----------------
   Probes both hops and interprets the result, so a network team is handed
   evidence rather than a guess. */
async function connectionCheck(){
  const url = backendUrl();
  const lines = [
    'PaySync connection check',
    'When    : ' + new Date().toISOString(),
    'Page    : ' + location.origin,
    'Backend : ' + (url || '(not set)'),
    ''
  ];
  if(!url){
    lines.push('No backend URL is configured, so there is nothing to test.');
    lines.push('Whoever published this file needs to set PAYSYNC_BACKEND_URL near the top of it.');
    return lines;
  }
  if(!isValidBackendUrl(url)){
    lines.push('That is not an Apps Script Web App address. It must look like');
    lines.push('  https://script.google.com/macros/s/AKfy…/exec');
    return lines;
  }

  const probe = async function(label, init){
    const started = Date.now();
    try{
      const res = await fetch(url, init);
      const took = Date.now() - started;
      const body = await res.text();
      let shape;
      try{
        const parsed = JSON.parse(body);
        shape = (parsed.result && parsed.result.app === 'paysync') ? 'PaySync JSON'
          : (parsed.error ? 'JSON error: ' + parsed.error : 'JSON, unrecognised');
      }catch(e){
        shape = /<html|<!doctype/i.test(body) ? 'an HTML page (usually a Google sign-in)' : 'not JSON';
      }
      lines.push(label + ': HTTP ' + res.status + ' in ' + took + 'ms');
      lines.push('        replied from : ' + (res.url || '(not reported)'));
      lines.push('        body         : ' + shape);
      return {status:res.status, finalUrl:res.url || '', shape:shape};
    }catch(err){
      lines.push(label + ': could not connect (' + (Date.now() - started) + 'ms)');
      lines.push('        ' + String(err.message || err));
      return {status:0, finalUrl:'', shape:'no reply'};
    }
  };

  const get = await probe('GET   ', {method:'GET', redirect:'follow'});
  lines.push('');
  const post = await probe('POST  ', {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'getLoginContext'}),
    redirect:'follow'
  });

  lines.push('');
  lines.push('What this means:');
  const reachedContentHost = (get.finalUrl + post.finalUrl).indexOf('googleusercontent') >= 0;

  if(post.shape.indexOf('PaySync JSON') >= 0){
    lines.push('  The backend is reachable from this device and answering normally.');
  }else if(post.shape.indexOf('JSON error') >= 0){
    lines.push('  The backend is reachable — it answered with an application error, which is');
    lines.push('  printed above. That is a Sheet or configuration problem, not a network one.');
  }else if(post.status === 0 && get.status === 0){
    lines.push('  Nothing answered at all — this device is offline, or script.google.com is blocked.');
  }else if(post.status === 404 || get.status === 404){
    lines.push('  Something answered but rejected the one-time key in Google’s redirect.');
    lines.push('  That key is good for a single request. Anything on this network that follows or');
    lines.push('  pre-fetches redirects — a proxy, web filter, or security scanner — spends it first,');
    lines.push('  so the browser then finds it used.');
    lines.push('  Decisive test: load this page on a phone hotspot. If it works there, it is the network.');
  }else if(post.shape.indexOf('HTML') >= 0){
    lines.push('  A Google sign-in page came back instead of data. Re-deploy the Web App with');
    lines.push('  "Execute as: Me" and "Who has access: Anyone".');
  }else{
    lines.push('  Unexpected reply — the HTTP status above is the thing to look into.');
  }
  if(!reachedContentHost && post.status !== 0){
    lines.push('  Note: nothing replied from script.googleusercontent.com. Apps Script always serves');
    lines.push('  replies from there, so it looks like that host was never reached.');
  }

  lines.push('');
  lines.push('Both hosts must be reachable AND exempt from redirect pre-fetching / inspection:');
  lines.push('  script.google.com');
  lines.push('  script.googleusercontent.com');
  return lines;
}

/* ============================================================
   STATE
   ============================================================ */
const VIEWS = ['dash','changes','payroll','security','consolidated','journal','bu',
  'schemes','history','structure','proration','recon','admin'];

const VIEW_LABELS = {
  dash:'Dashboard', changes:'Changes', payroll:'Payroll Register',
  security:'Security Register', consolidated:'Consolidated', journal:'Journal Postings',
  bu:'BG Cost Analysis', schemes:'Deduction Schemes', history:'Audit Trail',
  structure:'Salary Structure', proration:'Payroll Proration', recon:'Reconciliation',
  admin:'Administration'
};

/* Every record view carries its own filters, sort, and page — and each
   remembers its own page, so switching screens does not lose your place
   (gap G1). Changing any filter or sort returns that view to page one. */
function newRegisterFilter(){

}

const STATE = {
  loading: true,
  bootstrapped: false,
  fatalError: null,
  needsAccessCode: false,
  needsSetup: false,
  setupMessage: '',
  session: null,
  login: {step:'email', email:'', busy:false, error:null, resendIn:0, needsBootstrap:false,

  view: 'dash',
  period: '',
  periods: [],
  periodRow: null,
  staff: [],
  movements: [],
  schemes: [],
  schemeLedger: [],
  proration: [],
  reconciliation: null,
  journalSummary: null,
  refData: null,
  salaryStructure: [],
  directory: [],
  settings: {},
  revision: 0,

  jnl: {q:'', category:'', section:'', businessUnit:'', page:1, pageSize:200,
        loading:false, data:null, error:null, key:''},
  hist: {q:'', entity:'', action:'', actorId:'', from:'', to:'', page:1, pageSize:50,
         loading:false, data:null, error:null, key:''},
  sch: {q:'', status:'', page:1, pageSize:25},
  pro: {q:'', status:'', page:1, pageSize:25},
  str: {q:'', page:1, pageSize:25},
  bu:  {bg:''},
  /* Staff picked for a bulk action, by employee number. Deliberately survives
     paging and filtering — you select across pages, then act once — and is
     cleared when the period changes, because a selection from another month
     means nothing here. */

};

function currentCaps(){
  return (STATE.session && STATE.session.capabilities) || {};
}
function can(capability){ return !!currentCaps()[capability]; }
function periodIsOpen(){ return !!STATE.periodRow && STATE.periodRow.status === 'OPEN'; }
/* One place decides whether a write is offered, so a closed period and a
   missing capability read the same to every screen. */
function canEditNow(capability){ return can(capability) && periodIsOpen(); }

/* ============================================================
   FORMATTING
   ------------------------------------------------------------
   Naira, not the bare "N" the prototype printed everywhere including on
   payslips staff receive (defect D11).
   ============================================================ */
const NAIRA = '₦';

function n(v, d){
  const dp = d === undefined ? 2 : d;
  if(v === null || v === undefined || v === '' || isNaN(v)) return '';
  return Number(v).toLocaleString('en-NG', {minimumFractionDigits:dp, maximumFractionDigits:dp});
}
/* A zero renders as ₦0.00, not as an empty cell. The prototype blanked zeros,
   which makes "nothing deducted" and "not entered" look identical. */
function money(v, d){
  if(v === null || v === undefined || v === '' || isNaN(v)) return '—';
  return NAIRA + n(v, d);
}
/* For dense table cells, where a column of ₦0.00 is noise. */
function moneyOrBlank(v, d){
  if(!Number(v)) return '';
  return NAIRA + n(v, d);
}
function moneyM(v){
  const num = Number(v) || 0;
  if(Math.abs(num) >= 1e6) return NAIRA + n(num / 1e6, 1) + 'M';
  if(Math.abs(num) >= 1e3) return NAIRA + n(num / 1e3, 0) + 'K';
  return NAIRA + n(num, 0);
}
function signed(v){
  const num = Number(v) || 0;
  if(!num) return '';
  return (num > 0 ? '+' : '−') + n(Math.abs(num));
}
function pct(v, d){
  if(v === null || v === undefined || v === '' || isNaN(v)) return '—';
  return (Number(v) * 100).toFixed(d === undefined ? 2 : d) + '%';
}
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function attr(s){ return esc(s); }
function shortDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso);
  return d.toLocaleString('en-GB', {day:'2-digit', month:'short', year:'numeric',
    hour:'2-digit', minute:'2-digit'});
}
function periodLabel(p){
  const row = STATE.periods.filter(function(x){ return x.period === p; })[0];
  if(row && row.label) return row.label;
  const names = ['January','February','March','April','May','June','July','August',
    'September','October','November','December'];
  const parts = String(p || '').split('-');
  return names[Number(parts[1]) - 1] ? names[Number(parts[1]) - 1] + ' ' + parts[0] : String(p || '');
}
function statusBadge(s){
  const cls = {ACTIVE:'bACT','New Hire':'bNEW',EXITED:'bEXI',SUSPENDED:'bSUS'}[s] || 'bACT';
  return '<span class="bdg ' + cls + '">' + esc(s || 'ACTIVE') + '</span>';
}
function typeBadge(t){
  const cls = t === 'SALES' ? 'bSAL' : t === 'TD SERVICES' ? 'bTDS' : 'bSUP';
  return '<span class="bdg ' + cls + '">' + esc(t || 'SUPPORT') + '</span>';
}
function assertBadge(a, label){
  if(!a) return '';
  return '<span class="assert ' + (a.ok ? 'ok' : 'bad') + '">' +
    (a.ok ? '✓ ' : '⚠ ') + esc(label || a.name) + '</span>';
}

/* ============================================================
   UI STATE PRESERVATION
   ------------------------------------------------------------
   The whole page re-renders through innerHTML, so without this every redraw
   would throw away focus, caret position, scroll and half-typed input.
   Generic, not per-field: it captures every form control with an id, so a new
   screen needs no extra bookkeeping.
   ============================================================ */
function modalKey(){ return STATE.modal ? JSON.stringify(STATE.modal) : ''; }

function captureUiState(){
  const el = document.activeElement;
  const snap = {scrollY:window.scrollY, focusId:null, start:null, end:null,
    scrolls:{}, values:{}, modalKey:modalKey()};
  document.querySelectorAll('input[id],select[id],textarea[id]').forEach(function(f){
    snap.values[f.id] = (f.type === 'checkbox' || f.type === 'radio') ? f.checked : f.value;
  });
  if(el && el.id){
    snap.focusId = el.id;
    try{ snap.start = el.selectionStart; snap.end = el.selectionEnd; }catch(e){}
  }
  document.querySelectorAll('[data-keep-scroll]').forEach(function(node){
    snap.scrolls[node.getAttribute('data-keep-scroll')] = {top:node.scrollTop, left:node.scrollLeft};
  });
  return snap;
}

function restoreUiState(snap){
  if(!snap) return;
  /* Only ever restore into the same dialog — never carry one form's contents
     into another. */
  const sameModal = snap.modalKey === modalKey();
  Object.keys(snap.values).forEach(function(id){
    const f = document.getElementById(id);
    if(!f) return;
    if(!sameModal && f.closest && f.closest('.mdl')) return;
    if(f.type === 'checkbox' || f.type === 'radio') f.checked = snap.values[id];
    else f.value = snap.values[id];
  });
  Object.keys(snap.scrolls).forEach(function(key){
    const node = document.querySelector('[data-keep-scroll="' + key + '"]');
    if(node){ node.scrollTop = snap.scrolls[key].top; node.scrollLeft = snap.scrolls[key].left; }
  });
  if(snap.focusId){
    const f = document.getElementById(snap.focusId);
    if(f){
      f.focus();
      if(snap.start !== null && f.setSelectionRange){
        try{ f.setSelectionRange(snap.start, snap.end); }catch(e){}
      }
    }
  }
  window.scrollTo(0, snap.scrollY);
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  const snap = captureUiState();

  if(STATE.fatalError){
    app.innerHTML = renderFatal();
    renderOverlay();
    renderTransient();
    return;
  }
  if(STATE.needsAccessCode){
    app.innerHTML = renderUnlock();
    renderOverlay(); renderTransient(); restoreUiState(snap);
    return;
  }
  if(!STATE.session){
    app.innerHTML = renderLogin();
    renderOverlay(); renderTransient(); restoreUiState(snap);
    return;
  }
  if(STATE.loading && !STATE.bootstrapped){
    app.innerHTML = '<div class="empty" style="padding-top:80px">Loading PaySync…</div>';
    renderTransient();
    return;
  }

  app.innerHTML = renderTopBar() + renderNav() +
    '<div class="content">' +
      renderAlerts() +
      renderView() +
    '</div>';

  renderOverlay();
  renderTransient();
  restoreUiState(snap);
}

function renderTransient(){
  const box = document.getElementById('transient');
  let html = '';
  if(STATE.busy) html += '<div class="busy"><span class="spin"></span>' + esc(STATE.busy) + '…</div>';
  if(STATE.toast){
    html += '<div class="toast ' + (STATE.toast.bad ? 'err' : 'ok') + '">' + esc(STATE.toast.text) + '</div>';
  }
  box.innerHTML = html;
}

let toastTimer = null;
function toast(text, bad){
  STATE.toast = {text:text, bad:!!bad};
  renderTransient();
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ STATE.toast = null; renderTransient(); }, bad ? 8000 : 3500);
}

/* ============================================================
   SHARED TABLE MACHINERY
   ------------------------------------------------------------
   Filters, sorting and pagination on every record view (gap G1). One
   implementation, so every screen behaves the same way and changing any
   filter or sort always returns to page one.
   ============================================================ */

function paginate(rows, f){
  const pageCount = Math.max(1, Math.ceil(rows.length / f.pageSize));
  const page = Math.min(Math.max(1, f.page), pageCount);
  if(page !== f.page) f.page = page;
  return {
    rows: rows.slice((page - 1) * f.pageSize, page * f.pageSize),
    page: page, pageCount: pageCount, total: rows.length
  };
}

function pagerHtml(scope, p, unit){
  if(p.total === 0) return '<span class="pg">No ' + (unit || 'rows') + '</span>';
  const f = scopeOf(scope);
  const from = (p.page - 1) * f.pageSize + 1;
  const to = Math.min(p.page * f.pageSize, p.total);
  return '<div class="pager">' +
    '<span class="pg">' + from + '–' + to + ' of ' + p.total.toLocaleString() + ' ' + (unit || 'rows') + '</span>' +
    '<button data-page="' + scope + ':1" ' + (p.page <= 1 ? 'disabled' : '') + '>«</button>' +
    '<button data-page="' + scope + ':' + (p.page - 1) + '" ' + (p.page <= 1 ? 'disabled' : '') + '>‹</button>' +
    '<span class="pg">' + p.page + ' / ' + p.pageCount + '</span>' +
    '<button data-page="' + scope + ':' + (p.page + 1) + '" ' + (p.page >= p.pageCount ? 'disabled' : '') + '>›</button>' +
    '<button data-page="' + scope + ':' + p.pageCount + '" ' + (p.page >= p.pageCount ? 'disabled' : '') + '>»</button>' +
    '</div>';
}

function sortHeader(scope, key, label, cls){
  const f = scopeOf(scope);
  const on = f && f.sort === key;
  const ind = on ? (f.dir > 0 ? '▲' : '▼') : '';
  return '<th class="hc sortable ' + (cls || '') + '" data-sort="' + scope + ':' + key + '">' +
    esc(label) + '<span class="sort-ind">' + ind + '</span></th>';
}

function sortRows(rows, sort, dir){
  return rows.slice().sort(function(a, b){
    const av = a[sort], bv = b[sort];
    if(typeof av === 'number' || typeof bv === 'number'){
      return ((Number(av) || 0) - (Number(bv) || 0)) * dir;
    }
    return String(av === null || av === undefined ? '' : av)
      .localeCompare(String(bv === null || bv === undefined ? '' : bv)) * dir;
  });
}

function selectHtml(id, options, value, opts){
  const o = opts || {};
  return '<select id="' + attr(id) + '"' + (o.act ? ' data-act="' + attr(o.act) + '"' : '') +
    (o.disabled ? ' disabled' : '') + '>' +
    options.map(function(opt){
      const v = Array.isArray(opt) ? opt[0] : opt;
      const l = Array.isArray(opt) ? opt[1] : opt;
      return '<option value="' + attr(v) + '"' + (String(v) === String(value) ? ' selected' : '') + '>' +
        esc(l) + '</option>';
    }).join('') + '</select>';
}

/* Filters and page size live in the URL of the view state rather than the DOM,
   so a re-render never loses them. */
function setFilter(scope, key, value){
  const f = scopeOf(scope);
  if(!f) return;
  f[key] = value;
  /* Any filter or sort change returns to page one — otherwise you land on
     page 7 of a 2-page result and see nothing. */
  if(key !== 'page') f.page = 1;
}

/* Charts are inline SVG. The prototype loaded Chart.js from a CDN, so a
   blocked or slow host left the dashboard blank (defect C8 / gap G19).
   Nothing here reaches the network. */
function barChart(series, opts){
  const o = opts || {};
  const w = 100, h = 100;
  const max = Math.max.apply(null, series.map(function(s){ return Math.abs(s.value); }).concat([1]));
  const bw = w / series.length;
  return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" ' +
      'role="img" aria-label="' + attr(o.label || 'chart') + '">' +
    [0.25, 0.5, 0.75].map(function(g){
      return '<line class="grid" x1="0" y1="' + (h * g) + '" x2="' + w + '" y2="' + (h * g) +
        '" vector-effect="non-scaling-stroke"/>';
    }).join('') +
    series.map(function(s, i){
      const bh = Math.max(0.6, (Math.abs(s.value) / max) * (h - 14));
      return '<rect x="' + (i * bw + bw * 0.18) + '" y="' + (h - bh) + '" width="' + (bw * 0.64) +
        '" height="' + bh + '" fill="' + attr(s.colour || 'var(--w)') + '" rx="0.8"/>';
    }).join('') +
    '</svg>' +
    '<div class="legend">' + series.map(function(s){
      return '<span><i style="background:' + attr(s.colour || 'var(--w)') + '"></i>' +
        esc(s.label) + ' ' + esc(moneyM(s.value)) + '</span>';
    }).join('') + '</div>';
}

function stackedBarChart(rows, opts){
  const o = opts || {};
  const w = 100, h = 100;
  const max = Math.max.apply(null, rows.map(function(r){ return r.a + r.b; }).concat([1]));
  const bw = w / Math.max(rows.length, 1);
  return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" ' +
      'role="img" aria-label="' + attr(o.label || 'chart') + '">' +
    rows.map(function(r, i){
      const ah = (r.a / max) * (h - 8);
      const bh = (r.b / max) * (h - 8);
      const x = i * bw + bw * 0.18;
      const bwid = bw * 0.64;
      return '<rect x="' + x + '" y="' + (h - ah) + '" width="' + bwid + '" height="' + ah +
          '" fill="' + attr(r.colour) + '"/>' +
        '<rect x="' + x + '" y="' + (h - ah - bh) + '" width="' + bwid + '" height="' + bh +
          '" fill="' + attr(r.colour) + '" opacity="0.38"/>';
    }).join('') +
    '</svg>' +
    '<div class="legend"><span><i style="background:var(--w)"></i>Direct</span>' +
      '<span><i style="background:var(--w);opacity:.38"></i>Indirect (allocated)</span></div>' +
    '<div class="legend">' + rows.map(function(r){
      return '<span><i style="background:' + attr(r.colour) + '"></i>' + esc(r.label) + '</span>';
    }).join('') + '</div>';
}

function signedM(v){
  const num = Number(v) || 0;
  return (num >= 0 ? '+' : '−') + moneyM(Math.abs(num));
}
function signedMoney(v){
  if(v === null || v === undefined) return '—';
  const num = Number(v) || 0;
  return (num >= 0 ? '+' : '−') + money(Math.abs(num));
}
function previousPeriodOf(p){
  const parts = String(p || '').split('-');
  let y = Number(parts[0]), m = Number(parts[1]) - 1;
  if(m < 1){ m = 12; y--; }
  return y + '-' + String(m).padStart(2, '0');
}

/* ---------------- Changes ---------------- */
const MOVEMENT_LABELS = {
  A:'A — Addition (new hire / uplift)',
  B:'B — Addition (scheme completed / reinstatement)',
  C:'C — Deduction (exit / suspension / new scheme)',
  D:'D — Deduction (penalty / JOI / other)',
  PROMO:'Promotion — enter the new net pay',
  CONF:'Confirmation — enter the new net pay'
};
const ADDITION_TYPES = {A:1, B:1};

function viewChanges(){
  const f = STATE.chg;
  const staffById = staffIndex();

  let rows = STATE.movements.slice();
  if(!f.showReversed) rows = rows.filter(function(m){ return !m.reversedAt; });
  if(f.type) rows = rows.filter(function(m){ return m.type === f.type; });
  if(f.q){
    const q = f.q.toUpperCase();
    rows = rows.filter(function(m){
      const emp = staffById[m.emp_no];
      const name = m.name || (emp && emp.name) || '';
      return (m.emp_no || '').toUpperCase().indexOf(q) >= 0 ||
        name.toUpperCase().indexOf(q) >= 0 ||
        (m.reason || '').toUpperCase().indexOf(q) >= 0 ||
        (m.createdBy || '').toUpperCase().indexOf(q) >= 0;
    });
  }
  /* New hires first — they are the entries still awaiting a status change —
     then recorded movements newest first. */
  rows.sort(function(a, b){
    if(!!a.derived !== !!b.derived) return a.derived ? -1 : 1;
    return Number(b.seq || 0) - Number(a.seq || 0);
  });
  const p = paginate(rows, f);

  const live = STATE.movements.filter(function(m){ return !m.reversedAt; });
  /* A new hire's whole salary is new cost this month, but it is not an
     adjustment anyone typed — so it is counted separately rather than mixed in
     with the uplifts and penalties. */
  const hires = live.filter(function(m){ return m.derived; });
  const recorded = live.filter(function(m){ return !m.derived; });
  const sum = function(list, field){
    return list.reduce(function(a, m){ return a + Number(m[field] || 0); }, 0);
  };
  const totals = {
    hirePay: sum(hires, 'pay'),
    hireSec: sum(hires, 'sec'),
    addPay: sum(recorded.filter(function(m){ return ADDITION_TYPES[m.type]; }), 'pay'),
    addSec: sum(recorded.filter(function(m){ return ADDITION_TYPES[m.type]; }), 'sec'),
    dedPay: sum(recorded.filter(function(m){ return m.type === 'C' || m.type === 'D'; }), 'pay'),
    dedSec: sum(recorded.filter(function(m){ return m.type === 'C' || m.type === 'D'; }), 'sec')
  };

  return '<div class="sec-title">Movements &amp; changes <span class="sub">' +
      esc(periodLabel(STATE.period)) + '</span>' +
      (canEditNow('editMovement')
        ? '<button class="btn btn-f" data-act="new-movement">+ Add movement</button>' : '') +
    '</div>' +
    userBar() +

    '<div class="krow">' +
      kpi(hires.length, 'New hires', 'gn',
        hires.length ? 'Still to be set active' : 'None outstanding') +
      kpi(money(totals.hirePay), 'New hire payroll', 'gn', 'Their grade pay') +
      kpi(money(totals.hireSec), 'New hire security', 'gn', 'Their grade pay') +
      kpi(recorded.length, 'Recorded movements', 'wn', 'Typed in this period') +
      kpi(money(totals.addPay), 'Payroll additions', 'gn', 'A and B types') +
      kpi(money(totals.dedPay), 'Payroll deductions', 'rd', 'C and D types') +
      kpi(money(totals.addSec), 'Security additions', 'gn', 'A and B types') +
      kpi(money(totals.dedSec), 'Security deductions', 'rd', 'C and D types') +
      kpi(STATE.movements.filter(function(m){ return m.reversedAt; }).length, 'Reversed', 'am',
        'Kept for audit, not deleted') +
    '</div>' +
    (hires.length
      ? '<div class="note green">' + hires.length + ' member' + (hires.length === 1 ? '' : 's') +
        ' of staff are still marked <strong>New Hire</strong>, so their full grade pay is counted ' +
        'here as an addition. Set someone\u2019s status to <strong>Active</strong> on their staff ' +
        'record and they drop off this list.</div>'
      : '') +

    '<div class="ctrls">' +
      '<input type="text" id="chg-q" placeholder="Search name, employee no, reason, author…" ' +
        'data-filter="chg:q" value="' + attr(f.q) + '">' +
      selectHtml('chg-type', [['','All change types']].concat(Object.keys(MOVEMENT_LABELS)
        .map(function(t){ return [t, MOVEMENT_LABELS[t]]; })), f.type, {act:'filter:chg:type'}) +
      '<label><input type="checkbox" id="chg-rev" data-filter-check="chg:showReversed"' +
        (f.showReversed ? ' checked' : '') + '> Show reversed</label>' +
      selectHtml('chg-size', [[25,'25 per page'],[50,'50'],[100,'100']], f.pageSize,
        {act:'filter:chg:pageSize'}) +
      '<button class="btn btn-w" data-act="export-changes">Export CSV</button>' +
    '</div>' +

    (p.total === 0
      ? '<div class="tw"><div class="empty">No movements match. ' +
        (canEditNow('editMovement') ? 'Use “Add movement” above.' : '') + '</div></div>'
      : '<div class="tw"><div class="ts" data-keep-scroll="chg">' +
        '<table><thead><tr>' +
          '<th class="hc">#</th><th class="hc">Employee</th><th class="hc">Name</th>' +
          '<th class="hc c">Type</th><th class="hc r">Payroll</th><th class="hc r">Security</th>' +
          '<th class="hc">Reason</th><th class="hc">By</th><th class="hc">When</th>' +
          '<th class="hc c">State</th><th class="hc c"></th>' +
        '</tr></thead><tbody>' +
        p.rows.map(function(m){
          const emp = staffById[m.emp_no] || {name:m.emp_no};
          const isAdd = !!ADDITION_TYPES[m.type];
          const cls = m.reversedAt ? 'ded' : (isAdd ? 'earn' : 'ded');
          return '<tr' + (m.reversedAt ? ' style="opacity:.55"' : '') +
              (m.derived ? ' style="background:var(--gnl)"' : '') + '>' +
            '<td class="muted">' + esc(m.derived ? '—' : m.seq) + '</td>' +
            '<td class="muted">' + esc(m.emp_no) + '</td>' +
            '<td class="nm" title="' + attr(m.name || emp.name) + '">' +
              esc(m.name || emp.name) + '</td>' +
            '<td class="c"><span class="bdg ' + (isAdd ? 'bNEW' : 'bEXI') + '">' + esc(m.type) + '</span></td>' +
            '<td class="' + cls + '">' + esc(m.pay ? (isAdd ? '+' : '−') + money(m.pay) : '') + '</td>' +
            '<td class="' + cls + '">' + esc(m.sec ? (isAdd ? '+' : '−') + money(m.sec) : '') + '</td>' +
            '<td title="' + attr(m.reason) + '" style="max-width:260px">' + esc(m.reason) + '</td>' +
            '<td class="muted">' + esc(m.createdBy) + '</td>' +
            '<td class="muted">' + esc(shortDate(m.createdAt)) + '</td>' +
            '<td class="c">' + (m.derived
              ? '<span class="bdg bNEW" title="Derived from their New Hire status — not a typed ' +
                'movement. Set them Active and this drops off.">NEW HIRE</span>'
              : m.reversedAt
              ? '<span class="bdg bEXI" title="Reversed by ' + attr(m.reversedBy) + ' — ' +
                attr(m.reversalNote) + '">REVERSED</span>'
              : '<span class="bdg bNEW">LIVE</span>') + '</td>' +
            '<td class="c">' + (m.derived
              /* Not reversible — it is resolved by changing the person's
                 status, so the button goes where that is done. */
              ? (canEditNow('editStaff')
                  ? '<button class="btn btn-sm btn-w" data-act="edit-staff:' + attr(m.emp_no) +
                    '">Set active</button>'
                  : '')
              : (!m.reversedAt && canEditNow('editMovement')
                  ? '<button class="btn btn-sm btn-r" data-act="reverse-movement:' + attr(m.id) +
                    '">Reverse</button>'
                  : '')) + '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div>' +
        '<div class="tf">' + pagerHtml('chg', p, 'movements') +
          '<span>Reversals keep their row — nothing is deleted</span></div></div>');
}

function kpi(value, label, cls, sub){
  return '<div class="kpi ' + cls + '"><div class="kpi-l">' + esc(label) + '</div>' +
    '<div class="kpi-v" style="font-size:16px">' + esc(String(value)) + '</div>' +
    '<div class="kpi-s">' + esc(sub || '') + '</div></div>';
}

function selectedEmpNos(){
  return Object.keys(STATE.sel).filter(function(k){ return STATE.sel[k]; });
}
function selCount(){ return selectedEmpNos().length; }

function staffIndex(){
  const idx = {};
  STATE.staff.forEach(function(s){ idx[s.emp_no] = s; });
  return idx;
}

/* ---------------- Registers ---------------- */
const REGISTER_TITLES = {
  payroll:'Payroll register', security:'Security register', consolidated:'Consolidated register'
};

function filteredStaff(mode){
  const f = STATE.reg[mode];
  const q = (f.q || '').toUpperCase();
  let rows = STATE.staff.filter(function(e){
    if(q && (e.emp_no || '').toUpperCase().indexOf(q) < 0 &&
       (e.name || '').toUpperCase().indexOf(q) < 0) return false;
    if(f.grp && e.salary_group !== f.grp) return false;
    if(f.type && e.staff_type !== f.type) return false;
    if(f.bu && e.bus_unit !== f.bu) return false;
    if(f.status && (e.status || 'ACTIVE') !== f.status) return false;
    return true;
  });
  return sortRows(rows, f.sort, f.dir);
}

function registerControls(mode){
  const f = STATE.reg[mode];
  const ref = STATE.refData || {};
  return '<div class="ctrls">' +
    '<input type="text" id="' + mode + '-q" placeholder="Search name or employee no…" ' +
      'data-filter="reg.' + mode + ':q" value="' + attr(f.q) + '">' +
    selectHtml(mode + '-grp', [['','All salary groups']].concat((ref.salaryGroups || [])

    selectHtml(mode + '-type', [['','Sales + support + TDS'],['SALES','Sales only'],
      ['SUPPORT','Support only'],['TD SERVICES','TD Services']], f.type,
      {act:'filter:reg.' + mode + ':type'}) +
    selectHtml(mode + '-bu', [['','All business units']].concat((ref.businessUnits || [])
      .map(function(b){ return [b, b]; })), f.bu, {act:'filter:reg.' + mode + ':bu'}) +
    selectHtml(mode + '-status', [['','Any status'],['ACTIVE','Active'],['New Hire','New hire'],
      ['SUSPENDED','Suspended'],['EXITED','Exited']], f.status, {act:'filter:reg.' + mode + ':status'}) +
    selectHtml(mode + '-size', [[25,'25 per page'],[50,'50'],[100,'100'],[250,'250']], f.pageSize,
      {act:'filter:reg.' + mode + ':pageSize'}) +
    '<button class="btn btn-w" data-act="export-register:' + mode + '">Export CSV</button>' +

/* ---------------- Journal ----------------
   Paged on the SERVER. 4,215 rows for 317 staff, and it grows every period, so
   it is never shipped whole. The prototype built all of them into the DOM and
   cached them in a variable it never invalidated (defect D8) — here an open
   period derives fresh on every request and a closed one reads rows that
   cannot change, so there is no cache to go stale. */
function journalKey(){
  const f = STATE.jnl;
  return [STATE.period, f.q, f.category, f.section, f.businessUnit, f.page, f.pageSize,
    STATE.revision].join('|');
}

async function ensureJournal(){
  const key = journalKey();
  if(STATE.jnl.key === key || STATE.jnl.loading) return;
  STATE.jnl.loading = true;
  STATE.jnl.error = null;
  render();
  try{
    const f = STATE.jnl;
    const res = await rpc('getJournalPage', {
      period: STATE.period, page: f.page, pageSize: f.pageSize,
      filters: {q:f.q, category:f.category, section:f.section, businessUnit:f.businessUnit}
    });
    STATE.jnl.data = res;
    STATE.jnl.key = key;
  }catch(err){
    STATE.jnl.error = String(err.message || err);
  }finally{
    STATE.jnl.loading = false;
    render();
  }
}

  const f = STATE.jnl;

  const controls = '<div class="ctrls">' +

function viewBusinessGroups(){

  const a = r.allocation;
  const filterBg = STATE.bu.bg;
  const shown = filterBg ? a.groups.filter(function(g){ return g.bg === filterBg; }) : a.groups;
  const maxTotal = Math.max.apply(null, a.groups.map(function(g){ return g.total; }).concat([1]));

  const direct = STATE.staff.filter(function(e){
    return e.status !== 'EXITED' && e.staff_type !== 'SUPPORT' &&
      (!filterBg || e.resolvedBg === filterBg);

    return String(x.resolvedBg).localeCompare(String(y.resolvedBg)) ||
      String(x.bus_unit).localeCompare(String(y.bus_unit));

/* ---------------- Deduction schemes ---------------- */
function viewSchemes(){
  const f = STATE.sch;
  const idx = staffIndex();
  const ledgerThisPeriod = {};
  STATE.schemeLedger.forEach(function(l){
    if(!l.reversedAt) ledgerThisPeriod[l.schemeId] = (ledgerThisPeriod[l.schemeId] || 0) + Number(l.amount || 0);
  });

  let rows = STATE.schemes.slice();
  if(f.status === 'active') rows = rows.filter(function(s){ return s.active && !s.reversedAt; });
  if(f.status === 'completed') rows = rows.filter(function(s){ return !s.active && !s.reversedAt; });
  if(f.status === 'cancelled') rows = rows.filter(function(s){ return !!s.reversedAt; });
  if(f.q){
    const q = f.q.toUpperCase();
    rows = rows.filter(function(s){
      const emp = idx[s.emp_no] || {};
      return (s.emp_no || '').toUpperCase().indexOf(q) >= 0 ||
        ((emp.name) || '').toUpperCase().indexOf(q) >= 0 ||
        (s.type || '').toUpperCase().indexOf(q) >= 0 ||
        (s.description || '').toUpperCase().indexOf(q) >= 0 ||
        (s.account || '').toUpperCase().indexOf(q) >= 0;
    });
  }
  const p = paginate(rows, f);

  const live = STATE.schemes.filter(function(s){ return s.active && !s.reversedAt; });
  const thisMonth = Object.keys(ledgerThisPeriod).reduce(function(a, k){
    return a + ledgerThisPeriod[k]; }, 0);

  return '<div class="sec-title">Deduction schemes <span class="sub">' +
      esc(periodLabel(STATE.period)) + '</span>' +
      (canEditNow('editScheme')
        ? '<button class="btn btn-f" data-act="new-scheme">+ Add scheme</button>' : '') +
    '</div>' +
    userBar() +
    '<div class="note blue">A scheme is an amortising balance. One instalment is taken when it starts, ' +
      'and one more each time a new payroll period is created — that is what makes the balance run down ' +
      'and the scheme complete itself at zero. Instalments already posted into a closed period stay ' +
      'posted; cancelling only takes back the instalment in the period you are working in.</div>' +

    '<div class="krow">' +
      kpi(STATE.schemes.length, 'Schemes', 'wn', 'All time') +
      kpi(live.length, 'Active', 'gn', 'Still running') +
      kpi(money(thisMonth), 'Taken this period', 'am', 'From the scheme ledger') +
      kpi(money(live.reduce(function(a, s){ return a + Number(s.balance || 0); }, 0)),
        'Outstanding', 'rd', 'Balance remaining') +
    '</div>' +

    '<div class="ctrls">' +
      '<input type="text" id="sch-q" placeholder="Search employee, type, description, account…" ' +
        'data-filter="sch:q" value="' + attr(f.q) + '">' +
      selectHtml('sch-status', [['','All states'],['active','Active'],['completed','Completed'],
        ['cancelled','Cancelled']], f.status, {act:'filter:sch:status'}) +
      selectHtml('sch-size', [[25,'25 per page'],[50,'50'],[100,'100']], f.pageSize,
        {act:'filter:sch:pageSize'}) +
      '<button class="btn btn-w" data-act="export-schemes">Export CSV</button>' +
    '</div>' +

    (p.total === 0
      ? '<div class="tw"><div class="empty">No deduction schemes match.</div></div>'
      : '<div class="tw"><div class="ts" data-keep-scroll="sch"><table><thead><tr>' +
        '<th class="hc">Emp no</th><th class="hc">Name</th><th class="hc">Type</th>' +
        '<th class="hc">Description</th><th class="hc r">Total</th><th class="hc r">Monthly</th>' +
        '<th class="hc r">Taken this period</th><th class="hc r">Balance</th>' +
        '<th class="hc r">Paid</th><th class="hc r">Left</th><th class="hc">Started</th>' +
        '<th class="hc">Loan account</th><th class="hc c">State</th><th class="hc c"></th>' +
      '</tr></thead><tbody>' +
      p.rows.map(function(s){
        const emp = idx[s.emp_no] || {name:s.emp_no};
        const taken = ledgerThisPeriod[s.id] || 0;
        const left = Number(s.monthlyDeduction) > 0
          ? Math.ceil(Number(s.balance) / Number(s.monthlyDeduction)) : 0;
        const state = s.reversedAt ? ['bEXI','CANCELLED'] : s.active ? ['bNEW','ACTIVE'] : ['bACT','COMPLETED'];
        return '<tr' + (s.reversedAt ? ' style="opacity:.55"' : '') + '>' +

          '<td>' + esc(s.type) + '</td>' +
          '<td title="' + attr(s.description) + '" style="max-width:200px">' + esc(s.description || '—') + '</td>' +
          '<td class="r">' + esc(money(s.totalAmount)) + '</td>' +
          '<td class="r">' + esc(money(s.monthlyDeduction)) + '</td>' +
          '<td class="' + (taken ? 'emp-acct' : 'r') + '">' + esc(taken ? money(taken) : '—') + '</td>' +
          '<td class="ded">' + esc(money(s.balance)) + '</td>' +
          '<td class="r">' + esc(s.paymentsCount) + ' / ' + esc(s.months) + '</td>' +
          '<td class="r">' + esc(s.active ? left : '—') + '</td>' +

          '<td class="c"><span class="bdg ' + state[0] + '">' + state[1] + '</span></td>' +

/* ---------------- Audit trail ---------------- */
function historyKey(){
  const f = STATE.hist;
  return [STATE.period, f.q, f.entity, f.action, f.actorId, f.from, f.to, f.page, f.pageSize,
    STATE.revision].join('|');
}

async function ensureHistory(){
  const key = historyKey();
  if(STATE.hist.key === key || STATE.hist.loading) return;
  STATE.hist.loading = true;
  STATE.hist.error = null;
  render();
  try{
    const f = STATE.hist;
    const res = await rpc('getHistoryPage', {
      page: f.page, pageSize: f.pageSize,
      filters: {q:f.q, entity:f.entity, action:f.action, actorId:f.actorId,
        from:f.from, to:f.to, period:f.periodOnly ? STATE.period : ''}
    });
    STATE.hist.data = res;
    STATE.hist.key = key;
  }catch(err){
    STATE.hist.error = String(err.message || err);
  }finally{
    STATE.hist.loading = false;
    render();
  }
}

function viewHistory(){
  ensureHistory();
  const f = STATE.hist;
  const d = f.data;

  const controls = '<div class="ctrls">' +
    '<input type="text" id="hist-q" placeholder="Search record, person, action, detail…" ' +
      'data-filter="hist:q" value="' + attr(f.q) + '">' +
    selectHtml('hist-entity', [['','All record types']].concat(((d && d.entities) || [])
      .map(function(e){ return [e, e]; })), f.entity, {act:'filter:hist:entity'}) +
    selectHtml('hist-action', [['','All actions']].concat(((d && d.actions) || [])
      .map(function(a){ return [a, a]; })), f.action, {act:'filter:hist:action'}) +
    selectHtml('hist-actor', [['','Anyone']].concat(STATE.directory.map(function(u){
      return [u.userId, u.name]; })), f.actorId, {act:'filter:hist:actorId'}) +
    '<label>From <input type="date" id="hist-from" data-filter="hist:from" value="' +
      attr(f.from) + '"></label>' +
    '<label>To <input type="date" id="hist-to" data-filter="hist:to" value="' + attr(f.to) + '"></label>' +
    selectHtml('hist-size', [[50,'50 per page'],[100,'100'],[250,'250']], f.pageSize,
      {act:'filter:hist:pageSize'}) +
    '<button class="btn btn-ghost" data-act="clear-history-filters">Clear</button>' +
    '<button class="btn btn-w" data-act="export-history">Export CSV</button>' +
    '</div>';

  let table;
  if(f.error){
    table = '<div class="tw"><div class="empty" style="color:var(--red)">' + esc(f.error) + '</div></div>';
  }else if(!d || f.loading){
    table = '<div class="tw"><div class="empty">Loading audit trail…</div></div>';
  }else if(d.total === 0){
    table = '<div class="tw"><div class="empty">No audit entries match these filters.</div></div>';
  }else{
    table = '<div class="tw"><div class="ts" data-keep-scroll="hist"><table><thead><tr>' +
      '<th class="hc">When</th><th class="hc">Who</th><th class="hc c">Role</th>' +
      '<th class="hc">Period</th><th class="hc">Record</th><th class="hc">Reference</th>' +
      '<th class="hc">Action</th><th class="hc">Detail</th>' +
      '<th class="hc">Was</th><th class="hc">Became</th>' +
    '</tr></thead><tbody>' +
      d.rows.map(function(h){
        return '<tr><td class="muted">' + esc(shortDate(h.ts)) + '</td>' +
          '<td style="font-weight:600">' + esc(h.actor) + '</td>' +
          '<td class="c"><span class="role-badge rb-' + esc(h.actorRole || 'VIEW') + '">' +
            esc(h.actorRole || '—') + '</span></td>' +
          '<td class="muted">' + esc(h.period) + '</td>' +
          '<td>' + esc(h.entity) + '</td>' +
          '<td class="muted">' + esc(h.entityId) + '</td>' +
          '<td><span class="bdg bINF">' + esc(h.action) + '</span></td>' +
          '<td title="' + attr(h.detail) + '" style="max-width:340px">' + esc(h.detail) + '</td>' +
          '<td class="muted" title="' + attr(h.oldValue) + '" style="max-width:180px">' +
            esc(h.oldValue) + '</td>' +
          '<td class="muted" title="' + attr(h.newValue) + '" style="max-width:180px">' +
            esc(h.newValue) + '</td></tr>';
      }).join('') +
      '</tbody></table></div><div class="tf">' +
        '<div class="pager"><span class="pg">' +
          ((d.page - 1) * d.pageSize + 1) + '–' + Math.min(d.page * d.pageSize, d.total) +
          ' of ' + d.total.toLocaleString() + ' entries</span>' +
        '<button data-page="hist:1" ' + (d.page <= 1 ? 'disabled' : '') + '>«</button>' +
        '<button data-page="hist:' + (d.page - 1) + '" ' + (d.page <= 1 ? 'disabled' : '') + '>‹</button>' +
        '<span class="pg">' + d.page + ' / ' + d.pageCount + '</span>' +
        '<button data-page="hist:' + (d.page + 1) + '" ' + (d.page >= d.pageCount ? 'disabled' : '') + '>›</button>' +
        '<button data-page="hist:' + d.pageCount + '" ' + (d.page >= d.pageCount ? 'disabled' : '') + '>»</button>' +
        '</div><span>Append-only — nothing here is ever edited or removed</span>' +
      '</div></div>';
  }

  return '<div class="sec-title">Audit trail <span class="sub">every write, who made it, and what ' +
      'it changed</span></div>' + controls + table;
}

/* ============================================================
   MODALS
   ------------------------------------------------------------
   A modal is described by STATE.modal and rendered from it, so a redraw can
   never destroy an open form: captureUiState puts every typed value back, and
   the background poll never re-renders while one is open.
   ============================================================ */
function renderOverlay(){
  const box = document.getElementById('overlay');
  if(!STATE.modal){ box.innerHTML = ''; return; }
  const m = STATE.modal;
  const body = {
    payslip: modalPayslip, movement: modalMovement, staff: modalStaff,
    scheme: modalScheme, proration: modalProration, structure: modalStructure,
    user: modalUser, period: modalPeriod, controls: modalControls,
    confirm: modalConfirm, periods: modalPeriods, account: modalAccount,
    bulkPayslip: modalBulkPayslip, renumber: modalRenumber, schemeEdit: modalSchemeEdit,
    fieldChange: modalFieldChange,
    diagnostics: modalDiagnostics
  }[m.kind];
  box.innerHTML = body ? body(m) : '';
}

function modalShell(opts){
  return '<div class="ov" data-act="modal-backdrop"><div class="mdl ' + (opts.cls || '') + '">' +
    '<div class="mdl-h"><div><h3>' + esc(opts.title) + '</h3>' +
      (opts.sub ? '<p>' + esc(opts.sub) + '</p>' : '') + '</div>' +
      /* A dialog that must not be dismissed hides the control rather than
         showing one that silently does nothing. */
      (opts.noClose ? '' : '<button class="mdl-x" data-act="close-modal">×</button>') + '</div>' +
    '<div class="mdl-b">' +
      (STATE.modalError ? '<div class="alert err"><div>' + esc(STATE.modalError) + '</div></div>' : '') +
      opts.body + '</div>' +
    (opts.footer ? '<div class="mdl-f">' + opts.footer + '</div>' : '') +
    '</div></div>';
}

function busyBtn(label, act, cls){
  return '<button class="btn ' + (cls || 'btn-f') + '" data-act="' + attr(act) + '"' +
    (STATE.modalBusy ? ' disabled' : '') + '>' +
    (STATE.modalBusy ? '<span class="spin"></span> Working…' : esc(label)) + '</button>';
}

/* ---------------- Payslip ---------------- */
function modalPayslip(m){
  const p = m.payslip;
  if(!p) return modalShell({title:'Payslip', body:'<div class="empty">Loading…</div>'});
  const lines = function(list, cls){
    return list.map(function(l){
      return '<div class="ps-line ' + cls + '"><span>' + esc(l.label) +
        (l.code ? ' <small>[' + esc(l.code) + ']</small>' : '') + '</span>' +
        '<span>' + esc(money(l.amount)) + '</span></div>';
    }).join('');
  };
  const adjPay = p.adjustments.filter(function(a){ return a.side === 'pay'; });
  const adjSec = p.adjustments.filter(function(a){ return a.side === 'sec'; });
  const adjLines = function(list){
    return list.map(function(a){
      return '<div class="ps-line ' + (a.sign > 0 ? 'earn' : 'ded') + '"><span>' + esc(a.label) +
        '</span><span>' + (a.sign > 0 ? '+' : '−') + esc(money(a.amount)) + '</span></div>';
    }).join('');
  };

  return modalShell({
    cls:'wide',
    title:'Payslip — ' + p.name,
    sub:BRAND.address + ' · ' + p.label,
    body:
      '<div class="ps-emp">' +
        psField('Employee no', p.emp_no) + psField('Name', p.name) +
        psField('Grade', p.grade || '—') + psField('Salary group', p.salary_group || '—') +
        psField('Business unit', p.bus_unit || '—') + psField('Organisation', p.org || '—') +
        psField('Staff type', p.staff_type || '—') +
        psField('Loan account', p.empAccount || '—') +
      '</div>' +
      '<div class="ps-body">' +
        '<div class="ps-col">' +
          '<div class="ps-col-h pay">▲ Payroll earnings — DR 620100 / CR 230110</div>' +
          (p.payEarnings.length ? lines(p.payEarnings, 'earn')
            : '<div class="ps-line"><span style="color:var(--t3)">No payroll earnings</span><span></span></div>') +
          '<div class="ps-line sub"><span>Total payroll earnings</span><span>' +
            esc(money(p.totalPayEarnings)) + '</span></div>' +
          '<div class="ps-col-h ded">▼ Payroll deductions</div>' +
          (p.payDeductions.length ? lines(p.payDeductions, 'ded')
            : '<div class="ps-line"><span style="color:var(--t3)">No payroll deductions</span><span></span></div>') +
          '<div class="ps-line sub"><span>Total payroll deductions</span><span>' +
            esc(money(p.totalPayDeductions)) + '</span></div>' +
          (adjPay.length ? '<div class="ps-col-h adj">± Adjustments this period</div>' + adjLines(adjPay) : '') +
          '<div class="ps-net"><span>Net payroll</span><span>' + esc(money(p.netPay)) + '</span></div>' +
        '</div>' +
        '<div class="ps-col">' +
          '<div class="ps-col-h sec">▲ Security earnings — DR 620100 / CR 230110</div>' +
          (p.secEarnings.length ? lines(p.secEarnings, 'earn')
            : '<div class="ps-line"><span style="color:var(--t3)">No security earnings</span><span></span></div>') +
          '<div class="ps-line sub"><span>Total security earnings</span><span>' +
            esc(money(p.totalSecEarnings)) + '</span></div>' +
          '<div class="ps-col-h sded">▼ Security deductions</div>' +
          (p.secDeductions.length ? lines(p.secDeductions, 'ded')
            : '<div class="ps-line"><span style="color:var(--t3)">No security deductions</span><span></span></div>') +
          '<div class="ps-line sub"><span>Total security deductions</span><span>' +
            esc(money(p.totalSecDeductions)) + '</span></div>' +
          (adjSec.length ? '<div class="ps-col-h adj">± Adjustments this period</div>' + adjLines(adjSec) : '') +
          '<div class="ps-net sec"><span>Net security</span><span>' + esc(money(p.netSecurity)) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="ps-grand"><span>Grand net pay</span><span>' + esc(money(p.grandNet)) + '</span></div>' +
      '<div class="ps-foot">' +
        (p.employerPension
          ? 'Your employer also pays <strong>' + esc(money(p.employerPension)) + '</strong> into your ' +
            'pension. That is a company cost paid to your pension administrator — it is not part of ' +
            'your net pay, which is why it is shown here rather than in the earnings above.<br>'
          : '') +
        (p.foots.pay && p.foots.security
          ? '<span style="color:var(--grn);font-weight:600">✓ Earnings less deductions equals the net ' +
            'on both sides.</span>'
          : '<span style="color:var(--red);font-weight:700">⚠ This payslip does not foot. Do not issue ' +
            'it — report it.</span>') +
      '</div>',
    footer:
      '<span class="left">' + (p.email ? 'On file: ' + esc(p.email) : 'No email address on file') + '</span>' +
      '<input type="email" id="ps-email" placeholder="staff@tdafrica.com" value="' + attr(p.email) +
        '" style="padding:7px 11px;border:1px solid var(--bdr);border-radius:5px;font-size:12px;' +
        'min-width:220px;font-family:inherit">' +
      (can('sendPayslip') ? busyBtn('Email payslip', 'send-payslip:' + p.emp_no) : '') +
      '<button class="btn btn-w" data-act="print">Print / PDF</button>' +
      '<button class="btn btn-ghost" data-act="close-modal">Close</button>'
  });
}
function psField(label, value){
  return '<div><div class="ps-emp-f">' + esc(label) + '</div>' +
    '<div class="ps-emp-v">' + esc(value) + '</div></div>';
}
