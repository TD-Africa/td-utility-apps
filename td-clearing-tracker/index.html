<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD Clearing Tracker</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f4;
            --bg-tertiary: #fafaf9;
            --bg-success: #f0fdf4;
            --bg-danger: #fef2f2;
            --bg-warning: #fffbeb;
            --bg-info: #eff6ff;
            --text-primary: #1c1917;
            --text-secondary: #78716c;
            --text-tertiary: #a8a29e;
            --text-success: #15803d;
            --text-danger: #b91c1c;
            --text-warning: #b45309;
            --text-info: #1d4ed8;
            --border-primary: #d6d3d1;
            --border-secondary: #e7e5e4;
            --border-tertiary: #f5f5f4;
            --border-danger: #fecaca;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
            --font-mono: "SF Mono", Monaco, "Cascadia Code", monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-tertiary);
            margin: 0;
            padding: 16px;
            line-height: 1.45;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding-bottom: 2rem;
        }

        h1 {
            font-size: 19px;
            font-weight: 500;
            margin: 0;
        }

        h2 {
            font-size: 16px;
            font-weight: 500;
            margin: 0 0 10px;
        }

        h3 {
            font-size: 15px;
            font-weight: 500;
            margin: 0 0 10px;
        }

        p {
            margin: 0;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: 13px;
            border: 0.5px solid var(--border-primary);
            border-radius: 6px;
            padding: 6px 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.15s;
        }

        button {
            cursor: pointer;
            background: var(--bg-secondary);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        button:hover {
            background: var(--bg-tertiary);
            border-color: var(--text-tertiary);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary {
            background: var(--bg-success);
            color: var(--text-success);
            border-color: #86efac;
        }

        button.primary:hover {
            background: #dcfce7;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--text-info);
        }

        textarea {
            width: 100%;
            resize: vertical;
        }

        table {
            border-collapse: collapse;
        }

        th {
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 0.5px solid var(--border-secondary);
            padding: 8px 10px;
            background: var(--bg-secondary);
            white-space: nowrap;
            text-align: left;
        }

        td {
            padding: 7px 10px;
            border-bottom: 0.5px solid var(--border-tertiary);
        }

        .toast {
            position: sticky;
            top: 8px;
            z-index: 100;
            margin-bottom: 12px;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 0.5px solid currentColor;
        }

        .toast.success {
            background: var(--bg-success);
            color: var(--text-success);
        }

        .toast.error {
            background: var(--bg-danger);
            color: var(--text-danger);
        }

        .toast.info {
            background: var(--bg-info);
            color: var(--text-info);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header .sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sync-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
        }

        .sync-pill.idle {
            background: #f0fdf4;
            color: var(--text-success);
        }

        .sync-pill.syncing {
            background: #eff6ff;
            color: var(--text-info);
        }

        .sync-pill.error {
            background: var(--bg-danger);
            color: var(--text-danger);
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .sync-dot.pulse {
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .tabs {
            display: flex;
            border-bottom: 0.5px solid var(--border-secondary);
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            padding: 8px 14px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .tab-btn:hover {
            background: transparent;
            color: var(--text-primary);
        }

        .tab-btn.active {
            border-bottom-color: var(--text-info);
            color: var(--text-primary);
            font-weight: 500;
        }

        .icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            vertical-align: -2px;
        }

        .icon-sm {
            width: 12px;
            height: 12px;
        }

        .icon-lg {
            width: 16px;
            height: 16px;
        }

        .card {
            background: var(--bg-primary);
            border: 0.5px solid var(--border-secondary);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 14px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 12px 14px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-val {
            font-size: 16px;
            font-weight: 500;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .badge {
            padding: 2px 9px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            display: inline-block;
        }

        .progress-bar {
            height: 5px;
            background: var(--bg-secondary);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .danger-card {
            background: var(--bg-danger);
            border: 0.5px solid var(--border-danger);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 14px;
        }

        .filters-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters-row input,
        .filters-row select {
            padding: 7px 10px;
        }

        .filters-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .filters-row label input {
            width: auto;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 0.5px solid var(--border-secondary);
        }

        .table-wrap table {
            font-size: 12px;
            min-width: 100%;
        }

        .report-card {
            background: var(--bg-primary);
            border: 0.5px solid var(--border-secondary);
            border-radius: 12px;
            margin-bottom: 14px;
            overflow: hidden;
        }

        .report-header {
            padding: 12px 16px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 0.5px solid var(--border-secondary);
        }

        .report-header .title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .report-header .count {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            margin-left: 4px;
        }

        .report-body {
            overflow-x: auto;
        }

        .report-body table {
            width: 100%;
            font-size: 12px;
        }

        .text-right {
            text-align: right;
        }

        .text-center {
            text-align: center;
        }

        .text-danger {
            color: var(--text-danger);
        }

        .text-success {
            color: var(--text-success);
        }

        .text-warning {
            color: var(--text-warning);
        }

        .text-secondary {
            color: var(--text-secondary);
        }

        .fw-500 {
            font-weight: 500;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .form-grid .field label {
            font-size: 11px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 3px;
        }

        .form-grid .field input,
        .form-grid .field select {
            width: 100%;
        }

        .header-group-id {
            background: var(--bg-secondary);
        }

        .header-group-dates {
            background: #dbeafe;
        }

        .header-group-cost {
            background: #fef3c7;
        }

        .footer-note {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 20px;
            padding-top: 12px;
            border-top: 0.5px solid var(--border-tertiary);
        }

        .empty-msg {
            padding: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th.sortable:hover {
            color: var(--text-primary);
        }

        .row-overdue {
            background: var(--bg-danger) !important;
        }

        .row-done {
            opacity: 0.55;
        }

        tr:hover td {
            background: rgba(0, 0, 0, 0.02);
        }

        .info-box {
            background: var(--bg-info);
            border-left: 3px solid var(--text-info);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .code-block {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 11px;
            line-height: 1.8;
            font-family: var(--font-mono);
            word-break: break-all;
            color: var(--text-secondary);
        }

        .legend {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            margin-right: 14px;
        }

        .legend-swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            display: inline-block;
        }

        .field-edit {
            padding: 3px 6px !important;
            font-size: 11px !important;
            min-height: 26px;
        }

        .actions-cell {
            white-space: nowrap;
        }

        .actions-cell button {
            font-size: 11px;
            padding: 3px 7px;
            margin-right: 4px;
        }

        .splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 14px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-secondary);
            border-top-color: var(--text-info);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

            const text = await res.text();
            let data;
            try { data = JSON.parse(text); }

                    data.map(r => [r.bl_ref, r.brand, r.product, r.eta_port || "", r.est_delivery || "", Math.abs(daysFromToday(r.est_delivery)) + "d", r.status, pn(r.total_required).toFixed(0), pn(r.act_spent).toFixed(0)]),
                    "overdue_containers");
            } else if (which === "costOverruns")
            {
                const data = rSort(computed.filter(r => pn(r.act_spent) > 0 && pn(r.variance) < 0), state.rptSort.col, state.rptSort.dir);
                exportTableCSV(["BL/TD Reference", "Brand", "Product", "Status", "Total required (₦)", "Actual spent (₦)", "Overrun (₦)"],
                    data.map(r => [r.bl_ref, r.brand, r.product, r.status, pn(r.total_required).toFixed(0), pn(r.act_spent).toFixed(0), Math.abs(pn(r.variance)).toFixed(0)]),
                    "cost_overruns");
            } else if (which === "productSummary")
            {
                const summary = computed.reduce((acc, r) =>
                {
                    const p = r.product || "Unknown";
                    if (!acc[p]) acc[p] = { product: p, brands: new Set(), count: 0, containers: 0, totalReq: 0, totalSpent: 0, statuses: {} };
                    if (r.brand) acc[p].brands.add(r.brand);
                    acc[p].count++;
                    acc[p].containers += (pn(r.ft40) || 0) + (pn(r.ft20) || 0);
                    acc[p].totalReq += pn(r.total_required);
                    acc[p].totalSpent += pn(r.act_spent);
                    acc[p].statuses[r.status] = (acc[p].statuses[r.status] || 0) + 1;
                    return acc;
                }, {});
                const data = Object.values(summary).sort((a, b) => b.totalReq - a.totalReq);
                exportTableCSV(["Product", "Brands", "Shipments", "Total containers", "Total required (₦)", "Total spent (₦)", "Status breakdown"],
                    data.map(r => [r.product, [...r.brands].join("; "), r.count, r.containers, r.totalReq.toFixed(0), r.totalSpent.toFixed(0), Object.entries(r.statuses).filter(([, v]) => v > 0).map(([k, v]) => k + ": " + v).join(", ")]),
                    "product_summary");
            } else if (which === "noEstDelivery")
            {
                const data = computed.filter(r => !r.est_delivery && !["Delivered", "Cancelled"].includes(r.status));
                exportTableCSV(["S/No.", "BL/TD Reference", "Brand", "Product", "ETA to port", "Status"],
                    data.map(r => [r.sno, r.bl_ref, r.brand, r.product, r.eta_port || "", r.status]),
                    "missing_est_delivery");
            }
        }

        function buildKPI()
        {
            const computed = getComputed();
            const delivered = computed.filter(r => r.status === "Delivered" && r.lead_time_act !== null);
            const avgActLT = delivered.length ? Math.round(delivered.reduce((s, r) => s + r.lead_time_act, 0) / delivered.length) : null;
            const deliveredEst = delivered.filter(r => r.lead_time_est !== null);
            const avgEstLT = deliveredEst.length ? Math.round(deliveredEst.reduce((s, r) => s + r.lead_time_est, 0) / deliveredEst.length) : null;
            const onTime = delivered.filter(r => r.lead_time_var !== null && r.lead_time_var <= 0).length;
            const overrunCost = computed.filter(r => pn(r.variance) < 0).length;

            const stats = [
                { label: "Avg estimated lead time", val: avgEstLT !== null ? avgEstLT + "d" : "No data yet", c: "" },
                { label: "Avg actual lead time", val: avgActLT !== null ? avgActLT + "d" : "No data yet", c: (avgActLT !== null && avgEstLT !== null) ? (avgActLT > avgEstLT ? "var(--text-danger)" : "var(--text-success)") : "" },
                { label: "On time delivered", val: delivered.length ? onTime + "/" + delivered.length : "—", c: (delivered.length && onTime === delivered.length) ? "var(--text-success)" : "var(--text-warning)" },
                { label: "Delayed deliveries", val: String(delivered.filter(r => r.lead_time_var > 0).length), c: delivered.filter(r => r.lead_time_var > 0).length > 0 ? "var(--text-danger)" : "var(--text-success)" },
                { label: "Within cost budget", val: state.rows.filter(r => pn(r.variance) >= 0).length + "/" + state.rows.filter(r => pn(r.act_spent) > 0).length, c: "" },
                { label: "Cost overruns", val: String(overrunCost), c: overrunCost > 0 ? "var(--text-danger)" : "var(--text-success)" },
            ];

            let html = `<div class="stat-grid">${stats.map(({ label, val, c }) => `
    <div class="stat-card">
      <div class="stat-label">${escHtml(label)}</div>
      <div class="stat-val" style="color:${c || 'var(--text-primary)'};font-size:18px;">${val}</div>
    </div>`).join("")}</div>`;

            html += `<div class="card">
    <p class="fw-500" style="margin-bottom:6px;">Lead time — all containers</p>
    <p class="text-secondary" style="font-size:12px;margin-bottom:12px;">Fill in 'Est delivery to WH' and 'Actual delivery to WH' in the Register to populate. Positive = delayed, negative = ahead of schedule.</p>
    <div style="overflow-x:auto;"><table style="width:100%;font-size:12px;">
      <thead><tr><th>S/No.</th><th>BL/TD Reference</th><th>Brand</th><th>Product</th><th>ETA to port</th><th>Est delivery WH</th><th>Actual delivery WH</th><th>Est LT</th><th>Act LT</th><th>Variance</th><th>Status</th><th>Cost variance</th></tr></thead>
      <tbody>${computed.length === 0 ? `<tr><td colspan="12" class="empty-msg">No records.</td></tr>` : computed.map(r =>
            {
                const ltV = r.lead_time_var;
                const ltC = ltV === null ? "var(--text-secondary)" : ltV > 0 ? "var(--text-danger)" : ltV < 0 ? "var(--text-success)" : "inherit";
                return `<tr class="${["Delivered", "Cancelled"].includes(r.status) ? 'row-done' : ''}">
          <td>${r.sno}</td><td class="fw-500">${escHtml(r.bl_ref)}</td><td>${escHtml(r.brand || "")}</td><td>${escHtml(r.product || "")}</td>
          <td>${escHtml(r.eta_port || "—")}</td><td>${escHtml(r.est_delivery || "—")}</td><td>${escHtml(r.act_delivery || "—")}</td>
          <td class="text-center">${r.lead_time_est !== null ? r.lead_time_est + "d" : "—"}</td>
          <td class="text-center">${r.lead_time_act !== null ? r.lead_time_act + "d" : "—"}</td>
          <td class="text-center" style="color:${ltC};font-weight:${ltV !== null ? 500 : 400}">${ltV !== null ? (ltV > 0 ? "⚠ +" + ltV + "d" : ltV === 0 ? "✓ On time" : "✓ " + ltV + "d") : "—"}</td>
          <td>${badgeHtml(r.status)}</td>
          <td class="text-right" style="color:${pn(r.variance) < 0 ? 'var(--text-danger)' : pn(r.variance) > 0 ? 'var(--text-success)' : 'var(--text-secondary)'}">${naira(r.variance)}</td>
        </tr>`;
            }).join("")}</tbody>
    </table></div>
  </div>`;

            return html;
        }

        function buildRegister()
        {
            const filtered = getFiltered();
            let html = `<div class="filters-row">
    <input id="search-input" placeholder="Search…" value="${escHtml(state.search)}" style="flex:1;min-width:150px;max-width:220px;" oninput="setSearch(this.value)">
    <select onchange="setFilter(this.value)">
      <option value="All" ${state.filterSt === 'All' ? 'selected' : ''}>All statuses</option>
      ${STATUSES.map(s => `<option value="${s}" ${state.filterSt === s ? 'selected' : ''}>${s}</option>`).join("")}
    </select>
    <label><input type="checkbox" ${state.hideClosed ? 'checked' : ''} onchange="toggleHideClosed(this.checked)"> Hide closed</label>
    <button onclick="openAdd()" style="margin-left:auto;">${ic("plus")}Add row</button>
  </div>`;

            if (state.showAdd)
            {
                html += `<div class="card" style="border-color:var(--text-info);">
      <p class="fw-500" style="margin-bottom:12px;">Add new container</p>
      <div class="form-grid">${COLS.filter(c => c.key !== "sno" && c.type !== "computed").map(c =>
                {
                    if (c.type === "status") return `<div class="field"><label>${escHtml(c.label)}</label><select onchange="updateNewField('${c.key}', this.value)">${STATUSES.map(s => `<option ${s === (state.newRow[c.key] || "Booked") ? 'selected' : ''}>${s}</option>`).join("")}</select></div>`;
                    return `<div class="field"><label>${escHtml(c.label)}</label><input type="${c.type === 'date' ? 'date' : 'text'}" value="${escHtml(state.newRow[c.key] || '')}" oninput="updateNewField('${c.key}', this.value)"></div>`;
                }).join("")}</div>
      <div style="display:flex;gap:8px;margin-top:12px;"><button class="primary" onclick="addRow()">Save row</button><button onclick="closeAdd()">Cancel</button></div>
    </div>`;
            }

            html += `<p class="text-secondary" style="font-size:12px;margin-bottom:8px;">${filtered.length} of ${state.rows.length} rows · <span class="legend"><span class="legend-swatch" style="background:#dbeafe;"></span>Date columns</span><span class="legend"><span class="legend-swatch" style="background:#fef3c7;"></span>Cost columns</span></p>`;

            html += `<div class="table-wrap"><table style="font-size:12px;min-width:4200px;">
    <thead><tr>${COLS.map(c =>
            {
                const arrow = state.sortCol === c.key ? (state.sortDir === "asc" ? " ↑" : " ↓") : "";
                const groupClass = c.group === "dates" ? "header-group-dates" : c.group === "cost" ? "header-group-cost" : "header-group-id";
                const align = c.type === "currency" || c.type === "computed" ? "text-right" : "";
                return `<th class="${c.type !== "computed" ? "sortable" : ""} ${groupClass} ${align}" ${c.type !== "computed" ? `onclick="handleSort('${c.key}')"` : ""} style="min-width:${c.w}px;">${escHtml(c.label)}${arrow}</th>`;
            }).join("")}<th style="min-width:90px;">Actions</th></tr></thead>
    <tbody>${filtered.length === 0 ? `<tr><td colspan="${COLS.length + 1}" class="empty-msg">No rows match the current filter.</td></tr>` : filtered.map((r, i) =>
            {
                const isEdit = state.editId === r.sno;
                const isDone = ["Delivered", "Cancelled"].includes(r.status);
                const rowBg = i % 2 === 0 ? 'transparent' : 'var(--bg-secondary)';
                return `<tr class="${isDone ? 'row-done' : ''}" style="background:${rowBg};">
        ${COLS.map(c =>
                {
                    if (c.type === "computed")
                    {
                        const v = r[c.key];
                        const isVar = c.key === "lead_time_var";
                        const col = isVar && v !== null ? (v > 0 ? "var(--text-danger)" : v < 0 ? "var(--text-success)" : "inherit") : "inherit";
                        return `<td class="text-right" style="color:${col};font-weight:${isVar && v !== null ? 500 : 400}">${v !== null ? (isVar ? (v > 0 ? "+" + v : v) + "d" : v + "d") : "—"}</td>`;
                    }
                    if (isEdit && c.key !== "sno")
                    {
                        if (c.type === "status") return `<td><select class="field-edit" onchange="updateEditField('${c.key}', this.value)">${STATUSES.map(s => `<option ${s === state.editData[c.key] ? 'selected' : ''}>${s}</option>`).join("")}</select></td>`;
                        return `<td><input class="field-edit" type="${c.type === 'date' ? 'date' : 'text'}" value="${escHtml(state.editData[c.key] || '')}" oninput="updateEditField('${c.key}', this.value)" style="width:${Math.min(c.w - 10, 160)}px;"></td>`;
                    }
                    if (c.type === "status") return `<td>${badgeHtml(r[c.key])}</td>`;
                    if (c.type === "currency")
                    {
                        const showVal = r[c.key] !== "" && r[c.key] !== null && r[c.key] !== undefined ? fmt(r[c.key], c.type) : "—";
                        const col = c.key === "variance" && pn(r[c.key]) < 0 ? "var(--text-danger)" : "inherit";
                        return `<td class="text-right" style="color:${col};">${showVal}</td>`;
                    }
                    return `<td>${escHtml(r[c.key] || "")}</td>`;
                }).join("")}
        <td class="actions-cell">${isEdit
                        ? `<button class="primary" onclick="saveEdit()">Save</button><button onclick="cancelEdit()">Cancel</button>`
                        : `<button onclick="startEdit(${r.sno})" title="Edit">${ic("edit", "icon-sm")}</button>`}
        </td>
      </tr>`;
            }).join("")}</tbody>
    ${filtered.length === 0 ? "" : `<tfoot><tr class="fw-500" style="background:var(--bg-secondary);">
      <td colspan="15" style="border-top:0.5px solid var(--border-primary);">Totals (${filtered.length} rows)</td>
      ${COLS.slice(15).map(c => c.type === "currency"
                ? `<td class="text-right" style="border-top:0.5px solid var(--border-primary);color:${c.key === 'variance' && filtered.reduce((s, r) => s + pn(r[c.key]), 0) < 0 ? 'var(--text-danger)' : 'inherit'}">${filtered.reduce((s, r) => s + pn(r[c.key]), 0).toLocaleString("en-NG", { maximumFractionDigits: 0 })}</td>`
                : `<td style="border-top:0.5px solid var(--border-primary);"></td>`).join("")}
      <td style="border-top:0.5px solid var(--border-primary);"></td>
    </tr></tfoot>`}
  </table></div>`;

            return html;
        }

        function buildBulk()
        {
            return `<div style="max-width:680px;">
    <h3>Bulk upload containers</h3>
    <p class="text-secondary" style="font-size:13px;margin-bottom:12px;">Paste CSV data below. Include a header row matching column names, or data maps positionally. Accepted statuses: ${STATUSES.join(", ")}.</p>
    <div class="code-block">${CSV_HDR.join(", ")}</div>
    <textarea id="bulk-textarea" placeholder="BL/TD Reference,Brand,Product,40ft,20ft,Shipping line,ETA to port,...&#10;ABCD123456,Samsung,TVs,2,,MSC,2026-07-10,..." rows="10" style="font-family:var(--font-mono);font-size:12px;" oninput="setBulkText(this.value)">${escHtml(state.bulkText)}</textarea>
    <p class="text-danger" id="bulk-err" style="font-size:13px;margin-top:6px;"></p>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="primary" onclick="handleBulk()">${ic("upload")}Upload rows</button>
      <button onclick="clearBulk()">Clear</button>
    </div>
    <div class="card" style="margin-top:20px;">
      <p class="fw-500" style="font-size:13px;margin-bottom:6px;">Need the column template?</p>
      <p class="text-secondary" style="font-size:12px;margin-bottom:10px;">Export current data as CSV, add your rows at the bottom, and re-upload.</p>
      <button onclick="exportCSV()">${ic("download")}Download CSV template</button>
    </div>
  </div>`;
        }

        // ── Main render ──────────────────────────────────────────────────────────────
        function render()
        {
            const tabsEl = document.getElementById("tabs");
            const contentEl = document.getElementById("view-content");
            if (state.loading)
            {
                if (tabsEl) tabsEl.innerHTML = "";
                contentEl.innerHTML = `<div class="splash"><div class="spinner"></div><p class="text-secondary" style="font-size:13px;">Connecting to shared sheet…</p></div>`;
                return;
            }
            tabsEl.innerHTML = buildTabs();
            let content = "";
            if (state.view === "dash") content = buildDashboard();
            else if (state.view === "reports") content = buildReports();
            else if (state.view === "kpi") content = buildKPI();
            else if (state.view === "table") content = buildRegister();
            else if (state.view === "bulk") content = buildBulk();
            contentEl.innerHTML = content;
        }

        // ── Init ─────────────────────────────────────────────────────────────────────
        loadData();
    </script>
</body>

</html>
